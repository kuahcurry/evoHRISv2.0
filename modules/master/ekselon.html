<style>
  .table-ekselon-card {
    border-radius: 0.5rem;
    box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
  }
  .btn-action-icon {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }
</style>

<script type="module">
  import { httpGet, httpPost } from './assets/js/core/http.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url) 
    ? config.api_url 
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let allData = [];

  function getModal() {
    const modalEl = document.getElementById('modal-form-ekselon');
    if (!modalEl) return null;
    return window.bootstrap ? bootstrap.Modal.getOrCreateInstance(modalEl) : null;
  }

  async function loadData() {
    const tableBody = document.getElementById('table-ekselon');
    if (!tableBody) return;
    tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data Ekselon...</td></tr>';

    try {
      const res = await httpGet(`${apiUrl}/master/ekselon`);
      if (res && res.code === 200 && Array.isArray(res.data)) {
        allData = res.data;
        renderTable(allData);
      } else {
        allData = [];
        tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Tidak ada data Ekselon tersedia.</td></tr>';
        const totalInfo = document.getElementById('total-rows-info-ekselon');
        if (totalInfo) totalInfo.innerText = 'Total: 0 data';
      }
    } catch (err) {
      console.error(err);
      tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-danger">Gagal memuat data dari server.</td></tr>';
    }
  }

  function renderTable(items) {
    const tableBody = document.getElementById('table-ekselon');
    if (!tableBody) return;

    const totalInfo = document.getElementById('total-rows-info-ekselon');
    if (totalInfo) totalInfo.innerText = `Total: ${items.length} data`;

    if (!items.length) {
      tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Tidak ada data ditemukan.</td></tr>';
      return;
    }

    tableBody.innerHTML = items.map((item, idx) => `
      <tr>
        <td class="text-center">${idx + 1}</td>
        <td class="text-center font-monospace fw-bold text-dark">${item.KD_EKSELON}</td>
        <td class="fw-semi-bold">${item.EKSELON || '-'}</td>
        <td class="text-center">
          <div class="d-inline-flex gap-1">
            <button type="button" class="btn btn-sm btn-outline-warning btn-edit-ekselon py-1 px-2 btn-action-icon" data-id="${item.KD_EKSELON}" title="Edit Data">
              <i class="fas fa-edit"></i> Edit
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger btn-delete-ekselon py-1 px-2 btn-action-icon" data-id="${item.KD_EKSELON}" data-nama="${item.EKSELON || ''}" title="Soft Delete Data">
              <i class="fas fa-trash-alt"></i> Soft Delete
            </button>
          </div>
        </td>
      </tr>
    `).join('');

    // Attach row events
    tableBody.querySelectorAll('.btn-edit-ekselon').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        openEditModal(btn.getAttribute('data-id'));
      });
    });

    tableBody.querySelectorAll('.btn-delete-ekselon').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const id = btn.getAttribute('data-id');
        const nama = btn.getAttribute('data-nama');
        deleteData(id, nama);
      });
    });
  }

  function openAddModal() {
    document.getElementById('modal-title-ekselon').innerText = 'Tambah Data Ekselon';
    document.getElementById('modal-subtitle-ekselon').innerText = 'Masukkan informasi data Ekselon baru';
    document.getElementById('input-pk-ekselon').value = '';
    document.getElementById('input-display-ekselon').value = '';
    const modal = getModal();
    if (modal) modal.show();
  }

  function openEditModal(id) {
    const item = allData.find(a => String(a.KD_EKSELON) === String(id));
    if (!item) return;

    document.getElementById('modal-title-ekselon').innerText = 'Ubah Data Ekselon';
    document.getElementById('modal-subtitle-ekselon').innerText = `Perbarui data untuk ID: ${item.KD_EKSELON}`;
    document.getElementById('input-pk-ekselon').value = item.KD_EKSELON;
    document.getElementById('input-display-ekselon').value = item.EKSELON || '';
    const modal = getModal();
    if (modal) modal.show();
  }

  async function saveData() {
    const pkVal = document.getElementById('input-pk-ekselon').value.trim();
    const displayVal = document.getElementById('input-display-ekselon').value.trim();

    if (!displayVal) {
      alert('Ekselon wajib diisi!');
      document.getElementById('input-display-ekselon').focus();
      return;
    }

    const btnSimpan = document.getElementById('btn-simpan-ekselon');
    btnSimpan.disabled = true;
    btnSimpan.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Menyimpan...';

    const payload = {
      KD_EKSELON: pkVal,
      EKSELON: displayVal.toUpperCase()
    };

    try {
      const res = await httpPost(`${apiUrl}/master/ekselon/save`, payload);
      btnSimpan.disabled = false;
      btnSimpan.innerHTML = '<i class="fas fa-save me-1"></i> Simpan';

      if (res && res.code === 200) {
        const modal = getModal();
        if (modal) modal.hide();
        loadData();
      } else {
        alert(res?.data?.message || 'Gagal menyimpan data.');
      }
    } catch (err) {
      console.error(err);
      btnSimpan.disabled = false;
      btnSimpan.innerHTML = '<i class="fas fa-save me-1"></i> Simpan';
      alert('Terjadi kesalahan saat menghubungi server.');
    }
  }

  async function deleteData(id, nama) {
    if (!confirm(`Apakah Anda yakin ingin menghapus data Ekselon "${nama}" (ID: ${id})?`)) {
      return;
    }

    try {
      const res = await httpPost(`${apiUrl}/master/ekselon/delete`, { id: id });
      if (res && res.code === 200) {
        loadData();
      } else {
        alert(res?.data?.message || 'Gagal menghapus data.');
      }
    } catch (err) {
      console.error(err);
      alert('Terjadi kesalahan saat menghapus data.');
    }
  }

  // Filter Search
  document.getElementById('search-ekselon')?.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) {
      renderTable(allData);
      return;
    }
    const filtered = allData.filter(item => 
      String(item.KD_EKSELON).toLowerCase().includes(q) || 
      (item.EKSELON && item.EKSELON.toLowerCase().includes(q))
    );
    renderTable(filtered);
  });

  document.getElementById('btn-tambah-ekselon')?.addEventListener('click', (e) => {
    e.preventDefault();
    openAddModal();
  });

  document.getElementById('btn-simpan-ekselon')?.addEventListener('click', (e) => {
    e.preventDefault();
    saveData();
  });

  // Hook for global/sidebar SPA calls
  window.ekselon = {
    loadData,
    openAddModal,
    openEditModal,
    deleteData,
    saveData
  };
  document.ekselon = window.ekselon;

  // Initial load
  loadData();
</script>

<template>
  <div class="container-fluid p-0">
    <div class="card mb-3 table-ekselon-card">
      <div class="card-header bg-light d-flex flex-wrap justify-content-between align-items-center py-3 gap-2">
        <div>
          <h5 class="mb-0 text-primary fw-bold"><i class="fas fa-sitemap me-2"></i>Master Data Ekselon</h5>
          <small class="text-muted">Kelola tingkatan eselon jabatan struktural</small>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="input-group input-group-sm" style="width: 240px;">
            <input type="text" class="form-control" id="search-ekselon" placeholder="Cari ID / Ekselon...">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
          </div>
          <button class="btn btn-sm btn-primary" id="btn-tambah-ekselon" type="button">
            <i class="fas fa-plus me-1"></i> Tambah Ekselon
          </button>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-light border-bottom">
              <tr class="fs--1 text-dark">
                <th class="text-center" style="width: 60px;">No</th>
                <th class="text-center" style="width: 120px;">ID</th>
                <th>Ekselon</th>
                <th class="text-center" style="width: 200px;">Aksi</th>
              </tr>
            </thead>
            <tbody id="table-ekselon">
              <tr>
                <td colspan="4" class="text-center py-4 text-muted">Memuat data Ekselon...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center py-2 border-top">
        <small class="text-muted" id="total-rows-info-ekselon">Total: 0 data</small>
      </div>
    </div>

    <!-- MODAL FORM TAMBAH / UBAH Ekselon -->
    <div class="modal fade" id="modal-form-ekselon" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-white px-4 py-3 border-bottom d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <div class="d-flex align-items-center justify-content-center text-primary rounded-3" style="width: 38px; height: 38px; background: rgba(44, 123, 229, 0.08);">
                <i class="fas fa-sitemap fs-1"></i>
              </div>
              <div>
                <h5 class="modal-title fw-bold text-dark mb-0" id="modal-title-ekselon">Tambah Data Ekselon</h5>
                <small class="text-muted d-block" id="modal-subtitle-ekselon">Masukkan informasi data Ekselon baru</small>
              </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
          </div>

          <div class="modal-body px-4 py-3">
            <form id="form-ekselon">
              <input type="hidden" id="input-pk-ekselon" name="KD_EKSELON">
              <div class="mb-3">
                <label for="input-display-ekselon" class="form-label fw-semi-bold">Ekselon <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="input-display-ekselon" name="EKSELON" placeholder="Contoh: I.A, II.A, III.A, NON ESELON" required>
              </div>
            </form>
          </div>

          <div class="modal-footer bg-light px-4 py-2 border-top">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
            <button type="button" class="btn btn-primary btn-sm" id="btn-simpan-ekselon">
              <i class="fas fa-save me-1"></i> Simpan
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
