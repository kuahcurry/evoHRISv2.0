  <style>

    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--ui-shadow-lg);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--ui-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    
    .icon-primary { background: #eef2ff; color: #4f46e5; }
    .icon-success { background: #dcfce7; color: #16a34a; }
    .icon-warning { background: #fef3c7; color: #d97706; }
    .icon-danger  { background: #fee2e2; color: #dc2626; }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 0;
      color: var(--ui-text-main);
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--ui-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .ui-card {
      background: var(--ui-surface);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius-xl);
      box-shadow: var(--ui-shadow-md);
      overflow: hidden;
    }

    .ui-card-header {
      background: var(--ui-surface);
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--ui-border);
    }

    .ui-input {
      border-radius: var(--ui-radius-md);
      border: 1px solid var(--ui-border);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    .ui-input:focus {
      border-color: var(--ui-primary);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
      background: #ffffff;
    }

    .ui-table {
      width: 100%;
      margin-bottom: 0;
      border-collapse: separate;
      border-spacing: 0;
    }

    .ui-table th {
      background: #f8fafc;
      color: var(--ui-text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--ui-border);
      white-space: nowrap;
    }

    .ui-table td {
      padding: 1rem 1.25rem;
      vertical-align: middle;
      border-bottom: 1px solid var(--ui-border);
      color: var(--ui-text-main);
      font-size: 0.85rem;
    }

    .ui-table tbody tr {
      transition: background 0.2s ease;
    }

    .ui-table tbody tr:hover {
      background: #f1f5f9;
    }

    .btn-ui-white {
      background: var(--ui-surface);
      border: 1px solid var(--ui-border);
      color: var(--ui-text-main);
      border-radius: var(--ui-radius-md);
      font-weight: 600;
      padding: 0.5rem 1rem;
      box-shadow: var(--ui-shadow-sm);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-ui-white:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-1px);
      box-shadow: var(--ui-shadow-md);
      color: var(--ui-text-main);
    }

    .progress {
      background-color: #e2e8f0;
      border-radius: 0.5rem;
      height: 8px;
    }
    .progress-bar {
      border-radius: 0.5rem;
    }
  </style>

  <div class="monitoring-wrapper">
    
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
      <div class="d-flex align-items-center gap-3">
        <div class="stat-icon icon-success" style="width: 56px; height: 56px; font-size: 1.5rem; border-radius: var(--ui-radius-lg);">
          <i class="fas fa-tasks"></i>
        </div>
        <div>
          <h3 class="fw-bold text-dark mb-1">Monitoring Jadwal Unit Kerja</h3>
          <p class="text-secondary mb-0">Audit kepatuhan penginputan jadwal dinas (roster) bulanan antar unit kerja dan instalasi RS.</p>
        </div>
      </div>
      
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span class="badge bg-success bg-opacity-10 text-success border border-success-subtle px-3 py-2 rounded-pill fw-semibold" id="total-badge-monitoring">0 Unit</span>
        <button class="btn btn-ui-white" id="btn-refresh-monitoring">
          <i class="fas fa-sync-alt text-success"></i> Refresh
        </button>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stat-icon icon-primary"><i class="fas fa-sitemap"></i></div>
            <div>
              <div class="stat-label">Total Unit</div>
              <div class="stat-value" id="card-stat-mon-total">0</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stat-icon icon-success"><i class="fas fa-check-double"></i></div>
            <div>
              <div class="stat-label">Terjadwal Lengkap</div>
              <div class="stat-value" id="card-stat-mon-lengkap">0</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stat-icon icon-warning"><i class="fas fa-adjust"></i></div>
            <div>
              <div class="stat-label">Sebagian</div>
              <div class="stat-value" id="card-stat-mon-sebagian">0</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stat-icon icon-danger"><i class="fas fa-exclamation-circle"></i></div>
            <div>
              <div class="stat-label">Belum Terjadwal</div>
              <div class="stat-value" id="card-stat-mon-belum">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="ui-card">
      
      <div class="ui-card-header">
        <div class="row g-3 align-items-center justify-content-between">
          <div class="col-md-4">
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">Bulan</span>
              <input type="month" class="form-control ui-input border-start-0" id="filter-bulan-monitoring" value="2026-04">
            </div>
          </div>
          <div class="col-md-4">
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-search"></i></span>
              <input type="text" class="form-control ui-input border-start-0" id="search-monitoring" placeholder="Cari nama unit kerja...">
            </div>
          </div>
        </div>
      </div>

      <div class="d-none text-center py-3 border-bottom bg-light" id="loading-monitoring">
        <div class="spinner-border spinner-border-sm text-success mb-1" role="status"></div>
        <div class="small text-muted">Memperbarui monitoring jadwal...</div>
      </div>

      <div class="table-responsive">
        <table class="ui-table">
          <thead>
            <tr>
              <th class="text-center" style="width: 60px;">No</th>
              <th>Unit Kerja / Bagian</th>
              <th class="text-center" style="width: 120px;">Total Pegawai</th>
              <th class="text-center" style="width: 130px;">Terjadwal</th>
              <th style="width: 220px;">Progress</th>
              <th class="text-center" style="width: 150px;">Status</th>
              <th class="text-center" style="width: 130px;">Total Entri</th>
            </tr>
          </thead>
          <tbody id="tbody-monitoring">
            <tr>
              <td colspan="7" class="text-center py-5 text-muted">
                <div class="spinner-border text-success mb-2" role="status" style="width: 1.5rem; height: 1.5rem;"></div>
                <div>Memuat monitoring jadwal...</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>
</template>

<script type="module" defer>
  import { httpGet } from './assets/js/core/http.js';

  let rawMonitoringData = [];
  let filteredMonitoringData = [];

  const tag = 'absensi_monitoring';

  const initModule = async () => {
    const monthEl = document.getElementById('filter-bulan-monitoring');
    if (monthEl && !monthEl.value) monthEl.value = '2026-04';

    await loadData();
    bindEvents();
  };

  const loadData = async () => {
    const tbody = document.getElementById('tbody-monitoring');
    const spinner = document.getElementById('loading-monitoring');
    
    if (spinner) spinner.classList.remove('d-none');
    if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Menganalisis status jadwal unit kerja...</td></tr>';

    try {
      const bulan = document.getElementById('filter-bulan-monitoring')?.value || '2026-04';
      const res = await httpGet(`${config.api_url}/absensi/jadwal-monitoring?bulan=${encodeURIComponent(bulan)}`);
      
      if (res && res.code === 200 && res.data) {
        rawMonitoringData = res.data || [];
        filteredMonitoringData = [...rawMonitoringData];
        updateSummaryCards();
        renderTable();
      } else {
        if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Data monitoring tidak ditemukan.</td></tr>';
      }
    } catch (e) {
      console.error('Error loading monitoring jadwal:', e);
      if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat monitoring: ${e.message}</td></tr>`;
    } finally {
      if (spinner) spinner.classList.add('d-none');
    }
  };

  const updateSummaryCards = () => {
    const total = rawMonitoringData.length;
    let lengkap = 0;
    let sebagian = 0;
    let belum = 0;

    rawMonitoringData.forEach(r => {
      const st = r.status_keterangan || r.status || '';
      if (st === 'TERJADWAL LENGKAP') lengkap++;
      else if (st === 'SEBAGIAN TERJADWAL') sebagian++;
      else belum++;
    });

    document.getElementById('card-stat-mon-total').textContent = total;
    document.getElementById('card-stat-mon-lengkap').textContent = lengkap;
    document.getElementById('card-stat-mon-sebagian').textContent = sebagian;
    document.getElementById('card-stat-mon-belum').textContent = belum;
    document.getElementById('total-badge-monitoring').textContent = `${total} Bagian / Unit`;
  };

  const renderTable = () => {
    const tbody = document.getElementById('tbody-monitoring');
    if (!tbody) return;

    if (filteredMonitoringData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Data unit kerja tidak ditemukan.</td></tr>';
      return;
    }

    let html = '';
    filteredMonitoringData.forEach((row, idx) => {
      const totPeg = parseInt(row.total_pegawai || 0);
      const terjadwal = parseInt(row.pegawai_terjadwal || 0);
      const pct = totPeg > 0 ? Math.min(100, Math.round((terjadwal / totPeg) * 100)) : 0;
      const st = row.status_keterangan || row.status || 'BELUM TERJADWAL';
      
      let barClass = 'bg-danger';
      let statusBadge = '<span class="badge bg-danger"><i class="fas fa-times-circle me-1"></i>Belum Terjadwal</span>';

      if (st === 'TERJADWAL LENGKAP' || pct >= 95) {
        barClass = 'bg-success';
        statusBadge = '<span class="badge bg-success"><i class="fas fa-check-circle me-1"></i>Lengkap</span>';
      } else if (terjadwal > 0 || pct > 0) {
        barClass = 'bg-warning text-dark';
        statusBadge = '<span class="badge bg-warning text-dark"><i class="fas fa-clock me-1"></i>Sebagian</span>';
      }

      html += `
        <tr>
          <td class="text-center text-muted">${idx + 1}</td>
          <td class="fw-bold text-dark">${row.BAGIAN || row.nama_bagian || '-'}</td>
          <td class="text-center fw-bold">${totPeg}</td>
          <td class="text-center fw-bold text-primary">${terjadwal}</td>
          <td style="min-width: 180px;">
            <div class="d-flex align-items-center">
              <div class="progress flex-grow-1 me-2" style="height: 8px;">
                <div class="progress-bar ${barClass}" role="progressbar" style="width: ${pct}%;"></div>
              </div>
              <span class="small fw-bold">${pct}%</span>
            </div>
          </td>
          <td class="text-center">${statusBadge}</td>
          <td class="text-center text-muted small">${row.total_jadwal ? `${row.total_jadwal} shift` : '-'}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  };

  const bindEvents = () => {
    document.getElementById('filter-bulan-monitoring')?.addEventListener('change', () => loadData());
    document.getElementById('btn-refresh-monitoring')?.addEventListener('click', () => loadData());

    document.getElementById('search-monitoring')?.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        filteredMonitoringData = [...rawMonitoringData];
      } else {
        filteredMonitoringData = rawMonitoringData.filter(r => {
          const name = (r.BAGIAN || r.nama_bagian || '').toLowerCase();
          return name.includes(q);
        });
      }
      renderTable();
    });
  };

  window.absensi_monitoring = { loadData };
  document.absensi_monitoring = { loadData };

  initModule();
</script>
