<style>
  .absensi-lembur .card {
    border: none;
    box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.05);
    border-radius: 0.5rem;
  }
  .absensi-lembur .table th {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    background-color: #f8f9fa;
    color: #495057;
    font-weight: 600;
  }
  .absensi-lembur .table td {
    vertical-align: middle;
    font-size: 0.85rem;
  }
</style>

<script type="module" defer>
  import { httpGet } from './assets/js/core/http.js';

  let rawLemburData = [];
  let filteredLemburData = [];
  let masterBagian = [];
  let currentPage = 1;
  const pageSize = 20;

  const tag = 'absensi_lembur';

  const initModule = async () => {
    const monthEl = document.getElementById('filter-bulan-lembur');
    if (monthEl && !monthEl.value) monthEl.value = '2026-04';

    await loadMaster();
    await loadData();
    bindEvents();
  };

  const loadMaster = async () => {
    try {
      const res = await httpGet(`${config.api_url}/absensi/master`);
      if (res && res.code === 200 && res.data) {
        masterBagian = res.data.bagian || [];
        populateBagianSelect();
      }
    } catch (e) {
      console.warn('Master bagian load error:', e);
    }
  };

  const populateBagianSelect = () => {
    const sel = document.getElementById('filter-bagian-lembur');
    if (!sel) return;
    let html = '<option value="">-- Semua Unit / Bagian --</option>';
    masterBagian.forEach(b => {
      html += `<option value="${b.KD_BAGIAN}">${b.BAGIAN}</option>`;
    });
    sel.innerHTML = html;
  };

  const loadData = async () => {
    const tbody = document.getElementById('tbody-lembur');
    const spinner = document.getElementById('loading-lembur');
    
    if (spinner) spinner.classList.remove('d-none');
    if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data pengajuan lembur...</td></tr>';

    try {
      const bulan = document.getElementById('filter-bulan-lembur')?.value || '2026-04';
      const kdBagian = document.getElementById('filter-bagian-lembur')?.value || '';
      const status = document.getElementById('filter-status-lembur')?.value || '';

      let url = `${config.api_url}/absensi/lembur?bulan=${encodeURIComponent(bulan)}&limit=500`;
      if (kdBagian) url += `&kd_bagian=${encodeURIComponent(kdBagian)}`;
      if (status) url += `&status=${encodeURIComponent(status)}`;

      const res = await httpGet(url);
      if (res && res.code === 200 && res.data) {
        const dataObj = res.data;
        rawLemburData = Array.isArray(dataObj) ? dataObj : (dataObj.data || []);
        filteredLemburData = [...rawLemburData];
        currentPage = 1;
        updateSummaryCards(dataObj.total);
        renderTable();
      } else {
        if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted">Tidak ada data lembur pada bulan ini.</td></tr>';
      }
    } catch (e) {
      console.error('Error loading lembur:', e);
      if (tbody) tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat lembur: ${e.message}</td></tr>`;
    } finally {
      if (spinner) spinner.classList.add('d-none');
    }
  };

  const updateSummaryCards = () => {
    const total = rawLemburData.length;
    let approved = 0;
    let pending = 0;
    let rejected = 0;

    rawLemburData.forEach(r => {
      const s = String(r.status || '').toLowerCase();
      if (s.includes('setuju') || s === '1' || s === 'approved' || r.progress_approval >= r.max_approval) approved++;
      else if (s.includes('tolak') || s === '2' || s === 'rejected') rejected++;
      else pending++;
    });

    document.getElementById('card-stat-lembur-total').textContent = total;
    document.getElementById('card-stat-lembur-approved').textContent = approved;
    document.getElementById('card-stat-lembur-pending').textContent = pending;
    document.getElementById('card-stat-lembur-rejected').textContent = rejected;
    document.getElementById('total-badge-lembur').textContent = `${total} Pengajuan`;
  };

  const renderTable = () => {
    const tbody = document.getElementById('tbody-lembur');
    if (!tbody) return;

    if (filteredLemburData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted">Data lembur tidak ditemukan.</td></tr>';
      renderPagination(0);
      return;
    }

    const startIdx = (currentPage - 1) * pageSize;
    const endIdx = startIdx + pageSize;
    const pageItems = filteredLemburData.slice(startIdx, endIdx);

    let html = '';
    pageItems.forEach((row, idx) => {
      // Calculate duration
      let durasiText = '-';
      if (row.jam_mulai && row.jam_selesai) {
        const [h1, m1] = row.jam_mulai.split(':').map(Number);
        const [h2, m2] = row.jam_selesai.split(':').map(Number);
        let mins = (h2 * 60 + (m2 || 0)) - (h1 * 60 + (m1 || 0));
        if (mins < 0) mins += 24 * 60;
        const hours = (mins / 60).toFixed(1);
        durasiText = `${hours} Jam`;
      }

      // Status badge
      let badgeHtml = '<span class="badge bg-warning text-dark"><i class="fas fa-clock me-1"></i>Menunggu</span>';
      const s = String(row.status || '').toLowerCase();
      if (s.includes('setuju') || s === '1' || s === 'approved' || (row.max_approval > 0 && row.progress_approval >= row.max_approval)) {
        badgeHtml = '<span class="badge bg-success"><i class="fas fa-check-circle me-1"></i>Disetujui</span>';
      } else if (s.includes('tolak') || s === '2' || s === 'rejected') {
        badgeHtml = '<span class="badge bg-danger"><i class="fas fa-times-circle me-1"></i>Ditolak</span>';
      }

      html += `
        <tr>
          <td class="text-center text-muted">${startIdx + idx + 1}</td>
          <td class="fw-bold text-dark text-nowrap">${row.tanggal_lembur}</td>
          <td>
            <div class="fw-bold text-dark">${row.nama || '-'}</div>
            <div class="text-muted small">NIP: ${row.NIP || '-'}</div>
          </td>
          <td class="text-muted small">${row.nama_bagian || '-'}</td>
          <td class="text-success fw-bold">${row.jam_mulai || '-'}</td>
          <td class="text-info fw-bold">${row.jam_selesai || '-'}</td>
          <td class="text-center fw-semibold">${durasiText}</td>
          <td>
            <div class="text-truncate" style="max-width: 250px;" title="${row.keterangan || '-'}">
              ${row.keterangan || '-'}
            </div>
            ${row.jenis_hari ? `<span class="badge bg-light text-muted border extra-small mt-1">${row.jenis_hari}</span>` : ''}
          </td>
          <td class="text-center">${badgeHtml}</td>
          <td class="text-center text-nowrap">
            <button class="btn btn-outline-primary btn-sm px-2 py-1" onclick="window.absensi_lembur.showDetailModal(${row.id_lembur})">
              <i class="fas fa-eye me-1"></i>Detail
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    renderPagination(filteredLemburData.length);
  };

  const renderPagination = (totalItems) => {
    const el = document.getElementById('pagination-lembur');
    if (!el) return;
    const totalPages = Math.ceil(totalItems / pageSize);

    if (totalPages <= 1) {
      el.innerHTML = '';
      return;
    }

    let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage - 1}">«</a></li>`;
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || (p >= currentPage - 2 && p <= currentPage + 2)) {
        html += `<li class="page-item ${p === currentPage ? 'active' : ''}"><a class="page-link" href="#" data-page="${p}">${p}</a></li>`;
      } else if (p === currentPage - 3 || p === currentPage + 3) {
        html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
      }
    }
    html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage + 1}">»</a></li>`;
    el.innerHTML = html;

    el.querySelectorAll('.page-link').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const p = parseInt(btn.getAttribute('data-page'));
        if (p && p !== currentPage && p >= 1 && p <= totalPages) {
          currentPage = p;
          renderTable();
        }
      });
    });
  };

  const showDetailModal = (idLembur) => {
    const item = rawLemburData.find(x => x.id_lembur == idLembur);
    if (!item) return;

    const modalEl = document.getElementById('modal-detail-lembur');
    if (!modalEl || !window.bootstrap) return;

    document.getElementById('modal-lembur-nama').textContent = item.nama || '-';
    document.getElementById('modal-lembur-nip').textContent = item.NIP || '-';
    document.getElementById('modal-lembur-bagian').textContent = item.nama_bagian || '-';
    document.getElementById('modal-lembur-tanggal').textContent = item.tanggal_lembur || '-';
    document.getElementById('modal-lembur-jam').textContent = `${item.jam_mulai || '-'} s/d ${item.jam_selesai || '-'}`;
    document.getElementById('modal-lembur-uraian').textContent = item.keterangan || '-';
    
    // Approval progress bar
    const prog = item.progress_approval || 0;
    const maxProg = item.max_approval || 1;
    const pct = Math.min(100, Math.round((prog / (maxProg || 1)) * 100));
    const progEl = document.getElementById('modal-lembur-prog-bar');
    if (progEl) {
      progEl.style.width = `${pct}%`;
      progEl.textContent = `${prog} / ${maxProg} Approval`;
    }

    const berkasEl = document.getElementById('modal-lembur-berkas');
    if (berkasEl) {
      if (item.file_berkas) {
        const fileName = String(item.file_berkas);
        const fileUrl = new URL(
          `assets/uploads/lembur/${encodeURIComponent(fileName)}`,
          `${config.base_url.replace(/\/+$/, '')}/`
        );
        const downloadLink = document.createElement('a');
        downloadLink.href = fileUrl.href;
        downloadLink.download = fileName;
        downloadLink.className = 'btn btn-outline-info btn-sm';

        const icon = document.createElement('i');
        icon.className = 'fas fa-file-download me-1';
        downloadLink.append(icon, document.createTextNode('Unduh Berkas Lampiran'));

        berkasEl.replaceChildren(downloadLink);
      } else {
        berkasEl.innerHTML = '<span class="text-muted small">Tidak ada berkas lampiran.</span>';
      }
    }

    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    modal.show();
  };

  const bindEvents = () => {
    document.getElementById('btn-filter-lembur')?.addEventListener('click', () => loadData());
    document.getElementById('btn-refresh-lembur')?.addEventListener('click', () => loadData());

    document.getElementById('search-lembur')?.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        filteredLemburData = [...rawLemburData];
      } else {
        filteredLemburData = rawLemburData.filter(r => 
          (r.nama && r.nama.toLowerCase().includes(q)) ||
          (r.NIP && r.NIP.toLowerCase().includes(q)) ||
          (r.nama_bagian && r.nama_bagian.toLowerCase().includes(q)) ||
          (r.keterangan && r.keterangan.toLowerCase().includes(q))
        );
      }
      currentPage = 1;
      renderTable();
    });
  };

  window.absensi_lembur = { loadData, showDetailModal };
  document.absensi_lembur = { loadData };

  initModule();
</script>

<template>
  <div class="container-fluid py-3 absensi-lembur">
    <!-- Header -->
    <div class="row align-items-center mb-3">
      <div class="col-md-7">
        <div class="d-flex align-items-center">
          <div class="avatar bg-soft-warning text-warning p-3 rounded-circle me-3">
            <i class="fas fa-business-time fa-2x"></i>
          </div>
          <div>
            <h4 class="mb-0 fw-bold">Rekapitulasi Lembur Pegawai</h4>
            <p class="text-muted small mb-0">Manajemen pengajuan kerja lembur, verifikasi kepala unit, dan laporan jam dinas luar/ekstra</p>
          </div>
        </div>
      </div>
      <div class="col-md-5 text-md-end mt-2 mt-md-0">
        <span class="badge bg-primary px-3 py-2 me-2" id="total-badge-lembur">0 Pengajuan</span>
        <button class="btn btn-outline-secondary btn-sm me-2" id="btn-refresh-lembur" title="Segarkan Data">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="row g-3 mb-3">
      <div class="col-6 col-md-3">
        <div class="card p-3 border-start border-4 border-primary">
          <div class="d-flex align-items-center">
            <div class="flex-grow-1">
              <div class="text-muted small">Total Pengajuan</div>
              <h4 class="mb-0 fw-bold" id="card-stat-lembur-total">0</h4>
            </div>
            <i class="fas fa-clipboard-list fa-2x text-primary opacity-25"></i>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 border-start border-4 border-success">
          <div class="d-flex align-items-center">
            <div class="flex-grow-1">
              <div class="text-muted small">Disetujui</div>
              <h4 class="mb-0 fw-bold text-success" id="card-stat-lembur-approved">0</h4>
            </div>
            <i class="fas fa-check-circle fa-2x text-success opacity-25"></i>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 border-start border-4 border-warning">
          <div class="d-flex align-items-center">
            <div class="flex-grow-1">
              <div class="text-muted small">Menunggu Approval</div>
              <h4 class="mb-0 fw-bold text-warning" id="card-stat-lembur-pending">0</h4>
            </div>
            <i class="fas fa-hourglass-half fa-2x text-warning opacity-25"></i>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 border-start border-4 border-danger">
          <div class="d-flex align-items-center">
            <div class="flex-grow-1">
              <div class="text-muted small">Ditolak</div>
              <h4 class="mb-0 fw-bold text-danger" id="card-stat-lembur-rejected">0</h4>
            </div>
            <i class="fas fa-times-circle fa-2x text-danger opacity-25"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter & Table Card -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white py-3 border-bottom">
        <div class="row g-2 align-items-end">
          <!-- Periode Bulan -->
          <div class="col-lg-2 col-md-3 col-sm-6">
            <label class="form-label small fw-semibold text-muted mb-1">Periode Bulan:</label>
            <input type="month" class="form-control form-control-sm bg-white" id="filter-bulan-lembur" value="2026-04">
          </div>

          <!-- Unit / Bagian -->
          <div class="col-lg-3 col-md-3 col-sm-6">
            <label class="form-label small fw-semibold text-muted mb-1">Unit / Bagian:</label>
            <select class="form-select form-select-sm bg-white" id="filter-bagian-lembur">
              <option value="">-- Semua Unit / Bagian --</option>
            </select>
          </div>

          <!-- Status Verifikasi -->
          <div class="col-lg-2 col-md-3 col-sm-6">
            <label class="form-label small fw-semibold text-muted mb-1">Status Verifikasi:</label>
            <select class="form-select form-select-sm bg-white" id="filter-status-lembur">
              <option value="">-- Semua Status --</option>
              <option value="1">Disetujui</option>
              <option value="0">Menunggu</option>
              <option value="2">Ditolak</option>
            </select>
          </div>

          <!-- Pencarian (Fleksibel mengisi ruang) -->
          <div class="col-lg col-md col-sm-8">
            <label class="form-label small fw-semibold text-muted mb-1">Pencarian:</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white border-end-0 text-muted">
                <i class="fas fa-search"></i>
              </span>
              <input type="text" class="form-control form-control-sm bg-white border-start-0" id="search-lembur" placeholder="Nama / NIP...">
            </div>
          </div>

          <!-- Tombol Terapkan (Ukuran pas dan rata bawah) -->
          <div class="col-lg-auto col-md-auto col-sm-4">
            <button type="button" class="btn btn-primary btn-sm px-4 d-inline-flex align-items-center justify-content-center gap-1 shadow-sm" id="btn-filter-lembur" title="Filter Lembur">
              <i class="fas fa-filter"></i>
              <span>Terapkan</span>
            </button>
          </div>
        </div>
      </div>
    </div>

      <div class="card-body p-0">
        <div class="d-none text-center py-2 bg-light border-bottom" id="loading-lembur">
          <span class="spinner-border spinner-border-sm text-primary me-2"></span>Memperbarui data lembur...
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th style="width: 40px;" class="text-center">No</th>
                <th style="width: 105px;">Tanggal</th>
                <th>Nama Pegawai</th>
                <th>Unit / Bagian</th>
                <th style="width: 80px;">Mulai</th>
                <th style="width: 80px;">Selesai</th>
                <th style="width: 85px;" class="text-center">Durasi</th>
                <th>Uraian Tugas / Keterangan</th>
                <th style="width: 120px;" class="text-center">Status</th>
                <th style="width: 80px;" class="text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tbody-lembur">
              <tr>
                <td colspan="10" class="text-center py-4 text-muted">
                  <span class="spinner-border spinner-border-sm me-2"></span>Memuat data pengajuan lembur...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card-footer bg-white py-2 border-top d-flex justify-content-between align-items-center">
        <span class="text-muted small">Menampilkan data lembur terintegrasi sistem approval</span>
        <ul class="pagination pagination-sm mb-0" id="pagination-lembur"></ul>
      </div>
    </div>

    <!-- Modal Detail Lembur -->
    <div class="modal fade" id="modal-detail-lembur" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold"><i class="fas fa-file-invoice text-warning me-2"></i>Rincian Pengajuan Lembur</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="card bg-light border-0 p-3 mb-3">
              <div class="row g-2">
                <div class="col-7">
                  <small class="text-muted d-block">Nama Pegawai</small>
                  <strong id="modal-lembur-nama">-</strong>
                </div>
                <div class="col-5">
                  <small class="text-muted d-block">NIP</small>
                  <strong id="modal-lembur-nip">-</strong>
                </div>
                <div class="col-7">
                  <small class="text-muted d-block">Unit Kerja / Bagian</small>
                  <span id="modal-lembur-bagian">-</span>
                </div>
                <div class="col-5">
                  <small class="text-muted d-block">Tanggal Pelaksanaan</small>
                  <strong class="text-primary" id="modal-lembur-tanggal">-</strong>
                </div>
                <div class="col-12">
                  <small class="text-muted d-block">Jam Pelaksanaan</small>
                  <strong class="text-dark" id="modal-lembur-jam">-</strong>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <small class="text-muted fw-bold d-block text-uppercase mb-1">Uraian Tugas / Keterangan Lembur:</small>
              <div class="p-2 border rounded bg-white small" id="modal-lembur-uraian">-</div>
            </div>

            <div class="mb-3">
              <small class="text-muted fw-bold d-block text-uppercase mb-1">Progres Persetujuan (Approval):</small>
              <div class="progress" style="height: 20px;">
                <div class="progress-bar progress-bar-striped bg-success" role="progressbar" id="modal-lembur-prog-bar" style="width: 0%;">0 Approval</div>
              </div>
            </div>

            <div class="mb-2">
              <small class="text-muted fw-bold d-block text-uppercase mb-1">Berkas Lampiran Surat Tugas:</small>
              <div id="modal-lembur-berkas">-</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
