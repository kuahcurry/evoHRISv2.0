<template>
  <style>
    /* ==========================================
       DESIGN SYSTEM & VARIABLES
       ========================================== */
    :root {
      --ui-bg: #f8fafc;
      --ui-surface: #ffffff;

      --ui-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);

      --ui-shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.025);

    }

    /* ==========================================
       UI CARDS

    .ui-card {
      background: var(--ui-surface);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius-xl);
      box-shadow: var(--ui-shadow-md);
      overflow: hidden;
    }

    .ui-card-header {
      background: var(--ui-surface);
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--ui-border);
    }

    .ui-input {
      border-radius: var(--ui-radius-md);
      border: 1px solid var(--ui-border);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    .ui-input:focus {
      border-color: var(--ui-primary);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
      background: #ffffff;
    }

    .ui-table {
      width: 100%;
      margin-bottom: 0;
      border-collapse: separate;
      border-spacing: 0;
    }

    .ui-table th {
      background: #f8fafc;
      color: var(--ui-text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--ui-border);
      white-space: nowrap;
    }

    .ui-table td {
      padding: 1rem 1.25rem;
      vertical-align: middle;
      border-bottom: 1px solid var(--ui-border);
      color: var(--ui-text-main);
      font-size: 0.85rem;
    }

    .ui-table tbody tr {
      transition: background 0.2s ease;
    }

    .ui-table tbody tr:hover {
      background: #fef2f2; /* Hover warna merah pudar */
    }

    /* ==========================================
       BUTTONS
       ========================================== */
    .btn-ui-white {
      background: var(--ui-surface);
      border: 1px solid var(--ui-border);
      color: var(--ui-text-main);
      border-radius: var(--ui-radius-md);
      font-weight: 600;
      padding: 0.5rem 1rem;
      box-shadow: var(--ui-shadow-sm);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-ui-white:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-1px);
      box-shadow: var(--ui-shadow-md);
      color: var(--ui-text-main);
    }

    /* ==========================================
       BADGES
       ========================================== */
    .badge-soft-danger { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; font-weight: 600; }
    .badge-soft-success { background-color: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; font-weight: 600; }
  </style>

  <div class="apel-wrapper">
    
    <!-- HEADER -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
      <div class="d-flex align-items-center gap-3">
        <div class="d-flex align-items-center justify-content-center" style="width: 56px; height: 56px; border-radius: var(--ui-radius-lg); background: #fee2e2; color: #dc2626; font-size: 1.5rem;">
          <i class="fas fa-flag"></i>
        </div>
        <div>
          <h3 class="fw-bold text-dark mb-1">Konfigurasi & Rekap Apel Pagi</h3>
          <p class="text-secondary mb-0">Pengaturan jadwal apel pagi gabungan, upacara rutin, dan parameter toleransi scan.</p>
        </div>
      </div>
      
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span class="badge bg-danger bg-opacity-10 text-danger border border-danger-subtle px-3 py-2 rounded-pill fw-semibold" id="total-badge-apel">0 Kategori Apel</span>
        <button class="btn btn-ui-white" id="btn-refresh-apel">
          <i class="fas fa-sync-alt text-danger"></i> Refresh
        </button>
      </div>
    </div>

    <!-- MAIN TABLE CARD -->
    <div class="ui-card">
      
      <!-- Filter Toolbar -->
      <div class="ui-card-header">
        <div class="row g-3 align-items-center justify-content-between">
          <div class="col-md-4">
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-search"></i></span>
              <input type="text" class="form-control ui-input border-start-0 ps-0" id="search-apel" placeholder="Cari nama apel...">
            </div>
          </div>
          <div class="col-md-6 text-md-end text-secondary small">
            <i class="fas fa-fingerprint text-danger me-1"></i>
            Scan log biometrik apel terintegrasi otomatis dengan mesin finger.
          </div>
        </div>
      </div>

      <!-- Loading State -->
      <div class="d-none text-center py-3 border-bottom bg-light" id="loading-apel">
        <div class="spinner-border spinner-border-sm text-danger mb-1" role="status"></div>
        <div class="small text-muted">Memperbarui data apel...</div>
      </div>

      <!-- Table -->
      <div class="table-responsive">
        <table class="ui-table">
          <thead>
            <tr>
              <th class="text-center" style="width: 60px;">No</th>
              <th>Nama Kegiatan Apel</th>
              <th class="text-center" style="width: 130px;">Jam Mulai</th>
              <th class="text-center" style="width: 140px;">Toleransi Waktu</th>
              <th>Keterangan Pelaksanaan</th>
              <th class="text-center" style="width: 110px;">Status</th>
            </tr>
          </thead>
          <tbody id="tbody-apel">
            <tr>
              <td colspan="6" class="text-center py-5 text-muted">
                <div class="spinner-border text-danger mb-2" role="status" style="width: 1.5rem; height: 1.5rem;"></div>
                <div>Memuat konfigurasi apel...</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>
</template>

<script type="module" defer>
  import { httpGet } from './assets/js/core/http.js';

  let rawApelData = [];
  let filteredApelData = [];

  const tag = 'absensi_apel';

  const initModule = async () => {
    await loadData();
    bindEvents();
  };

  const loadData = async () => {
    const tbody = document.getElementById('tbody-apel');
    const spinner = document.getElementById('loading-apel');
    
    if (spinner) spinner.classList.remove('d-none');
    if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data apel...</td></tr>';

    try {
      const res = await httpGet(`${config.api_url}/absensi/apel`);
      if (res && res.code === 200 && res.data) {
        rawApelData = res.data || [];
        filteredApelData = [...rawApelData];
        renderTable();
      } else {
        if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Belum ada konfigurasi apel.</td></tr>';
      }
    } catch (e) {
      console.error('Error loading apel:', e);
      if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat apel: ${e.message}</td></tr>`;
    } finally {
      if (spinner) spinner.classList.add('d-none');
    }
  };

  const renderTable = () => {
    const tbody = document.getElementById('tbody-apel');
    const badgeEl = document.getElementById('total-badge-apel');
    if (!tbody) return;

    if (badgeEl) badgeEl.textContent = `${filteredApelData.length} Kategori Apel`;

    if (filteredApelData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Data apel tidak ditemukan.</td></tr>';
      return;
    }

    let html = '';
    filteredApelData.forEach((row, idx) => {
      html += `
        <tr>
          <td class="text-center text-muted">${idx + 1}</td>
          <td>
            <div class="fw-bold text-dark"><i class="fas fa-flag text-danger me-2"></i>${row.nama_apel || '-'}</div>
            <div class="text-muted small">ID: ${row.kd_jenis_apel || row.id_jenis_apel || '-'} | Tempat: ${row.tempat || 'RS'}</div>
          </td>
          <td class="text-center fw-bold text-primary">${row.jam_mulai_apel || row.jam_mulai || '-'}</td>
          <td class="text-center">
            <span class="badge bg-soft-warning text-warning fw-bold">+${row.toleransi_apel || row.toleransi || 0} menit</span>
          </td>
          <td class="text-muted small">${row.keterangan || 'Apel rutin pegawai RS'}</td>
          <td class="text-center">
            <span class="badge bg-success"><i class="fas fa-check-circle me-1"></i>Aktif</span>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  };

  const bindEvents = () => {
    document.getElementById('btn-refresh-apel')?.addEventListener('click', () => loadData());
    document.getElementById('search-apel')?.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        filteredApelData = [...rawApelData];
      } else {
        filteredApelData = rawApelData.filter(r => 
          (r.nama_apel && r.nama_apel.toLowerCase().includes(q)) ||
          (r.keterangan && r.keterangan.toLowerCase().includes(q))
        );
      }
      renderTable();
    });
  };

  window.absensi_apel = { loadData };
  document.absensi_apel = { loadData };

  initModule();
</script>
