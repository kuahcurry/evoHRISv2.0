<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';
  import { loadSession, getCurrentUser } from './assets/js/core/helpers.js';
  import EvoSelector from './components/EvoSelector.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url)
    ? config.api_url
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let selJenisIjin = null;
  let currentUserData = {};
  let cachedIjinData = [];
  let modalCetakInstance = null;

  // Nama hari dalam Bahasa Indonesia
  const HARI_INDO = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const BULAN_INDO = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];

  // Utility Debounce
  function debounce(func, delay = 350) {
    let timer;
    return function (...args) {
      clearTimeout(timer);
      timer = setTimeout(() => func.apply(this, args), delay);
    };
  }

  // Format Tanggal Indonesia
  function formatTanggalIndo(dateObj) {
    const d = new Date(dateObj);
    if (isNaN(d.getTime())) return '';
    return `${d.getDate()} ${BULAN_INDO[d.getMonth()]} ${d.getFullYear()}`;
  }

  // Format Hari / YYYY-MM-DD
  function formatHariTanggal(dateStr) {
    if (!dateStr || dateStr === '0000-00-00') {
      const today = new Date();
      const hari = HARI_INDO[today.getDay()];
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${hari} / ${yyyy}-${mm}-${dd}`;
    }
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return `Jumat / ${dateStr}`;
    const hari = HARI_INDO[d.getDay()];
    return `${hari} / ${dateStr}`;
  }

  // Inisialisasi Data Pengguna dari Sesi Login Dinamis (Tanpa Hardcode)
  async function initUserData() {
    let sessionApp = {};
    try {
      if (typeof loadSession === 'function') {
        sessionApp = loadSession({ id: 'app' }) || {};
      }
    } catch (e) {
      sessionApp = {};
    }

    const curr = (typeof getCurrentUser === 'function') ? (getCurrentUser() || {}) : {};

    currentUserData = {
      nama: curr.nama_user || curr.username || curr.nama || sessionApp.nama_user || sessionApp.username || sessionApp.nama || '',
      nip: curr.nip || curr.kd_paramedis || curr.kd_user || sessionApp.nip || sessionApp.kd_paramedis || sessionApp.kd_user || '',
      bagian: curr.nama_unit || curr.tag_unit || curr.bagian || sessionApp.nama_unit || sessionApp.tag_unit || sessionApp.bagian || ''
    };

    const elNama = document.getElementById('ijin_nama');
    const elNip = document.getElementById('ijin_nip');
    const elBagian = document.getElementById('ijin_bagian');

    if (elNama) elNama.value = currentUserData.nama;
    if (elNip) elNip.value = currentUserData.nip;
    if (elBagian) elBagian.value = currentUserData.bagian;

    // Set default tanggal hari ini
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const elTgl = document.getElementById('ijin_tanggal');
    if (elTgl && !elTgl.value) {
      elTgl.value = `${yyyy}-${mm}-${dd}`;
    }

    // Ambil info bagian dan profil lengkap jika NIP tersedia
    if (currentUserData.nip) {
      try {
        const res = await httpGet(`${apiUrl}/pegawai/cuti/sisa?nip=${encodeURIComponent(currentUserData.nip)}`);
        if (res && res.code === 200 && res.data) {
          if (res.data.bagian && !currentUserData.bagian) {
            currentUserData.bagian = res.data.bagian;
            if (elBagian) elBagian.value = res.data.bagian;
          }
          if (res.data.nama && !currentUserData.nama) {
            currentUserData.nama = res.data.nama;
            if (elNama) elNama.value = res.data.nama;
          }
        }
      } catch (e) {
        // Abaikan jika tidak tersedia
      }
    }
  }

  // Inisialisasi Dropdown Jenis Ijin
  async function initJenisIjinSelector() {
    selJenisIjin = new EvoSelector('sel_jenis_ijin', [
      { text: 'Pilih Jenis Ijin', value: '-' }
    ]);

    try {
      const rs = await httpGet(`${apiUrl}/pegawai/ijin/jenis`);
      let list = [];
      if (rs && rs.code === 200 && Array.isArray(rs.data)) {
        list = rs.data;
      }
      if (list.length > 0) {
        const opts = [{ text: 'Pilih Jenis Ijin', value: '-' }];
        list.forEach(item => {
          opts.push({
            text: item.JENIS_CUTI,
            value: String(item.KD_JENIS_CUTI)
          });
        });
        selJenisIjin.addOptions(opts);
      }
    } catch (err) {
      console.warn('Gagal memuat master jenis ijin:', err);
    }
  }

  // Render Status Badge
  function renderStatusBadge(status, statusBatal) {
    if (statusBatal == 1 || status == 3 || String(status).toLowerCase() === 'ditolak') {
      return `<span class="badge badge-status-ditolak"><i class="fas fa-times-circle me-1"></i>Ditolak</span>`;
    }
    const s = parseInt(status);
    switch (s) {
      case 1:
        return `<span class="badge badge-status-disetujui"><i class="fas fa-check-circle me-1"></i>Disetujui</span>`;
      case 2:
        return `<span class="badge badge-status-hrd"><i class="fas fa-check-double me-1"></i>Disetujui HRD</span>`;
      case 0:
      default:
        return `<span class="badge badge-status-menunggu"><i class="fas fa-clock me-1"></i>Menunggu</span>`;
    }
  }

  // Render Tombol Aksi: Cetak, Edit, Hapus (Soft Delete)
  function renderActionButtons(item) {
    const id = item.KD_CUTI;
    return `
      <div class="d-flex justify-content-center align-items-center gap-1">
        <button type="button" class="btn btn-falcon-info btn-xs btn-cetak-ijin" data-id="${id}" title="Cetak Surat Ijin">
          <i class="fas fa-print me-1"></i>Cetak
        </button>
        <button type="button" class="btn btn-falcon-warning btn-xs btn-edit-ijin" data-id="${id}" title="Edit Permohonan Ijin">
          <i class="fas fa-edit me-1"></i>Edit
        </button>
        <button type="button" class="btn btn-falcon-danger btn-xs btn-hapus-ijin" data-id="${id}" title="Hapus (Soft Delete)">
          <i class="fas fa-trash-alt me-1"></i>Hapus
        </button>
      </div>
    `;
  }

  // Muat Data Riwayat Ijin
  async function loadDataIjin(keyword = '') {
    const tbody = document.getElementById('tbody-ijin');
    const textCounter = document.getElementById('text-counter-ijin');
    const footerSummary = document.getElementById('footer-summary-ijin');

    if (!tbody) return;

    tbody.innerHTML = `
      <tr>
        <td colspan="11" class="text-center py-4 text-muted">
          <span class="spinner-border spinner-border-sm me-2"></span>Memuat data riwayat ijin...
        </td>
      </tr>
    `;

    try {
      let url = `${apiUrl}/pegawai/ijin`;
      if (keyword && keyword.trim() !== '') {
        url += `?search=${encodeURIComponent(keyword.trim())}`;
      }

      const res = await httpGet(url);
      let list = [];
      if (res && res.code === 200 && Array.isArray(res.data)) {
        list = res.data;
      }
      cachedIjinData = list;

      if (textCounter) textCounter.textContent = `Menampilkan ${list.length} data riwayat ijin`;
      if (footerSummary) footerSummary.textContent = `Total permohonan ijin: ${list.length}`;

      if (list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="11" class="text-center py-4 text-muted">
              <i class="fas fa-inbox fa-2x mb-2 d-block text-300"></i>
              Belum ada riwayat permohonan ijin${keyword ? ` untuk pencarian "${keyword}"` : ''}.
            </td>
          </tr>
        `;
        return;
      }

      let html = '';
      list.forEach((item, index) => {
        const nip = item.NIP || '-';
        const nama = item.NAMA_PEGAWAI || item.NAMA || '-';
        const jenis = item.JENIS_CUTI || '-';
        const tglMulai = item.TANGGAL_MULAI || '-';
        const tglSampai = (item.TANGGAL_SAMPAI && item.TANGGAL_SAMPAI !== '0000-00-00') ? item.TANGGAL_SAMPAI : tglMulai;
        const lama = item.LAMA || '1 Hari';
        const unit = item.BAGIAN || '-';
        const keperluan = item.KEPERLUAN || '-';
        const statusBadge = renderStatusBadge(item.STATUS, item.STATUS_BATAL);
        const aksiButtons = renderActionButtons(item);

        html += `
          <tr data-id="${item.KD_CUTI}">
            <td class="text-center text-muted fw-bold">${index + 1}</td>
            <td class="fw-semi-bold">${nip}</td>
            <td class="fw-bold text-dark">${nama}</td>
            <td><span class="badge bg-soft-primary text-primary fs--2">${jenis}</span></td>
            <td>${tglMulai}</td>
            <td>${tglSampai}</td>
            <td class="text-center"><span class="badge bg-soft-info text-info fs--2">${lama}</span></td>
            <td>${unit}</td>
            <td><span class="text-truncate d-inline-block" style="max-width: 180px;" title="${keperluan}">${keperluan}</span></td>
            <td class="text-center">${statusBadge}</td>
            <td class="text-center">${aksiButtons}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
      bindTableActions();
    } catch (err) {
      console.error('Error memuat riwayat ijin:', err);
      tbody.innerHTML = `
        <tr>
          <td colspan="11" class="text-center py-4 text-danger">
            <i class="fas fa-exclamation-triangle me-1"></i> Terjadi kesalahan saat memuat data.
          </td>
        </tr>
      `;
    }
  }

  // Bind Aksi Tombol Cetak, Edit, dan Hapus
  function bindTableActions() {
    // 1. Tombol Cetak
    document.querySelectorAll('.btn-cetak-ijin').forEach(btn => {
      btn.addEventListener('click', function () {
        const id = this.getAttribute('data-id');
        openModalCetak(id);
      });
    });

    // 2. Tombol Edit
    document.querySelectorAll('.btn-edit-ijin').forEach(btn => {
      btn.addEventListener('click', function () {
        const id = this.getAttribute('data-id');
        populateEditForm(id);
      });
    });

    // 3. Tombol Hapus (Soft Delete)
    document.querySelectorAll('.btn-hapus-ijin').forEach(btn => {
      btn.addEventListener('click', function () {
        const id = this.getAttribute('data-id');
        deletePermohonanIjin(id);
      });
    });
  }

  // Buka Modal Cetak Surat Ijin Pulang Awal
  function openModalCetak(id) {
    const item = cachedIjinData.find(x => String(x.KD_CUTI) === String(id));
    if (!item) {
      alert('Data permohonan ijin tidak ditemukan');
      return;
    }

    // Nama & Unit
    document.getElementById('cetak-nama').textContent = item.NAMA_PEGAWAI || item.NAMA || currentUserData.nama || '-';
    document.getElementById('cetak-unit').textContent = item.BAGIAN || currentUserData.bagian || '-';

    // Judul Surat Dinamis berdasarkan Jenis Ijin
    const judulEl = document.getElementById('cetak-judul-surat');
    if (judulEl) {
      if (item.JENIS_CUTI && item.JENIS_CUTI.toUpperCase().includes('PULANG AWAL')) {
        judulEl.textContent = 'SURAT IJIN PULANG AWAL';
      } else if (item.JENIS_CUTI) {
        judulEl.textContent = `SURAT ${item.JENIS_CUTI.toUpperCase()}`;
      } else {
        judulEl.textContent = 'SURAT IJIN PULANG AWAL';
      }
    }

    // Hari/Tanggal: Hari / YYYY-MM-DD
    const tglMulai = item.TANGGAL_MULAI || '';
    document.getElementById('cetak-hari-tanggal').textContent = formatHariTanggal(tglMulai);

    // Jam Pulang Awal / Jam Ijin
    const jamPulang = item.JAM_PULANG || item.JAM_MULAI || '09:14:00';
    document.getElementById('cetak-jam').textContent = jamPulang;

    // Keperluan
    document.getElementById('cetak-keperluan').textContent = item.KEPERLUAN || '-';

    // Titimangsa: Pulau Taliabu , 13 November 2026
    const today = new Date();
    document.getElementById('cetak-titimangsa').textContent = `Pulau Taliabu , ${formatTanggalIndo(today)}`;

    // Tanda Tangan Pemohon
    document.getElementById('cetak-ttd-pemohon').textContent = item.NAMA_PEGAWAI || item.NAMA || currentUserData.nama || '( __________________ )';

    // Tanda Tangan Atasan (Aman dari PHP Notice property of non-object)
    const elJabatanAtasan = document.getElementById('cetak-ttd-jabatan-atasan');
    const elNamaAtasan = document.getElementById('cetak-ttd-nama-atasan');

    const jabatanAtasan = item.JABATAN_ATASAN || 'Kepala Bagian / Atasan';
    const namaAtasan = (item.NAMA_ATASAN_PEGAWAI && item.NAMA_ATASAN_PEGAWAI !== '-')
      ? item.NAMA_ATASAN_PEGAWAI
      : (item.NAMA_ATASAN && item.NAMA_ATASAN !== '-')
        ? item.NAMA_ATASAN
        : '( __________________ )';

    if (elJabatanAtasan) elJabatanAtasan.textContent = jabatanAtasan;
    if (elNamaAtasan) elNamaAtasan.textContent = namaAtasan.startsWith('(') ? namaAtasan : `( ${namaAtasan} )`;

    // Tampilkan Modal Bootstrap
    const modalEl = document.getElementById('modal-cetak-ijin');
    if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
      if (!modalCetakInstance) {
        modalCetakInstance = new bootstrap.Modal(modalEl);
      }
      modalCetakInstance.show();
    } else {
      modalEl.classList.add('show');
      modalEl.style.display = 'block';
    }
  }

  // Populate Form untuk Edit Mode
  function populateEditForm(id) {
    const item = cachedIjinData.find(x => String(x.KD_CUTI) === String(id));
    if (!item) return;

    document.getElementById('ijin_kd_cuti').value = item.KD_CUTI;
    if (document.getElementById('ijin_bagian')) {
      document.getElementById('ijin_bagian').value = item.BAGIAN || currentUserData.bagian || '';
    }
    if (document.getElementById('ijin_nama')) {
      document.getElementById('ijin_nama').value = item.NAMA_PEGAWAI || item.NAMA || currentUserData.nama;
    }
    if (document.getElementById('ijin_nip')) {
      document.getElementById('ijin_nip').value = item.NIP || currentUserData.nip;
    }
    if (document.getElementById('ijin_tanggal')) {
      document.getElementById('ijin_tanggal').value = item.TANGGAL_MULAI || '';
    }
    if (document.getElementById('ijin_jam_mulai')) {
      const jmMulai = item.JAM_MULAI ? item.JAM_MULAI.substring(0, 5) : '09:14';
      document.getElementById('ijin_jam_mulai').value = jmMulai;
    }
    if (document.getElementById('ijin_jam_selesai')) {
      const jmSelesai = item.JAM_PULANG ? item.JAM_PULANG.substring(0, 5) : '16:00';
      document.getElementById('ijin_jam_selesai').value = jmSelesai;
    }
    if (document.getElementById('ijin_keperluan')) {
      document.getElementById('ijin_keperluan').value = item.KEPERLUAN || '';
    }

    if (selJenisIjin && item.KD_JENIS_CUTI) {
      selJenisIjin.setValue(String(item.KD_JENIS_CUTI));
    }

    // Perbarui label form
    document.getElementById('form-ijin-title').textContent = `Edit Permohonan Ijin (#${item.KD_CUTI})`;
    document.getElementById('form-ijin-badge').textContent = 'Mode ubah data permohonan ijin';
    const btnSimpan = document.getElementById('btn-simpan-ijin');
    btnSimpan.innerHTML = '<i class="fas fa-save me-1"></i> Perbarui Ijin';
    btnSimpan.classList.replace('btn-primary', 'btn-warning');
    document.getElementById('btn-cancel-edit-ijin').classList.remove('d-none');

    // Scroll mulus ke form
    document.getElementById('form-pengajuan-ijin').scrollIntoView({ behavior: 'smooth' });
  }

  // Reset Form ke Pengajuan Baru
  function resetFormIjin() {
    document.getElementById('form-pengajuan-ijin').reset();
    document.getElementById('ijin_kd_cuti').value = '';
    document.getElementById('ijin_nama').value = currentUserData.nama || '';
    document.getElementById('ijin_nip').value = currentUserData.nip || '';
    document.getElementById('ijin_bagian').value = currentUserData.bagian || '';

    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('ijin_tanggal').value = `${yyyy}-${mm}-${dd}`;
    document.getElementById('ijin_jam_mulai').value = '08:00';
    document.getElementById('ijin_jam_selesai').value = '16:00';

    if (selJenisIjin) {
      selJenisIjin.setValue('-');
    }

    document.getElementById('form-ijin-title').textContent = 'Form Pengajuan Ijin';
    document.getElementById('form-ijin-badge').textContent = 'Silakan lengkapi data permohonan ijin';
    const btnSimpan = document.getElementById('btn-simpan-ijin');
    btnSimpan.innerHTML = '<i class="fas fa-paper-plane me-1"></i> Ajukan Ijin';
    btnSimpan.classList.replace('btn-warning', 'btn-primary');
    document.getElementById('btn-cancel-edit-ijin').classList.add('d-none');
  }

  // Soft Delete Permohonan Ijin
  async function deletePermohonanIjin(id) {
    if (!confirm(`Apakah Anda yakin ingin menghapus permohonan ijin #${id}? (Data akan dinonaktifkan / soft delete)`)) {
      return;
    }

    try {
      const res = await httpPost(`${apiUrl}/pegawai/ijin/delete`, {
        KD_CUTI: id,
        id: id
      });

      if (res && (res.code === 200 || res.status === 200 || res.status === true)) {
        alert(res.message || 'Permohonan ijin berhasil dihapus (soft delete).');
        loadDataIjin(document.getElementById('input_search_ijin').value);
      } else {
        alert(res.message || 'Gagal menghapus permohonan ijin.');
      }
    } catch (err) {
      console.error('Error saat soft delete ijin:', err);
      alert('Terjadi kesalahan saat menghapus data.');
    }
  }

  // Simpan / Perbarui Permohonan Ijin
  async function handleFormSubmit(e) {
    e.preventDefault();

    const kdCuti = document.getElementById('ijin_kd_cuti').value;
    const tanggal = document.getElementById('ijin_tanggal').value;
    const jamMulai = document.getElementById('ijin_jam_mulai').value;
    const jamSelesai = document.getElementById('ijin_jam_selesai').value;
    const keperluan = document.getElementById('ijin_keperluan').value;

    const jenisVal = selJenisIjin ? selJenisIjin.getValue() : '-';
    if (!jenisVal || jenisVal === '-') {
      alert('Silakan pilih Jenis Ijin terlebih dahulu!');
      return;
    }

    if (!tanggal) {
      alert('Tanggal Ijin wajib diisi!');
      return;
    }

    const nipVal = document.getElementById('ijin_nip').value || currentUserData.nip;
    const namaVal = document.getElementById('ijin_nama').value || currentUserData.nama;

    if (!nipVal) {
      alert('NIP pemohon tidak terdeteksi dari sesi aktif. Silakan pastikan Anda sudah login.');
      return;
    }

    const payload = {
      KD_CUTI: kdCuti || undefined,
      NIP: nipVal,
      NAMA: namaVal,
      TANGGAL_MULAI: tanggal,
      TANGGAL_SAMPAI: tanggal,
      JAM_MULAI: jamMulai,
      JAM_SELESAI: jamSelesai,
      JAM_PULANG: jamSelesai,
      KD_JENIS_CUTI: jenisVal,
      KEPERLUAN: keperluan
    };

    const btnSimpan = document.getElementById('btn-simpan-ijin');
    const originalText = btnSimpan.innerHTML;
    btnSimpan.disabled = true;
    btnSimpan.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Menyimpan...';

    try {
      const res = await httpPost(`${apiUrl}/pegawai/ijin/save`, payload);
      if (res && (res.code === 200 || res.status === 200 || res.status === true)) {
        alert(res.message || 'Permohonan ijin berhasil disimpan!');
        resetFormIjin();
        loadDataIjin();
      } else {
        alert(res.message || 'Gagal menyimpan permohonan ijin.');
      }
    } catch (err) {
      console.error('Error saat menyimpan ijin:', err);
      alert('Terjadi kesalahan koneksi server saat menyimpan data.');
    } finally {
      btnSimpan.disabled = false;
      btnSimpan.innerHTML = originalText;
    }
  }

  // Inisialisasi Event Handlers
  function initEventHandlers() {
    // Form Submit
    const form = document.getElementById('form-pengajuan-ijin');
    if (form) {
      form.addEventListener('submit', handleFormSubmit);
    }

    // Reset Form
    const btnReset = document.getElementById('btn-reset-ijin');
    if (btnReset) {
      btnReset.addEventListener('click', resetFormIjin);
    }

    // Batal Edit
    const btnCancel = document.getElementById('btn-cancel-edit-ijin');
    if (btnCancel) {
      btnCancel.addEventListener('click', resetFormIjin);
    }

    // Refresh Data
    const btnRefresh = document.getElementById('btn-refresh-ijin');
    if (btnRefresh) {
      btnRefresh.addEventListener('click', () => {
        const keyword = document.getElementById('input_search_ijin').value;
        loadDataIjin(keyword);
      });
    }

    // Search Input dengan Debounce (NIP & Nama)
    const inputSearch = document.getElementById('input_search_ijin');
    if (inputSearch) {
      const debouncedSearch = debounce((val) => {
        loadDataIjin(val);
      }, 350);

      inputSearch.addEventListener('input', function () {
        debouncedSearch(this.value);
      });

      inputSearch.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          loadDataIjin(this.value);
        }
      });
    }

    // Tombol Cari
    const btnSearch = document.getElementById('btn_search_ijin');
    if (btnSearch) {
      btnSearch.addEventListener('click', () => {
        const val = document.getElementById('input_search_ijin').value;
        loadDataIjin(val);
      });
    }

    // Tombol Print di Modal
    const btnPrint = document.getElementById('btn-print-surat-modal');
    if (btnPrint) {
      btnPrint.addEventListener('click', () => {
        window.print();
      });
    }
  }

  // Bootstrapping Modul Vijin
  async function initVijinModule() {
    await initUserData();
    await initJenisIjinSelector();
    initEventHandlers();
    await loadDataIjin();
  }

  initVijinModule();
</script>
