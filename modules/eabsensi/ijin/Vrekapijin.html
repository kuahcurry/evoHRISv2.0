<script type="module" defer>
  import { httpGet } from './assets/js/core/http.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url)
    ? config.api_url
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let fullIjinList = [];
  let modalDokumen = null;

  const MONTH_NAMES_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const HARI_INDO = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const BULAN_INDO = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];

  function debounce(func, delay = 300) {
    let timer;
    return function (...args) {
      clearTimeout(timer);
      timer = setTimeout(() => func.apply(this, args), delay);
    };
  }

  // Format tanggal ke: 06-Oct-2026
  function formatTglShort(dateStr) {
    if (!dateStr || dateStr === '0000-00-00' || dateStr.trim() === '') return '';
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      const yyyy = parts[0];
      const mIdx = parseInt(parts[1], 10) - 1;
      const dd = parts[2].padStart(2, '0');
      const mName = MONTH_NAMES_SHORT[mIdx] || parts[1];
      return `${dd}-${mName}-${yyyy}`;
    }
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    const dd = String(d.getDate()).padStart(2, '0');
    const mName = MONTH_NAMES_SHORT[d.getMonth()];
    const yyyy = d.getFullYear();
    return `${dd}-${mName}-${yyyy}`;
  }

  // Format jam: e.g. 08:15:00
  function formatJam(jamStr) {
    if (!jamStr || jamStr.trim() === '') return '';
    const clean = jamStr.trim();
    if (clean === '00:00:00') return '';
    if (clean.length === 5) return `${clean}:00`;
    return clean;
  }

  function formatHariTanggal(dateStr) {
    if (!dateStr || dateStr === '0000-00-00') return '-';
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      const hari = HARI_INDO[d.getDay()] || 'Hari';
      return `${hari} / ${dateStr}`;
    }
    return dateStr;
  }

  function formatTanggalIndo(dateObj) {
    const d = dateObj || new Date();
    const tgl = d.getDate();
    const bln = BULAN_INDO[d.getMonth()];
    const thn = d.getFullYear();
    return `${tgl} ${bln} ${thn}`;
  }

  async function loadDaftarIjin(keyword = '') {
    const tbody = document.getElementById('tbody-daftar-ijin');
    if (!tbody) return;

    tbody.innerHTML = `
      <tr>
        <td colspan="11" class="text-center py-4 text-muted">
          <span class="spinner-border spinner-border-sm me-2"></span>Memuat Daftar Ijin Pegawai...
        </td>
      </tr>
    `;

    try {
      let url = `${apiUrl}/pegawai/ijin`;
      if (keyword && keyword.trim() !== '') {
        url += `?search=${encodeURIComponent(keyword.trim())}`;
      }

      const res = await httpGet(url);
      let list = [];
      if (res && res.code === 200 && Array.isArray(res.data)) {
        list = res.data;
      }

      fullIjinList = list;
      renderDaftarIjinTable(list);
    } catch (err) {
      console.error('Error saat load daftar ijin:', err);
      tbody.innerHTML = `
        <tr>
          <td colspan="11" class="text-center py-4 text-danger">
            <i class="fas fa-exclamation-triangle me-1"></i> Terjadi kesalahan saat memuat data ijin pegawai.
          </td>
        </tr>
      `;
    }
  }

  function renderDaftarIjinTable(list) {
    const tbody = document.getElementById('tbody-daftar-ijin');
    const badgeTotal = document.getElementById('badge-total-ijin');
    const footerCount = document.getElementById('footer-rekap-count');

    if (badgeTotal) badgeTotal.textContent = `Total: ${list.length} Ijin`;
    if (footerCount) footerCount.textContent = `Menampilkan ${list.length} data`;

    if (list.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="11" class="text-center py-4 text-muted">
            <i class="fas fa-inbox fa-2x mb-2 d-block text-300"></i>
            Tidak ada data ijin pegawai yang ditemukan.
          </td>
        </tr>
      `;
      return;
    }

    let html = '';
    list.forEach((item, index) => {
      const nip = item.NIP || '-';
      const nama = item.NAMA_PEGAWAI || item.NAMA || '-';
      const jenis = item.JENIS_CUTI || '-';

      // Format Tgl Mulai: e.g. 06-Oct-2026
      const tglMulaiFormatted = formatTglShort(item.TANGGAL_MULAI);

      // Tgl Sampai: jika kosong, 0000-00-00, atau sama dengan tgl mulai, kosongkan
      let tglSampaiFormatted = '';
      if (item.TANGGAL_SAMPAI && item.TANGGAL_SAMPAI !== '0000-00-00' && item.TANGGAL_SAMPAI !== item.TANGGAL_MULAI) {
        tglSampaiFormatted = formatTglShort(item.TANGGAL_SAMPAI);
      }

      // Jam Mulai & Jam Sampai (e.g. 08:15:00 dan 00:30:00)
      const jamMulai = formatJam(item.JAM_MULAI);
      const jamSampai = formatJam(item.JAM_PULANG || item.JAM_SELESAI);

      const bagian = item.BAGIAN || '-';
      const keperluan = item.KEPERLUAN || '-';

      html += `
        <tr data-id="${item.KD_CUTI}">
          <td class="text-center text-muted fw-bold">${index + 1}.</td>
          <td class="fw-semi-bold">${nip}</td>
          <td class="fw-bold text-dark">${nama}</td>
          <td><span class="badge badge-jenis-ijin">${jenis}</span></td>
          <td class="text-nowrap">${tglMulaiFormatted}</td>
          <td class="text-nowrap">${tglSampaiFormatted}</td>
          <td class="text-nowrap">${jamMulai}</td>
          <td class="text-nowrap">${jamSampai}</td>
          <td>${bagian}</td>
          <td><span title="${keperluan}">${keperluan}</span></td>
          <td class="text-center">
            <button type="button" class="btn btn-falcon-info btn-xs btn-lihat-dokumen" data-id="${item.KD_CUTI}">
              <i class="fas fa-file-alt me-1"></i>Lihat
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    bindLihatDokumenButtons();
  }

  function bindLihatDokumenButtons() {
    document.querySelectorAll('.btn-lihat-dokumen').forEach(btn => {
      btn.addEventListener('click', function () {
        const id = this.getAttribute('data-id');
        bukaDokumenIjin(id);
      });
    });
  }

  function bukaDokumenIjin(id) {
    const item = fullIjinList.find(x => String(x.KD_CUTI) === String(id));
    if (!item) {
      alert('Data permohonan ijin tidak ditemukan');
      return;
    }

    // Nama, NIP, & Unit
    document.getElementById('dokumen-nama').textContent = item.NAMA_PEGAWAI || item.NAMA || '-';
    document.getElementById('dokumen-nip').textContent = item.NIP || '-';
    document.getElementById('dokumen-unit').textContent = item.BAGIAN || '-';

    // Judul Surat Dinamis
    const judulEl = document.getElementById('dokumen-judul-surat');
    if (judulEl) {
      if (item.JENIS_CUTI && item.JENIS_CUTI.toUpperCase().includes('PULANG AWAL')) {
        judulEl.textContent = 'SURAT IJIN PULANG AWAL';
      } else if (item.JENIS_CUTI) {
        judulEl.textContent = `SURAT ${item.JENIS_CUTI.toUpperCase()}`;
      } else {
        judulEl.textContent = 'SURAT IJIN PULANG AWAL';
      }
    }

    // Hari / Tanggal
    const tglMulai = item.TANGGAL_MULAI || '';
    document.getElementById('dokumen-hari-tanggal').textContent = formatHariTanggal(tglMulai);

    // Jam
    const jamMulai = formatJam(item.JAM_MULAI);
    const jamSampai = formatJam(item.JAM_PULANG || item.JAM_SELESAI);
    let jamText = jamSampai || jamMulai || '-';
    if (jamMulai && jamSampai && jamMulai !== jamSampai) {
      jamText = `${jamMulai} s/d ${jamSampai}`;
    }
    document.getElementById('dokumen-jam').textContent = jamText;

    // Keperluan
    document.getElementById('dokumen-keperluan').textContent = item.KEPERLUAN || '-';

    // Titimangsa
    const today = new Date();
    document.getElementById('dokumen-titimangsa').textContent = `Pulau Taliabu , ${formatTanggalIndo(today)}`;

    // TTD Pemohon
    document.getElementById('dokumen-ttd-pemohon').textContent = item.NAMA_PEGAWAI || item.NAMA || '( __________________ )';

    // TTD Atasan
    const elJabatanAtasan = document.getElementById('dokumen-ttd-jabatan-atasan');
    const elNamaAtasan = document.getElementById('dokumen-ttd-nama-atasan');

    const jabatanAtasan = item.JABATAN_ATASAN || 'Kepala Bagian / Atasan';
    const namaAtasan = (item.NAMA_ATASAN_PEGAWAI && item.NAMA_ATASAN_PEGAWAI !== '-')
      ? item.NAMA_ATASAN_PEGAWAI
      : (item.NAMA_ATASAN && item.NAMA_ATASAN !== '-')
        ? item.NAMA_ATASAN
        : '( __________________ )';

    if (elJabatanAtasan) elJabatanAtasan.textContent = jabatanAtasan;
    if (elNamaAtasan) elNamaAtasan.textContent = namaAtasan;

    // Tampilkan Modal
    const modalEl = document.getElementById('modal-preview-dokumen-ijin');
    if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
      modalDokumen = new bootstrap.Modal(modalEl);
      modalDokumen.show();
    } else {
      modalEl.classList.add('show');
      modalEl.style.display = 'block';
    }
  }

  // Export Excel CSV UTF-8
  function exportToExcel() {
    if (fullIjinList.length === 0) {
      alert('Tidak ada data ijin yang dapat diekspor.');
      return;
    }

    let csvContent = '\uFEFF'; // BOM UTF-8
    csvContent += '#,NIP,Nama,Jenis,Tgl Mulai,Tgl Sampai,Jam Mulai,Jam Sampai,Bagian/Unit,Keperluan,Dokumen\n';

    fullIjinList.forEach((item, index) => {
      const no = `${index + 1}.`;
      const nip = `"${(item.NIP || '').replace(/"/g, '""')}"`;
      const nama = `"${(item.NAMA_PEGAWAI || item.NAMA || '').replace(/"/g, '""')}"`;
      const jenis = `"${(item.JENIS_CUTI || '').replace(/"/g, '""')}"`;
      const tglM = `"${formatTglShort(item.TANGGAL_MULAI)}"`;

      let tglSVal = '';
      if (item.TANGGAL_SAMPAI && item.TANGGAL_SAMPAI !== '0000-00-00' && item.TANGGAL_SAMPAI !== item.TANGGAL_MULAI) {
        tglSVal = formatTglShort(item.TANGGAL_SAMPAI);
      }
      const tglS = `"${tglSVal}"`;

      const jamM = `"${formatJam(item.JAM_MULAI)}"`;
      const jamS = `"${formatJam(item.JAM_PULANG || item.JAM_SELESAI)}"`;
      const unit = `"${(item.BAGIAN || '').replace(/"/g, '""')}"`;
      const kep = `"${(item.KEPERLUAN || '').replace(/"/g, '""')}"`;
      const dok = '"Lihat"';

      csvContent += `${no},${nip},${nama},${jenis},${tglM},${tglS},${jamM},${jamS},${unit},${kep},${dok}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `Daftar_Ijin_Pegawai_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function initModule() {
    loadDaftarIjin();

    // Input Cari dengan Debounce (300ms)
    const inputCari = document.getElementById('input_cari_rekap');
    if (inputCari) {
      const debouncedSearch = debounce((keyword) => {
        loadDaftarIjin(keyword);
      }, 300);

      inputCari.addEventListener('input', function () {
        debouncedSearch(this.value);
      });

      inputCari.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          loadDaftarIjin(this.value);
        }
      });
    }

    // Tombol Clear Cari
    const btnClear = document.getElementById('btn_clear_cari');
    if (btnClear) {
      btnClear.addEventListener('click', () => {
        if (inputCari) {
          inputCari.value = '';
          loadDaftarIjin('');
        }
      });
    }

    // Tombol Export Excel
    const btnExport = document.getElementById('btn-export-excel-ijin');
    if (btnExport) {
      btnExport.addEventListener('click', exportToExcel);
    }

    // Tombol Cetak Dokumen di Modal
    const btnPrint = document.getElementById('btn-print-dokumen');
    if (btnPrint) {
      btnPrint.addEventListener('click', () => {
        window.print();
      });
    }
  }

  initModule();
</script>
