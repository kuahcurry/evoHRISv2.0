            <div class="col-md-4">

          <!-- Row 2: Tanggal Cuti, Jenis Cuti, Pegawai Pengganti -->
          <div class="row g-3 mb-3">

                <small class="text-muted fs--2">Format: YYYY-MM-DD</small>

            <div class="col-md-4">

              <div id="sel_jenis_cuti" placeholder="Pilih Jenis Cuti"></div>

            <div class="col-md-4">

              <div id="sel_pegawai_pengganti" placeholder="Pilih Pegawai Pengganti"></div>

          <!-- Row 3: No Yang Bisa Dihubungi, Sisa Cuti, Keperluan -->

          <!-- Tombol Aksi Pengajuan -->

    <!-- TABEL RIWAYAT PENGAJUAN CUTI -->

        <div>
          <h6 class="mb-0 fw-bold text-700">

          </h6>

        </div>

        <!-- Search Input dengan Debounce -->
        <div class="d-flex align-items-center gap-2">
          <div class="input-group input-group-sm" style="min-width: 280px; max-width: 360px;">
            <span class="input-group-text bg-light border-end-0">

      <div class="card-body p-0">

              <tr>

                <th>NIP</th>
                <th>Nama</th>

                <th>Tgl Sampai</th>

              </tr>

              <tr>
                <td colspan="12" class="text-center py-4 text-muted">
                  <span class="spinner-border spinner-border-sm me-2"></span>Memuat data riwayat cuti...

            </tbody>
          </table>
        </div>
      </div>

      <div class="card-footer bg-light py-2 px-3 border-top d-flex justify-content-between align-items-center">
        <span class="fs--2 text-muted" id="footer-summary-cuti">Total pengajuan: 0</span>
        <span class="fs--2 text-muted">Data tersinkronisasi otomatis dengan HRIS</span>
      </div>
    </div>
  </div>
</template>

<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';
  import { loadSession, getCurrentUser } from './assets/js/core/helpers.js';
  import EvoSelector from './components/EvoSelector.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url)
    ? config.api_url
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let selJenisCuti = null;
  let selPegawaiPengganti = null;
  let cachedPegawaiList = [];
  let currentUserData = {};

  // Utility Debounce
  function debounce(func, delay = 300) {
    let timer;
    return function (...args) {
      clearTimeout(timer);
      timer = setTimeout(() => func.apply(this, args), delay);
    };
  }

  // Hitung selisih hari
  function calculateLamaHari(tglMulai, tglSampai) {
    if (!tglMulai || !tglSampai) return 0;
    const start = new Date(tglMulai);
    const end = new Date(tglSampai);
    if (isNaN(start) || isNaN(end) || end < start) return 0;
    const diffTime = Math.abs(end - start);
    return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
  }

  // Inisialisasi Data Pengguna
  async function initUserData() {
    const sessionApp = loadSession({ id: 'app' }) || {};
    const curr = (typeof getCurrentUser === 'function') ? (getCurrentUser() || {}) : {};
    
    // Gabungkan preferensi sesi
    currentUserData = {
      nama: curr.nama_user || curr.username || sessionApp.nama_user || sessionApp.username || 'administrator',
      nip: curr.nip || curr.kd_paramedis || curr.kd_user || sessionApp.nip || sessionApp.kd_paramedis || '123456',
      bagian: curr.nama_unit || curr.tag_unit || curr.bagian || sessionApp.nama_unit || '',
      kontak: curr.kontak || curr.handphone || curr.hp || curr.telephone || sessionApp.kontak || '4456'
    };

    document.getElementById('cuti_nama').value = currentUserData.nama;
    document.getElementById('cuti_nip').value = currentUserData.nip;
    document.getElementById('cuti_kontak').value = currentUserData.kontak;
    if (currentUserData.bagian) {
      document.getElementById('cuti_bagian').value = currentUserData.bagian;
    }

    // Ambil detail kuota sisa cuti dan kontak resmi dari database
    try {
      const res = await httpGet(`${apiUrl}/pegawai/cuti/sisa?nip=${encodeURIComponent(currentUserData.nip)}`);
      if (res && res.code === 200 && res.data) {
        if (res.data.sisa !== undefined) {
          document.getElementById('cuti_sisa').value = res.data.sisa;
        }
        if (res.data.bagian) {
          document.getElementById('cuti_bagian').value = res.data.bagian;
        }
        if (res.data.kontak) {
          document.getElementById('cuti_kontak').value = res.data.kontak;
        }
        if (res.data.total !== undefined && res.data.terpakai !== undefined) {
          document.getElementById('info_sisa_cuti').textContent = 
            `Kuota: ${res.data.total} hari | Terpakai: ${res.data.terpakai} hari | Sisa: ${res.data.sisa} hari`;
        }
      }
    } catch (err) {
      console.warn('Gagal memuat sisa cuti:', err);
    }
  }

  // Inisialisasi Selector Evo
  async function initSelectors() {
    // 1. Selector Jenis Cuti
    selJenisCuti = new EvoSelector('sel_jenis_cuti', [
      { text: 'Pilih Jenis Cuti', value: '-' }
    ]);

    // 2. Selector Pegawai Pengganti
    selPegawaiPengganti = new EvoSelector('sel_pegawai_pengganti', [
      { text: 'Pilih Pegawai Pengganti', value: '-' }
    ]);

    // Load Master Jenis Cuti
    try {
      const rsMaster = await httpGet(`${apiUrl}/cPegawai/master`);
      if (rsMaster && rsMaster.data && Array.isArray(rsMaster.data.jenis_cuti)) {
        const optsCuti = [{ text: 'Pilih Jenis Cuti', value: '-' }];
        rsMaster.data.jenis_cuti.forEach(item => {
          optsCuti.push({
            text: item.JENIS_CUTI || item.NAMA_JENIS_CUTI,
            value: String(item.KD_JENIS_CUTI)
          });
        });
        selJenisCuti.addOptions(optsCuti);
      }
    } catch (err) {
      console.warn('Gagal memuat master jenis cuti:', err);
    }

    // Load Master Pegawai Pengganti
    try {
      const rsPegawai = await httpGet(`${apiUrl}/cTambahPegawai/get_data_pegawai`);
      let list = [];
      if (rsPegawai && rsPegawai.data) {
        if (Array.isArray(rsPegawai.data.data)) {
          list = rsPegawai.data.data;
        } else if (Array.isArray(rsPegawai.data)) {
          list = rsPegawai.data;
        }
      }
      cachedPegawaiList = list;
      if (list.length > 0) {
        const optsPengganti = [{ text: 'Pilih Pegawai Pengganti', value: '-' }];
        list.forEach(p => {
          optsPengganti.push({
            text: `${p.NIP || '-'} - ${p.NAMA || 'Tanpa Nama'}`,
            value: String(p.ID_PEGAWAI || p.NIP)
          });
        });
        selPegawaiPengganti.addOptions(optsPengganti);
      }
    } catch (err) {
      console.warn('Gagal memuat master pegawai pengganti:', err);
    }
  }

  // Format Status Badge
  function renderStatusBadge(status, statusBatal) {
    if (statusBatal == 1 || status == 3 || String(status).toLowerCase() === 'ditolak') {
      return `<span class="badge badge-status-ditolak"><i class="fas fa-times-circle me-1"></i>Ditolak</span>`;
    }
    const s = parseInt(status);
    switch (s) {
      case 1:
        return `<span class="badge badge-status-disetujui"><i class="fas fa-check-circle me-1"></i>Disetujui</span>`;
      case 2:
        return `<span class="badge badge-status-hrd"><i class="fas fa-check-double me-1"></i>Disetujui HRD</span>`;
      case 0:
      default:
        return `<span class="badge badge-status-menunggu"><i class="fas fa-clock me-1"></i>Menunggu</span>`;
    }
  }

  // Muat Data Riwayat Cuti (12 Kolom)
  async function loadDataCuti(keyword = '') {
    const tbody = document.getElementById('tbody-cuti');
    tbody.innerHTML = `<tr><td colspan="12" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Memuat riwayat pengajuan cuti...</td></tr>`;

    try {
      let queryParam = keyword ? `?keyword=${encodeURIComponent(keyword)}` : '';
      const res = await httpGet(`${apiUrl}/pegawai/cuti${queryParam}`);
      const data = (res && res.data && Array.isArray(res.data)) ? res.data : [];

      document.getElementById('text-counter-cuti').textContent = `Ditemukan ${data.length} pengajuan cuti`;
      document.getElementById('footer-summary-cuti').textContent = `Total pengajuan: ${data.length}`;

      if (data.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="12" class="text-center py-4 text-muted">
              <i class="fas fa-inbox fa-2x mb-2 d-block text-300"></i>
              Tidak ada data riwayat cuti yang sesuai.
            </td>
          </tr>
        `;
        return;
      }

      let rowsHtml = '';
      data.forEach((item, idx) => {
        const lamaHari = item.LAMA || calculateLamaHari(item.TANGGAL_MULAI, item.TANGGAL_SAMPAI) || '-';
        const namaPegawai = item.NAMA_PEGAWAI || item.NAMA || '-';
        const bagianUnit = item.BAGIAN || item.KD_BAGIAN || '-';
        const jenisCuti = item.JENIS_CUTI || item.NAMA_JENIS_CUTI || '-';
        const tglMulai = item.TANGGAL_MULAI || '-';
        const tglSampai = item.TANGGAL_SAMPAI || '-';
        const keperluan = item.KEPERLUAN || '-';
        const statusBadge = renderStatusBadge(item.STATUS, item.STATUS_BATAL);
        const catatanAtasan = item.CATATAN_ATASAN || '-';
        const catatanHrd = item.CATATAN_HRD || '-';

        rowsHtml += `
          <tr>
            <td class="text-center text-muted fw-bold">${idx + 1}</td>
            <td><span class="badge bg-light text-dark font-monospace">${item.NIP || '-'}</span></td>
            <td class="fw-semi-bold text-900">${namaPegawai}</td>
            <td><span class="badge bg-soft-secondary text-secondary">${jenisCuti}</span></td>
            <td>${tglMulai}</td>
            <td>${tglSampai}</td>
            <td class="text-center fw-bold">${lamaHari} Hari</td>
            <td>${bagianUnit}</td>
            <td class="text-truncate" style="max-width: 180px;" title="${keperluan}">${keperluan}</td>
            <td class="text-center">${statusBadge}</td>
            <td class="small text-muted">${catatanAtasan}</td>
            <td class="small text-muted">${catatanHrd}</td>
          </tr>
        `;
      });

      tbody.innerHTML = rowsHtml;
    } catch (err) {
      console.error('Error saat memuat data cuti:', err);
      tbody.innerHTML = `
        <tr>
          <td colspan="12" class="text-center py-4 text-danger">
            <i class="fas fa-exclamation-triangle me-1"></i> Gagal memuat data riwayat cuti.
          </td>
        </tr>
      `;
    }
  }

  // Event Listeners Tanggal Cuti (Hitung Durasi)
  function setupDateListeners() {
    const elMulai = document.getElementById('cuti_tgl_mulai');
    const elSampai = document.getElementById('cuti_tgl_sampai');
    const elBadge = document.getElementById('label_lama_hari');

    const updateDurasi = () => {
      const durasi = calculateLamaHari(elMulai.value, elSampai.value);
      elBadge.textContent = `${durasi} Hari`;
      if (durasi > 0) {
        elBadge.className = 'badge bg-soft-primary text-primary fs--2';
      } else {
        elBadge.className = 'badge bg-soft-info text-info fs--2';
      }
    };

    elMulai?.addEventListener('change', () => {
      if (!elSampai.value || elSampai.value < elMulai.value) {
        elSampai.value = elMulai.value;
      }
      updateDurasi();
    });

    elSampai?.addEventListener('change', updateDurasi);
  }

  // Submit Form Pengajuan Cuti
  document.getElementById('form-pengajuan-cuti')?.addEventListener('submit', async (e) => {
    e.preventDefault();

    const tglMulai = document.getElementById('cuti_tgl_mulai').value;
    const tglSampai = document.getElementById('cuti_tgl_sampai').value;
    const kdJenisCuti = (selJenisCuti?.value && selJenisCuti.value !== '-') ? selJenisCuti.value : '';
    const pengganti = (selPegawaiPengganti?.value && selPegawaiPengganti.value !== '-') ? selPegawaiPengganti.value : '';
    const keperluan = document.getElementById('cuti_keperluan').value.trim();

    if (!tglMulai || !tglSampai) {
      alert('Silakan tentukan Tanggal Cuti (Mulai s/d Sampai).');
      return;
    }

    if (!kdJenisCuti) {
      alert('Silakan pilih Jenis Cuti.');
      return;
    }

    if (!keperluan) {
      alert('Silakan tulis keperluan/alasan cuti.');
      return;
    }

    const payload = {
      NIP: document.getElementById('cuti_nip').value,
      NAMA: document.getElementById('cuti_nama').value,
      BAGIAN: document.getElementById('cuti_bagian').value,
      KD_JENIS_CUTI: kdJenisCuti,
      TANGGAL_MULAI: tglMulai,
      TANGGAL_SAMPAI: tglSampai,
      PEGAWAI_PENGGANTI: pengganti,
      KEPERLUAN: keperluan,
      STATUS: 0
    };

    const submitBtn = document.getElementById('btn-simpan-cuti');
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Mengirim...`;

    try {
      const res = await httpPost(`${apiUrl}/pegawai/cuti`, payload);
      if (res && (res.code === 200 || res.status === 'ok')) {
        alert('Pengajuan cuti berhasil dikirim.');
        // Reset form input
        document.getElementById('cuti_tgl_mulai').value = '';
        document.getElementById('cuti_tgl_sampai').value = '';
        document.getElementById('cuti_keperluan').value = '';
        document.getElementById('label_lama_hari').textContent = '0 Hari';
        if (selJenisCuti) selJenisCuti.value = '-';
        if (selPegawaiPengganti) selPegawaiPengganti.value = '-';

        // Segarkan riwayat cuti dan sisa cuti
        await loadDataCuti();
        await initUserData();
      } else {
        alert((res && res.message) ? res.message : 'Gagal mengirim pengajuan cuti.');
      }
    } catch (err) {
      console.error('Error saat mengirim pengajuan cuti:', err);
      alert('Terjadi kesalahan saat menyimpan pengajuan cuti.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<i class="fas fa-paper-plane me-1"></i> Ajukan Cuti`;
    }
  });

  // Tombol Reset Form
  document.getElementById('btn-reset-cuti')?.addEventListener('click', () => {
    document.getElementById('cuti_tgl_mulai').value = '';
    document.getElementById('cuti_tgl_sampai').value = '';
    document.getElementById('cuti_keperluan').value = '';
    document.getElementById('label_lama_hari').textContent = '0 Hari';
    if (selJenisCuti) selJenisCuti.value = '-';
    if (selPegawaiPengganti) selPegawaiPengganti.value = '-';
  });

  // Pencarian dengan Debounce (Parameter NIP & Nama)
  const searchInput = document.getElementById('input_search_cuti');
  if (searchInput) {
    searchInput.addEventListener('input', debounce((e) => {
      const kw = e.target.value.trim();
      loadDataCuti(kw);
    }, 300));
  }

  // Tombol Cari langsung
  document.getElementById('btn_search_cuti')?.addEventListener('click', () => {
    const kw = searchInput ? searchInput.value.trim() : '';
    loadDataCuti(kw);
  });

  // Tombol Refresh
  document.getElementById('btn-refresh-cuti')?.addEventListener('click', () => {
    if (searchInput) searchInput.value = '';
    loadDataCuti('');
    initUserData();
  });

  // Jalankan inisialisasi awal
  initUserData();
  initSelectors();
  setupDateListeners();
  loadDataCuti();
</script>
