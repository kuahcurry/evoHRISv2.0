<script type="module">
  import { httpGet } from './assets/js/core/http.js';

  let rawMonitoringData = null;
  let detailModalInstance = null;

  function escapeXml(unsafe) {
    if (unsafe === null || unsafe === undefined) return '';
    return String(unsafe)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  function getDetailModal() {
    const el = document.getElementById('modal-unit-detail');
    if (!el) return null;
    if (window.bootstrap && window.bootstrap.Modal) {
      if (!detailModalInstance) {
        detailModalInstance = new window.bootstrap.Modal(el);
      }
      return detailModalInstance;
    }
    return {
      show: () => { el.classList.add('show'); el.style.display = 'block'; },
      hide: () => { el.classList.remove('show'); el.style.display = 'none'; }
    };
  }

  // Validasi Input Filter: "isi terlebih dahulu"
  function validateFilters() {
    const tglAwal = document.getElementById('filter_tgl_awal')?.value.trim();
    const tglAkhir = document.getElementById('filter_tgl_akhir')?.value.trim();

    if (!tglAwal || !tglAkhir) {
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          icon: 'warning',
          title: 'Peringatan',
          text: 'isi terlebih dahulu'
        });
      } else {
        alert('isi terlebih dahulu');
      }
      return false;
    }

    if (tglAwal > tglAkhir) {
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          icon: 'error',
          title: 'Format Tanggal Salah',
          text: 'Tgl Awal tidak boleh lebih besar dari Tgl Akhir!'
        });
      } else {
        alert('Tgl Awal tidak boleh lebih besar dari Tgl Akhir!');
      }
      return false;
    }

    return true;
  }

  // Load Monitoring Lembur Data from API
  async function loadMonitoringLembur(applyValidation = false) {
    if (applyValidation) {
      if (!validateFilters()) {
        return;
      }
    }

    const tbody = document.getElementById('tbody-monitoring-lembur');
    if (tbody) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data monitoring lembur...</td></tr>`;
    }

    const tglAwal = document.getElementById('filter_tgl_awal')?.value.trim() || '';
    const tglAkhir = document.getElementById('filter_tgl_akhir')?.value.trim() || '';
    const searchUnit = document.getElementById('filter_search_unit')?.value.trim() || '';

    let url = '/evoHRIS_v2.1/api/pegawai/lembur/monitoring';
    const params = new URLSearchParams();
    if (tglAwal) params.append('tgl_awal', tglAwal);
    if (tglAkhir) params.append('tgl_akhir', tglAkhir);
    if (searchUnit) params.append('search', searchUnit);

    const queryString = params.toString();
    if (queryString) {
      url += '?' + queryString;
    }

    // Update active filter badge
    const indicator = document.getElementById('filter-active-indicator');
    if (indicator) {
      if (tglAwal && tglAkhir) {
        indicator.textContent = `Periode: ${tglAwal} s/d ${tglAkhir}`;
      } else if (tglAwal) {
        indicator.textContent = `Mulai: ${tglAwal}`;
      } else {
        indicator.textContent = 'Semua Periode';
      }
    }

    try {
      const res = await httpGet(url);
      if (res && res.code === 200 && res.data) {
        rawMonitoringData = res.data;
        renderMonitoringTable(res.data.units || [], res.data.summary || {});
      } else {
        throw new Error(res?.message || 'Gagal mengambil data monitoring lembur');
      }
    } catch (err) {
      console.error('Error loadMonitoringLembur:', err);
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat data: ${escapeXml(err.message)}</td></tr>`;
      }
    }
  }

  // Render Table: No | Unit | Status Approval | Total | Keterangan
  function renderMonitoringTable(units, summary) {
    const tbody = document.getElementById('tbody-monitoring-lembur');
    if (!tbody) return;

    // Update counters
    document.getElementById('counter-total-unit').textContent = `${units.length} Unit`;
    document.getElementById('counter-total-lembur').textContent = summary.total_lembur ?? 0;
    document.getElementById('counter-total-disetujui').textContent = summary.total_disetujui ?? 0;
    document.getElementById('counter-total-menunggu').textContent = summary.total_menunggu ?? 0;

    // Update footer
    const footerTotal = document.getElementById('footer-total-pengajuan');
    const footerKet = document.getElementById('footer-total-keterangan');
    if (footerTotal) footerTotal.textContent = `${summary.total_lembur ?? 0} Pengajuan`;
    if (footerKet) footerKet.textContent = `${summary.total_disetujui ?? 0} Disetujui, ${summary.total_menunggu ?? 0} Menunggu, ${summary.total_ditolak ?? 0} Ditolak`;

    if (!units || units.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted"><i class="fas fa-inbox me-2"></i>Tidak ada data unit yang sesuai filter</td></tr>`;
      return;
    }

    let html = '';
    units.forEach((item, index) => {
      const no = item.no || (index + 1);
      const isHasData = item.total > 0;
      const rowClass = isHasData ? 'row-has-data' : 'row-empty';

      let statusBadge = '';
      if (item.status_badge === 'success') {
        statusBadge = `<span class="badge bg-soft-success text-success px-2 py-1"><i class="fas fa-check-circle me-1"></i>${escapeXml(item.status_approval)}</span>`;
      } else if (item.status_badge === 'warning') {
        statusBadge = `<span class="badge bg-soft-warning text-warning px-2 py-1"><i class="fas fa-clock me-1"></i>${escapeXml(item.status_approval)}</span>`;
      } else if (item.status_badge === 'info') {
        statusBadge = `<span class="badge bg-soft-info text-info px-2 py-1"><i class="fas fa-info-circle me-1"></i>${escapeXml(item.status_approval)}</span>`;
      } else if (item.status_badge === 'danger') {
        statusBadge = `<span class="badge bg-soft-danger text-danger px-2 py-1"><i class="fas fa-times-circle me-1"></i>${escapeXml(item.status_approval)}</span>`;
      } else {
        statusBadge = `<span class="badge bg-soft-secondary text-secondary px-2 py-1">${escapeXml(item.status_approval || '-')}</span>`;
      }

      let totalDisplay = '';
      if (item.total > 0) {
        totalDisplay = `<span class="badge bg-primary rounded-pill px-3 py-1 fs--1">${item.total} Pengajuan</span>`;
      } else {
        totalDisplay = `<span class="text-muted fw-bold">0</span>`;
      }

      let keteranganHtml = `<span>${escapeXml(item.keterangan || '-')}</span>`;
      if (isHasData) {
        keteranganHtml += `
          <button type="button" class="btn btn-link btn-sm text-primary p-0 ms-2 btn-view-unit-detail" data-unit-index="${index}" title="Lihat Rincian Pengajuan Unit">
            <i class="fas fa-eye me-1"></i>Lihat Rincian
          </button>
        `;
      }

      html += `
        <tr class="${rowClass}">
          <td class="text-center fw-bold text-muted">${no}</td>
          <td class="fw-bold text-800">
            <i class="fas fa-building text-400 me-2"></i>${escapeXml(item.unit)}
          </td>
          <td class="text-center">${statusBadge}</td>
          <td class="text-center">${totalDisplay}</td>
          <td>${keteranganHtml}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;

    // Attach click events for detail view
    tbody.querySelectorAll('.btn-view-unit-detail').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const uIdx = parseInt(btn.getAttribute('data-unit-index'), 10);
        if (units[uIdx]) {
          showUnitDetailModal(units[uIdx]);
        }
      });
    });
  }

  // Show Unit Detail Modal
  function showUnitDetailModal(unitObj) {
    const modalTitle = document.getElementById('modal-unit-title');
    const modalTbody = document.getElementById('modal-unit-tbody');
    if (!modalTitle || !modalTbody) return;

    modalTitle.innerHTML = `<i class="fas fa-list-alt text-primary me-2"></i>Rincian Pengajuan Lembur Unit: <span class="text-primary">${escapeXml(unitObj.unit)}</span> (${unitObj.total} Pengajuan)`;

    if (!unitObj.items || unitObj.items.length === 0) {
      modalTbody.innerHTML = `<tr><td colspan="11" class="text-center py-3 text-muted">Tidak ada rincian data pengajuan lembur</td></tr>`;
    } else {
      let rowsHtml = '';
      unitObj.items.forEach((r, i) => {
        const durasi = r.durasi_jam || r.DURASI_JAM || r.durasi || '-';
        const jamMulai = r.jam_mulai ? r.jam_mulai.substring(0, 5) : '-';
        const jamSelesai = r.jam_selesai ? r.jam_selesai.substring(0, 5) : '-';
        const tglRealisasiMulai = r.tgl_realisasi_mulai || '-';
        const jamRealisasiMulai = r.jam_realisasi_mulai ? r.jam_realisasi_mulai.substring(0, 5) : '-';
        const tglRealisasiSelesai = r.tgl_realisasi_selesai || '-';
        const jamRealisasiSelesai = r.jam_realisasi_selesai ? r.jam_realisasi_selesai.substring(0, 5) : '-';

        const st = parseInt(r.status || 0, 10);
        const pr = parseInt(r.progress_approval || 0, 10);
        let badgeStatus = '<span class="badge bg-soft-warning text-warning">Menunggu Atasan</span>';
        if (st === 1 || pr >= 2) {
          badgeStatus = '<span class="badge bg-soft-success text-success">Disetujui HRD</span>';
        } else if (pr === 1) {
          badgeStatus = '<span class="badge bg-soft-info text-info">Menunggu HRD</span>';
        } else if (st === 2 || st === 3) {
          badgeStatus = '<span class="badge bg-soft-danger text-danger">Ditolak</span>';
        }

        rowsHtml += `
          <tr>
            <td class="text-center text-muted">${i + 1}</td>
            <td class="fw-bold">${escapeXml(r.NIP_PEGAWAI || r.id_pegawai || '-')}</td>
            <td>${escapeXml(r.NAMA_PEGAWAI || r.nama || '-')}</td>
            <td class="text-nowrap">${escapeXml(r.tanggal_lembur || '-')}</td>
            <td class="text-center">${escapeXml(jamMulai)}</td>
            <td class="text-center">${escapeXml(jamSelesai)}</td>
            <td class="text-center">${escapeXml(jamRealisasiMulai !== '-' ? jamRealisasiMulai : '-')}</td>
            <td class="text-center">${escapeXml(jamRealisasiSelesai !== '-' ? jamRealisasiSelesai : '-')}</td>
            <td class="text-center">${escapeXml(durasi)} Jam</td>
            <td class="text-center">${badgeStatus}</td>
            <td>${escapeXml(r.keterangan || '-')}</td>
          </tr>
        `;
      });
      modalTbody.innerHTML = rowsHtml;
    }

    const modal = getDetailModal();
    if (modal) modal.show();
  }

  // Export to Excel (CSV/XLS format)
  function exportToExcel() {
    if (!rawMonitoringData || !rawMonitoringData.units || rawMonitoringData.units.length === 0) {
      if (typeof Swal !== 'undefined') {
        Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Tidak ada data untuk diekspor' });
      } else {
        alert('Tidak ada data untuk diekspor');
      }
      return;
    }

    const tglAwal = document.getElementById('filter_tgl_awal')?.value.trim() || 'Semua';
    const tglAkhir = document.getElementById('filter_tgl_akhir')?.value.trim() || 'Semua';

    let tableHtml = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
      <head>
        <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Monitoring Lembur</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
        <meta http-equiv="content-type" content="text/plain; charset=UTF-8"/>
      </head>
      <body>
        <h3>DATA MONITORING LEMBUR PEGAWAI PER UNIT KERJA</h3>
        <p>Periode: Tgl Awal : ${tglAwal} | Tgl Akhir : ${tglAkhir}</p>
        <table border="1">
          <thead>
            <tr style="background-color: #d8e2ef; font-weight: bold;">
              <th>No</th>
              <th>Unit</th>
              <th>Status Approval</th>
              <th>Total</th>
              <th>Keterangan</th>
            </tr>
          </thead>
          <tbody>
    `;

    rawMonitoringData.units.forEach(u => {
      tableHtml += `
        <tr>
          <td>${u.no}</td>
          <td>${u.unit}</td>
          <td>${u.status_approval}</td>
          <td>${u.total}</td>
          <td>${u.keterangan}</td>
        </tr>
      `;
    });

    tableHtml += `
          </tbody>
        </table>
      </body>
      </html>
    `;

    const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Monitoring_Lembur_${tglAwal}_sd_${tglAkhir}.xls`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  // Print Monitoring Function
  function printMonitoring() {
    window.print();
  }

  // Initialize Page & Event Listeners
  function initMonitoringLembur() {
    const container = document.getElementById('page-monitoring-lembur-container');
    if (!container) return;

    if (container.dataset.initialized === 'true') return;
    container.dataset.initialized = 'true';

    // Button Apply Filter
    const btnFilter = document.getElementById('btn-apply-filter');
    if (btnFilter) {
      btnFilter.addEventListener('click', () => {
        loadMonitoringLembur(true);
      });
    }

    // Button Reset Filter
    const btnReset = document.getElementById('btn-reset-filter');
    if (btnReset) {
      btnReset.addEventListener('click', () => {
        const inpAwal = document.getElementById('filter_tgl_awal');
        const inpAkhir = document.getElementById('filter_tgl_akhir');
        const inpSearch = document.getElementById('filter_search_unit');
        if (inpAwal) inpAwal.value = '';
        if (inpAkhir) inpAkhir.value = '';
        if (inpSearch) inpSearch.value = '';
        loadMonitoringLembur(false);
      });
    }

    // Live search on enter
    const inpSearch = document.getElementById('filter_search_unit');
    if (inpSearch) {
      inpSearch.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') {
          loadMonitoringLembur(false);
        }
      });
    }

    // Export Excel Button
    const btnExcel = document.getElementById('btn-export-excel');
    if (btnExcel) {
      btnExcel.addEventListener('click', exportToExcel);
    }

    // Print Button
    const btnPrint = document.getElementById('btn-print-monitoring');
    if (btnPrint) {
      btnPrint.addEventListener('click', printMonitoring);
    }

    // Initial Load Data (without strict validation on first render so default list loads)
    loadMonitoringLembur(false);
  }

  // SPA Lifecycle Bootstrap
  if (document.readyState !== 'loading') {
    initMonitoringLembur();
  } else {
    document.addEventListener('DOMContentLoaded', initMonitoringLembur);
  }
  setTimeout(initMonitoringLembur, 100);
</script>
