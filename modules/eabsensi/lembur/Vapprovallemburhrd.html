<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';
  import { loadSession, getCurrentUser } from './assets/js/core/helpers.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url)
    ? config.api_url
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let rawHrdList = [];
  let selectedLemburItem = null;

  function debounce(func, delay = 300) {
    let timer;
    return function (...args) {
      clearTimeout(timer);
      timer = setTimeout(() => func.apply(this, args), delay);
    };
  }

  function getBadgeHrd(row) {
    const st = parseInt(row.status ?? 0, 10);
    const pr = parseInt(row.progress_approval ?? 0, 10);

    if (st === 2 || st === 3) {
      return '<span class="badge bg-soft-danger text-danger px-2 py-1"><i class="fas fa-times-circle me-1"></i>Ditolak</span>';
    } else if (st === 1 || pr >= 2) {
      return '<span class="badge bg-soft-success text-success px-2 py-1"><i class="fas fa-check-double me-1"></i>Disetujui HRD</span>';
    } else if (pr === 1) {
      return '<span class="badge bg-soft-warning text-warning px-2 py-1"><i class="fas fa-hourglass-half me-1"></i>Menunggu HRD</span>';
    } else {
      return '<span class="badge bg-soft-secondary text-secondary px-2 py-1"><i class="fas fa-clock me-1"></i>Menunggu Atasan</span>';
    }
  }

  function updateHrdStatCards(dataList) {
    let countMenungguHrd = 0;
    let countDisetujui = 0;
    let countDitolak = 0;

    dataList.forEach(item => {
      const st = parseInt(item.status ?? 0, 10);
      const pr = parseInt(item.progress_approval ?? 0, 10);
      if (st === 2 || st === 3) {
        countDitolak++;
      } else if (st === 1 || pr >= 2) {
        countDisetujui++;
      } else if (pr === 1) {
        countMenungguHrd++;
      }
    });

    const elMenunggu = document.getElementById('hrd-stat-menunggu');
    const elDisetujui = document.getElementById('hrd-stat-disetujui');
    const elDitolak = document.getElementById('hrd-stat-ditolak');
    const elTotal = document.getElementById('hrd-stat-total');

    if (elMenunggu) elMenunggu.textContent = countMenungguHrd;
    if (elDisetujui) elDisetujui.textContent = countDisetujui;
    if (elDitolak) elDitolak.textContent = countDitolak;
    if (elTotal) elTotal.textContent = dataList.length;
  }

  function selectRowForHrd(item, rowEl) {
    selectedLemburItem = item;

    // Highlight row
    const tbody = document.getElementById('tbody-lembur-hrd');
    if (tbody) {
      tbody.querySelectorAll('tr').forEach(tr => tr.classList.remove('table-selected'));
    }
    if (rowEl) rowEl.classList.add('table-selected');

    // Populate top form
    const fId = document.getElementById('hrd_id_lembur');
    const fBagian = document.getElementById('hrd_bagian');
    const fNama = document.getElementById('hrd_nama');
    const fTanggal = document.getElementById('hrd_tanggal');
    const fDurasi = document.getElementById('hrd_durasi');
    const fKeterangan = document.getElementById('hrd_keterangan');

    const fTglMulaiRealisasi = document.getElementById('hrd_tgl_mulai_realisasi');
    const fJamMulaiRealisasi = document.getElementById('hrd_jam_mulai_realisasi');
    const fTglSelesaiRealisasi = document.getElementById('hrd_tgl_selesai_realisasi');
    const fJamSelesaiRealisasi = document.getElementById('hrd_jam_selesai_realisasi');

    const btnApprove = document.getElementById('btn-hrd-approve');
    const btnReject = document.getElementById('btn-hrd-reject');
    const statusHint = document.getElementById('hrd-status-hint');

    if (fId) fId.value = item.id_lembur || '';
    if (fBagian) fBagian.value = item.BAGIAN_PEGAWAI || '-';
    if (fNama) fNama.value = `${item.NAMA_PEGAWAI || item.nama || '-'} (${item.NIP_PEGAWAI || item.id_pegawai || '-'})`;
    if (fTanggal) fTanggal.value = item.tanggal_lembur || '';
    if (fDurasi) fDurasi.value = item.DURASI || (item.durasi ? item.durasi + ' Jam' : '-');
    if (fKeterangan) fKeterangan.value = item.keterangan || '-';

    // Set realisasi fields with fallback
    const tglDefault = item.tanggal_lembur || new Date().toISOString().substring(0, 10);
    if (fTglMulaiRealisasi) fTglMulaiRealisasi.value = item.TGL_MULAI_REALISASI || tglDefault;
    if (fJamMulaiRealisasi) fJamMulaiRealisasi.value = item.JAM_MULAI_REALISASI || item.jam_mulai || '17:00';
    if (fTglSelesaiRealisasi) fTglSelesaiRealisasi.value = item.TGL_SELESAI_REALISASI || tglDefault;
    if (fJamSelesaiRealisasi) fJamSelesaiRealisasi.value = item.JAM_SELESAI_REALISASI || item.jam_pulang || item.jam_selesai || '20:00';

    if (btnApprove) btnApprove.disabled = false;
    if (btnReject) btnReject.disabled = false;
    if (statusHint) {
      statusHint.className = 'badge bg-soft-success text-success fs--2';
      statusHint.innerHTML = `<i class="fas fa-check-circle me-1"></i>Data ${item.NAMA_PEGAWAI || item.nama} siap diverifikasi`;
    }

    // Scroll smoothly to form if needed
    const formCard = document.getElementById('form-approval-hrd');
    if (formCard) {
      formCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function resetHrdForm() {
    selectedLemburItem = null;
    const form = document.getElementById('form-approval-hrd');
    if (form) form.reset();

    const tbody = document.getElementById('tbody-lembur-hrd');
    if (tbody) {
      tbody.querySelectorAll('tr').forEach(tr => tr.classList.remove('table-selected'));
    }

    const btnApprove = document.getElementById('btn-hrd-approve');
    const btnReject = document.getElementById('btn-hrd-reject');
    const statusHint = document.getElementById('hrd-status-hint');

    if (btnApprove) btnApprove.disabled = true;
    if (btnReject) btnReject.disabled = true;
    if (statusHint) {
      statusHint.className = 'badge bg-soft-info text-info fs--2';
      statusHint.textContent = 'Pilih data pada tabel di bawah untuk diverifikasi';
    }
  }

  function renderTableHrd(dataList) {
    const tbody = document.getElementById('tbody-lembur-hrd');
    const footer = document.getElementById('footer-lembur-hrd');
    if (!tbody) return;

    if (!Array.isArray(dataList) || dataList.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="12" class="text-center py-4 text-muted">
            <i class="fas fa-clipboard-list fa-2x mb-2 d-block text-300"></i>
            Tidak ada pengajuan lembur yang sesuai kriteria.
          </td>
        </tr>
      `;
      if (footer) footer.textContent = 'Menampilkan 0 data pengajuan';
      return;
    }

    let html = '';
    dataList.forEach((row, idx) => {
      const nip = row.NIP_PEGAWAI || row.id_pegawai || '-';
      const nama = row.NAMA_PEGAWAI || row.nama || '-';
      const bagian = row.BAGIAN_PEGAWAI || '-';
      const tgl = row.tanggal_lembur || '-';
      const jamMulai = row.JAM_MULAI_PENGAJUAN || row.jam_mulai || '-';
      const jamSelesai = row.JAM_SELESAI_PENGAJUAN || row.jam_selesai || '-';
      const ket = row.keterangan || '-';
      const jamMulaiRealisasi = row.JAM_MULAI_REALISASI || row.jam_mulai || '-';
      const jamSelesaiRealisasi = row.JAM_SELESAI_REALISASI || row.jam_pulang || row.jam_selesai || '-';
      const durasi = row.DURASI || (row.durasi ? row.durasi + ' Jam' : '-');
      const badge = getBadgeHrd(row);

      const isSelected = selectedLemburItem && String(selectedLemburItem.id_lembur) === String(row.id_lembur);

      html += `
        <tr data-id="${row.id_lembur}" class="${isSelected ? 'table-selected' : ''}">
          <td class="text-center fw-semi-bold text-muted">${idx + 1}</td>
          <td class="fw-bold text-primary">${nip}</td>
          <td class="fw-bold text-dark">${nama}</td>
          <td>${bagian}</td>
          <td class="text-nowrap">${tgl}</td>
          <td class="text-center text-nowrap">${jamMulai}</td>
          <td class="text-center text-nowrap">${jamSelesai}</td>
          <td class="text-break">${ket}</td>
          <td class="text-center text-nowrap">${jamMulaiRealisasi}</td>
          <td class="text-center text-nowrap">${jamSelesaiRealisasi}</td>
          <td class="text-center text-nowrap fw-bold">${durasi}</td>
          <td class="text-center">${badge}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    if (footer) footer.textContent = `Menampilkan ${dataList.length} data pengajuan lembur`;

    // Row click to select & populate form
    tbody.querySelectorAll('tr').forEach(tr => {
      tr.addEventListener('click', () => {
        const id = tr.getAttribute('data-id');
        const item = dataList.find(r => String(r.id_lembur) === String(id));
        if (item) {
          selectRowForHrd(item, tr);
        }
      });
    });
  }

  function applyFilterHrd() {
    const filterStatus = document.getElementById('hrd-filter-status')?.value || 'all';
    const cariVal = (document.getElementById('hrd-lembur-cari')?.value || '').toLowerCase().trim();

    let filtered = rawHrdList.filter(item => {
      const st = parseInt(item.status ?? 0, 10);
      const pr = parseInt(item.progress_approval ?? 0, 10);

      if (filterStatus === 'pending-hrd' && !(pr === 1 && st === 0)) return false;
      if (filterStatus === 'approved' && !(st === 1 || pr >= 2)) return false;
      if (filterStatus === 'rejected' && !(st === 2 || st === 3)) return false;

      if (cariVal) {
        const nip = (item.NIP_PEGAWAI || item.id_pegawai || '').toLowerCase();
        const nama = (item.NAMA_PEGAWAI || item.nama || '').toLowerCase();
        const bagian = (item.BAGIAN_PEGAWAI || '').toLowerCase();
        const ket = (item.keterangan || '').toLowerCase();
        const tgl = (item.tanggal_lembur || '').toLowerCase();

        return nip.includes(cariVal) || nama.includes(cariVal) || bagian.includes(cariVal) || ket.includes(cariVal) || tgl.includes(cariVal);
      }
      return true;
    });

    renderTableHrd(filtered);
  }

  async function loadApprovalLemburHrd() {
    const tbody = document.getElementById('tbody-lembur-hrd');
    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="12" class="text-center py-4 text-muted">
            <div class="spinner-border spinner-border-sm text-primary me-1" role="status"></div> Memuat data approval HRD...
          </td>
        </tr>
      `;
    }

    try {
      const res = await httpGet(`${apiUrl}/pegawai/lembur`);
      if (res && res.code === 200 && Array.isArray(res.data)) {
        rawHrdList = res.data;
      } else {
        rawHrdList = [];
      }

      updateHrdStatCards(rawHrdList);
      applyFilterHrd();
    } catch (err) {
      console.error('Error loadApprovalLemburHrd:', err);
      if (tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="12" class="text-center py-4 text-danger">
              <i class="fas fa-exclamation-triangle fa-2x mb-2 d-block text-danger"></i>
              Gagal memuat data lembur dari server: ${err.message || 'Terjadi kesalahan'}
            </td>
          </tr>
        `;
      }
    }
  }

  async function handleApproveHrd() {
    if (!selectedLemburItem) {
      alert('Pilih data pengajuan lembur pada tabel terlebih dahulu.');
      return;
    }

    const tglMulaiReal = document.getElementById('hrd_tgl_mulai_realisasi')?.value;
    const jamMulaiReal = document.getElementById('hrd_jam_mulai_realisasi')?.value;
    const tglSelesaiReal = document.getElementById('hrd_tgl_selesai_realisasi')?.value;
    const jamSelesaiReal = document.getElementById('hrd_jam_selesai_realisasi')?.value;

    const confirmMsg = `Setujui pengajuan lembur untuk ${selectedLemburItem.NAMA_PEGAWAI || selectedLemburItem.nama}?\n` +
      `Realisasi: ${jamMulaiReal || '-'} s/d ${jamSelesaiReal || '-'}`;

    if (!confirm(confirmMsg)) return;

    const btnApprove = document.getElementById('btn-hrd-approve');
    if (btnApprove) {
      btnApprove.disabled = true;
      btnApprove.innerHTML = '<div class="spinner-border spinner-border-sm me-1"></div> Menyimpan...';
    }

    try {
      const payload = {
        id_lembur: selectedLemburItem.id_lembur,
        catatan: `Realisasi: ${tglMulaiReal} ${jamMulaiReal} s/d ${tglSelesaiReal} ${jamSelesaiReal}`,
        tgl_mulai_realisasi: tglMulaiReal,
        jam_mulai_realisasi: jamMulaiReal,
        tgl_selesai_realisasi: tglSelesaiReal,
        jam_selesai_realisasi: jamSelesaiReal
      };

      const res = await httpPost(`${apiUrl}/pegawai/lembur/approve-hrd`, payload);
      if (res && (res.code === 200 || res.status === 200 || res.status === true)) {
        if (typeof Swal !== 'undefined') {
          Swal.fire({ icon: 'success', title: 'Berhasil', text: 'Pengajuan lembur berhasil disetujui HRD.', timer: 1500, showConfirmButton: false });
        } else {
          alert('Pengajuan lembur berhasil disetujui HRD.');
        }
        resetHrdForm();
        await loadApprovalLemburHrd();
      } else {
        alert(res?.message || 'Gagal menyetujui pengajuan lembur.');
      }
    } catch (err) {
      console.error('Error approve HRD:', err);
      alert('Terjadi kesalahan jaringan atau server saat menyetujui lembur.');
    } finally {
      if (btnApprove) {
        btnApprove.disabled = false;
        btnApprove.innerHTML = '<i class="fas fa-check-double me-1"></i>Setujui HRD';
      }
    }
  }

  async function handleRejectHrd() {
    if (!selectedLemburItem) {
      alert('Pilih data pengajuan lembur pada tabel terlebih dahulu.');
      return;
    }

    const alasan = prompt(`Masukkan alasan penolakan lembur untuk ${selectedLemburItem.NAMA_PEGAWAI || selectedLemburItem.nama}:`, 'Tidak memenuhi kualifikasi lembur');
    if (alasan === null) return; // user cancelled

    const btnReject = document.getElementById('btn-hrd-reject');
    if (btnReject) {
      btnReject.disabled = true;
      btnReject.innerHTML = '<div class="spinner-border spinner-border-sm me-1"></div> Menolak...';
    }

    try {
      const payload = {
        id_lembur: selectedLemburItem.id_lembur,
        catatan: alasan.trim() || 'Ditolak oleh HRD'
      };

      const res = await httpPost(`${apiUrl}/pegawai/lembur/reject-hrd`, payload);
      if (res && (res.code === 200 || res.status === 200 || res.status === true)) {
        if (typeof Swal !== 'undefined') {
          Swal.fire({ icon: 'success', title: 'Berhasil', text: 'Pengajuan lembur berhasil ditolak.', timer: 1500, showConfirmButton: false });
        } else {
          alert('Pengajuan lembur telah ditolak.');
        }
        resetHrdForm();
        await loadApprovalLemburHrd();
      } else {
        alert(res?.message || 'Gagal menolak pengajuan lembur.');
      }
    } catch (err) {
      console.error('Error reject HRD:', err);
      alert('Terjadi kesalahan jaringan atau server saat menolak lembur.');
    } finally {
      if (btnReject) {
        btnReject.disabled = false;
        btnReject.innerHTML = '<i class="fas fa-times me-1"></i>Tolak HRD';
      }
    }
  }

  function initApprovalLemburHrdModule() {
    // Stat cards click filter
    document.querySelectorAll('.stat-card-hrd').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.stat-card-hrd').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        const filterStatus = card.getAttribute('data-filter-status');
        const select = document.getElementById('hrd-filter-status');
        if (select) select.value = filterStatus;
        applyFilterHrd();
      });
    });

    // Select filter change
    const selectFilter = document.getElementById('hrd-filter-status');
    if (selectFilter) {
      selectFilter.addEventListener('change', () => {
        document.querySelectorAll('.stat-card-hrd').forEach(c => c.classList.remove('active'));
        const matchedCard = document.querySelector(`.stat-card-hrd[data-filter-status="${selectFilter.value}"]`);
        if (matchedCard) matchedCard.classList.add('active');
        applyFilterHrd();
      });
    }

    // Debounced search Cari
    const searchInput = document.getElementById('hrd-lembur-cari');
    if (searchInput) {
      searchInput.addEventListener('input', debounce(() => {
        applyFilterHrd();
      }, 300));
    }

    // Buttons
    document.getElementById('btn-refresh-hrd')?.addEventListener('click', () => {
      loadApprovalLemburHrd();
    });

    document.getElementById('btn-hrd-approve')?.addEventListener('click', handleApproveHrd);
    document.getElementById('btn-hrd-reject')?.addEventListener('click', handleRejectHrd);
    document.getElementById('btn-hrd-reset')?.addEventListener('click', resetHrdForm);

    loadApprovalLemburHrd();
  }

  // SPA Lifecycle Bootstrap
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApprovalLemburHrdModule);
  } else {
    initApprovalLemburHrdModule();
  }
  setTimeout(initApprovalLemburHrdModule, 50);
</script>
