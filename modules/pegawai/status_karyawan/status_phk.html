<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';
  import EvoSelector from './components/EvoSelector.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url) 
    ? config.api_url 
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  // State Management
  let allPegawai = [];
  let allPHK = [];
  let filteredPHK = [];
  let currentPage = 1;
  const pageSize = 10;
  let lookupModalInstance = null;
  let isEditMode = false;

  // EvoSelector instances
  let selNip = null;
  let selBagian = null;
  let selGolongan = null;
  let selJenisPHK = null;
  let selJabatan = null;
  let selPangkat = null;
  let selEkselon = null;
  let selJenisPegawai = null;
  let selStatusPegawai = null;
  let selLokasi = null;

  // Helper untuk membuat opsi EvoSelector
  function makeOptions(items, valKey, textKey, placeholder) {
    const opts = [{ text: placeholder, value: '-' }];
    if (Array.isArray(items)) {
      items.forEach(it => {
        const v = it[valKey];
        const t = it[textKey] || it.NAMA || v;
        if (v !== undefined && v !== null) {
          opts.push({ text: String(t), value: String(v) });
        }
      });
    }
    return opts;
  }

  // Format Tanggal DD/MM/YYYY
  function formatDate(dateStr) {
    if (!dateStr || dateStr === '0000-00-00') return '-';
    const parts = dateStr.substring(0, 10).split('-');
    if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
    return dateStr;
  }

  // Format Tanggal YYYY-MM-DD
  function toInputDate(dateStr) {
    if (!dateStr || dateStr === '0000-00-00') return '';
    return dateStr.substring(0, 10);
  }

  // Set default dates
  function setDefaultDates() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;

    const tglSuratEl = document.querySelector('#replacement_tanggal_surat');
    const tglPhkEl = document.querySelector('#replacement_tanggal_phk');

    if (tglSuratEl && !tglSuratEl.value) tglSuratEl.value = todayStr;
    if (tglPhkEl && !tglPhkEl.value) tglPhkEl.value = todayStr;
  }

  // Inisialisasi seluruh EvoSelector
  function initEvoSelectors() {
    selNip = new EvoSelector('sel_nip', [{ text: 'Pilih NIK / NIP Pegawai...', value: '-' }]);
    selBagian = new EvoSelector('sel_bagian', [{ text: 'Pilih Bagian', value: '-' }]);
    selGolongan = new EvoSelector('sel_golongan', [{ text: 'Pilih Golongan', value: '-' }]);
    selJenisPHK = new EvoSelector('sel_jenis_phk', [{ text: 'Pilih Jenis PHK', value: '-' }]);
    selJabatan = new EvoSelector('sel_jabatan', [{ text: 'Pilih Jabatan', value: '-' }]);
    selPangkat = new EvoSelector('sel_pangkat', [{ text: 'Pilih Pangkat', value: '-' }]);
    selEkselon = new EvoSelector('sel_ekselon', [{ text: 'Pilih Ekselon', value: '-' }]);
    selJenisPegawai = new EvoSelector('sel_jenis_pegawai', [{ text: 'Pilih Jenis Pegawai', value: '-' }]);
    selStatusPegawai = new EvoSelector('sel_status_pegawai', [{ text: 'Pilih Status Pegawai', value: '-' }]);
    selLokasi = new EvoSelector('sel_lokasi', [{ text: 'Pilih Lokasi', value: '-' }]);

    selNip.on('selected', (e) => {
      const nip = e.values ? (e.values.nip || e.value) : e.value;
      if (nip && nip !== '-') {
        autofillPegawai(nip);
      }
    });
  }

  // Load Master Data (refData)
  async function loadMasterData() {
    try {
      const res = await httpGet(`${apiUrl}/pegawai/ref_data`);
      if (res && res.data) {
        const d = res.data;
        if (selBagian && d.bagian) selBagian.addOptions(makeOptions(d.bagian, 'KD_BAGIAN', 'BAGIAN', 'Pilih Bagian'));
        if (selGolongan && d.golongan) selGolongan.addOptions(makeOptions(d.golongan, 'KD_GOLONGAN', 'GOLONGAN', 'Pilih Golongan'));
        if (selJenisPHK && d.jenis_phk) selJenisPHK.addOptions(makeOptions(d.jenis_phk, 'KD_JENIS_PHK', 'JENIS_PHK', 'Pilih Jenis PHK'));
        if (selJabatan && d.jabatan) selJabatan.addOptions(makeOptions(d.jabatan, 'KD_JABATAN', 'JABATAN', 'Pilih Jabatan'));
        if (selPangkat && d.pangkat) selPangkat.addOptions(makeOptions(d.pangkat, 'KD_PANGKAT', 'PANGKAT', 'Pilih Pangkat'));
        if (selEkselon && d.ekselon) selEkselon.addOptions(makeOptions(d.ekselon, 'KD_EKSELON', 'EKSELON', 'Pilih Ekselon'));
        if (selJenisPegawai && d.jenis_pegawai) selJenisPegawai.addOptions(makeOptions(d.jenis_pegawai, 'KD_JENIS_PEGAWAI', 'JENIS_PEGAWAI', 'Pilih Jenis Pegawai'));
        if (selStatusPegawai && d.status_pegawai) selStatusPegawai.addOptions(makeOptions(d.status_pegawai, 'KD_STATUS_PEGAWAI', 'STATUS_PEGAWAI', 'Pilih Status Pegawai'));
        if (selLokasi && d.lokasi) selLokasi.addOptions(makeOptions(d.lokasi, 'KD_LOKASI', 'LOKASI', 'Pilih Lokasi'));
      }
    } catch (err) {
      console.warn('Gagal memuat master data:', err);
    }
  }

  // Load Pegawai List untuk EvoSelector
  async function loadPegawaiList() {
    try {
      const res = await httpGet(`${apiUrl}/pegawai/list?limit=1000`);
      let list = [];
      if (res && Array.isArray(res.data)) list = res.data;
      else if (res && res.data && Array.isArray(res.data.pegawai)) list = res.data.pegawai;

      allPegawai = list;

      const opts = [{ text: 'Pilih NIK / NIP Pegawai...', value: '-' }];
      list.forEach(p => {
        const nik = (p.NO_IDENTITAS || '').trim();
        const nip = (p.NIP || '').trim();
        const nama = (p.NAMA || '').trim();

        let label = '';
        if (nik && nip) {
          label = `${nik} - ${nip} - ${nama}`;
        } else if (nip) {
          label = `${nip} - ${nama}`;
        } else if (nik) {
          label = `${nik} - ${nama}`;
        } else {
          label = nama || 'Pegawai';
        }

        opts.push({
          text: label,
          value: nip || String(p.ID_PEGAWAI),
          values: {
            id_pegawai: p.ID_PEGAWAI,
            nip: nip,
            nik: nik,
            nama: nama
          }
        });
      });

      if (selNip) {
        selNip.addOptions(opts);
      }
    } catch (err) {
      console.warn('Gagal memuat daftar pegawai:', err);
    }
  }

  // Autofill Data Pegawai berdasarkan NIP
  async function autofillPegawai(nip) {
    if (!nip) return;
    const cleanNip = String(nip).trim();
    if (!cleanNip) return;

    const statusEl = document.querySelector('#form-phk-status');
    if (statusEl) statusEl.textContent = 'Memuat snapshot pegawai...';

    try {
      const res = await httpGet(`${apiUrl}/pegawai/snapshot/${encodeURIComponent(cleanNip)}`);
      if (res && res.data) {
        const snap = res.data;
        const idPegEl = document.querySelector('#replacement_id_pegawai');
        const namaEl = document.querySelector('#replacement_nama');

        if (idPegEl) idPegEl.value = snap.ID_PEGAWAI || '';
        if (namaEl) namaEl.value = snap.NAMA || '';

        if (selBagian && snap.KD_BAGIAN) selBagian.value = snap.KD_BAGIAN;
        if (selGolongan && snap.KD_GOLONGAN) selGolongan.value = snap.KD_GOLONGAN;
        if (selJabatan && (snap.KD_JABATAN !== undefined && snap.KD_JABATAN !== null)) selJabatan.value = snap.KD_JABATAN;
        if (selPangkat && snap.KD_PANGKAT) selPangkat.value = snap.KD_PANGKAT;
        if (selEkselon && snap.KD_EKSELON) selEkselon.value = snap.KD_EKSELON;
        if (selJenisPegawai && snap.KD_JENIS_PEGAWAI) selJenisPegawai.value = snap.KD_JENIS_PEGAWAI;
        if (selStatusPegawai && (snap.KD_STATUS_PEGAWAI !== undefined && snap.KD_STATUS_PEGAWAI !== null)) selStatusPegawai.value = snap.KD_STATUS_PEGAWAI;
        if (selLokasi && snap.KD_LOKASI) selLokasi.value = snap.KD_LOKASI;

        if (statusEl) {
          statusEl.textContent = `Pegawai ditemukan: ${snap.NAMA || cleanNip}`;
          statusEl.className = 'fs--1 text-success ms-2';
        }
        return;
      }
    } catch (err) {
      console.warn('Snapshot endpoint gagal, coba cari di memori:', err);
    }

    // Fallback pencarian di memori allPegawai
    const found = allPegawai.find(p => String(p.NIP).trim() === cleanNip);
    if (found) {
      const idPegEl = document.querySelector('#replacement_id_pegawai');
      const namaEl = document.querySelector('#replacement_nama');
      if (idPegEl) idPegEl.value = found.ID_PEGAWAI || '';
      if (namaEl) namaEl.value = found.NAMA || '';
      if (statusEl) {
        statusEl.textContent = `Pegawai ditemukan: ${found.NAMA || cleanNip}`;
        statusEl.className = 'fs--1 text-success ms-2';
      }
    } else {
      if (statusEl) {
        statusEl.textContent = 'Pegawai belum terdaftar di snapshot';
        statusEl.className = 'fs--1 text-warning ms-2';
      }
    }
  }

  // Load Tabel PHK
  async function loadPHKTable() {
    const tbody = document.querySelector('#tb_phk_body');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin me-2"></i>Memuat data riwayat PHK...</td></tr>';
    }

    try {
      const res = await httpGet(`${apiUrl}/pegawai/phk`);
      if (res && Array.isArray(res.data)) {
        allPHK = res.data;
      } else {
        allPHK = [];
      }
    } catch (err) {
      console.warn('Gagal memuat riwayat PHK:', err);
      allPHK = [];
    }

    applyFilter();
  }

  // Filter Tabel PHK
  function applyFilter() {
    const keyword = (document.querySelector('#txtcari_phk')?.value || '').trim().toLowerCase();
    if (!keyword) {
      filteredPHK = [...allPHK];
    } else {
      filteredPHK = allPHK.filter(row => {
        return (
          (row.NIP && row.NIP.toLowerCase().includes(keyword)) ||
          (row.NAMA_PEGAWAI && row.NAMA_PEGAWAI.toLowerCase().includes(keyword)) ||
          (row.NAMA && row.NAMA.toLowerCase().includes(keyword)) ||
          (row.NO_SURAT && row.NO_SURAT.toLowerCase().includes(keyword)) ||
          (row.JENIS_PHK && row.JENIS_PHK.toLowerCase().includes(keyword)) ||
          (row.BAGIAN && row.BAGIAN.toLowerCase().includes(keyword)) ||
          (row.JABATAN && row.JABATAN.toLowerCase().includes(keyword)) ||
          (row.PANGKAT && row.PANGKAT.toLowerCase().includes(keyword)) ||
          (row.ALASAN && row.ALASAN.toLowerCase().includes(keyword))
        );
      });
    }

    currentPage = 1;
    renderTable();
  }

  // Render Tabel PHK
  function renderTable() {
    const tbody = document.querySelector('#tb_phk_body');
    const badgeTotal = document.querySelector('#badge-total-phk');
    const infoEl = document.querySelector('#phk-pagination-info');
    if (!tbody) return;

    if (badgeTotal) badgeTotal.textContent = `${filteredPHK.length} Data`;

    if (filteredPHK.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center py-4 text-muted">Belum ada data riwayat pemutusan hubungan kerja (PHK)</td></tr>';
      if (infoEl) infoEl.textContent = 'Menampilkan 0 data';
      renderPagination(0);
      return;
    }

    const totalPages = Math.ceil(filteredPHK.length / pageSize);
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIdx = (currentPage - 1) * pageSize;
    const endIdx = Math.min(startIdx + pageSize, filteredPHK.length);
    const pageRows = filteredPHK.slice(startIdx, endIdx);

    let html = '';
    pageRows.forEach((row, idx) => {
      const rowNum = startIdx + idx + 1;
      const nip = row.NIP || '-';
      const nama = row.NAMA_PEGAWAI || row.NAMA || '-';
      const noSurat = row.NO_SURAT || '-';
      const tglSurat = formatDate(row.TGL_SURAT);
      const jenisPhk = row.JENIS_PHK || '-';
      const tglPhk = formatDate(row.TGL_PHK);
      const bagian = row.BAGIAN || '-';
      const jabatan = row.JABATAN || '-';
      const pangkat = row.PANGKAT || '-';
      const alasan = row.ALASAN || row.KETERANGAN || '-';
      const kdPhk = row.KD_PHK || '';

      html += `
        <tr>
          <td class="text-center fw-semi-bold text-muted">${rowNum}</td>
          <td class="fw-semi-bold">${nip}</td>
          <td>${nama}</td>
          <td><span class="badge bg-soft-secondary text-dark font-monospace">${noSurat}</span></td>
          <td>${tglSurat}</td>
          <td><span class="badge bg-soft-danger text-danger">${jenisPhk}</span></td>
          <td>${tglPhk}</td>
          <td>${bagian}</td>
          <td>${jabatan}</td>
          <td>${pangkat}</td>
          <td class="text-truncate" style="max-width: 180px;" title="${alasan}">${alasan}</td>
          <td class="text-center text-nowrap">
            <button class="btn btn-sm btn-outline-primary py-0 px-2 btn-edit-phk" data-id="${kdPhk}" title="Edit Data">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger py-0 px-2 ms-1 btn-delete-phk" data-id="${kdPhk}" data-surat="${noSurat}" title="Hapus Data">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    if (infoEl) infoEl.textContent = `Menampilkan ${startIdx + 1} - ${endIdx} dari ${filteredPHK.length} data`;
    renderPagination(totalPages);
  }

  // Render Pagination PHK
  function renderPagination(totalPages) {
    const ul = document.querySelector('#phk-pagination');
    if (!ul) return;
    ul.innerHTML = '';
    if (totalPages <= 1) return;

    // Tombol Prev
    const prevLi = document.createElement('li');
    prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
    prevLi.innerHTML = '<a class="page-link" href="#" aria-label="Previous">&laquo;</a>';
    prevLi.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentPage > 1) {
        currentPage--;
        renderTable();
      }
    });
    ul.appendChild(prevLi);

    // Nomor Halaman
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
        const li = document.createElement('li');
        li.className = `page-item ${i === currentPage ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
        li.addEventListener('click', (e) => {
          e.preventDefault();
          currentPage = i;
          renderTable();
        });
        ul.appendChild(li);
      } else if (i === currentPage - 3 || i === currentPage + 3) {
        const dots = document.createElement('li');
        dots.className = 'page-item disabled';
        dots.innerHTML = '<span class="page-link">...</span>';
        ul.appendChild(dots);
      }
    }

    // Tombol Next
    const nextLi = document.createElement('li');
    nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
    nextLi.innerHTML = '<a class="page-link" href="#" aria-label="Next">&raquo;</a>';
    nextLi.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentPage < totalPages) {
        currentPage++;
        renderTable();
      }
    });
    ul.appendChild(nextLi);
  }

  // Reset Form
  function resetForm() {
    isEditMode = false;
    const form = document.querySelector('#form-phk');
    if (form) form.reset();

    const kdEl = document.querySelector('#replacement_kd_phk');
    const idPegEl = document.querySelector('#replacement_id_pegawai');
    const badgeMode = document.querySelector('#form-mode-badge');
    const btnSave = document.querySelector('#btn-save-phk');
    const statusEl = document.querySelector('#form-phk-status');

    if (kdEl) kdEl.value = '';
    if (idPegEl) idPegEl.value = '';
    if (badgeMode) {
      badgeMode.textContent = 'Mode Tambah';
      badgeMode.className = 'badge bg-soft-danger text-danger fs--2';
    }
    if (btnSave) {
      btnSave.innerHTML = '<i class="fas fa-save me-1"></i> Simpan';
      btnSave.className = 'btn btn-sm btn-danger px-3 fw-semi-bold';
    }
    if (statusEl) {
      statusEl.textContent = '';
      statusEl.className = 'fs--1 text-muted ms-2';
    }

    if (selNip) selNip.value = '-';
    if (selBagian) selBagian.value = '-';
    if (selGolongan) selGolongan.value = '-';
    if (selJenisPHK) selJenisPHK.value = '-';
    if (selJabatan) selJabatan.value = '-';
    if (selPangkat) selPangkat.value = '-';
    if (selEkselon) selEkselon.value = '-';
    if (selJenisPegawai) selJenisPegawai.value = '-';
    if (selStatusPegawai) selStatusPegawai.value = '-';
    if (selLokasi) selLokasi.value = '-';

    setDefaultDates();
  }

  // Edit PHK
  function editPHK(kdPhk) {
    const row = allPHK.find(r => String(r.KD_PHK) === String(kdPhk));
    if (!row) {
      alert('Data PHK tidak ditemukan');
      return;
    }

    isEditMode = true;
    const kdEl = document.querySelector('#replacement_kd_phk');
    const idPegEl = document.querySelector('#replacement_id_pegawai');
    const noSuratEl = document.querySelector('#replacement_no_surat');
    const nipEl = document.querySelector('#replacement_NIP');
    const namaEl = document.querySelector('#replacement_nama');
    const tglSuratEl = document.querySelector('#replacement_tanggal_surat');
    const tglPhkEl = document.querySelector('#replacement_tanggal_phk');
    const alasanEl = document.querySelector('#replacement_alasan');

    const badgeMode = document.querySelector('#form-mode-badge');
    const btnSave = document.querySelector('#btn-save-phk');
    const statusEl = document.querySelector('#form-phk-status');

    if (kdEl) kdEl.value = row.KD_PHK || '';
    if (idPegEl) idPegEl.value = row.ID_PEGAWAI || '';
    if (noSuratEl) noSuratEl.value = row.NO_SURAT || '';
    if (nipEl) nipEl.value = row.NIP || '';
    if (selNip) selNip.value = row.NIP || '-';
    if (namaEl) namaEl.value = row.NAMA_PEGAWAI || row.NAMA || '';
    if (tglSuratEl) tglSuratEl.value = toInputDate(row.TGL_SURAT);
    if (tglPhkEl) tglPhkEl.value = toInputDate(row.TGL_PHK);
    if (alasanEl) alasanEl.value = row.ALASAN || row.KETERANGAN || '';

    if (selBagian) selBagian.value = row.KD_BAGIAN || '-';
    if (selGolongan) selGolongan.value = row.KD_GOLONGAN || '-';
    if (selJenisPHK) selJenisPHK.value = row.KD_JENIS_PHK || '-';
    if (selJabatan) selJabatan.value = row.KD_JABATAN !== undefined ? row.KD_JABATAN : '-';
    if (selPangkat) selPangkat.value = row.KD_PANGKAT || '-';
    if (selEkselon) selEkselon.value = row.KD_EKSELON || '-';
    if (selJenisPegawai) selJenisPegawai.value = row.KD_JENIS_PEGAWAI || '-';
    if (selStatusPegawai) selStatusPegawai.value = row.KD_STATUS_PEGAWAI !== undefined ? row.KD_STATUS_PEGAWAI : '-';
    if (selLokasi) selLokasi.value = row.KD_LOKASI || '-';

    if (badgeMode) {
      badgeMode.textContent = `Mode Edit: ${row.NO_SURAT || kdPhk}`;
      badgeMode.className = 'badge bg-soft-warning text-warning fs--2';
    }
    if (btnSave) {
      btnSave.innerHTML = '<i class="fas fa-save me-1"></i> Update PHK';
      btnSave.className = 'btn btn-sm btn-warning px-3 fw-semi-bold';
    }
    if (statusEl) {
      statusEl.textContent = 'Silakan ubah data di atas lalu klik Update PHK';
      statusEl.className = 'fs--1 text-info ms-2';
    }

    const formCard = document.querySelector('#form-phk');
    if (formCard) formCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Hapus PHK
  async function deletePHK(kdPhk, noSurat) {
    const msg = `Apakah Anda yakin ingin menghapus data PHK No. Surat "${noSurat}"?`;
    if (!confirm(msg)) return;

    try {
      const res = await httpPost(`${apiUrl}/pegawai/phk/delete/${kdPhk}`, {});
      if (res && (res.code === 200 || res.status === true || res.status === 'ok')) {
        alert(res.message || 'Data PHK berhasil dihapus');
        loadPHKTable();
      } else {
        alert(res?.message || 'Gagal menghapus data PHK');
      }
    } catch (err) {
      alert(`Terjadi kesalahan saat menghapus data: ${err.message}`);
    }
  }

  // Simpan / Update PHK
  async function savePHK(e) {
    e.preventDefault();

    const kdPhk = document.querySelector('#replacement_kd_phk')?.value || '';
    const idPegawai = document.querySelector('#replacement_id_pegawai')?.value || '';
    const nip = (selNip?.value && selNip.value !== '-' ? selNip.value : '').trim();
    const nama = (document.querySelector('#replacement_nama')?.value || '').trim();
    const noSurat = (document.querySelector('#replacement_no_surat')?.value || '').trim();
    const tglSurat = document.querySelector('#replacement_tanggal_surat')?.value || '';
    const tglPhk = document.querySelector('#replacement_tanggal_phk')?.value || '';
    const alasan = (document.querySelector('#replacement_alasan')?.value || '').trim();

    const kdBagian = selBagian?.value !== '-' ? selBagian?.value : '';
    const kdGolongan = selGolongan?.value !== '-' ? selGolongan?.value : '';
    const kdJenisPHK = selJenisPHK?.value !== '-' ? selJenisPHK?.value : '';
    const kdJabatan = selJabatan?.value !== '-' ? selJabatan?.value : '';
    const kdPangkat = selPangkat?.value !== '-' ? selPangkat?.value : '';
    const kdEkselon = selEkselon?.value !== '-' ? selEkselon?.value : '';
    const kdJenisPegawai = selJenisPegawai?.value !== '-' ? selJenisPegawai?.value : '';
    const kdStatusPegawai = selStatusPegawai?.value !== '-' ? selStatusPegawai?.value : '';
    const kdLokasi = selLokasi?.value !== '-' ? selLokasi?.value : '';

    if (!nip) {
      alert('NIP wajib diisi');
      /* selNip focus */
      return;
    }
    if (!noSurat) {
      alert('Nomor Surat wajib diisi');
      document.querySelector('#replacement_no_surat')?.focus();
      return;
    }
    if (!kdJenisPHK) {
      alert('Jenis PHK wajib dipilih');
      return;
    }

    const payload = {
      KD_PHK: kdPhk,
      ID_PEGAWAI: idPegawai,
      NIP: nip,
      NAMA: nama,
      NO_SURAT: noSurat,
      TGL_SURAT: tglSurat,
      TGL_PHK: tglPhk,
      KD_BAGIAN: kdBagian,
      KD_GOLONGAN: kdGolongan,
      KD_JENIS_PHK: kdJenisPHK,
      KD_JABATAN: kdJabatan,
      KD_PANGKAT: kdPangkat,
      KD_EKSELON: kdEkselon,
      KD_JENIS_PEGAWAI: kdJenisPegawai,
      KD_STATUS_PEGAWAI: kdStatusPegawai,
      KD_LOKASI: kdLokasi,
      ALASAN: alasan
    };

    const statusEl = document.querySelector('#form-phk-status');
    const btnSave = document.querySelector('#btn-save-phk');
    if (btnSave) btnSave.disabled = true;
    if (statusEl) {
      statusEl.textContent = 'Menyimpan data PHK...';
      statusEl.className = 'fs--1 text-info ms-2';
    }

    try {
      const res = await httpPost(`${apiUrl}/pegawai/phk/save`, payload);
      if (res && (res.code === 200 || res.status === true || res.status === 'ok')) {
        alert(res.message || 'Data PHK berhasil disimpan');
        resetForm();
        loadPHKTable();
      } else {
        alert(res?.message || 'Gagal menyimpan data PHK');
        if (statusEl) {
          statusEl.textContent = res?.message || 'Gagal menyimpan';
          statusEl.className = 'fs--1 text-danger ms-2';
        }
      }
    } catch (err) {
      alert(`Terjadi kesalahan: ${err.message}`);
      if (statusEl) {
        statusEl.textContent = err.message;
        statusEl.className = 'fs--1 text-danger ms-2';
      }
    } finally {
      if (btnSave) btnSave.disabled = false;
    }
  }

  // Setup Event Listeners
  function setupEventListeners() {
    // Form submit
    const form = document.querySelector('#form-phk');
    if (form) form.addEventListener('submit', savePHK);

    // Reset button
    const btnReset = document.querySelector('#btn-reset-phk');
    if (btnReset) btnReset.addEventListener('click', resetForm);

    // Tabel search & toolbar
    const searchInput = document.querySelector('#txtcari_phk');
    const btnCari = document.querySelector('#btn-cari-phk');
    const btnClear = document.querySelector('#btn-clear-phk');
    const btnRefresh = document.querySelector('#btn-refresh-phk');

    if (searchInput) {
      searchInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') applyFilter();
      });
    }
    if (btnCari) btnCari.addEventListener('click', applyFilter);
    if (btnClear) {
      btnClear.addEventListener('click', () => {
        if (searchInput) searchInput.value = '';
        applyFilter();
      });
    }
    if (btnRefresh) btnRefresh.addEventListener('click', loadPHKTable);

    // Delegation tombol Edit & Delete pada tabel
    const tbody = document.querySelector('#tb_phk_body');
    if (tbody) {
      tbody.addEventListener('click', (e) => {
        const btnEdit = e.target.closest('.btn-edit-phk');
        if (btnEdit) {
          editPHK(btnEdit.dataset.id);
          return;
        }

        const btnDel = e.target.closest('.btn-delete-phk');
        if (btnDel) {
          deletePHK(btnDel.dataset.id, btnDel.dataset.surat);
          return;
        }
      });
    }
  }

  // Inisialisasi Halaman
  async function init() {
    initEvoSelectors();
    setDefaultDates();
    setupEventListeners();
    await Promise.all([
      loadMasterData(),
      loadPegawaiList(),
      loadPHKTable()
    ]);
  }

  init();
</script>
