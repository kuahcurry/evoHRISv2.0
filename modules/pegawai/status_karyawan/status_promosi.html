<style>
  .table-status_promosi-card {
    border-radius: 0.5rem;
    box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
  }
  .btn-action-icon {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }
</style>

<template id="template-status_promosi">
  <!-- Actions Toolbar -->
  <div id="status_promosi-actions" class="card mb-3 shadow-none border">
    <div class="card-body p-2 d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">
        <h5 class="mb-0 text-primary fw-bold"><i class="fas fa-level-up-alt me-2"></i>Promosi Pegawai</h5>
        <span class="badge bg-soft-primary text-primary ms-2" id="status_promosi-total-badge">0 Data</span>
      </div>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <div class="input-group input-group-sm" style="width: 240px;">
          <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
          <input type="text" class="form-control form-control-sm border-start-0 search-box" placeholder="Cari NIP, nama, SK, jabatan...">
        </div>
        <a href="#!btn-tambah" class="btn btn-sm btn-primary" role="button">
          <i class="fas fa-plus me-1"></i> Tambah Promosi
        </a>
        <a href="#!btn-refresh" class="btn btn-sm btn-outline-secondary" role="button">
          <i class="fas fa-sync-alt me-1"></i> Refresh
        </a>
        <a href="#!btn-export" class="btn btn-sm btn-outline-success" role="button">
          <i class="fas fa-file-excel me-1"></i> Ekspor CSV
        </a>
      </div>
    </div>
  </div>

  <!-- Entries Table -->
  <div id="status_promosi-entries" class="card shadow-sm border table-status_promosi-card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-sm table-striped table-hover fs--1 mb-0 align-middle">
          <thead class="bg-200 text-800 text-uppercase">
            <tr>
              <th class="text-center py-2" style="width: 50px;">#</th>
              <th class="py-2" style="min-width: 140px;">NIP / Pegawai</th>
              <th class="text-center py-2" style="min-width: 110px;">Tgl Promosi</th>
              <th class="py-2" style="min-width: 130px;">No. Surat / SK</th>
              <th class="py-2" style="min-width: 130px;">Jabatan Asal</th>
              <th class="py-2" style="min-width: 140px;">Jabatan Baru</th>
              <th class="py-2" style="min-width: 140px;">Bagian Baru</th>
              <th class="py-2" style="min-width: 150px;">Keterangan</th>
              <th class="text-center py-2" style="width: 140px;">Aksi</th>
            </tr>
          </thead>
          <tbody class="list">
            <tr>
              <td colspan="9" class="text-center py-4 text-muted">
                <span class="spinner-border spinner-border-sm me-2"></span>Memuat data promosi...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center py-2 bg-light border-top">
      <span class="pagination-info fs--1 text-muted">Menampilkan 0 data</span>
      <ul class="pagination pagination-sm mb-0"></ul>
    </div>
  </div>

  <!-- Modal Form CRUD -->
  <div class="modal fade" id="status_promosi-modal" tabindex="-1" aria-labelledby="status_promosi-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content shadow">
        <div class="modal-header bg-light">
          <h5 class="modal-title" id="status_promosi-modal-title">
            <i class="fas fa-level-up-alt text-primary me-2"></i>Form Data Promosi
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="status_promosi-form">
          <input type="hidden" data-field="KD_PROMOSI_DARI" data-type="txt">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label fw-semi-bold">Pilih Pegawai <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm" data-field="ID_PEGAWAI" data-type="sel" required>
                <option value="">-- Pilih Pegawai --</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semi-bold">Tgl / TMT Promosi <span class="text-danger">*</span></label>
              <input type="date" class="form-control form-control-sm" data-field="TGL_PROMOSI" data-type="txt" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semi-bold">Nomor SK / Surat</label>
              <input type="text" class="form-control form-control-sm" data-field="NO_SURAT" data-type="txt" placeholder="Nomor surat / SK">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semi-bold">Bagian Baru</label>
              <select class="form-select form-select-sm" data-field="KD_BAGIAN_BARU" data-type="sel">
                <option value="">-- Pilih Bagian Baru --</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semi-bold">Jabatan Baru</label>
              <select class="form-select form-select-sm" data-field="KD_JABATAN_BARU" data-type="sel">
                <option value="">-- Pilih Jabatan Baru --</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semi-bold">Pangkat / Golongan Baru</label>
              <select class="form-select form-select-sm" data-field="KD_PANGKAT_BARU" data-type="sel">
                <option value="">-- Pilih Pangkat Baru --</option>
              </select>
            </div>
            <div class="col-md-12">
              <label class="form-label fw-semi-bold">Keterangan / Pertimbangan</label>
              <textarea class="form-control form-control-sm" data-field="KETERANGAN" data-type="txtarea" rows="3" placeholder="Catatan atau pertimbangan promosi..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light py-2">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Batal</button>
          <a href="#!btn-simpan" class="btn btn-sm btn-primary">
            <i class="fas fa-save me-1"></i> Simpan
          </a>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';
  import { getFormEntries, setFormEntries, showDialog } from './assets/js/core/helpers.js';

  const id = 'status_promosi';
  const { actions: frm_actions, entries: frm_entries } = getThisForm(id);
  const apiUrl = (typeof config !== 'undefined' && config.api_url) 
    ? config.api_url 
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let allData = [];
  let filteredData = [];
  let refData = null;
  let lookupPegawai = [];
  let currentPage = 1;
  const rowsPerPage = 10;

  function getModal() {
    const modalEl = document.getElementById(`${id}-modal`);
    if (!modalEl) return null;
    return window.bootstrap ? bootstrap.Modal.getOrCreateInstance(modalEl) : null;
  }

  async function loadMasterData() {
    try {
      const [refRes, lookupRes] = await Promise.all([
        httpGet(`${apiUrl}/pegawai/ref_data`),
        httpGet(`${apiUrl}/pegawai/lookup`)
      ]);

      if (refRes && refRes.code === 200 && refRes.data) {
        refData = refRes.data;
        populateSelectOptions();
      }
      if (lookupRes && lookupRes.code === 200 && Array.isArray(lookupRes.data)) {
        lookupPegawai = lookupRes.data;
        populatePegawaiOptions();
      }
    } catch (e) {
      console.warn('Gagal memuat master data:', e);
    }
  }

  function populatePegawaiOptions() {
    const selPegawai = document.querySelector(`#${id}-form [data-field="ID_PEGAWAI"]`);
    if (!selPegawai) return;
    let html = '<option value="">-- Pilih Pegawai --</option>';
    lookupPegawai.forEach(p => {
      html += `<option value="${p.ID_PEGAWAI}">[${p.NIP || '-'}] ${p.NAMA || '-'}</option>`;
    });
    selPegawai.innerHTML = html;
  }

  function populateSelectOptions() {
    if (!refData) return;
    const formEl = document.getElementById(`${id}-form`);
    if (!formEl) return;

    // Bagian
    const selBagian = formEl.querySelector('[data-field="KD_BAGIAN_BARU"]');
    if (selBagian && Array.isArray(refData.bagian)) {
      selBagian.innerHTML = '<option value="">-- Pilih Bagian Baru --</option>' + 
        refData.bagian.map(b => `<option value="${b.KD_BAGIAN}">${b.BAGIAN}</option>`).join('');
    }

    // Jabatan
    const selJabatan = formEl.querySelector('[data-field="KD_JABATAN_BARU"]');
    if (selJabatan && Array.isArray(refData.jabatan)) {
      selJabatan.innerHTML = '<option value="">-- Pilih Jabatan Baru --</option>' + 
        refData.jabatan.map(j => `<option value="${j.KD_JABATAN}">${j.JABATAN}</option>`).join('');
    }

    // Pangkat
    const selPangkat = formEl.querySelector('[data-field="KD_PANGKAT_BARU"]');
    if (selPangkat && Array.isArray(refData.pangkat)) {
      selPangkat.innerHTML = '<option value="">-- Pilih Pangkat Baru --</option>' + 
        refData.pangkat.map(p => `<option value="${p.KD_PANGKAT}">${p.PANGKAT}</option>`).join('');
    }
  }

  async function loadData() {
    if (!frm_entries) return;
    const tableBody = frm_entries.querySelector('tbody.list');
    if (tableBody) {
      tableBody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data promosi...</td></tr>';
    }

    try {
      if (!refData || !lookupPegawai.length) {
        await loadMasterData();
      }

      const res = await httpGet(`${apiUrl}/pegawai/promosi`);
      if (res && res.code === 200 && Array.isArray(res.data)) {
        allData = res.data;
      } else {
        allData = [];
      }
      filterAndRender();
    } catch (err) {
      console.error(err);
      if (tableBody) {
        tableBody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-danger">Gagal memuat data dari server.</td></tr>';
      }
    }
  }

  function filterAndRender() {
    const searchInput = frm_actions ? frm_actions.querySelector('.search-box') : null;
    const query = searchInput ? searchInput.value.toLowerCase().trim() : '';

    if (!query) {
      filteredData = [...allData];
    } else {
      filteredData = allData.filter(item => {
        return (item.NIP && item.NIP.toLowerCase().includes(query)) ||
          (item.NAMA && item.NAMA.toLowerCase().includes(query)) ||
          (item.NO_SURAT && item.NO_SURAT.toLowerCase().includes(query)) ||
          (item.JABATAN_BARU && item.JABATAN_BARU.toLowerCase().includes(query)) ||
          (item.BAGIAN_BARU && item.BAGIAN_BARU.toLowerCase().includes(query)) ||
          (item.KETERANGAN && item.KETERANGAN.toLowerCase().includes(query));
      });
    }

    currentPage = 1;
    renderTable();
    updateTotalBadge();
  }

  function updateTotalBadge() {
    const badge = document.getElementById(`${id}-total-badge`);
    if (badge) {
      badge.textContent = `${filteredData.length} Data`;
    }
  }

  function renderTable() {
    if (!frm_entries) return;
    const tableBody = frm_entries.querySelector('tbody.list');
    if (!tableBody) return;

    if (!filteredData.length) {
      tableBody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted"><i class="fas fa-inbox fa-2x mb-2 d-block text-400"></i>Tidak ada data promosi yang ditemukan.</td></tr>';
      renderPagination(0);
      return;
    }

    const startIndex = (currentPage - 1) * rowsPerPage;
    const endIndex = Math.min(startIndex + rowsPerPage, filteredData.length);
    const paginatedItems = filteredData.slice(startIndex, endIndex);

    tableBody.innerHTML = paginatedItems.map((item, idx) => {
      const rowNum = startIndex + idx + 1;
      const tgl = item.TGL_PROMOSI || item.TGL_SURAT || '-';
      return `
        <tr>
          <td class="text-center text-muted fw-semi-bold">${rowNum}</td>
          <td>
            <div class="fw-bold text-dark">${item.NAMA || '-'}</div>
            <div class="text-muted font-monospace fs--2">NIP: ${item.NIP || '-'}</div>
          </td>
          <td class="text-center font-monospace">${tgl}</td>
          <td class="fw-semi-bold text-dark">${item.NO_SURAT || '-'}</td>
          <td class="text-secondary">${item.JABATAN_ASAL || '-'}</td>
          <td class="text-primary fw-semi-bold">${item.JABATAN_BARU || '-'}</td>
          <td><span class="badge bg-soft-info text-info">${item.BAGIAN_BARU || '-'}</span></td>
          <td class="text-muted fs--2">${item.KETERANGAN || '-'}</td>
          <td class="text-center">
            <div class="d-inline-flex gap-1">
              <a href="#!btn-edit" class="btn btn-sm btn-outline-warning py-1 px-2 btn-action-icon" role="button" title="Edit Data" data-row='${JSON.stringify(item)}'>
                <i class="fas fa-edit"></i>
              </a>
              <a href="#!btn-hapus" class="btn btn-sm btn-outline-danger py-1 px-2 btn-action-icon" role="button" title="Hapus Data" data-row='${JSON.stringify(item)}'>
                <i class="fas fa-trash-alt"></i>
              </a>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    renderPagination(filteredData.length);
  }

  function renderPagination(totalRows) {
    if (!frm_entries) return;
    const infoEl = frm_entries.querySelector('.pagination-info');
    const paginationEl = frm_entries.querySelector('.pagination');
    if (!infoEl || !paginationEl) return;

    if (totalRows === 0) {
      infoEl.textContent = 'Menampilkan 0 data';
      paginationEl.innerHTML = '';
      return;
    }

    const totalPages = Math.ceil(totalRows / rowsPerPage);
    const startIndex = (currentPage - 1) * rowsPerPage + 1;
    const endIndex = Math.min(currentPage * rowsPerPage, totalRows);
    infoEl.textContent = `Menampilkan ${startIndex}-${endIndex} dari ${totalRows} data`;

    let html = '';
    html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" data-page="${currentPage - 1}">&laquo;</a>
    </li>`;

    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
        html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
          <a class="page-link" href="#" data-page="${i}">${i}</a>
        </li>`;
      } else if (i === currentPage - 3 || i === currentPage + 3) {
        html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
      }
    }

    html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link" href="#" data-page="${currentPage + 1}">&raquo;</a>
    </li>`;

    paginationEl.innerHTML = html;

    paginationEl.querySelectorAll('a.page-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const p = parseInt(a.getAttribute('data-page'));
        if (p >= 1 && p <= totalPages && p !== currentPage) {
          currentPage = p;
          renderTable();
        }
      });
    });
  }

  function openAddModal() {
    const formEl = document.getElementById(`${id}-form`);
    if (!formEl) return;

    document.getElementById(`${id}-modal-title`).innerHTML = '<i class="fas fa-level-up-alt text-primary me-2"></i>Tambah Data Promosi';
    setFormEntries(formEl, {
      KD_PROMOSI_DARI: '',
      ID_PEGAWAI: '',
      TGL_PROMOSI: new Date().toISOString().split('T')[0],
      NO_SURAT: '',
      KD_BAGIAN_BARU: '',
      KD_JABATAN_BARU: '',
      KD_PANGKAT_BARU: '',
      KETERANGAN: ''
    });

    const selPegawai = formEl.querySelector('[data-field="ID_PEGAWAI"]');
    if (selPegawai) selPegawai.removeAttribute('disabled');

    const modal = getModal();
    if (modal) modal.show();
  }

  function openEditModal(item) {
    const formEl = document.getElementById(`${id}-form`);
    if (!formEl || !item) return;

    document.getElementById(`${id}-modal-title`).innerHTML = `<i class="fas fa-edit text-warning me-2"></i>Edit Data Promosi [${item.NAMA || ''}]`;
    setFormEntries(formEl, {
      KD_PROMOSI_DARI: item.KD_PROMOSI_DARI || '',
      ID_PEGAWAI: item.ID_PEGAWAI || '',
      TGL_PROMOSI: item.TGL_PROMOSI || item.TGL_SURAT || '',
      NO_SURAT: item.NO_SURAT || '',
      KD_BAGIAN_BARU: item.KD_BAGIAN_BARU || '',
      KD_JABATAN_BARU: item.KD_JABATAN_BARU || '',
      KD_PANGKAT_BARU: item.KD_PANGKAT_BARU || '',
      KETERANGAN: item.KETERANGAN || ''
    });

    const modal = getModal();
    if (modal) modal.show();
  }

  async function saveData() {
    const formEl = document.getElementById(`${id}-form`);
    if (!formEl) return;

    const payload = getFormEntries(formEl);
    if (!payload.ID_PEGAWAI) {
      showDialog({
        ui: 'interactive',
        type: 'warning',
        label: '<span class="text-danger">Silakan pilih Pegawai terlebih dahulu.</span>'
      });
      return;
    }
    if (!payload.TGL_PROMOSI) {
      showDialog({
        ui: 'interactive',
        type: 'warning',
        label: '<span class="text-danger">Tanggal Promosi wajib diisi.</span>'
      });
      return;
    }

    try {
      const res = await httpPost(`${apiUrl}/pegawai/promosi/save`, payload);
      if (res && res.code === 200) {
        const modal = getModal();
        if (modal) modal.hide();
        showDialog({
          type: 'success',
          label: '<span class="text-success">Data promosi berhasil disimpan.</span>'
        });
        await loadData();
      } else {
        showDialog({
          ui: 'interactive',
          type: 'warning',
          label: `<span class="text-danger">${res?.message || 'Gagal menyimpan data promosi.'}</span>`
        });
      }
    } catch (err) {
      console.error(err);
      showDialog({
        ui: 'interactive',
        type: 'warning',
        label: '<span class="text-danger">Terjadi kesalahan pada server saat menyimpan data.</span>'
      });
    }
  }

  async function deleteData(item) {
    const pk = item.KD_PROMOSI_DARI;
    if (!pk) return;

    const dialog = await showDialog({
      ui: 'interactive',
      type: 'question',
      label: `<span class="text-black">Apakah anda yakin akan menghapus data promosi <b>${item.NAMA || ''}</b> (SK: ${item.NO_SURAT || '-'})?</span>`,
      buttons: [
        {
          label: 'Ya, Hapus',
          class: 'btn-danger',
          onClick: async () => {
            dialog.close();
            try {
              const res = await httpPost(`${apiUrl}/pegawai/promosi/delete/${pk}`, { id: pk });
              if (res && res.code === 200) {
                showDialog({
                  type: 'success',
                  label: '<span class="text-success">Data promosi berhasil dihapus.</span>'
                });
                await loadData();
              } else {
                showDialog({
                  ui: 'interactive',
                  type: 'warning',
                  label: `<span class="text-danger">${res?.message || 'Gagal menghapus data promosi.'}</span>`
                });
              }
            } catch (err) {
              console.error(err);
              showDialog({
                ui: 'interactive',
                type: 'warning',
                label: '<span class="text-danger">Terjadi kesalahan server saat menghapus data.</span>'
              });
            }
          }
        },
        {
          label: 'Batal',
          class: 'btn-secondary',
          onClick: () => dialog.close()
        }
      ]
    });
  }

  function exportCSV() {
    if (!filteredData.length) {
      showDialog({
        ui: 'interactive',
        type: 'warning',
        label: '<span class="text-danger">Tidak ada data untuk diekspor.</span>'
      });
      return;
    }

    const headers = ['No', 'NIP', 'Nama Pegawai', 'Tgl Promosi', 'No SK', 'Jabatan Asal', 'Jabatan Baru', 'Bagian Baru', 'Keterangan'];
    const rows = filteredData.map((d, i) => [
      i + 1,
      `"${(d.NIP || '').replace(/"/g, '""')}"`,
      `"${(d.NAMA || '').replace(/"/g, '""')}"`,
      `"${(d.TGL_PROMOSI || d.TGL_SURAT || '').replace(/"/g, '""')}"`,
      `"${(d.NO_SURAT || '').replace(/"/g, '""')}"`,
      `"${(d.JABATAN_ASAL || '').replace(/"/g, '""')}"`,
      `"${(d.JABATAN_BARU || '').replace(/"/g, '""')}"`,
      `"${(d.BAGIAN_BARU || '').replace(/"/g, '""')}"`,
      `"${(d.KETERANGAN || '').replace(/"/g, '""')}"`
    ]);

    const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `status_promosi_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function setupEventListeners() {
    if (frm_actions) {
      const btnTambah = frm_actions.querySelector('a[href="#!btn-tambah"]');
      if (btnTambah) {
        btnTambah.addEventListener('click', (e) => {
          e.preventDefault();
          openAddModal();
        });
      }

      const btnRefresh = frm_actions.querySelector('a[href="#!btn-refresh"]');
      if (btnRefresh) {
        btnRefresh.addEventListener('click', (e) => {
          e.preventDefault();
          loadData();
        });
      }

      const btnExport = frm_actions.querySelector('a[href="#!btn-export"]');
      if (btnExport) {
        btnExport.addEventListener('click', (e) => {
          e.preventDefault();
          exportCSV();
        });
      }

      const searchInput = frm_actions.querySelector('.search-box');
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          filterAndRender();
        });
      }
    }

    if (frm_entries) {
      frm_entries.addEventListener('click', (e) => {
        const btnEdit = e.target.closest('a[href="#!btn-edit"]');
        const btnHapus = e.target.closest('a[href="#!btn-hapus"]');

        if (btnEdit) {
          e.preventDefault();
          const rowData = btnEdit.getAttribute('data-row');
          if (rowData) {
            try {
              openEditModal(JSON.parse(rowData));
            } catch (err) {
              console.error(err);
            }
          }
        } else if (btnHapus) {
          e.preventDefault();
          const rowData = btnHapus.getAttribute('data-row');
          if (rowData) {
            try {
              deleteData(JSON.parse(rowData));
            } catch (err) {
              console.error(err);
            }
          }
        }
      });
    }

    const modalEl = document.getElementById(`${id}-modal`);
    if (modalEl) {
      const btnSimpan = modalEl.querySelector('a[href="#!btn-simpan"]');
      if (btnSimpan) {
        btnSimpan.addEventListener('click', (e) => {
          e.preventDefault();
          saveData();
        });
      }
    }
  }

  // Init Lifecycle
  setupEventListeners();
  loadData();

  // Expose to Global Lifecycle
  document[id] = { id, loadData, reload: loadData, openAddModal };
  window[id] = document[id];
</script>
