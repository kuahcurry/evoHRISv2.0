<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';
  import EvoSelector from './components/EvoSelector.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url) 
    ? config.api_url 
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let selNip = null;
  let selBagian = null;
  let selGolongan = null;
  let selJenisCatatan = null;
  let selJabatan = null;
  let selPangkat = null;
  let selEkselon = null;
  let selJenisPegawai = null;
  let selStatusPegawai = null;
  let selLokasi = null;

  let allPegawai = [];
  let allCatatan = [];
  let filteredCatatan = [];
  let currentPage = 1;
  const pageSize = 10;
  let isEditMode = false;

  function initEvoSelectors() {
    selNip = new EvoSelector('sel_nip', [{ text: 'Pilih NIK / NIP Pegawai...', value: '-' }]);
    selBagian = new EvoSelector('sel_bagian', [{ text: 'Pilih Bagian', value: '-' }]);
    selGolongan = new EvoSelector('sel_golongan', [{ text: 'Pilih Golongan', value: '-' }]);
    selJenisCatatan = new EvoSelector('sel_jenis_catatan', [{ text: 'Pilih Jenis Catatan', value: '-' }]);
    selJabatan = new EvoSelector('sel_jabatan', [{ text: 'Pilih Jabatan', value: '-' }]);
    selPangkat = new EvoSelector('sel_pangkat', [{ text: 'Pilih Pangkat', value: '-' }]);
    selEkselon = new EvoSelector('sel_ekselon', [{ text: 'Pilih Ekselon', value: '-' }]);
    selJenisPegawai = new EvoSelector('sel_jenis_pegawai', [{ text: 'Pilih Jenis Pegawai', value: '-' }]);
    selStatusPegawai = new EvoSelector('sel_status_pegawai', [{ text: 'Pilih Status Pegawai', value: '-' }]);
    selLokasi = new EvoSelector('sel_lokasi', [{ text: 'Pilih Lokasi', value: '-' }]);
  }

  function makeOptions(list, idKey, nameKey, placeholder) {
    const opts = [{ text: placeholder, value: '-' }];
    if (Array.isArray(list)) {
      list.forEach(item => {
        opts.push({
          text: item[nameKey] || item[idKey],
          value: String(item[idKey])
        });
      });
    }
    return opts;
  }

  function formatDate(dateStr) {
    if (!dateStr || dateStr === '0000-00-00') return '-';
    const parts = dateStr.substring(0, 10).split('-');
    if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
    return dateStr;
  }

  function toInputDate(dateStr) {
    if (!dateStr || dateStr === '0000-00-00') return '';
    return dateStr.substring(0, 10);
  }

  function setDefaultDates() {
    const today = new Date().toISOString().substring(0, 10);
    const tglSuratEl = document.querySelector('#catatan_tgl_surat');
    const tglCatatanEl = document.querySelector('#catatan_tgl_catatan');
    if (tglSuratEl && !tglSuratEl.value) tglSuratEl.value = today;
    if (tglCatatanEl && !tglCatatanEl.value) tglCatatanEl.value = today;
  }

  async function loadMasterData() {
    try {
      const res = await httpGet(`${apiUrl}/pegawai/ref_data`);
      if (res && res.code === 200 && res.data) {
        const d = res.data;
        if (selBagian && d.bagian) selBagian.addOptions(makeOptions(d.bagian, 'KD_BAGIAN', 'BAGIAN', 'Pilih Bagian'));
        if (selGolongan && d.golongan) selGolongan.addOptions(makeOptions(d.golongan, 'KD_GOLONGAN', 'GOLONGAN', 'Pilih Golongan'));
        if (selJenisCatatan && d.jenis_catatan) selJenisCatatan.addOptions(makeOptions(d.jenis_catatan, 'KD_JENIS_CATATAN', 'JENIS_CATATAN', 'Pilih Jenis Catatan'));
        if (selJabatan && d.jabatan) selJabatan.addOptions(makeOptions(d.jabatan, 'KD_JABATAN', 'JABATAN', 'Pilih Jabatan'));
        if (selPangkat && d.pangkat) selPangkat.addOptions(makeOptions(d.pangkat, 'KD_PANGKAT', 'PANGKAT', 'Pilih Pangkat'));
        if (selEkselon && d.ekselon) selEkselon.addOptions(makeOptions(d.ekselon, 'KD_EKSELON', 'EKSELON', 'Pilih Ekselon'));
        if (selJenisPegawai && d.jenis_pegawai) selJenisPegawai.addOptions(makeOptions(d.jenis_pegawai, 'KD_JENIS_PEGAWAI', 'JENIS_PEGAWAI', 'Pilih Jenis Pegawai'));
        if (selStatusPegawai && d.status_pegawai) selStatusPegawai.addOptions(makeOptions(d.status_pegawai, 'KD_STATUS_PEGAWAI', 'STATUS_PEGAWAI', 'Pilih Status Pegawai'));
        if (selLokasi && d.lokasi) selLokasi.addOptions(makeOptions(d.lokasi, 'KD_LOKASI', 'LOKASI', 'Pilih Lokasi'));
      }
    } catch (err) {
      console.warn('Gagal memuat master data:', err);
    }
  }

  async function loadPegawaiList() {
    try {
      const res = await httpGet(`${apiUrl}/pegawai/list?limit=1000`);
      if (res && res.code === 200 && Array.isArray(res.data)) {
        allPegawai = res.data;
        const opts = [{ text: 'Pilih NIK / NIP Pegawai...', value: '-' }];
        allPegawai.forEach(p => {
          const nik = (p.NO_IDENTITAS || '').trim();
          const nip = (p.NIP || '').trim();
          const nama = (p.NAMA || '').trim();

          let label = '';
          if (nik && nip) {
            label = `${nik} - ${nip} - ${nama}`;
          } else if (nip) {
            label = `${nip} - ${nama}`;
          } else if (nik) {
            label = `${nik} - ${nama}`;
          } else {
            label = nama || 'Pegawai';
          }

          opts.push({
            text: label,
            value: nip || String(p.ID_PEGAWAI),
            values: {
              id_pegawai: p.ID_PEGAWAI,
              nip: nip,
              nik: nik,
              nama: nama
            }
          });
        });
        if (selNip) {
          selNip.addOptions(opts);
        }
      }
    } catch (err) {
      console.warn('Gagal memuat daftar pegawai:', err);
    }
  }

  async function autofillPegawai(nip) {
    if (!nip || nip === '-') return;
    try {
      const res = await httpGet(`${apiUrl}/pegawai/snapshot/${encodeURIComponent(nip)}`);
      if (res && res.code === 200 && res.data) {
        const snap = res.data;
        const idPegEl = document.querySelector('#catatan_id_pegawai');
        const namaEl = document.querySelector('#catatan_nama');
        const nipEl = document.querySelector('#catatan_nip');

        if (idPegEl && snap.ID_PEGAWAI) idPegEl.value = snap.ID_PEGAWAI;
        if (namaEl && snap.NAMA) namaEl.value = snap.NAMA;
        if (nipEl && snap.NIP) nipEl.value = snap.NIP;

        if (selBagian && snap.KD_BAGIAN) selBagian.value = String(snap.KD_BAGIAN);
        if (selGolongan && snap.KD_GOLONGAN) selGolongan.value = String(snap.KD_GOLONGAN);
        if (selJabatan && snap.KD_JABATAN) selJabatan.value = String(snap.KD_JABATAN);
        if (selPangkat && snap.KD_PANGKAT) selPangkat.value = String(snap.KD_PANGKAT);
        if (selEkselon && snap.KD_EKSELON) selEkselon.value = String(snap.KD_EKSELON);
        if (selJenisPegawai && snap.KD_JENIS_PEGAWAI) selJenisPegawai.value = String(snap.KD_JENIS_PEGAWAI);
        if (selStatusPegawai && snap.KD_STATUS_PEGAWAI) selStatusPegawai.value = String(snap.KD_STATUS_PEGAWAI);
        if (selLokasi && snap.KD_LOKASI) selLokasi.value = String(snap.KD_LOKASI);
      }
    } catch (err) {
      console.warn('Gagal memuat snapshot pegawai:', err);
    }
  }

  function setupEventListeners() {
    if (selNip) {
      selNip.on('selected', (e) => {
        const detail = e.detail || {};
        const val = detail.value || (selNip ? selNip.value : '');
        const values = detail.values || {};

        let nip = values.nip || val;
        let nama = values.nama || '';
        let idPeg = values.id_pegawai || '';

        const match = allPegawai.find(p => 
          (nip && String(p.NIP) === String(nip)) || 
          (val && (String(p.NIP) === String(val) || String(p.ID_PEGAWAI) === String(val) || String(p.NO_IDENTITAS) === String(val)))
        );

        if (match) {
          nip = match.NIP || nip;
          nama = match.NAMA || nama;
          idPeg = match.ID_PEGAWAI || idPeg;
        }

        const nipInput = document.querySelector('#catatan_nip');
        const namaInput = document.querySelector('#catatan_nama');
        const idInput = document.querySelector('#catatan_id_pegawai');

        if (nipInput) nipInput.value = nip || '';
        if (namaInput) namaInput.value = nama || '';
        if (idInput) idInput.value = idPeg || '';

        if (nip && nip !== '-') {
          autofillPegawai(nip);
        }
      });

      selNip.on('cleared', () => {
        const nipInput = document.querySelector('#catatan_nip');
        const namaInput = document.querySelector('#catatan_nama');
        const idInput = document.querySelector('#catatan_id_pegawai');
        if (nipInput) nipInput.value = '';
        if (namaInput) {
          namaInput.value = '';
          namaInput.dispatchEvent(new Event('input', { bubbles: true }));
          namaInput.dispatchEvent(new Event('change', { bubbles: true }));
        }
        if (idInput) idInput.value = '';
      });
    }

    const btnReset = document.querySelector('#btn-reset-catatan');
    if (btnReset) btnReset.addEventListener('click', resetForm);
    const btnResetTop = document.querySelector('#btn-reset-catatan-top');
    if (btnResetTop) btnResetTop.addEventListener('click', resetForm);

    const form = document.querySelector('#form-catatan');
    if (form) form.addEventListener('submit', handleFormSubmit);

    const searchInput = document.querySelector('#txtcari_catatan');
    const searchBtn = document.querySelector('#btn-search-catatan');
    const clearBtn = document.querySelector('#btn-clear-catatan');

    if (searchBtn) {
      searchBtn.addEventListener('click', () => {
        applyFilter(searchInput ? searchInput.value : '');
      });
    }

    if (searchInput) {
      searchInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') applyFilter(searchInput.value);
      });
      searchInput.addEventListener('input', () => {
        if (!searchInput.value) applyFilter('');
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (searchInput) searchInput.value = '';
        applyFilter('');
      });
    }

    const refreshBtn = document.querySelector('#btn-refresh-catatan');
    if (refreshBtn) refreshBtn.addEventListener('click', loadCatatanTable);

    const exportBtn = document.querySelector('#btn-export-catatan');
    if (exportBtn) exportBtn.addEventListener('click', exportCSV);

    const tbody = document.querySelector('#tb_catatan_body');
    if (tbody) {
      tbody.addEventListener('click', (e) => {
        const editBtn = e.target.closest('.btn-edit-catatan');
        if (editBtn) {
          const id = editBtn.getAttribute('data-id');
          editCatatan(id);
          return;
        }

        const delBtn = e.target.closest('.btn-delete-catatan');
        if (delBtn) {
          const id = delBtn.getAttribute('data-id');
          const surat = delBtn.getAttribute('data-surat') || '';
          deleteCatatan(id, surat);
          return;
        }
      });
    }
  }

  async function handleFormSubmit(e) {
    e.preventDefault();

    let nipVal = selNip ? selNip.value : '';
    if (!nipVal || nipVal === '-') {
      nipVal = document.querySelector('#catatan_nip').value;
    }
    if (!nipVal || nipVal === '-') {
      alert('Silakan pilih NIK / NIP Pegawai terlebih dahulu!');
      return;
    }

    const noSurat = document.querySelector('#catatan_no_surat').value.trim();
    if (!noSurat) {
      alert('Nomor Surat wajib diisi!');
      return;
    }

    const jenisCatatanVal = selJenisCatatan ? selJenisCatatan.value : '';
    if (!jenisCatatanVal || jenisCatatanVal === '-') {
      alert('Jenis Catatan wajib dipilih!');
      return;
    }

    const kdCatatan = document.querySelector('#catatan_kd_catatan').value;
    const idPegawai = document.querySelector('#catatan_id_pegawai').value;
    const nama = document.querySelector('#catatan_nama').value.trim();
    const tglSurat = document.querySelector('#catatan_tgl_surat').value;
    const tglCatatan = document.querySelector('#catatan_tgl_catatan').value;
    const keterangan = document.querySelector('#catatan_keterangan').value.trim();
    const existingFile = document.querySelector('#catatan_existing_file').value;

    const payload = {
      KD_CATATAN: kdCatatan || '',
      ID_PEGAWAI: idPegawai || '',
      NIP: nipVal,
      NAMA: nama,
      NO_SURAT: noSurat,
      TGL_SURAT: tglSurat,
      TGL_CATATAN: tglCatatan,
      KD_JENIS_CATATAN: jenisCatatanVal,
      KD_BAGIAN: (selBagian && selBagian.value !== '-') ? selBagian.value : '',
      KD_GOLONGAN: (selGolongan && selGolongan.value !== '-') ? selGolongan.value : '',
      KD_JABATAN: (selJabatan && selJabatan.value !== '-') ? selJabatan.value : '',
      KD_PANGKAT: (selPangkat && selPangkat.value !== '-') ? selPangkat.value : '',
      KD_EKSELON: (selEkselon && selEkselon.value !== '-') ? selEkselon.value : '',
      KD_JENIS_PEGAWAI: (selJenisPegawai && selJenisPegawai.value !== '-') ? selJenisPegawai.value : '',
      KD_STATUS_PEGAWAI: (selStatusPegawai && selStatusPegawai.value !== '-') ? selStatusPegawai.value : '',
      KD_LOKASI: (selLokasi && selLokasi.value !== '-') ? selLokasi.value : '',
      KETERANGAN: keterangan,
      EXISTING_FILE: existingFile
    };

    if (!payload.FILE && existingFile) {
      payload.FILE = existingFile;
    }

    const btnSave = document.querySelector('#btn-save-catatan');
    if (btnSave) btnSave.disabled = true;

    try {
      const fileInput = document.querySelector('#catatan_file');
      let res;
      if (fileInput && fileInput.files && fileInput.files[0]) {
        const formData = new FormData();
        Object.keys(payload).forEach(k => formData.append(k, payload[k]));
        formData.append('file', fileInput.files[0]);

        const token = localStorage.getItem('token') || '';
        const response = await fetch(`${apiUrl}/pegawai/catatan/save`, {
          method: 'POST',
          headers: token ? { 'Authorization': `Bearer ${token}` } : {},
          body: formData
        });
        res = await response.json();
      } else {
        res = await httpPost(`${apiUrl}/pegawai/catatan/save`, payload);
      }

      if (res && (res.code === 200 || res.status === true || res.status === 'ok')) {
        alert(res.message || 'Data catatan berhasil disimpan');
        resetForm();
        loadCatatanTable();
      } else {
        alert(res?.message || 'Gagal menyimpan data catatan');
      }
    } catch (err) {
      alert(`Terjadi kesalahan: ${err.message}`);
    } finally {
      if (btnSave) btnSave.disabled = false;
    }
  }

  async function deleteCatatan(id, surat) {
    if (!id) return;
    if (!confirm(`Yakin ingin menghapus catatan No. Surat "${surat || id}"?`)) return;

    try {
      const res = await httpPost(`${apiUrl}/pegawai/catatan/delete`, { id: id, KD_CATATAN: id });
      if (res && (res.code === 200 || res.status === true || res.status === 'ok')) {
        alert(res.message || 'Data catatan berhasil dihapus');
        loadCatatanTable();
      } else {
        alert(res?.message || 'Gagal menghapus data catatan');
      }
    } catch (err) {
      alert(`Terjadi kesalahan: ${err.message}`);
    }
  }

  function editCatatan(id) {
    const item = allCatatan.find(c => String(c.KD_CATATAN) === String(id));
    if (!item) return;

    isEditMode = true;
    document.querySelector('#catatan_kd_catatan').value = item.KD_CATATAN || '';
    document.querySelector('#catatan_id_pegawai').value = item.ID_PEGAWAI || '';
    document.querySelector('#catatan_nip').value = item.NIP || '';
    document.querySelector('#catatan_nama').value = item.NAMA_PEGAWAI || item.NAMA || '';
    document.querySelector('#catatan_no_surat').value = item.NO_SURAT || '';
    document.querySelector('#catatan_tgl_surat').value = toInputDate(item.TGL_SURAT);
    document.querySelector('#catatan_tgl_catatan').value = toInputDate(item.TGL_CATATAN);
    document.querySelector('#catatan_keterangan').value = item.KETERANGAN || '';
    document.querySelector('#catatan_existing_file').value = item.FILE || '';

    const previewBadge = document.querySelector('#file_preview_badge');
    if (previewBadge) {
      if (item.FILE) {
        previewBadge.innerHTML = `<span class="badge bg-soft-info text-info"><i class="fas fa-file me-1"></i>File tersimpan: ${item.FILE}</span>`;
      } else {
        previewBadge.innerHTML = '';
      }
    }

    if (selNip) selNip.value = item.NIP || item.ID_PEGAWAI || '-';
    if (selBagian) selBagian.value = item.KD_BAGIAN ? String(item.KD_BAGIAN) : '-';
    if (selGolongan) selGolongan.value = item.KD_GOLONGAN ? String(item.KD_GOLONGAN) : '-';
    if (selJenisCatatan) selJenisCatatan.value = item.KD_JENIS_CATATAN ? String(item.KD_JENIS_CATATAN) : '-';
    if (selJabatan) selJabatan.value = item.KD_JABATAN ? String(item.KD_JABATAN) : '-';
    if (selPangkat) selPangkat.value = item.KD_PANGKAT ? String(item.KD_PANGKAT) : '-';
    if (selEkselon) selEkselon.value = item.KD_EKSELON ? String(item.KD_EKSELON) : '-';
    if (selJenisPegawai) selJenisPegawai.value = item.KD_JENIS_PEGAWAI ? String(item.KD_JENIS_PEGAWAI) : '-';
    if (selStatusPegawai) selStatusPegawai.value = item.KD_STATUS_PEGAWAI ? String(item.KD_STATUS_PEGAWAI) : '-';
    if (selLokasi) selLokasi.value = item.KD_LOKASI ? String(item.KD_LOKASI) : '-';

    document.querySelector('#form-mode-badge').textContent = 'Mode Edit';
    document.querySelector('#form-mode-badge').className = 'badge bg-soft-warning text-warning fs--2 ms-2';
    document.querySelector('#btn-save-catatan').innerHTML = '<i class="fas fa-save me-1"></i> Perbarui Catatan';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    isEditMode = false;
    const form = document.querySelector('#form-catatan');
    if (form) form.reset();

    document.querySelector('#catatan_kd_catatan').value = '';
    document.querySelector('#catatan_id_pegawai').value = '';
    document.querySelector('#catatan_nip').value = '';
    document.querySelector('#catatan_nama').value = '';
    document.querySelector('#catatan_existing_file').value = '';

    const previewBadge = document.querySelector('#file_preview_badge');
    if (previewBadge) previewBadge.innerHTML = '';

    document.querySelector('#form-mode-badge').textContent = 'Mode Tambah';
    document.querySelector('#form-mode-badge').className = 'badge bg-soft-primary text-primary fs--2 ms-2';
    document.querySelector('#btn-save-catatan').innerHTML = '<i class="fas fa-save me-1"></i> Simpan Catatan';

    setDefaultDates();

    if (selNip) selNip.value = '-';
    if (selBagian) selBagian.value = '-';
    if (selGolongan) selGolongan.value = '-';
    if (selJenisCatatan) selJenisCatatan.value = '-';
    if (selJabatan) selJabatan.value = '-';
    if (selPangkat) selPangkat.value = '-';
    if (selEkselon) selEkselon.value = '-';
    if (selJenisPegawai) selJenisPegawai.value = '-';
    if (selStatusPegawai) selStatusPegawai.value = '-';
    if (selLokasi) selLokasi.value = '-';
  }

  async function loadCatatanTable() {
    const tbody = document.querySelector('#tb_catatan_body');
    if (tbody) {
      tbody.innerHTML = `<tr><td colspan="13" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data riwayat catatan...</td></tr>`;
    }

    try {
      const res = await httpGet(`${apiUrl}/pegawai/catatan?limit=1000`);
      if (res && res.code === 200 && Array.isArray(res.data)) {
        allCatatan = res.data;
        const searchInput = document.querySelector('#txtcari_catatan');
        const q = searchInput ? searchInput.value.trim() : '';
        applyFilter(q);
      } else {
        allCatatan = [];
        filteredCatatan = [];
        renderTable();
      }
    } catch (err) {
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="13" class="text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat data: ${err.message}</td></tr>`;
      }
    }
  }

  function applyFilter(keyword) {
    const q = (keyword || '').toLowerCase().trim();
    if (!q) {
      filteredCatatan = [...allCatatan];
    } else {
      filteredCatatan = allCatatan.filter(item => {
        return (
          (item.NIP && item.NIP.toLowerCase().includes(q)) ||
          ((item.NAMA_PEGAWAI || item.NAMA) && (item.NAMA_PEGAWAI || item.NAMA).toLowerCase().includes(q)) ||
          (item.NO_SURAT && item.NO_SURAT.toLowerCase().includes(q)) ||
          (item.JENIS_CATATAN && item.JENIS_CATATAN.toLowerCase().includes(q)) ||
          (item.BAGIAN && item.BAGIAN.toLowerCase().includes(q)) ||
          (item.JABATAN && item.JABATAN.toLowerCase().includes(q)) ||
          (item.KETERANGAN && item.KETERANGAN.toLowerCase().includes(q))
        );
      });
    }
    currentPage = 1;
    renderTable();
  }

  function renderTable() {
    const tbody = document.querySelector('#tb_catatan_body');
    const badgeTotal = document.querySelector('#badge-total-catatan');
    if (badgeTotal) badgeTotal.textContent = `${filteredCatatan.length} Data`;

    if (!tbody) return;

    if (filteredCatatan.length === 0) {
      tbody.innerHTML = `<tr><td colspan="13" class="text-center py-4 text-muted"><i class="fas fa-inbox fa-2x mb-2 d-block text-secondary"></i>Belum ada data catatan pegawai</td></tr>`;
      renderPagination(0, 0, 0);
      return;
    }

    const totalPages = Math.ceil(filteredCatatan.length / pageSize) || 1;
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIdx = (currentPage - 1) * pageSize;
    const endIdx = Math.min(startIdx + pageSize, filteredCatatan.length);
    const pageRows = filteredCatatan.slice(startIdx, endIdx);

    let html = '';
    pageRows.forEach((row, i) => {
      const no = startIdx + i + 1;
      const nip = row.NIP || '-';
      const nama = row.NAMA_PEGAWAI || row.NAMA || '-';
      const noSurat = row.NO_SURAT || '-';
      const tglSurat = formatDate(row.TGL_SURAT);
      const jenisCatatan = row.JENIS_CATATAN || '-';
      const tglCatatan = formatDate(row.TGL_CATATAN);
      const bagian = row.BAGIAN || '-';
      const jabatan = row.JABATAN || '-';
      const pangkat = row.PANGKAT || '-';
      const keterangan = row.KETERANGAN || '-';
      
      let fileCell = '<span class="text-muted fs--2">-</span>';
      if (row.FILE) {
        fileCell = `<a href="uploads/${encodeURIComponent(row.FILE)}" target="_blank" class="badge bg-soft-info text-info text-decoration-none" title="Unduh / Lihat File"><i class="fas fa-file-download me-1"></i>Unduh</a>`;
      }

      html += `
        <tr>
          <td class="text-center">${no}</td>
          <td class="fw-semi-bold">${nip}</td>
          <td>${nama}</td>
          <td>${noSurat}</td>
          <td>${tglSurat}</td>
          <td><span class="badge bg-soft-primary text-primary">${jenisCatatan}</span></td>
          <td>${tglCatatan}</td>
          <td>${bagian}</td>
          <td>${jabatan}</td>
          <td>${pangkat}</td>
          <td>${keterangan}</td>
          <td class="text-center">${fileCell}</td>
          <td class="text-center">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-action-icon btn-outline-warning btn-edit-catatan" data-id="${row.KD_CATATAN}" title="Edit Catatan">
                <i class="fas fa-pencil-alt fs--2"></i>
              </button>
              <button class="btn btn-action-icon btn-outline-danger btn-delete-catatan" data-id="${row.KD_CATATAN}" data-surat="${noSurat}" title="Hapus Catatan">
                <i class="fas fa-trash-alt fs--2"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    renderPagination(filteredCatatan.length, startIdx + 1, endIdx);
  }

  function renderPagination(total, from, to) {
    const paginationInfo = document.querySelector('#catatan-pagination-info');
    const paginationUl = document.querySelector('#catatan-pagination');

    if (paginationInfo) {
      paginationInfo.textContent = total > 0 ? `Menampilkan ${from} - ${to} dari ${total} data` : 'Menampilkan 0 - 0 dari 0 data';
    }

    if (!paginationUl) return;
    paginationUl.innerHTML = '';

    if (total <= pageSize) return;

    const totalPages = Math.ceil(total / pageSize);

    // Prev Button
    const prevLi = document.createElement('li');
    prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
    prevLi.innerHTML = `<a class="page-link" href="javascript:void(0)">&laquo;</a>`;
    if (currentPage > 1) {
      prevLi.addEventListener('click', () => {
        currentPage--;
        renderTable();
      });
    }
    paginationUl.appendChild(prevLi);

    // Page numbers
    for (let p = 1; p <= totalPages; p++) {
      if (totalPages > 7 && Math.abs(p - currentPage) > 2 && p !== 1 && p !== totalPages) {
        continue;
      }
      const li = document.createElement('li');
      li.className = `page-item ${p === currentPage ? 'active' : ''}`;
      li.innerHTML = `<a class="page-link" href="javascript:void(0)">${p}</a>`;
      li.addEventListener('click', () => {
        currentPage = p;
        renderTable();
      });
      paginationUl.appendChild(li);
    }

    // Next Button
    const nextLi = document.createElement('li');
    nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
    nextLi.innerHTML = `<a class="page-link" href="javascript:void(0)">&raquo;</a>`;
    if (currentPage < totalPages) {
      nextLi.addEventListener('click', () => {
        currentPage++;
        renderTable();
      });
    }
    paginationUl.appendChild(nextLi);
  }

  function exportCSV() {
    if (!filteredCatatan || filteredCatatan.length === 0) {
      alert('Tidak ada data untuk diekspor!');
      return;
    }

    const headers = ['No', 'NIP', 'Nama', 'No Surat', 'Tgl Surat', 'Jenis Catatan', 'Tgl Catatan', 'Bagian', 'Jabatan', 'Pangkat', 'Keterangan', 'File'];
    const rows = filteredCatatan.map((r, i) => [
      i + 1,
      `"${(r.NIP || '').replace(/"/g, '""')}"`,
      `"${(r.NAMA_PEGAWAI || r.NAMA || '').replace(/"/g, '""')}"`,
      `"${(r.NO_SURAT || '').replace(/"/g, '""')}"`,
      `"${formatDate(r.TGL_SURAT)}"`,
      `"${(r.JENIS_CATATAN || '').replace(/"/g, '""')}"`,
      `"${formatDate(r.TGL_CATATAN)}"`,
      `"${(r.BAGIAN || '').replace(/"/g, '""')}"`,
      `"${(r.JABATAN || '').replace(/"/g, '""')}"`,
      `"${(r.PANGKAT || '').replace(/"/g, '""')}"`,
      `"${(r.KETERANGAN || '').replace(/"/g, '""')}"`,
      `"${(r.FILE || '').replace(/"/g, '""')}"`
    ]);

    let csvContent = '\uFEFF' + headers.join(',') + '\n' + rows.map(e => e.join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `data_catatan_pegawai_${new Date().toISOString().substring(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  async function init() {
    initEvoSelectors();
    setDefaultDates();
    setupEventListeners();
    await Promise.all([
      loadMasterData(),
      loadPegawaiList(),
      loadCatatanTable()
    ]);
  }

  window.status_catatan = { loadData: loadCatatanTable, init: init };
  document.status_catatan = { loadData: loadCatatanTable, init: init };

  init();
</script>
