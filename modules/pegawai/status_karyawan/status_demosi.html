<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';
  import EvoSelector from './components/EvoSelector.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url) 
    ? config.api_url 
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let allDemosi = [];
  let filteredDemosi = [];
  let refData = {
    bagian: [],
    golongan: [],
    jabatan: [],
    pangkat: [],
    ekselon: [],
    jenis_pegawai: [],
    status_pegawai: [],
    lokasi: []
  };
  let lookupPegawai = [];
  let currentPage = 1;
  const rowsPerPage = 10;
  let lookupModalInstance = null;

  // EvoSelector instances
  let selDariBagian = null;
  let selDariGolongan = null;
  let selDariJabatan = null;
  let selDariPangkat = null;
  let selDariEkselon = null;
  let selDariJenisPegawai = null;
  let selDariStatusPegawai = null;
  let selDariLokasi = null;

  let selMenjadiBagian = null;
  let selMenjadiGolongan = null;
  let selMenjadiJabatan = null;
  let selMenjadiPangkat = null;
  let selMenjadiEkselon = null;
  let selMenjadiJenisPegawai = null;
  let selMenjadiStatusPegawai = null;
  let selMenjadiLokasi = null;

  // Helper untuk membuat opsi EvoSelector dengan baris kosong/placeholder '-'
  function createOptList(items, valKey, textKey, defaultText) {
    const list = [{ text: defaultText, value: '-' }];
    if (Array.isArray(items)) {
      items.forEach(item => {
        const val = item[valKey] !== undefined ? String(item[valKey]) : '';
        const txt = item[textKey] !== undefined ? String(item[textKey]) : val;
        list.push({ text: txt, value: val });
      });
    }
    return list;
  }

  // Inisialisasi seluruh EvoSelector Dari dan Menjadi (tampil instan)
  function initEvoSelectors() {
    selDariBagian = new EvoSelector('sel_dari_bagian', [{ text: 'Pilih Bagian', value: '-' }]);
    selDariGolongan = new EvoSelector('sel_dari_golongan', [{ text: 'Pilih Golongan', value: '-' }]);
    selDariJabatan = new EvoSelector('sel_dari_jabatan', [{ text: 'Pilih Jabatan', value: '-' }]);
    selDariPangkat = new EvoSelector('sel_dari_pangkat', [{ text: 'Pilih Pangkat', value: '-' }]);
    selDariEkselon = new EvoSelector('sel_dari_ekselon', [{ text: 'Pilih Ekselon', value: '-' }]);
    selDariJenisPegawai = new EvoSelector('sel_dari_jenis_pegawai', [{ text: 'Pilih Jenis Pegawai', value: '-' }]);
    selDariStatusPegawai = new EvoSelector('sel_dari_status_pegawai', [{ text: 'Pilih Status Pegawai', value: '-' }]);
    selDariLokasi = new EvoSelector('sel_dari_lokasi', [{ text: 'Pilih Lokasi', value: '-' }]);

    selMenjadiBagian = new EvoSelector('sel_menjadi_bagian', [{ text: 'Pilih Bagian', value: '-' }]);
    selMenjadiGolongan = new EvoSelector('sel_menjadi_golongan', [{ text: 'Pilih Golongan', value: '-' }]);
    selMenjadiJabatan = new EvoSelector('sel_menjadi_jabatan', [{ text: 'Pilih Jabatan', value: '-' }]);
    selMenjadiPangkat = new EvoSelector('sel_menjadi_pangkat', [{ text: 'Pilih Pangkat', value: '-' }]);
    selMenjadiEkselon = new EvoSelector('sel_menjadi_ekselon', [{ text: 'Pilih Ekselon', value: '-' }]);
    selMenjadiJenisPegawai = new EvoSelector('sel_menjadi_jenis_pegawai', [{ text: 'Pilih Jenis Pegawai', value: '-' }]);
    selMenjadiStatusPegawai = new EvoSelector('sel_menjadi_status_pegawai', [{ text: 'Pilih Status Pegawai', value: '-' }]);
    selMenjadiLokasi = new EvoSelector('sel_menjadi_lokasi', [{ text: 'Pilih Lokasi', value: '-' }]);
  }

  // Update opsi dropdown dari data master database
  function updateEvoSelectorOptions() {
    const optBagian = createOptList(refData.bagian, 'KD_BAGIAN', 'BAGIAN', 'Pilih Bagian');
    const optGolongan = createOptList(refData.golongan, 'KD_GOLONGAN', 'GOLONGAN', 'Pilih Golongan');
    const optJabatan = createOptList(refData.jabatan, 'KD_JABATAN', 'JABATAN', 'Pilih Jabatan');
    const optPangkat = createOptList(refData.pangkat, 'KD_PANGKAT', 'PANGKAT', 'Pilih Pangkat');
    const optEkselon = createOptList(refData.ekselon, 'KD_EKSELON', 'EKSELON', 'Pilih Ekselon');
    const optJenisPegawai = createOptList(refData.jenis_pegawai, 'KD_JENIS_PEGAWAI', 'JENIS_PEGAWAI', 'Pilih Jenis Pegawai');
    const optStatusPegawai = createOptList(refData.status_pegawai, 'KD_STATUS_PEGAWAI', 'STATUS_PEGAWAI', 'Pilih Status Pegawai');

  function populateNipDatalist() {

  // Muat Master Referensi & Lookup Pegawai dari Database
  async function loadMasterData() {
    try {
      let refRes = await httpGet(`${apiUrl}/cPegawai/master`);
      if (!refRes || refRes.code !== 200 || !refRes.data) {
        refRes = await httpGet(`${apiUrl}/pegawai/ref_data`);
      }
      const lookupRes = await httpGet(`${apiUrl}/pegawai/lookup`);

      if (refRes && refRes.code === 200 && refRes.data) {
        refData = { ...refData, ...refRes.data };
      }
      if (lookupRes && lookupRes.code === 200 && Array.isArray(lookupRes.data)) {
        lookupPegawai = lookupRes.data;
      }

      updateEvoSelectorOptions();
      populateNipDatalist();
    } catch (err) {
      console.warn('Gagal memuat master data demosi:', err);
    }
  }

  // Muat Snapshot Pegawai dan isi otomatis sisi "Dari"
  async function fetchAndApplySnapshot(nipOrId) {
    if (!nipOrId) return;
    const statusEl = document.querySelector('#form-demosi-status');
    if (statusEl) statusEl.textContent = 'Memuat snapshot pegawai...';

    try {
      const res = await httpGet(`${apiUrl}/pegawai/snapshot/${encodeURIComponent(nipOrId)}`);
      if (res && res.code === 200 && res.data) {
        const d = res.data;
        document.querySelector('#replacement_id_pegawai').value = d.ID_PEGAWAI || '';
        document.querySelector('#replacement_NIP').value = d.NIP || nipOrId;
        document.querySelector('#replacement_nama').value = d.NAMA || '';

        // Otomatis pilih nilai dropdown asal (Dari) via EvoSelector
        if (selDariBagian) selDariBagian.value = d.KD_BAGIAN || '';
        if (selDariGolongan) selDariGolongan.value = d.KD_GOLONGAN || '';
        if (selDariJabatan) selDariJabatan.value = d.KD_JABATAN || '';
        if (selDariPangkat) selDariPangkat.value = d.KD_PANGKAT || '';
        if (selDariEkselon) selDariEkselon.value = d.KD_EKSELON || '';
        if (selDariJenisPegawai) selDariJenisPegawai.value = d.KD_JENIS_PEGAWAI || '';
        if (selDariStatusPegawai) selDariStatusPegawai.value = d.KD_STATUS_PEGAWAI || '';
        if (selDariLokasi) selDariLokasi.value = d.KD_LOKASI || '';

        // Auto isi nama pimpinan bila masih kosong
        const pimpinanNamaEl = document.querySelector('#replacement_nama_pimpinan');
        if (pimpinanNamaEl && !pimpinanNamaEl.value) {
          pimpinanNamaEl.value = d.NAMA || '';
        }

        if (statusEl) statusEl.textContent = `Data pegawai [${d.NAMA}] berhasil dimuat.`;
        setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 3000);
      } else {
        if (statusEl) statusEl.textContent = 'Pegawai tidak ditemukan dalam snapshot.';
      }
    } catch (e) {
      console.warn('Gagal snapshot pegawai:', e);
      if (statusEl) statusEl.textContent = 'Gagal memuat snapshot pegawai.';
    }
  }

  // Muat Data Riwayat Demosi dari Database
  async function loadData() {
    try {
      const res = await httpGet(`${apiUrl}/pegawai/demosi`);
      if (res && res.code === 200 && Array.isArray(res.data) && res.data.length > 0) {
        allDemosi = res.data;
      } else {
        allDemosi = [];
      }
    } catch (err) {
      console.warn('Gagal mengambil data demosi:', err);
      allDemosi = [];
    }

    applyFilter();
  }

  // Filter pencarian tabel
  function applyFilter() {
    const keyword = (document.querySelector('#txtcari_demosi')?.value || '').trim().toLowerCase();
    if (!keyword) {
      filteredDemosi = [...allDemosi];
    } else {
      filteredDemosi = allDemosi.filter(row => {
        return (
          (row.NIP && row.NIP.toLowerCase().includes(keyword)) ||
          (row.NAMA_PEGAWAI && row.NAMA_PEGAWAI.toLowerCase().includes(keyword)) ||
          (row.NO_SURAT && row.NO_SURAT.toLowerCase().includes(keyword)) ||
          (row.BAGIAN_ASAL && row.BAGIAN_ASAL.toLowerCase().includes(keyword)) ||
          (row.BAGIAN_BARU && row.BAGIAN_BARU.toLowerCase().includes(keyword)) ||
          (row.JABATAN_ASAL && row.JABATAN_ASAL.toLowerCase().includes(keyword)) ||
          (row.JABATAN_BARU && row.JABATAN_BARU.toLowerCase().includes(keyword))
        );
      });
    }

    currentPage = 1;
    renderTable();
  }

  // Render Tabel Bertingkat 2 Baris
  function renderTable() {
    const tbody = document.querySelector('#tb_demosi_body');
    const badgeTotal = document.querySelector('#badge-total-demosi');
    const infoEl = document.querySelector('#demosi-pagination-info');
    if (!tbody) return;

    if (badgeTotal) badgeTotal.textContent = `${filteredDemosi.length} Data`;

    if (filteredDemosi.length === 0) {
      tbody.innerHTML = '<tr><td colspan="15" class="text-center py-4 text-muted">Belum ada data riwayat demosi</td></tr>';
      if (infoEl) infoEl.textContent = 'Menampilkan 0 data';
      renderPagination(0);
      return;
    }

    const totalPages = Math.ceil(filteredDemosi.length / rowsPerPage);
    if (currentPage > totalPages) currentPage = totalPages;

    const startIdx = (currentPage - 1) * rowsPerPage;
    const endIdx = Math.min(startIdx + rowsPerPage, filteredDemosi.length);
    const pageRows = filteredDemosi.slice(startIdx, endIdx);

    let html = '';
    pageRows.forEach((row, i) => {
      const no = startIdx + i + 1;
      const nip = row.NIP || '-';
      const nama = row.NAMA_PEGAWAI || row.NAMA || '-';
      const bagianDari = row.BAGIAN_ASAL || '-';
      const jabatanDari = row.JABATAN_ASAL || '-';
      const pangkatDari = row.PANGKAT_ASAL || '-';
      const ekselonDari = row.EKSELON_ASAL || '-';
      const noSurat = row.NO_SURAT || '-';

      const bagianMenjadi = row.BAGIAN_BARU || '-';
      const jabatanMenjadi = row.JABATAN_BARU || '-';
      const pangkatMenjadi = row.PANGKAT_BARU || '-';
      const ekselonMenjadi = row.EKSELON_BARU || '-';
      const tglDemosi = row.TGL_DEMOSI ? row.TGL_DEMOSI.substring(0, 10) : '-';
      const keterangan = row.KETERANGAN || '-';

      html += `
        <tr>
          <td class="text-center fw-semi-bold">${no}</td>
          <!-- Dari -->
          <td><span class="badge bg-soft-primary text-primary fw-medium">${nip}</span></td>
          <td class="fw-semi-bold">${nama}</td>
          <td>${bagianDari}</td>
          <td>${jabatanDari}</td>
          <td>${pangkatDari}</td>
          <td>${ekselonDari}</td>
          <td>${noSurat}</td>
          <!-- Menjadi -->
          <td class="fw-semi-bold text-warning">${bagianMenjadi}</td>
          <td>${jabatanMenjadi}</td>
          <td>${pangkatMenjadi}</td>
          <td>${ekselonMenjadi}</td>
          <td>${tglDemosi}</td>
          <td class="text-break" style="max-width: 150px;">${keterangan}</td>
          <!-- Aksi -->
          <td class="text-center">
            <div class="btn-group btn-group-sm">
              <button type="button" class="btn btn-link text-600 btn-edit-demosi p-1" data-id="${row.KD_DEMOSI_DARI || ''}" title="Edit Data">
                <i class="fas fa-edit text-warning"></i>
              </button>
              <button type="button" class="btn btn-link text-600 btn-delete-demosi p-1" data-id="${row.KD_DEMOSI_DARI || ''}" data-nama="${nama}" title="Hapus Data">
                <i class="fas fa-trash text-danger"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;

    if (infoEl) {
      infoEl.textContent = `Menampilkan ${startIdx + 1} - ${endIdx} dari ${filteredDemosi.length} data`;
    }

    renderPagination(totalPages);
    attachRowActions();
  }

  // Render Tombol Paginasi
  function renderPagination(totalPages) {
    const ul = document.querySelector('#demosi-pagination');
    if (!ul) return;
    if (totalPages <= 1) {
      ul.innerHTML = '';
      return;
    }

    let html = `
      <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
        <a class="page-link" href="javascript:void(0)" data-page="${currentPage - 1}"><i class="fas fa-chevron-left"></i></a>
      </li>
    `;

    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || (p >= currentPage - 2 && p <= currentPage + 2)) {
        html += `
          <li class="page-item ${p === currentPage ? 'active' : ''}">
            <a class="page-link" href="javascript:void(0)" data-page="${p}">${p}</a>
          </li>
        `;
      } else if (p === currentPage - 3 || p === currentPage + 3) {
        html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
      }
    }

    html += `
      <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
        <a class="page-link" href="javascript:void(0)" data-page="${currentPage + 1}"><i class="fas fa-chevron-right"></i></a>
      </li>
    `;

    ul.innerHTML = html;
    ul.querySelectorAll('a.page-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const page = parseInt(a.getAttribute('data-page'));
        if (page && page >= 1 && page <= totalPages && page !== currentPage) {
          currentPage = page;
          renderTable();
        }
      });
    });
  }

  // Event Edit & Hapus pada baris tabel
  function attachRowActions() {
    // Edit
    document.querySelectorAll('.btn-edit-demosi').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const row = allDemosi.find(r => String(r.KD_DEMOSI_DARI) === String(id));
        if (row) {
          fillFormForEdit(row);
        }
      });
    });

    // Delete
    document.querySelectorAll('.btn-delete-demosi').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const nama = btn.getAttribute('data-nama') || 'Pegawai';
        if (!id) return;

        const konfirmasi = confirm(`Apakah Anda yakin ingin menghapus data demosi untuk [${nama}]?`);
        if (!konfirmasi) return;

        try {
          const res = await httpPost(`${apiUrl}/pegawai/demosi/delete/${id}`, {});
          if (res && (res.code === 200 || res.status === 'ok')) {
            alert('Data demosi berhasil dihapus!');
            loadData();
          } else {
            alert(res?.message || 'Gagal menghapus data demosi.');
          }
        } catch (e) {
          console.error('Error delete demosi:', e);
          alert('Terjadi kesalahan saat menghapus data demosi.');
        }
      });
    });
  }

  // Simpan Formulir Demosi
  async function handleFormSubmit(e) {
    e.preventDefault();
    const btnSave = document.querySelector('#btn-save-demosi');
    const statusEl = document.querySelector('#form-demosi-status');

    const nip = document.querySelector('#replacement_NIP')?.value?.trim();
    if (!nip) {
      alert('Silakan pilih atau masukkan NIP Pegawai terlebih dahulu!');
      return;
    }

    const payload = {
      replacement_kd_demosi_dari: document.querySelector('#replacement_kd_demosi_dari')?.value || '',
      replacement_kd_demosi_menjadi: document.querySelector('#replacement_kd_demosi_menjadi')?.value || '',
      replacement_id_pegawai: document.querySelector('#replacement_id_pegawai')?.value || '',
      replacement_NIP: nip,
      replacement_nama: document.querySelector('#replacement_nama')?.value || '',
      replacement_bagian: selDariBagian?.value || '',
      replacement_golongan: selDariGolongan?.value || '',
      replacement_jabatan: selDariJabatan?.value || '',
      replacement_pangkat: selDariPangkat?.value || '',
      replacement_no_surat: document.querySelector('#replacement_no_surat')?.value || '',
      replacement_ekselon: selDariEkselon?.value || '',
      replacement_jenis_pegawai: selDariJenisPegawai?.value || '',
      replacement_tanggal_surat: document.querySelector('#replacement_tanggal_surat')?.value || '',
      replacement_status_pegawai: selDariStatusPegawai?.value || '',
      replacement_lokasi: selDariLokasi?.value || '',

      // Menjadi
      replacement_NIP_pimpinan: document.querySelector('#replacement_NIP_pimpinan')?.value || '',
      replacement_bagian_menjadi: selMenjadiBagian?.value || '',
      replacement_golongan_menjadi: selMenjadiGolongan?.value || '',
      replacement_nama_pimpinan: document.querySelector('#replacement_nama_pimpinan')?.value || '',
      replacement_jabatan_menjadi: selMenjadiJabatan?.value || '',
      replacement_pangkat_menjadi: selMenjadiPangkat?.value || '',
      replacement_tanggal_demosi: document.querySelector('#replacement_tanggal_demosi')?.value || '',
      replacement_ekselon_menjadi: selMenjadiEkselon?.value || '',
      replacement_jenis_pegawai_menjadi: selMenjadiJenisPegawai?.value || '',
      replacement_status_pegawai_menjadi: selMenjadiStatusPegawai?.value || '',
      replacement_lokasi_menjadi: selMenjadiLokasi?.value || '',
      replacement_keterangan: document.querySelector('#replacement_keterangan')?.value || ''
    };

    if (btnSave) {
      btnSave.disabled = true;
      btnSave.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Menyimpan...';
    }
    if (statusEl) statusEl.textContent = 'Menyimpan data demosi ke server...';

    try {
      const res = await httpPost(`${apiUrl}/pegawai/demosi/save`, payload);
      if (res && (res.code === 200 || res.status === 'ok')) {
        alert('Data demosi berhasil disimpan!');
        resetForm();
        await loadData();
      } else {
        alert(res?.message || 'Gagal menyimpan data demosi.');
      }
    } catch (err) {
      console.error('Error saat simpan demosi:', err);
      alert('Terjadi kesalahan koneksi saat menyimpan demosi.');
    } finally {
      if (btnSave) {
        btnSave.disabled = false;
        btnSave.innerHTML = '<i class="fas fa-save me-1"></i> Simpan';
      }
      if (statusEl) statusEl.textContent = '';
    }
  }

  // Render data di tabel modal lookup pegawai
  function renderLookupPegawaiTable(filterText = '') {

    if (!tbody) return;

    let list = lookupPegawai;
    const q = filterText.trim().toLowerCase();

      list = lookupPegawai.filter(p => {
        return (
          (p.NIP && p.NIP.toLowerCase().includes(q)) ||
          (p.NAMA && p.NAMA.toLowerCase().includes(q))
        );
      });
    }

    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-muted">Tidak ada pegawai yang sesuai.</td></tr>';
      return;

          <td class="text-center">${idx + 1}</td>

  // Binding Event Handlers Utama
  function initEvents() {
    // Submit Form
    const form = document.querySelector('#form-demosi');
    if (form) {
      form.addEventListener('submit', handleFormSubmit);
    }

    // Reset Form
    const btnReset = document.querySelector('#btn-reset-demosi');
    if (btnReset) {
      btnReset.addEventListener('click', resetForm);
    }

    // Cari NIP via manual typing / change / blur
    const nipInput = document.querySelector('#replacement_NIP');
    if (nipInput) {
      nipInput.addEventListener('change', () => {
        const val = nipInput.value.trim();
        if (val) fetchAndApplySnapshot(val);
      });
      nipInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = nipInput.value.trim();
          if (val) fetchAndApplySnapshot(val);
        }
      });
    }

    // Modal Lookup Pegawai
    const btnLookup = document.querySelector('#btn-lookup-nip');
    const modalEl = document.querySelector('#modalLookupPegawai');
    if (btnLookup && modalEl && (window.bootstrap || typeof bootstrap !== 'undefined')) {
      const bs = window.bootstrap || bootstrap;
      lookupModalInstance = new bs.Modal(modalEl);
      btnLookup.addEventListener('click', () => {
        renderLookupPegawaiTable();
        lookupModalInstance.show();
      });
    }

    const searchLookup = document.querySelector('#txtcari_lookup_pegawai');
    if (searchLookup) {
      searchLookup.addEventListener('input', () => {
        renderLookupPegawaiTable(searchLookup.value);
      });
    }

    // Toolbar Pencarian Tabel
    const searchTable = document.querySelector('#txtcari_demosi');
    const btnCari = document.querySelector('#btn-cari-demosi');
    const btnClear = document.querySelector('#btn-clear-demosi');
    const btnRefresh = document.querySelector('#btn-refresh-demosi');

    if (btnCari) btnCari.addEventListener('click', applyFilter);
    if (searchTable) {
      searchTable.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          applyFilter();
        }
      });
    }
    if (btnClear) {
      btnClear.addEventListener('click', () => {
        if (searchTable) searchTable.value = '';
        applyFilter();
      });
    }
    if (btnRefresh) {
      btnRefresh.addEventListener('click', () => {
        loadData();
      });
    }
  }

  // Export ke window & document untuk integrasi sidebar menu
  const modObj = {
    id: 'status_demosi',
    loadData: loadData,
    reload: loadData
  };
  window['status_demosi'] = modObj;
  document['status_demosi'] = modObj;
  window['vdemosi'] = modObj;
  document['vdemosi'] = modObj;
  window['status_demosi'] = modObj;
  document['status_demosi'] = modObj;

  // Eksekusi Awal Saat Komponen Dimuat
  initEvents();
  initEvoSelectors();
  await loadMasterData();
  await loadData();
</script>
