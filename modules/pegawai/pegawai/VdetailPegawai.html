<script type="module">
  import { httpGet, httpPost } from './assets/js/core/http.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url) 
    ? config.api_url 
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let currentPegawaiId = null;
  let detailData = null;
  let masterData = {};

  async function init() {
    // Ambil ID pegawai dari sessionStorage, window, atau URL query
    const urlParams = new URLSearchParams(window.location.search);
    currentPegawaiId = sessionStorage.getItem('selected_pegawai_id') 
      || window.selected_pegawai_id 
      || urlParams.get('id') 
      || '1666';

    bindHeaderEvents();
    await loadMasterDropdowns();
    await loadDetailData();
  }

  async function loadMasterDropdowns() {
    try {
      const res = await httpGet(`${apiUrl}/cPegawai/master`);
      if (res && res.code === 200 && res.data) {
        masterData = res.data;
        populateDropdowns();
      }
    } catch (err) {
      console.error('Error load master dropdowns:', err);
    }
  }

  function populateDropdowns() {
    fillSelect('edit-agama', masterData.agama, 'KD_AGAMA', 'AGAMA', 'Pilih Agama');
    fillSelect('edit-identitas', masterData.identitas, 'KD_IDENTITAS', 'IDENTITAS', 'Pilih Identitas');
    fillSelect('edit-goldar', masterData.gol_darah, 'KD_GOLONGAN_DARAH', 'GOLONGAN_DARAH', 'Pilih Golongan Darah');
    fillSelect('edit-status-nikah', masterData.perkawinan, 'KD_STATUS_PERKAWINAN', 'STATUS_PERKAWINAN', 'Pilih Status Perkawinan');
    fillSelect('edit-bagian', masterData.bagian, 'KD_BAGIAN', 'BAGIAN', 'Pilih Bagian');
    fillSelect('edit-jabatan', masterData.jabatan, 'KD_JABATAN', 'JABATAN', 'Pilih Jabatan');
    fillSelect('edit-pangkat', masterData.pangkat, 'KD_PANGKAT', 'PANGKAT', 'Pilih Pangkat');
    fillSelect('edit-status-pegawai', masterData.status_pegawai, 'KD_STATUS_PEGAWAI', 'STATUS_PEGAWAI', 'Pilih Status Pegawai');
    fillSelect('edit-jenis-pegawai', masterData.jenis_pegawai, 'KD_JENIS_PEGAWAI', 'JENIS_PEGAWAI', 'Pilih Jenis Pegawai');
    fillSelect('edit-pendidikan', masterData.jenjang_pendidikan, 'KD_JENJANG', 'JENJANG_PENDIDIKAN', 'Pilih Pendidikan');
    fillSelect('edit-provinsi', masterData.provinsi, 'KD_PROVINSI', 'PROVINSI', 'Pilih Provinsi');
  }

  function fillSelect(elId, list = [], valKey, textKey, placeholder) {
    const el = document.getElementById(elId);
    if (!el) return;
    let opts = `<option value="">-- ${placeholder} --</option>`;
    list.forEach(item => {
      opts += `<option value="${item[valKey]}">${item[textKey]}</option>`;
    });
    el.innerHTML = opts;
  }

  async function loadDetailData() {
    const loadingCard = document.getElementById('detail-loading-state');
    const mainContent = document.getElementById('detail-main-content');
    if (loadingCard) loadingCard.classList.remove('d-none');
    if (mainContent) mainContent.classList.add('d-none');

    try {
      const res = await httpGet(`${apiUrl}/cPegawai/edit_detail/${currentPegawaiId}`);
      if (res && res.code === 200 && res.data) {
        detailData = res.data;
        renderHeaderInfo(detailData.pegawai || {});
        renderProfilForm(detailData.pegawai || {});
        renderAllRiwayatTables();
        updateTabBadges();
      } else {
        alert(res?.data?.message || 'Data pegawai tidak ditemukan.');
      }
    } catch (err) {
      console.error('Error load detail pegawai:', err);
      alert('Gagal memuat detail pegawai dari server.');
    } finally {
      if (loadingCard) loadingCard.classList.add('d-none');
      if (mainContent) mainContent.classList.remove('d-none');
    }
  }

  function renderHeaderInfo(p) {
    const nama = p.NAMA || '-';
    const nip = p.NIP || '-';
    const nik = p.NO_IDENTITAS || '-';
    const bagian = p.NAMA_BAGIAN || p.BAGIAN || '-';
    const jabatan = p.NAMA_JABATAN || p.JABATAN || '-';
    const statusPeg = p.STATUS_PEGAWAI || '-';
    const pangkat = p.PANGKAT || '-';
    const tglMasuk = p.TGL_MASUK ? new Date(p.TGL_MASUK).toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' }) : '-';

    document.getElementById('header-nama').innerText = nama;
    document.getElementById('header-nip').innerText = nip;
    document.getElementById('header-nik').innerText = nik;
    document.getElementById('header-bagian').innerText = bagian;
    document.getElementById('header-jabatan').innerText = jabatan;
    const isAktif = (p.STATUS_AKTIF == 1 || p.STATUS_AKTIF === '1' || p.STATUS_AKTIF === 'Aktif' || p.STATUS_AKTIF === true);
    const headerStatus = document.getElementById('header-status');
    if (headerStatus) {
      headerStatus.innerText = isAktif ? 'Aktif' : 'Non-Aktif';
      const badgeParent = headerStatus.closest('.badge');
      if (badgeParent) {
        badgeParent.className = isAktif 
          ? 'badge bg-success-subtle text-success border border-success-subtle' 
          : 'badge bg-danger-subtle text-danger border border-danger-subtle';
      }
    }
    document.getElementById('header-pangkat').innerText = pangkat;
    document.getElementById('header-tgl-masuk').innerText = tglMasuk;

    const avatarWrap = document.getElementById('header-avatar-container');
    if (avatarWrap) {
      const avatarSrc = p.FOTO ? `./assets/user/${p.FOTO}` : null;
      if (avatarSrc) {
        avatarWrap.innerHTML = `
          <img src="${avatarSrc}" class="profile-avatar-img" alt="${nama}" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'profile-avatar-placeholder\\'>${nama.charAt(0).toUpperCase()}</div>';">
          <button type="button" class="btn btn-sm btn-primary btn-change-photo" id="btn-trigger-upload-foto" title="Ganti Foto">
            <i class="fas fa-camera"></i>
          </button>
        `;
      } else {
        avatarWrap.innerHTML = `
          <div class="profile-avatar-placeholder">${nama.charAt(0).toUpperCase()}</div>
          <button type="button" class="btn btn-sm btn-primary btn-change-photo" id="btn-trigger-upload-foto" title="Unggah Foto">
            <i class="fas fa-camera"></i>
          </button>
        `;
      }
      document.getElementById('btn-trigger-upload-foto')?.addEventListener('click', () => {
        document.getElementById('input-quick-foto')?.click();
      });
    }
  }

  function renderProfilForm(p) {
    setVal('edit-nama', p.NAMA);
    setVal('edit-gelar-depan', p.GELAR_DEPAN);
    setVal('edit-gelar-belakang', p.GELAR_BELAKANG);
    setVal('edit-nip', p.NIP);
    setVal('edit-nik', p.NO_IDENTITAS);
    setVal('edit-kk', p.NO_KK);
    setVal('edit-jk', p.JENIS_KELAMIN || 'L');
    setVal('edit-tempat-lahir', p.TEMPAT_LAHIR);
    setVal('edit-tgl-lahir', p.TANGGAL_LAHIR);
    setVal('edit-agama', p.KD_AGAMA);
    setVal('edit-goldar', p.KD_GOLONGAN_DARAH);
    setVal('edit-rhesus', p.RHESUS);
    setVal('edit-status-nikah', p.KD_STATUS_PERKAWINAN);
    setVal('edit-pendidikan', p.KD_JENJANG);

    setVal('edit-bagian', p.KD_BAGIAN);
    setVal('edit-jabatan', p.KD_JABATAN);
    setVal('edit-pangkat', p.KD_PANGKAT);
    setVal('edit-status-pegawai', p.KD_STATUS_PEGAWAI);
    setVal('edit-jenis-pegawai', p.KD_JENIS_PEGAWAI);
    setVal('edit-tgl-masuk', p.TGL_MASUK);
    setVal('edit-status-aktif', p.STATUS_AKTIF !== undefined ? String(p.STATUS_AKTIF) : '1');

    setVal('edit-hp', p.HANDPHONE);
    setVal('edit-email', p.EMAIL);
    setVal('edit-alamat', p.ALAMAT);
    setVal('edit-provinsi', p.KD_PROVINSI);
    setVal('edit-kodepos', p.KODE_POS);

    setVal('edit-bpjs-kes', p.NO_BPJS_KES);
    setVal('edit-bpjs-tk', p.NO_BPJS_TK);
    setVal('edit-npwp', p.NPWP);

    // Cascading lokasi jika ada
    if (p.KD_PROVINSI) {
      loadKabupatenOptions(p.KD_PROVINSI, p.KD_KABUPATEN);
    }
    if (p.KD_KABUPATEN) {
      loadKecamatanOptions(p.KD_KABUPATEN, p.KD_KECAMATAN);
    }
    if (p.KD_KECAMATAN) {
      loadKelurahanOptions(p.KD_KECAMATAN, p.KD_KELURAHAN);
    }
  }

  function setVal(id, val) {
    const el = document.getElementById(id);
    if (el) el.value = val !== null && val !== undefined ? val : '';
  }

  async function loadKabupatenOptions(kdProv, selected = '') {
    try {
      const res = await httpGet(`${apiUrl}/cPegawai/get_kabupaten`, { kd_provinsi: kdProv });
      if (res && res.code === 200) {
        fillSelect('edit-kabupaten', res.data || [], 'KD_KABUPATEN', 'KABUPATEN', 'Pilih Kabupaten / Kota');
        if (selected) setVal('edit-kabupaten', selected);
      }
    } catch (e) { console.error(e); }
  }

  async function loadKecamatanOptions(kdKab, selected = '') {
    try {
      const res = await httpGet(`${apiUrl}/cPegawai/get_kecamatan`, { kd_kabupaten: kdKab });
      if (res && res.code === 200) {
        fillSelect('edit-kecamatan', res.data || [], 'KD_KECAMATAN', 'KECAMATAN', 'Pilih Kecamatan');
        if (selected) setVal('edit-kecamatan', selected);
      }
    } catch (e) { console.error(e); }
  }

  async function loadKelurahanOptions(kdKec, selected = '') {
    try {
      const res = await httpGet(`${apiUrl}/cPegawai/get_kelurahan`, { kd_kecamatan: kdKec });
      if (res && res.code === 200) {
        fillSelect('edit-kelurahan', res.data || [], 'KD_KELURAHAN', 'KELURAHAN', 'Pilih Kelurahan / Desa');
        if (selected) setVal('edit-kelurahan', selected);
      }
    } catch (e) { console.error(e); }
  }

  // Update profil submit
  async function submitUpdateProfil(e) {
    if (e) e.preventDefault();
    const btn = document.getElementById('btn-simpan-update-profil');
    const oldText = btn ? btn.innerHTML : '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan Perubahan...';
    }

    const payload = {
      ID_PEGAWAI: currentPegawaiId,
      NAMA: document.getElementById('edit-nama')?.value.trim() || '',
      GELAR_DEPAN: document.getElementById('edit-gelar-depan')?.value.trim() || '',
      GELAR_BELAKANG: document.getElementById('edit-gelar-belakang')?.value.trim() || '',
      NIP: document.getElementById('edit-nip')?.value.trim() || '',
      NO_IDENTITAS: document.getElementById('edit-nik')?.value.trim() || '',
      NO_KK: document.getElementById('edit-kk')?.value.trim() || '',
      JENIS_KELAMIN: document.getElementById('edit-jk')?.value || 'L',
      TEMPAT_LAHIR: document.getElementById('edit-tempat-lahir')?.value.trim() || '',
      TANGGAL_LAHIR: document.getElementById('edit-tgl-lahir')?.value || '',
      KD_AGAMA: document.getElementById('edit-agama')?.value || '',
      KD_GOLONGAN_DARAH: document.getElementById('edit-goldar')?.value || '',
      RHESUS: document.getElementById('edit-rhesus')?.value || '',
      KD_STATUS_PERKAWINAN: document.getElementById('edit-status-nikah')?.value || '',
      KD_JENJANG: document.getElementById('edit-pendidikan')?.value || '',

      KD_BAGIAN: document.getElementById('edit-bagian')?.value || '',
      KD_JABATAN: document.getElementById('edit-jabatan')?.value || '',
      KD_PANGKAT: document.getElementById('edit-pangkat')?.value || '',
      KD_STATUS_PEGAWAI: document.getElementById('edit-status-pegawai')?.value || (currentPegawai?.KD_STATUS_PEGAWAI || ''),
      KD_JENIS_PEGAWAI: document.getElementById('edit-jenis-pegawai')?.value || '',
      TGL_MASUK: document.getElementById('edit-tgl-masuk')?.value || '',
      STATUS_AKTIF: document.getElementById('edit-status-aktif')?.value || '1',

      HANDPHONE: document.getElementById('edit-hp')?.value.trim() || '',
      EMAIL: document.getElementById('edit-email')?.value.trim() || '',
      ALAMAT: document.getElementById('edit-alamat')?.value.trim() || '',
      KD_PROVINSI: document.getElementById('edit-provinsi')?.value || '',
      KD_KABUPATEN: document.getElementById('edit-kabupaten')?.value || '',
      KD_KECAMATAN: document.getElementById('edit-kecamatan')?.value || '',
      KD_KELURAHAN: document.getElementById('edit-kelurahan')?.value || '',
      KODE_POS: document.getElementById('edit-kodepos')?.value.trim() || '',

      NO_BPJS_KES: document.getElementById('edit-bpjs-kes')?.value.trim() || '',
      NO_BPJS_TK: document.getElementById('edit-bpjs-tk')?.value.trim() || '',
      NPWP: document.getElementById('edit-npwp')?.value.trim() || ''
    };

    try {
      const res = await httpPost(`${apiUrl}/cPegawai/update_data_pegawai/${currentPegawaiId}`, payload);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = oldText;
      }

      if (res && res.code === 200) {
        alert('Data profil pegawai berhasil diperbarui!');
        loadDetailData();
      } else {
        alert(res?.data?.message || 'Gagal memperbarui profil pegawai.');
      }
    } catch (err) {
      console.error('Error update profil:', err);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = oldText;
      }
      alert('Terjadi kesalahan saat menyimpan perubahan profil.');
    }
  }

  // --- RIWAYAT TABLES RENDERING ---
  function renderAllRiwayatTables() {
    renderTableGeneric('penempatan', detailData.penempatan || [], [
      { key: 'BAGIAN', label: 'Unit / Bagian' },
      { key: 'JABATAN', label: 'Jabatan' },
      { key: 'TGL_MULAI', label: 'Mulai' },
      { key: 'TGL_SELESAI', label: 'Selesai' },
      { key: 'KETERANGAN', label: 'Keterangan' }
    ], 'KD_PENEMPATAN');

    renderTableGeneric('pendidikan', detailData.pendidikan || [], [
      { key: 'JENJANG_PENDIDIKAN', label: 'Jenjang' },
      { key: 'NAMA_SEKOLAH', label: 'Institusi / Universitas' },
      { key: 'JURUSAN', label: 'Jurusan / Prodi' },
      { key: 'TAHUN_LULUS', label: 'Tahun Lulus' },
      { key: 'NO_IJAZAH', label: 'No. Ijazah' }
    ], 'KD_PENDIDIKAN');

    renderTableGeneric('pelatihan', detailData.pelatihan || [], [
      { key: 'NAMA_PELATIHAN', label: 'Nama Pelatihan / Diklat' },
      { key: 'PENYELENGGARA', label: 'Penyelenggara' },
      { key: 'TGL_PELATIHAN', label: 'Tanggal' },
      { key: 'JUMLAH_JAM', label: 'Jam' },
      { key: 'NO_SERTIFIKAT', label: 'No. Sertifikat' }
    ], 'KD_PELATIHAN');

    renderTableGeneric('str', detailData.str || [], [
      { key: 'NO_STR', label: 'Nomor STR' },
      { key: 'TGL_TERBIT', label: 'Tgl Terbit' },
      { key: 'TGL_KADALUARSA', label: 'Berlaku Sampai' },
      { key: 'KETERANGAN', label: 'Keterangan' }
    ], 'KD_STR');

    renderTableGeneric('sip', detailData.sip || [], [
      { key: 'NO_SIP', label: 'Nomor SIP' },
      { key: 'INSTANSI_PENERBIT', label: 'Penerbit' },
      { key: 'TGL_BERLAKU', label: 'Mulai' },
      { key: 'TGL_KADALUARSA', label: 'Berlaku Sampai' }
    ], 'KD_SIP');

    renderTableGeneric('mutasi', detailData.mutasi || [], [
      { key: 'NO_SK', label: 'No. SK Mutasi' },
      { key: 'TGL_SK', label: 'Tgl SK' },
      { key: 'BAGIAN_LAMA', label: 'Dari Unit' },
      { key: 'BAGIAN_BARU', label: 'Menjadi Unit' },
      { key: 'KETERANGAN', label: 'Alasan / Keterangan' }
    ], 'KD_MUTASI_DARI');

    renderTableGeneric('promosi', detailData.promosi || [], [
      { key: 'NO_SK', label: 'No. SK Promosi' },
      { key: 'TGL_SK', label: 'Tgl SK' },
      { key: 'JABATAN_LAMA', label: 'Jabatan Lama' },
      { key: 'JABATAN_BARU', label: 'Jabatan Baru' },
      { key: 'PANGKAT_BARU', label: 'Pangkat Baru' }
    ], 'KD_PROMOSI_DARI');

    renderTableGeneric('kontrak', detailData.kontrak || [], [
      { key: 'NO_KONTRAK', label: 'Nomor Kontrak' },
      { key: 'TGL_AWAL', label: 'Mulai Kontrak' },
      { key: 'TGL_AKHIR', label: 'Akhir Kontrak' },
      { key: 'KETERANGAN', label: 'Keterangan' }
    ], 'KD_KONTRAK');

    renderTableGeneric('cuti', detailData.cuti || [], [
      { key: 'JENIS_CUTI', label: 'Jenis Cuti' },
      { key: 'TGL_MULAI', label: 'Dari' },
      { key: 'TGL_SELESAI', label: 'Sampai' },
      { key: 'JUMLAH_HARI', label: 'Hari' },
      { key: 'KETERANGAN', label: 'Alasan' }
    ], 'KD_CUTI');

    renderTableGeneric('keluarga', detailData.keluarga || [], [
      { key: 'NAMA', label: 'Nama Lengkap' },
      { key: 'HUBUNGAN', label: 'Hubungan' },
      { key: 'TEMPAT_LAHIR', label: 'Tempat Lahir' },
      { key: 'TGL_LAHIR', label: 'Tanggal Lahir' },
      { key: 'PEKERJAAN', label: 'Pekerjaan' }
    ], 'KD_KELUARGA');

    renderTableGeneric('pengalaman', detailData.pengalaman || [], [
      { key: 'PERUSAHAAN', label: 'Instansi / Perusahaan' },
      { key: 'JABATAN', label: 'Posisi / Jabatan' },
      { key: 'TGL_MASUK', label: 'Mulai' },
      { key: 'TGL_KELUAR', label: 'Selesai' },
      { key: 'DESKRIPSI', label: 'Keterangan' }
    ], 'KD_PENGALAMAN');

    renderTableGeneric('keahlian', detailData.keahlian || [], [
      { key: 'KEAHLIAN', label: 'Bidang Keahlian' },
      { key: 'TINGKAT', label: 'Tingkat Kemahiran' },
      { key: 'SERTIFIKASI', label: 'Lembaga Sertifikasi' }
    ], 'KD_KEAHLIAN');

    renderTableGeneric('kemampuan', detailData.kemampuan || [], [
      { key: 'NAMA_KEMAMPUAN', label: 'Kemampuan / Bahasa' },
      { key: 'TINGKAT_KEMAHIRAN', label: 'Kemahiran' },
      { key: 'KETERANGAN', label: 'Catatan' }
    ], 'KD_KEMAMPUAN');

    renderTableGeneric('mcu', detailData.mcu || [], [
      { key: 'TGL_MCU', label: 'Tanggal MCU' },
      { key: 'HASIL_MCU', label: 'Hasil Pemeriksaan' },
      { key: 'DOKTER_PEMERIKSA', label: 'Dokter' },
      { key: 'CATATAN', label: 'Rekomendasi Medis' }
    ], 'KD_MCU');

    renderTableGeneric('penghargaan', detailData.penghargaan || [], [
      { key: 'NAMA_PENGHARGAAN', label: 'Nama Penghargaan' },
      { key: 'PEMBERI', label: 'Pemberi Penghargaan' },
      { key: 'TAHUN', label: 'Tahun' },
      { key: 'KETERANGAN', label: 'Deskripsi' }
    ], 'KD_PENGHARGAAN');

    renderTableGeneric('sanksi', detailData.sanksi || [], [
      { key: 'JENIS_SANKSI', label: 'Tingkat Sanksi / SP' },
      { key: 'NO_SK', label: 'No. SK' },
      { key: 'TGL_SANKSI', label: 'Tanggal' },
      { key: 'PELANGGARAN', label: 'Pelanggaran' }
    ], 'KD_SANKSI');

    renderTableGeneric('phk', detailData.phk || [], [
      { key: 'JENIS_PHK', label: 'Status / Alasan PHK' },
      { key: 'NO_SK', label: 'No. SK Pensiun/PHK' },
      { key: 'TGL_PHK', label: 'Tanggal Efektif' },
      { key: 'KETERANGAN', label: 'Keterangan' }
    ], 'KD_PHK');

    // Rak Lemari Arsip
    renderTableGeneric('rak', detailData.rak || [], [
      { key: 'no_lemari', label: 'Nomor Lemari' },
      { key: 'nama_rak', label: 'Nama / Posisi Rak' }
    ], 'no_rak');

    // Buku Tanah
    renderTableGeneric('buku', detailData.buku || [], [
      { key: 'no_hak', label: 'Nomor Hak' },
      { key: 'jenis_hak', label: 'Jenis Hak' },
      { key: 'tahun', label: 'Tahun' },
      { key: 'kd_lemari', label: 'Lemari' },
      { key: 'kd_rak', label: 'Rak' }
    ], 'id_buku');
  }

  function renderTableGeneric(mode, items, columns, idKey) {
    const tbody = document.getElementById(`table-${mode}-body`);
    if (!tbody) return;

    if (!items || items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${columns.length + 2}" class="text-center py-3 text-muted small">Belum ada riwayat ${mode} tercatat.</td></tr>`;
      return;
    }

    let html = '';
    items.forEach((item, idx) => {
      const idVal = item[idKey] || item.NO_AUTO || idx;
      html += `<tr><td class="text-center text-muted small" style="width: 40px;">${idx + 1}</td>`;
      columns.forEach(col => {
        let val = item[col.key] || item[col.key.toLowerCase()] || '-';
        html += `<td class="small">${val}</td>`;
      });
      html += `
        <td class="text-end" style="width: 90px;">
          <button type="button" class="btn btn-xs btn-outline-danger btn-delete-riwayat py-0 px-2" data-mode="${mode}" data-id="${idVal}" title="Hapus Riwayat">
            <i class="fas fa-trash-alt"></i>
          </button>
        </td>
      </tr>`;
    });

    tbody.innerHTML = html;

    tbody.querySelectorAll('.btn-delete-riwayat').forEach(btn => {
      btn.addEventListener('click', () => {
        const m = btn.getAttribute('data-mode');
        const id = btn.getAttribute('data-id');
        hapusRiwayatGeneric(m, id);
      });
    });
  }

  function updateTabBadges() {
    const badgeMap = {
      'badge-count-penempatan': detailData?.penempatan?.length || 0,
      'badge-count-pendidikan': detailData?.pendidikan?.length || 0,
      'badge-count-pelatihan': detailData?.pelatihan?.length || 0,
      'badge-count-str': detailData?.str?.length || 0,
      'badge-count-sip': detailData?.sip?.length || 0,
      'badge-count-mutasi': detailData?.mutasi?.length || 0,
      'badge-count-promosi': detailData?.promosi?.length || 0,
      'badge-count-kontrak': detailData?.kontrak?.length || 0,
      'badge-count-cuti': detailData?.cuti?.length || 0,
      'badge-count-keluarga': detailData?.keluarga?.length || 0,
      'badge-count-pengalaman': detailData?.pengalaman?.length || 0,
      'badge-count-keahlian': detailData?.keahlian?.length || 0,
      'badge-count-kemampuan': detailData?.kemampuan?.length || 0,
      'badge-count-mcu': detailData?.mcu?.length || 0,
      'badge-count-penghargaan': detailData?.penghargaan?.length || 0,
      'badge-count-sanksi': detailData?.sanksi?.length || 0,
      'badge-count-phk': detailData?.phk?.length || 0,

  async function hapusRiwayatGeneric(mode, id) {
    if (!confirm(`Apakah Anda yakin ingin menghapus catatan riwayat ${mode} ini?`)) return;

    try {
      const res = await httpPost(`${apiUrl}/cPegawai/delete_data`, {
        mode: mode,
        id: id
      });
      if (res && res.code === 200) {
        loadDetailData();
      } else {
        alert(res?.data?.message || 'Gagal menghapus catatan riwayat.');
      }
    } catch (err) {
      console.error('Error delete riwayat:', err);
      alert('Terjadi kesalahan saat menghapus data.');
    }
  }

  // Bind Header Events & Navigations
  function bindHeaderEvents() {
    document.getElementById('btn-kembali-ke-direktori')?.addEventListener('click', () => {
      const sectionDetail = document.getElementById('section-detail-pegawai');
      const sectionList = document.getElementById('section-list-pegawai');
      if (sectionDetail && sectionList) {
        sectionDetail.classList.add('d-none');
        sectionList.classList.remove('d-none');
        if (window.vpegawai && typeof window.vpegawai.loadData === 'function') {
          window.vpegawai.loadData();
        }
        return;
      }
      if (typeof loadModule === 'function') {
        loadModule('modules/pegawai/pegawai/Vpegawai', '#container-isi');
      }
    });

    document.getElementById('btn-cetak-riwayat-a4')?.addEventListener('click', async () => {
      if (!currentPegawaiId) return;
      try {
        if (typeof showLoader === 'function') showLoader();
        const rs = await httpPost(`${config.api_url}/cTambahPegawai/print/${currentPegawaiId}`, { id: currentPegawaiId });
        if (typeof hideLoader === 'function') hideLoader();
        if (rs && rs.code === 200 && rs.data && rs.data.length > 0 && rs.data[0].file) {
          window.open(rs.data[0].file, '_blank');
        } else {
          const msg = (rs && rs.message) ? rs.message : 'Gagal mencetak riwayat pegawai.';
          if (typeof showDialog === 'function') {
            showDialog({ ui: 'interactive', size: 'large', type: 'warning', label: `<span class="text-danger">${msg}</span>` });
          } else if (typeof Swal !== 'undefined') {
            Swal.fire('Cetak Gagal', msg, 'warning');
          } else {
            alert(msg);
          }
        }
      } catch (err) {
        if (typeof hideLoader === 'function') hideLoader();
        console.error('Error saat mencetak riwayat:', err);
        window.open(`${config.api_url}/cTambahPegawai/print/${currentPegawaiId}`, '_blank');
      }
    });

    document.getElementById('form-edit-profil-pegawai')?.addEventListener('submit', submitUpdateProfil);

    // Quick upload foto
    document.getElementById('input-quick-foto')?.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('foto', file);
      formData.append('id_pegawai', currentPegawaiId);

      try {
        const upRes = await fetch(`${apiUrl}/cPegawai/upload_foto`, {
          method: 'POST',
          headers: { 'Authorization-Key': config.auth_key },
          body: formData
        });
        const upJson = await upRes.json();
        if (upJson && (upJson.code === 200 || upJson.status === true)) {
          alert('Foto profil berhasil diperbarui!');
          loadDetailData();
        } else {
          alert(upJson?.message || 'Gagal mengunggah foto profil.');
        }
      } catch (err) {
        console.error('Upload foto error:', err);
        alert('Terjadi kesalahan saat mengunggah foto.');
      }
    });

    // Cascading Wilayah on edit
    document.getElementById('edit-provinsi')?.addEventListener('change', (e) => {
      loadKabupatenOptions(e.target.value);
    });
    document.getElementById('edit-kabupaten')?.addEventListener('change', (e) => {
      loadKecamatanOptions(e.target.value);
    });
    document.getElementById('edit-kecamatan')?.addEventListener('change', (e) => {
      loadKelurahanOptions(e.target.value);
    });

    // Modal Ubah Password
    document.getElementById('btn-modal-ganti-pass')?.addEventListener('click', () => {
      document.getElementById('form-ganti-pass')?.reset();
      const modalEl = document.getElementById('modal-ganti-password');
      if (modalEl && window.bootstrap) {
        bootstrap.Modal.getOrCreateInstance(modalEl).show();
      }
    });

    document.getElementById('form-ganti-pass')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const passLama = document.getElementById('pass-lama')?.value;
      const passBaru = document.getElementById('pass-baru')?.value;
      const passKonf = document.getElementById('pass-konfirmasi')?.value;

      if (!passLama) {
        alert('Password lama wajib diisi!');
        return;
      }
      if (!passBaru || passBaru.length < 5) {
        alert('Password baru minimal 5 karakter!');
        return;
      }
      if (passBaru !== passKonf) {
        alert('Konfirmasi password baru tidak cocok!');
        return;
      }

      // Verifikasi password lama via cek_pass
      try {
        const cekRes = await httpPost(`${apiUrl}/cPegawai/cek_pass`, {
          id_pegawai: currentPegawaiId,
          password: passLama
        });

        if (!cekRes || cekRes.code !== 200) {
          alert('Password lama yang Anda masukkan salah!');
          return;
        }

        // Update password baru
        const upRes = await httpPost(`${apiUrl}/cPegawai/update_pass`, {
          id_pegawai: currentPegawaiId,
          password: passBaru
        });

        if (upRes && upRes.code === 200) {
          alert('Password akun pengguna berhasil diperbarui!');
          const modalEl = document.getElementById('modal-ganti-password');
          if (modalEl && window.bootstrap) {
            bootstrap.Modal.getOrCreateInstance(modalEl).hide();
          }
        } else {
          alert(upRes?.data?.message || 'Gagal mengubah password.');
        }
      } catch (err) {
        console.error('Error ganti password:', err);
        alert('Terjadi kesalahan saat memproses password.');
      }
    });

    // Modal Generic Tambah Riwayat Form
    bindModalTambahRiwayat();
  }

        case 'pelatihan':

        case 'sip':

          break;
        case 'kontrak':
          endpoint = `${apiUrl}/cPegawai/update_data_kontrak`;
          payload.NO_KONTRAK = f1; payload.TGL_AWAL = f2; payload.TGL_AKHIR = f3; payload.KETERANGAN = f4;

        case 'cuti':
          endpoint = `${apiUrl}/cPegawai/update_data_cuti`;
          payload.KD_JENIS_CUTI = f1; payload.TGL_MULAI = f2; payload.TGL_SELESAI = f3; payload.JUMLAH_HARI = f4; payload.KETERANGAN = f5;

        case 'keluarga':

          payload.NAMA = f1; payload.KD_HUBUNGAN = f2; payload.TEMPAT_LAHIR = f3; payload.TGL_LAHIR = f4; payload.PEKERJAAN = f5;
          break;
        case 'pengalaman':

        case 'keahlian':

        case 'kemampuan':

          payload.NAMA_KEMAMPUAN = f1; payload.TINGKAT_KEMAHIRAN = f2; payload.KETERANGAN = f3;

        case 'mcu':

          payload.TGL_MCU = f1; payload.HASIL_MCU = f2; payload.DOKTER_PEMERIKSA = f3; payload.CATATAN = f4;
          break;
        case 'penghargaan':
          endpoint = `${apiUrl}/cPegawai/update_data_penghargaan`;
          payload.NAMA_PENGHARGAAN = f1; payload.PEMBERI = f2; payload.TAHUN = f3; payload.KETERANGAN = f4;
          break;
        case 'sanksi':
          endpoint = `${apiUrl}/cPegawai/update_data_sanksi`;
          payload.KD_JENIS_SANKSI = f1; payload.NO_SK = f2; payload.TGL_SANKSI = f3; payload.PELANGGARAN = f4;
          break;
        case 'phk':
          endpoint = `${apiUrl}/cPegawai/update_data_phk`;
          payload.KD_JENIS_PHK = f1; payload.NO_SK = f2; payload.TGL_PHK = f3; payload.KETERANGAN = f4;
          break;
        case 'rak':

          payload.no_lemari = f1; payload.nama_rak = f2;

    const el = document.getElementById(id);
    if (el) el.innerText = text;

  // Global namespace hooks
  window.vdetailpegawai = {
    init,
    loadDetailData
  };
  document.vdetailpegawai = window.vdetailpegawai;

  // Run initialization
  init();
</script>
