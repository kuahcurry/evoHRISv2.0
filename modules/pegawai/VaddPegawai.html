<script type="module">
  import { httpGet, httpPost } from './assets/js/core/http.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url) 
    ? config.api_url 
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let master = {};
  let masterDataCache = null;
  let selectedFotoFile = null;

  async function initMasterData() {
    try {
      const res = await httpGet(`${apiUrl}/cPegawai/master`);
      if (res && res.code === 200 && res.data) {
        master = res.data;
        masterDataCache = res.data;

        // Data Pribadi & Identitas
        fillDropdown('add-agama', master.agama, 'KD_AGAMA', 'AGAMA', 'Pilih Agama');
        fillDropdown('add-identitas', master.identitas, 'KD_IDENTITAS', 'IDENTITAS', 'Pilih Jenis Identitas');
        fillDropdown('add-goldar', master.golda, 'KD_GOLDA', 'GOLONGAN_DARAH', 'Pilih Golongan Darah');
        fillDropdown('add-status-nikah', master.status_perkawinan, 'KD_STATUS_PERKAWINAN', 'STATUS_PERKAWINAN', 'Pilih Status Pernikahan');

        // Domisili
        fillDropdown('add-provinsi', master.provinsi, 'KD_PROVINSI', 'PROVINSI', 'Pilih Provinsi');

        // Penempatan
        fillDropdown('add-bagian', master.bagian, 'KD_BAGIAN', 'BAGIAN', 'Pilih Bagian / Unit Kerja');
        fillDropdown('add-jabatan', master.jabatan, 'KD_JABATAN', 'JABATAN', 'Pilih Jabatan');
        fillDropdown('add-pangkat', master.pangkat, 'KD_PANGKAT', 'PANGKAT', 'Pilih Pangkat');
        fillDropdown('add-golongan', master.golongan, 'KD_GOLONGAN', 'GOLONGAN', 'Pilih Golongan');
        fillDropdown('add-eselon', master.ekselon, 'KD_EKSELON', 'EKSELON', 'Pilih Eselon');
        fillDropdown('add-status-pegawai', master.status_pegawai, 'KD_STATUS_PEGAWAI', 'STATUS_PEGAWAI', 'Pilih Status Pegawai');
        fillDropdown('add-jenis-pegawai', master.jenis_pegawai, 'KD_JENIS_PEGAWAI', 'JENIS_PEGAWAI', 'Pilih Jenis Pegawai');
        fillDropdown('add-lokasi', master.lokasi, 'KD_LOKASI', 'LOKASI', 'Pilih Lokasi Kerja');

        // Pendidikan
        fillDropdown('add-jenjang-pendidikan', master.jenjang_pendidikan, 'KD_JENJANG', 'JENJANG_PENDIDIKAN', 'Pilih Jenjang');
        fillDropdown('add-jenis-pendidikan', master.jenis_pendidikan, 'KD_JENIS_PENDIDIKAN', 'JENIS_PENDIDIKAN', 'Pilih Jenis Pendidikan');
        fillDropdown('add-status-lulus', master.status_lulus, 'KD_STATUS_LULUS', 'STATUS_LULUS', 'Pilih Status Lulus');

        // Keahlian & Pengalaman (Dynamic rows)
        populateDynamicRowsDropdowns();

        // Keluarga
        fillDropdown('add-keluarga-hubungan', master.hubungan, 'KD_HUBUNGAN', 'HUBUNGAN', 'Pilih Hubungan');
        fillDropdown('add-keluarga-pekerjaan', master.pekerjaan, 'KD_PEKERJAAN', 'PEKERJAAN', 'Pilih Pekerjaan');
        fillDropdown('add-keluarga-pendidikan', master.jenjang_pendidikan, 'KD_JENJANG', 'JENJANG_PENDIDIKAN', 'Pilih Pendidikan');
        fillDropdown('add-keluarga-goldar', master.golda, 'KD_GOLDA', 'GOLONGAN_DARAH', 'Pilih Golongan Darah');
        fillDropdown('add-keluarga-status-asuransi', master.status_asuransi, 'KD_STATUS_ASURANSI', 'STATUS_ASURANSI', 'Pilih Status Asuransi');
        fillDropdown('add-keluarga-nama-asuransi', master.nama_asuransi, 'KD_ASURANSI', 'NAMA_ASURANSI', 'Pilih Asuransi');
      }

      // Load Jurusan
      const resJurusan = await httpGet(`${apiUrl}/cPegawai/get_jurusan`);
      if (resJurusan && (resJurusan.code === 200 || Array.isArray(resJurusan.data))) {
        const jurusanList = Array.isArray(resJurusan.data) ? resJurusan.data : (resJurusan.data?.data || []);
        fillDropdown('add-jurusan', jurusanList, 'KD_JURUSAN', 'JURUSAN', 'Pilih Jurusan');
      }
    } catch (err) {
      console.error('Error in initMasterData:', err);
    }
  }

  function fillDropdown(elementOrId, items, valKey, textKey, defaultText = 'Pilih...') {
    const el = (typeof elementOrId === 'string') ? document.getElementById(elementOrId) : elementOrId;
    if (!el || !items || !Array.isArray(items)) return;

    el.innerHTML = `<option value="">${defaultText}</option>`;
    items.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item[valKey] || '';
      opt.textContent = item[textKey] || item['NAMA_' + valKey] || item[valKey];
      el.appendChild(opt);
    });
  }

  function bindWilayahEvents() {
    // Domisili Wilayah
    const provEl = document.getElementById('add-provinsi');
    const kabEl = document.getElementById('add-kabupaten');
    const kecEl = document.getElementById('add-kecamatan');
    const kelEl = document.getElementById('add-kelurahan');

    provEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (kabEl) kabEl.innerHTML = '<option value="">Pilih Kabupaten</option>';
        if (kecEl) kecEl.innerHTML = '<option value="">Pilih Kecamatan</option>';
        if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kabupaten?kd_provinsi=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-kabupaten', list, 'KD_KABUPATEN', 'KABUPATEN', 'Pilih Kabupaten');
      } catch (err) {
        console.error('Error loading kabupaten:', err);
      }
    });

    kabEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (kecEl) kecEl.innerHTML = '<option value="">Pilih Kecamatan</option>';
        if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kecamatan?kd_kabupaten=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-kecamatan', list, 'KD_KECAMATAN', 'KECAMATAN', 'Pilih Kecamatan');
      } catch (err) {
        console.error('Error loading kecamatan:', err);
      }
    });

    kecEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kelurahan?kd_kecamatan=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-kelurahan', list, 'KD_KELURAHAN', 'KELURAHAN', 'Pilih Kelurahan');
      } catch (err) {
        console.error('Error loading kelurahan:', err);
      }
    });

    // Bagian & Sub Bagian
    const bagianEl = document.getElementById('add-bagian');
    const subBagianEl = document.getElementById('add-sub-bagian');
    bagianEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (subBagianEl) subBagianEl.innerHTML = '<option value="">Pilih Sub Bagian</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_sub_bagian?kd_bagian=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-sub-bagian', list, 'KD_SUB_BAGIAN', 'SUB_BAGIAN', 'Pilih Sub Bagian');
      } catch (err) {
        console.error('Error loading sub bagian:', err);
      }
    });
  }

  // ==========================================
  // PENGALAMAN PEKERJAAN DINAMIS (MULTI-ROW)
  // ==========================================
  function tambahBarisPengalaman(initialData = {}) {
    const container = document.getElementById('container-pengalaman-list');
    if (!container) return;

    const emptyNotice = container.querySelector('.empty-pengalaman-notice');
    if (emptyNotice) emptyNotice.remove();

    const currentCount = container.querySelectorAll('.item-pengalaman').length;
    const itemIndex = currentCount + 1;

    const itemEl = document.createElement('div');
    itemEl.className = 'item-pengalaman border rounded p-3 bg-light-subtle shadow-sm mb-2';
    itemEl.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-primary text-white fw-bold item-pengalaman-number">Pengalaman #${itemIndex}</span>
          <span class="small text-muted fst-italic item-pengalaman-preview-title"></span>
        </div>
        <button type="button" class="btn btn-outline-danger btn-sm py-0 px-2 btn-hapus-pengalaman" title="Hapus baris pengalaman ini">
          <i class="fas fa-trash-alt me-1"></i> Hapus
        </button>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Nama Perusahaan / Instansi</label>
          <input type="text" class="form-control form-control-sm field-pengalaman-perusahaan" placeholder="Contoh: PT. Maju Bersama">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Alamat Perusahaan</label>
          <input type="text" class="form-control form-control-sm field-pengalaman-alamat" placeholder="Alamat lengkap instansi">
        </div>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Provinsi</label>
          <select class="form-select form-select-sm field-pengalaman-provinsi">
            <option value="">Pilih Provinsi Perusahaan</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Kabupaten / Kota</label>
          <select class="form-select form-select-sm field-pengalaman-kabupaten">
            <option value="">Pilih Kabupaten</option>
          </select>
        </div>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Kecamatan</label>
          <select class="form-select form-select-sm field-pengalaman-kecamatan">
            <option value="">Pilih Kecamatan</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Kelurahan / Desa</label>
          <select class="form-select form-select-sm field-pengalaman-kelurahan">
            <option value="">Pilih Kelurahan</option>
          </select>
        </div>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Periode Mulai</label>
          <input type="date" class="form-control form-control-sm field-pengalaman-mulai">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Periode Selesai</label>
          <input type="date" class="form-control form-control-sm field-pengalaman-selesai">
        </div>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Jabatan Terakhir</label>
          <select class="form-select form-select-sm field-pengalaman-jabatan">
            <option value="">Pilih Jabatan</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Jenis Pengalaman</label>
          <select class="form-select form-select-sm field-pengalaman-jenis">
            <option value="">Pilih Jenis Pengalaman</option>
          </select>
        </div>
      </div>

      <div class="row g-2">
        <div class="col-md-12">
          <label class="form-label small fw-semibold text-muted mb-1">Upload File SK / Bukti Pengalaman</label>
          <input type="file" class="form-control form-control-sm field-pengalaman-sk" accept=".pdf,.jpg,.jpeg,.png">
        </div>
      </div>
    `;

    container.appendChild(itemEl);

    // Isi dropdown jika master cache sudah ada
    if (masterDataCache) {
      fillDropdown(itemEl.querySelector('.field-pengalaman-provinsi'), masterDataCache.provinsi, 'KD_PROVINSI', 'PROVINSI', 'Pilih Provinsi Perusahaan');
      fillDropdown(itemEl.querySelector('.field-pengalaman-jabatan'), masterDataCache.jabatan, 'KD_JABATAN', 'JABATAN', 'Pilih Jabatan');
      fillDropdown(itemEl.querySelector('.field-pengalaman-jenis'), masterDataCache.jenis_pengalaman, 'KD_JENIS_PENGALAMAN', 'JENIS_PENGALAMAN', 'Pilih Jenis Pengalaman');
    }

    // Cascade wilayah khusus item ini
    setupWilayahCascadePengalaman(itemEl);

    // Live preview judul nama perusahaan
    const namaInput = itemEl.querySelector('.field-pengalaman-perusahaan');
    const previewSpan = itemEl.querySelector('.item-pengalaman-preview-title');
    namaInput?.addEventListener('input', () => {
      previewSpan.textContent = namaInput.value.trim() ? `- ${namaInput.value.trim()}` : '';
    });

    // Event tombol hapus baris
    itemEl.querySelector('.btn-hapus-pengalaman')?.addEventListener('click', () => {
      hapusBarisPengalaman(itemEl);
    });

    // Populate initial data jika ada
    if (initialData.nama_perusahaan) itemEl.querySelector('.field-pengalaman-perusahaan').value = initialData.nama_perusahaan;
    if (initialData.alamat) itemEl.querySelector('.field-pengalaman-alamat').value = initialData.alamat;

    updatePengalamanNumbers();
    return itemEl;
  }

  function hapusBarisPengalaman(itemEl) {
    const container = document.getElementById('container-pengalaman-list');
    if (!container || !itemEl) return;
    itemEl.remove();
    updatePengalamanNumbers();

    if (container.querySelectorAll('.item-pengalaman').length === 0) {
      container.innerHTML = `
        <div class="text-center py-3 text-muted empty-pengalaman-notice border border-dashed rounded">
          <p class="mb-2 small">Belum ada riwayat pengalaman pekerjaan.</p>
          <button type="button" class="btn btn-sm btn-outline-primary" onclick="window.vaddpegawai && window.vaddpegawai.tambahPengalaman ? window.vaddpegawai.tambahPengalaman() : null">
            <i class="fas fa-plus me-1"></i> Tambah Pengalaman
          </button>
        </div>
      `;
    }
  }

  function updatePengalamanNumbers() {
    const container = document.getElementById('container-pengalaman-list');
    if (!container) return;
    const items = container.querySelectorAll('.item-pengalaman');
    items.forEach((item, index) => {
      const badge = item.querySelector('.item-pengalaman-number');
      if (badge) badge.textContent = `Pengalaman #${index + 1}`;
    });
  }

  function setupWilayahCascadePengalaman(itemEl) {
    const provEl = itemEl.querySelector('.field-pengalaman-provinsi');
    const kabEl = itemEl.querySelector('.field-pengalaman-kabupaten');
    const kecEl = itemEl.querySelector('.field-pengalaman-kecamatan');
    const kelEl = itemEl.querySelector('.field-pengalaman-kelurahan');

    provEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (kabEl) kabEl.innerHTML = '<option value="">Pilih Kabupaten</option>';
        if (kecEl) kecEl.innerHTML = '<option value="">Pilih Kecamatan</option>';
        if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kabupaten?kd_provinsi=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown(kabEl, list, 'KD_KABUPATEN', 'KABUPATEN', 'Pilih Kabupaten');
      } catch (err) {
        console.error('Error loading pengalaman kabupaten:', err);
      }
    });

    kabEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (kecEl) kecEl.innerHTML = '<option value="">Pilih Kecamatan</option>';
        if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kecamatan?kd_kabupaten=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown(kecEl, list, 'KD_KECAMATAN', 'KECAMATAN', 'Pilih Kecamatan');
      } catch (err) {
        console.error('Error loading pengalaman kecamatan:', err);
      }
    });

    kecEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kelurahan?kd_kecamatan=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown(kelEl, list, 'KD_KELURAHAN', 'KELURAHAN', 'Pilih Kelurahan');
      } catch (err) {
        console.error('Error loading pengalaman kelurahan:', err);
      }
    });
  }

  // ==========================================
  // STATUS KEAHLIAN DINAMIS (MULTI-ROW)
  // ==========================================
  function tambahBarisKeahlian(initialData = {}) {
    const container = document.getElementById('container-keahlian-list');
    if (!container) return;

    const emptyNotice = container.querySelector('.empty-keahlian-notice');
    if (emptyNotice) emptyNotice.remove();

    const currentCount = container.querySelectorAll('.item-keahlian').length;
    const itemIndex = currentCount + 1;

    const itemEl = document.createElement('div');
    itemEl.className = 'item-keahlian border rounded p-3 bg-light-subtle shadow-sm mb-2';
    itemEl.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-primary text-white fw-bold item-keahlian-number">Keahlian #${itemIndex}</span>
          <span class="small text-muted fst-italic item-keahlian-preview-title"></span>
        </div>
        <button type="button" class="btn btn-outline-danger btn-sm py-0 px-2 btn-hapus-keahlian" title="Hapus baris keahlian ini">
          <i class="fas fa-trash-alt me-1"></i> Hapus
        </button>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Nama Keahlian / Kompetensi</label>
          <input type="text" class="form-control form-control-sm field-keahlian-nama" placeholder="Contoh: K3, First Responder, PLC, dll.">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Status Keahlian</label>
          <select class="form-select form-select-sm field-keahlian-status">
            <option value="">Pilih Status Keahlian</option>
          </select>
        </div>
      </div>

      <div class="row g-2">
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Keterangan</label>
          <input type="text" class="form-control form-control-sm field-keahlian-keterangan" placeholder="Keterangan singkat / sertifikasi">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-muted mb-1">Upload Bukti / Sertifikat Keahlian</label>
          <input type="file" class="form-control form-control-sm field-keahlian-upload" accept=".pdf,.jpg,.jpeg,.png">
        </div>
      </div>
    `;

    container.appendChild(itemEl);

    // Isi dropdown status jika master cache sudah ada
    if (masterDataCache) {
      fillDropdown(itemEl.querySelector('.field-keahlian-status'), masterDataCache.status_keahlian, 'KD_STATUS_KEAHLIAN', 'STATUS_KEAHLIAN', 'Pilih Status Keahlian');
    }

    // Live preview judul nama keahlian
    const namaInput = itemEl.querySelector('.field-keahlian-nama');
    const previewSpan = itemEl.querySelector('.item-keahlian-preview-title');
    namaInput?.addEventListener('input', () => {
      previewSpan.textContent = namaInput.value.trim() ? `- ${namaInput.value.trim()}` : '';
    });

    // Event tombol hapus baris
    itemEl.querySelector('.btn-hapus-keahlian')?.addEventListener('click', () => {
      hapusBarisKeahlian(itemEl);
    });

    // Populate initial data jika ada
    if (initialData.nama_keahlian) itemEl.querySelector('.field-keahlian-nama').value = initialData.nama_keahlian;
    if (initialData.keterangan) itemEl.querySelector('.field-keahlian-keterangan').value = initialData.keterangan;

    updateKeahlianNumbers();
    return itemEl;
  }

  function hapusBarisKeahlian(itemEl) {
    const container = document.getElementById('container-keahlian-list');
    if (!container || !itemEl) return;
    itemEl.remove();
    updateKeahlianNumbers();

    if (container.querySelectorAll('.item-keahlian').length === 0) {
      container.innerHTML = `
        <div class="text-center py-3 text-muted empty-keahlian-notice border border-dashed rounded">
          <p class="mb-2 small">Belum ada data status keahlian.</p>
          <button type="button" class="btn btn-sm btn-outline-primary" onclick="window.vaddpegawai && window.vaddpegawai.tambahKeahlian ? window.vaddpegawai.tambahKeahlian() : null">
            <i class="fas fa-plus me-1"></i> Tambah Keahlian
          </button>
        </div>
      `;
    }
  }

  function updateKeahlianNumbers() {
    const container = document.getElementById('container-keahlian-list');
    if (!container) return;
    const items = container.querySelectorAll('.item-keahlian');
    items.forEach((item, index) => {
      const badge = item.querySelector('.item-keahlian-number');
      if (badge) badge.textContent = `Keahlian #${index + 1}`;
    });
  }

  function populateDynamicRowsDropdowns() {
    if (!masterDataCache) return;
    const contPeng = document.getElementById('container-pengalaman-list');
    if (contPeng) {
      contPeng.querySelectorAll('.item-pengalaman').forEach(itemEl => {
        const provEl = itemEl.querySelector('.field-pengalaman-provinsi');
        if (provEl && provEl.options.length <= 1) {
          fillDropdown(provEl, masterDataCache.provinsi, 'KD_PROVINSI', 'PROVINSI', 'Pilih Provinsi Perusahaan');
        }
        const jabEl = itemEl.querySelector('.field-pengalaman-jabatan');
        if (jabEl && jabEl.options.length <= 1) {
          fillDropdown(jabEl, masterDataCache.jabatan, 'KD_JABATAN', 'JABATAN', 'Pilih Jabatan');
        }
        const jenisEl = itemEl.querySelector('.field-pengalaman-jenis');
        if (jenisEl && jenisEl.options.length <= 1) {
          fillDropdown(jenisEl, masterDataCache.jenis_pengalaman, 'KD_JENIS_PENGALAMAN', 'JENIS_PENGALAMAN', 'Pilih Jenis Pengalaman');
        }
      });
    }

    const contKhl = document.getElementById('container-keahlian-list');
    if (contKhl) {
      contKhl.querySelectorAll('.item-keahlian').forEach(itemEl => {
        const statusEl = itemEl.querySelector('.field-keahlian-status');
        if (statusEl && statusEl.options.length <= 1) {
          fillDropdown(statusEl, masterDataCache.status_keahlian, 'KD_STATUS_KEAHLIAN', 'STATUS_KEAHLIAN', 'Pilih Status Keahlian');
        }
      });
    }
  }

  function bindFotoPreview() {
    const box = document.getElementById('box-foto-profil');
    const input = document.getElementById('input-file-foto');
    const preview = document.getElementById('img-preview-foto');
    const placeholder = document.getElementById('placeholder-icon-foto');

    box?.addEventListener('click', () => {
      input?.click();
    });

    input?.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) {
        selectedFotoFile = file;
        const reader = new FileReader();
        reader.onload = (re) => {
          if (preview) {
            preview.src = re.target.result;
            preview.classList.remove('d-none');
          }
          if (placeholder) {
            placeholder.classList.add('d-none');
          }
        };
        reader.readAsDataURL(file);
      }
    });
  }

  async function submitFormPegawai(e) {
    if (e) e.preventDefault();

    const nip = document.getElementById('add-nip')?.value.trim();
    const nama = document.getElementById('add-nama')?.value.trim();

    if (!nip || !nama) {
      if (typeof Swal !== 'undefined') {
        Swal.fire('Validasi Gagal', 'NIP dan Nama Lengkap Pegawai wajib diisi!', 'warning');
      } else {
        alert('NIP dan Nama Lengkap Pegawai wajib diisi!');
      }
      return;
    }

    const btnSimpan = document.getElementById('btn-simpan-add-pegawai');
    const oldBtnText = btnSimpan ? btnSimpan.innerHTML : '';
    if (btnSimpan) {
      btnSimpan.disabled = true;
      btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Menyimpan...';
    }

    const formData = new FormData();

    // 1. Foto Profil
    if (selectedFotoFile) {
      formData.append('foto', selectedFotoFile);
    } else {
      const fotoInput = document.getElementById('input-file-foto');
      if (fotoInput && fotoInput.files && fotoInput.files[0]) {
        formData.append('foto', fotoInput.files[0]);
      }
    }

    // 2. Data Pribadi
    formData.append('nip', nip);
    formData.append('nama', nama);
    formData.append('gelar_depan', document.getElementById('add-gelar-depan')?.value.trim() || '');
    formData.append('gelar_belakang', document.getElementById('add-gelar-belakang')?.value.trim() || '');
    formData.append('no_identitas', document.getElementById('add-nik')?.value.trim() || '');
    formData.append('kd_identitas', document.getElementById('add-identitas')?.value || '1');
    formData.append('no_kk', document.getElementById('add-kk')?.value.trim() || '');
    formData.append('jenis_kelamin', document.getElementById('add-jk')?.value || '1');
    formData.append('tempat_lahir', document.getElementById('add-tempat-lahir')?.value.trim() || '');
    formData.append('tgl_lahir', document.getElementById('add-tgl-lahir')?.value || '');
    formData.append('kd_agama', document.getElementById('add-agama')?.value || '1');
    formData.append('kd_golda', document.getElementById('add-goldar')?.value || '1');
    formData.append('rhesus', document.getElementById('add-rhesus')?.value || '+');
    formData.append('kd_status_perkawinan', document.getElementById('add-status-nikah')?.value || '1');

    // 3. Kontak & Domisili
    formData.append('handphone', document.getElementById('add-hp')?.value.trim() || '');
    formData.append('email', document.getElementById('add-email')?.value.trim() || '');
    formData.append('alamat', document.getElementById('add-alamat')?.value.trim() || '');
    formData.append('kd_provinsi', document.getElementById('add-provinsi')?.value || '');
    formData.append('kd_kabupaten', document.getElementById('add-kabupaten')?.value || '');
    formData.append('kd_kecamatan', document.getElementById('add-kecamatan')?.value || '');
    formData.append('kd_kelurahan', document.getElementById('add-kelurahan')?.value || '');
    formData.append('kodepos', document.getElementById('add-kodepos')?.value.trim() || '');
    formData.append('npwp', document.getElementById('add-npwp')?.value.trim() || '');
    formData.append('bpjs_kes', document.getElementById('add-bpjs-kes')?.value.trim() || '');
    formData.append('bpjs_tk', document.getElementById('add-bpjs-tk')?.value.trim() || '');

    // 4. Penempatan
    formData.append('kd_bagian', document.getElementById('add-bagian')?.value || '');
    formData.append('kd_subbagian', document.getElementById('add-sub-bagian')?.value || '');
    formData.append('kd_jabatan', document.getElementById('add-jabatan')?.value || '');
    formData.append('kd_pangkat', document.getElementById('add-pangkat')?.value || '');
    formData.append('kd_golongan', document.getElementById('add-golongan')?.value || '');
    formData.append('kd_eselon', document.getElementById('add-eselon')?.value || '');
    formData.append('kd_status_pegawai', document.getElementById('add-status-pegawai')?.value || '');
    formData.append('kd_jenis_pegawai', document.getElementById('add-jenis-pegawai')?.value || '');
    formData.append('kd_lokasi', document.getElementById('add-lokasi')?.value || '');
    formData.append('jenis_penempatan', document.getElementById('add-jenis-penempatan')?.value || 'Tetap');
    formData.append('tgl_masuk', document.getElementById('add-tgl-masuk')?.value || '');
    const fileSk = document.getElementById('add-file-sk')?.files?.[0];
    if (fileSk) formData.append('file_penempatan', fileSk);

    // 5. Pendidikan
    formData.append('nama_lembaga', document.getElementById('add-pendidikan')?.value.trim() || '');
    formData.append('kd_jenjang', document.getElementById('add-jenjang-pendidikan')?.value || '');
    formData.append('kd_jenis_pendidikan', document.getElementById('add-jenis-pendidikan')?.value || '');
    formData.append('kd_status_lulus', document.getElementById('add-status-lulus')?.value || '');
    formData.append('kd_jurusan', document.getElementById('add-jurusan')?.value || '');
    formData.append('ipk', document.getElementById('add-ipk')?.value.trim() || '');
    formData.append('periode_mulai', document.getElementById('add-pendidikan-mulai')?.value || '');
    formData.append('periode_sampai', document.getElementById('add-pendidikan-sampai')?.value || '');
    formData.append('alamat_lembaga', document.getElementById('add-alamat-lembaga')?.value.trim() || '');
    formData.append('nama_pejabat', document.getElementById('add-nama-pejabat')?.value.trim() || '');
    formData.append('no_ijazah', document.getElementById('add-no-ijazah')?.value.trim() || '');
    const filePdk = document.getElementById('add-pendidikan-upload')?.files?.[0];
    if (filePdk) formData.append('file_pendidikan', filePdk);

    // 6. Pengalaman Kerja (Multi-Entry / Repeater)
    const listPengalaman = [];
    const itemPengEls = document.querySelectorAll('#container-pengalaman-list .item-pengalaman');
    itemPengEls.forEach((el, idx) => {
      const perusahaan = el.querySelector('.field-pengalaman-perusahaan')?.value.trim() || '';
      const alamat = el.querySelector('.field-pengalaman-alamat')?.value.trim() || '';
      const kdProv = el.querySelector('.field-pengalaman-provinsi')?.value || '';
      const kdKab = el.querySelector('.field-pengalaman-kabupaten')?.value || '';
      const kdKec = el.querySelector('.field-pengalaman-kecamatan')?.value || '';
      const kdKel = el.querySelector('.field-pengalaman-kelurahan')?.value || '';
      const mulai = el.querySelector('.field-pengalaman-mulai')?.value || '';
      const selesai = el.querySelector('.field-pengalaman-selesai')?.value || '';
      const kdJab = el.querySelector('.field-pengalaman-jabatan')?.value || '';
      const jabSelect = el.querySelector('.field-pengalaman-jabatan');
      const namaJab = (jabSelect && jabSelect.selectedIndex > 0) ? jabSelect.options[jabSelect.selectedIndex].text : '';
      const kdJenis = el.querySelector('.field-pengalaman-jenis')?.value || '';
      const fileInput = el.querySelector('.field-pengalaman-sk');
      const fileSk = fileInput?.files?.[0];

      if (perusahaan || fileSk || kdJab) {
        listPengalaman.push({
          nama_perusahaan: perusahaan,
          alamat: alamat,
          kd_provinsi: kdProv,
          kd_kabupaten: kdKab,
          kd_kecamatan: kdKec,
          kd_kelurahan: kdKel,
          periode_mulai: mulai,
          periode_selesai: selesai,
          kd_jabatan: kdJab,
          jabatan: namaJab,
          kd_jenis_pengalaman: kdJenis
        });

        if (fileSk) {
          formData.append(`file_pengalaman_${listPengalaman.length - 1}`, fileSk);
        }
      }
    });

    formData.append('pengalaman_list', JSON.stringify(listPengalaman));
    if (listPengalaman.length > 0) {
      formData.append('nama_perusahaan', listPengalaman[0].nama_perusahaan);
      formData.append('pengalaman_alamat', listPengalaman[0].alamat);
      formData.append('pengalaman_provinsi', listPengalaman[0].kd_provinsi);
      formData.append('pengalaman_kabupaten', listPengalaman[0].kd_kabupaten);
      formData.append('pengalaman_kecamatan', listPengalaman[0].kd_kecamatan);
      formData.append('pengalaman_kelurahan', listPengalaman[0].kd_kelurahan);
      formData.append('pengalaman_periode_mulai', listPengalaman[0].periode_mulai);
      formData.append('pengalaman_periode_selesai', listPengalaman[0].periode_selesai);
      formData.append('pengalaman_jabatan', listPengalaman[0].kd_jabatan);
      formData.append('pengalaman_nama_jabatan', listPengalaman[0].jabatan);
      formData.append('pengalaman_jenis', listPengalaman[0].kd_jenis_pengalaman);
      const firstFile = itemPengEls[0]?.querySelector('.field-pengalaman-sk')?.files?.[0];
      if (firstFile) formData.append('file_pengalaman', firstFile);
    }

    // 7. Keahlian (Multi-Entry / Repeater)
    const listKeahlian = [];
    const itemKhlEls = document.querySelectorAll('#container-keahlian-list .item-keahlian');
    itemKhlEls.forEach((el, idx) => {
      const namaKhl = el.querySelector('.field-keahlian-nama')?.value.trim() || '';
      const kdStatus = el.querySelector('.field-keahlian-status')?.value || '1';
      const ket = el.querySelector('.field-keahlian-keterangan')?.value.trim() || '';
      const fileInput = el.querySelector('.field-keahlian-upload');
      const fileKhl = fileInput?.files?.[0];

      if (namaKhl || fileKhl) {
        listKeahlian.push({
          nama_keahlian: namaKhl,
          kd_status_keahlian: kdStatus,
          keterangan: ket
        });

        if (fileKhl) {
          formData.append(`file_keahlian_${listKeahlian.length - 1}`, fileKhl);
        }
      }
    });

    formData.append('keahlian_list', JSON.stringify(listKeahlian));
    if (listKeahlian.length > 0) {
      formData.append('nama_keahlian', listKeahlian[0].nama_keahlian);
      formData.append('keahlian_status', listKeahlian[0].kd_status_keahlian);
      formData.append('keahlian_keterangan', listKeahlian[0].keterangan);
      const firstFile = itemKhlEls[0]?.querySelector('.field-keahlian-upload')?.files?.[0];
      if (firstFile) formData.append('file_keahlian', firstFile);
    }

    // 8. Keluarga
    formData.append('nama_keluarga', document.getElementById('add-keluarga-nama')?.value.trim() || '');
    formData.append('keluarga_hubungan', document.getElementById('add-keluarga-hubungan')?.value || '1');
    formData.append('keluarga_tempat_lahir', document.getElementById('add-keluarga-tempat-lahir')?.value.trim() || '');
    formData.append('keluarga_tgl_lahir', document.getElementById('add-keluarga-tgl-lahir')?.value || '');
    formData.append('keluarga_jk', document.getElementById('add-keluarga-jk')?.value || '1');
    formData.append('keluarga_pekerjaan', document.getElementById('add-keluarga-pekerjaan')?.value || '1');
    formData.append('keluarga_pendidikan', document.getElementById('add-keluarga-pendidikan')?.value || '1');
    formData.append('keluarga_goldar', document.getElementById('add-keluarga-goldar')?.value || '1');
    formData.append('keluarga_status_asuransi', document.getElementById('add-keluarga-status-asuransi')?.value || '1');
    formData.append('keluarga_nama_asuransi', document.getElementById('add-keluarga-nama-asuransi')?.value || '1');
    const fileKel = document.getElementById('add-keluarga-upload')?.files?.[0];
    if (fileKel) formData.append('file_keluarga', fileKel);

    // 9. Akun Sistem
    const buatUser = document.getElementById('add-buat-user')?.checked ? '1' : '0';
    formData.append('buat_user', buatUser);
    formData.append('username', document.getElementById('add-username')?.value.trim() || nip);
    formData.append('password', document.getElementById('add-password')?.value || '');

    try {
      const response = await fetch(`${apiUrl}/cPegawai/save_data`, {
        method: 'POST',
        headers: (typeof config !== 'undefined' && config.auth_key) ? { 'Authorization-Key': config.auth_key } : {},
        body: formData
      });
      const res = await response.json();

      if (btnSimpan) {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = oldBtnText;
      }

      if (res && (res.code === 200 || res.status === 200 || res.status === 'OK' || res.status === 'ok')) {
        if (typeof Swal !== 'undefined') {
          await Swal.fire({
            icon: 'success',
            title: 'Berhasil Terdaftar',
            text: res.message || 'Data pegawai baru berhasil disimpan ke sistem.',
            timer: 1600,
            showConfirmButton: false
          });
        } else {
          alert(res.message || 'Data pegawai baru berhasil disimpan ke sistem.');
        }

        // Tutup form / popup
        handleTutupForm();

        // Refresh tabel pegawai
        if (window.vpegawai && typeof window.vpegawai.loadData === 'function') {
          window.vpegawai.loadData();
        } else if (typeof memuatUlangDataPegawai === 'function') {
          memuatUlangDataPegawai();
        }
      } else {
        const errMsg = res?.data?.message || res?.message || res?.status || 'Gagal menyimpan data pegawai.';
        if (typeof Swal !== 'undefined') {
          Swal.fire('Gagal Simpan', String(errMsg), 'error');
        } else {
          alert('Gagal Simpan: ' + String(errMsg));
        }
      }
    } catch (err) {
      console.error('Error saat simpan pegawai:', err);
      if (btnSimpan) {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = oldBtnText;
      }
      if (typeof Swal !== 'undefined') {
        Swal.fire('Error', 'Terjadi kendala jaringan saat menghubungi server.', 'error');
      } else {
        alert('Terjadi kendala jaringan saat menghubungi server.');
      }
    }
  }

  function handleTutupForm() {
    if (window.popupTambahPegawai && typeof window.popupTambahPegawai.close === 'function') {
      window.popupTambahPegawai.close();
      return;
    }
    if (window.popupTambah && typeof window.popupTambah.close === 'function') {
      window.popupTambah.close();
      return;
    }
    const activeModal = document.querySelector('#modalTambahPegawai, .modal.show');
    if (activeModal && typeof bootstrap !== 'undefined') {
      const bsModal = bootstrap.Modal.getInstance(activeModal);
      if (bsModal) {
        bsModal.hide();
        return;
      }
    }
    if (typeof loadModule === 'function') {
      loadModule('modules/pegawai/Vpegawai', '#container-isi');
    }
  }

  function resetFormPegawai() {
    const form = document.getElementById('form-tambah-pegawai');
    if (form) {
      form.reset();
    }

    // 1. Reset Foto Profil & Preview
    selectedFotoFile = null;
    const fileFotoInput = document.getElementById('input-file-foto');
    if (fileFotoInput) fileFotoInput.value = '';
    const imgPreview = document.getElementById('img-preview-foto');
    if (imgPreview) {
      imgPreview.src = '';
      imgPreview.classList.add('d-none');
    }
    const placeholderFoto = document.getElementById('placeholder-icon-foto');
    if (placeholderFoto) {
      placeholderFoto.classList.remove('d-none');
    }

    // 2. Reset Dependent Dropdowns Domisili
    const kabEl = document.getElementById('add-kabupaten');
    if (kabEl) kabEl.innerHTML = '<option value="">Pilih Kabupaten</option>';
    const kecEl = document.getElementById('add-kecamatan');
    if (kecEl) kecEl.innerHTML = '<option value="">Pilih Kecamatan</option>';
    const kelEl = document.getElementById('add-kelurahan');
    if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';

    // 3. Reset Dependent Dropdown Organisasi
    const subBagianEl = document.getElementById('add-sub-bagian');
    if (subBagianEl) subBagianEl.innerHTML = '<option value="">Pilih Sub Bagian</option>';

    // 4. Reset User Kredensial
    const buatUserCb = document.getElementById('add-buat-user');
    const secKredensial = document.getElementById('section-kredensial-user');
    if (buatUserCb) buatUserCb.checked = true;
    if (secKredensial) secKredensial.classList.remove('d-none');
    const unameInput = document.getElementById('add-username');
    if (unameInput) {
      unameInput.value = '';
      delete unameInput.dataset.manualEdited;
    }

    // 5. Reset Repeater Pengalaman: bersihkan dan render ulang tepat 1 baris awal
    const contPeng = document.getElementById('container-pengalaman-list');
    if (contPeng) {
      contPeng.innerHTML = '';
      tambahBarisPengalaman();
    }

    // 6. Reset Repeater Keahlian: bersihkan dan render ulang tepat 1 baris awal
    const contKhl = document.getElementById('container-keahlian-list');
    if (contKhl) {
      contKhl.innerHTML = '';
      tambahBarisKeahlian();
    }

    // 7. Bersihkan status validasi
    form?.querySelectorAll('.is-invalid, .is-valid').forEach(el => {
      el.classList.remove('is-invalid', 'is-valid');
    });

    // 8. Feedback toast
    if (typeof Swal !== 'undefined') {
      const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 1500,
        timerProgressBar: true
      });
      Toast.fire({
        icon: 'info',
        title: 'Formulir telah di-reset'
      });
    }
  }

  function bindEvents() {
    document.getElementById('btn-kembali-direktori')?.addEventListener('click', handleTutupForm);
    document.getElementById('btn-batal-tambah')?.addEventListener('click', handleTutupForm);
    document.getElementById('btn-batal-add')?.addEventListener('click', handleTutupForm);

    // Tombol reset formulir
    const btnReset = document.getElementById('btn-reset-add');
    if (btnReset && !btnReset._hasResetListener) {
      btnReset._hasResetListener = true;
      btnReset.addEventListener('click', (e) => {
        e.preventDefault();
        resetFormPegawai();
      });
    }

    // Tombol tambah baris dinamis Pengalaman & Keahlian (menggunakan guard idempoten)
    const btnAddPengalaman = document.getElementById('btn-tambah-pengalaman');
    if (btnAddPengalaman && !btnAddPengalaman._hasAddListener) {
      btnAddPengalaman._hasAddListener = true;
      btnAddPengalaman.addEventListener('click', (e) => {
        e.preventDefault();
        tambahBarisPengalaman();
      });
    }

    const btnAddKeahlian = document.getElementById('btn-tambah-keahlian');
    if (btnAddKeahlian && !btnAddKeahlian._hasAddListener) {
      btnAddKeahlian._hasAddListener = true;
      btnAddKeahlian.addEventListener('click', (e) => {
        e.preventDefault();
        tambahBarisKeahlian();
      });
    }

    document.getElementById('form-tambah-pegawai')?.addEventListener('submit', submitFormPegawai);
    document.getElementById('btn-simpan-add-pegawai')?.addEventListener('click', (e) => {
      const form = document.getElementById('form-tambah-pegawai');
      if (form && !form.checkValidity()) {
        form.reportValidity();
        return;
      }
      e.preventDefault();
      submitFormPegawai(e);
    });

    document.getElementById('add-nip')?.addEventListener('input', (e) => {
      const unameInput = document.getElementById('add-username');
      if (unameInput && !unameInput.dataset.manualEdited) {
        unameInput.value = e.target.value.trim();
      }
    });

    document.getElementById('add-username')?.addEventListener('input', (e) => {
      e.target.dataset.manualEdited = 'true';
    });

    document.getElementById('add-buat-user')?.addEventListener('change', (e) => {
      const sec = document.getElementById('section-kredensial-user');
      if (sec) {
        if (e.target.checked) {
          sec.classList.remove('d-none');
        } else {
          sec.classList.add('d-none');
        }
      }
    });
  }

  // Global namespace hooks
  window.vaddpegawai = {
    init: async () => {
      await initMasterData();
      bindWilayahEvents();
      bindFotoPreview();
      bindEvents();

      // Render 1 baris default awal jika container masih kosong
      const contPeng = document.getElementById('container-pengalaman-list');
      if (contPeng && contPeng.querySelectorAll('.item-pengalaman').length === 0) {
        tambahBarisPengalaman();
      }
      const contKhl = document.getElementById('container-keahlian-list');
      if (contKhl && contKhl.querySelectorAll('.item-keahlian').length === 0) {
        tambahBarisKeahlian();
      }
    },
    initMasterData,
    submitFormPegawai,
    resetForm: resetFormPegawai,
    tambahPengalaman: tambahBarisPengalaman,
    hapusPengalaman: hapusBarisPengalaman,
    tambahKeahlian: tambahBarisKeahlian,
    hapusKeahlian: hapusBarisKeahlian,
    close: handleTutupForm
  };
  document.vaddpegawai = window.vaddpegawai;
  document['VaddPegawai'] = window.vaddpegawai;

  // Initialize
  window.vaddpegawai.init();
