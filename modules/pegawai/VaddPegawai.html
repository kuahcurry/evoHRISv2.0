<script type="module">
  import { httpGet, httpPost } from './assets/js/core/http.js';

  const apiUrl = (typeof config !== 'undefined' && config.api_url) 
    ? config.api_url 
    : `${window.location.origin}/evoHRIS_v2.1/api`;

  let master = {};
  let selectedFotoFile = null;

  async function initMasterData() {
    try {
      const res = await httpGet(`${apiUrl}/cPegawai/master`);
      if (res && res.code === 200 && res.data) {
        master = res.data;

        // Data Pribadi & Identitas
        fillDropdown('add-agama', master.agama, 'KD_AGAMA', 'AGAMA', 'Pilih Agama');
        fillDropdown('add-identitas', master.identitas, 'KD_IDENTITAS', 'IDENTITAS', 'Pilih Jenis Identitas');
        fillDropdown('add-goldar', master.golda, 'KD_GOLDA', 'GOLONGAN_DARAH', 'Pilih Golongan Darah');
        fillDropdown('add-status-nikah', master.status_perkawinan, 'KD_STATUS_PERKAWINAN', 'STATUS_PERKAWINAN', 'Pilih Status Pernikahan');

        // Domisili
        fillDropdown('add-provinsi', master.provinsi, 'KD_PROVINSI', 'PROVINSI', 'Pilih Provinsi');

        // Penempatan
        fillDropdown('add-bagian', master.bagian, 'KD_BAGIAN', 'BAGIAN', 'Pilih Bagian / Unit Kerja');
        fillDropdown('add-jabatan', master.jabatan, 'KD_JABATAN', 'JABATAN', 'Pilih Jabatan');
        fillDropdown('add-pangkat', master.pangkat, 'KD_PANGKAT', 'PANGKAT', 'Pilih Pangkat');
        fillDropdown('add-golongan', master.golongan, 'KD_GOLONGAN', 'GOLONGAN', 'Pilih Golongan');
        fillDropdown('add-eselon', master.ekselon, 'KD_EKSELON', 'EKSELON', 'Pilih Eselon');
        fillDropdown('add-status-pegawai', master.status_pegawai, 'KD_STATUS_PEGAWAI', 'STATUS_PEGAWAI', 'Pilih Status Pegawai');
        fillDropdown('add-jenis-pegawai', master.jenis_pegawai, 'KD_JENIS_PEGAWAI', 'JENIS_PEGAWAI', 'Pilih Jenis Pegawai');
        fillDropdown('add-lokasi', master.lokasi, 'KD_LOKASI', 'LOKASI', 'Pilih Lokasi Kerja');

        // Pendidikan
        fillDropdown('add-jenjang-pendidikan', master.jenjang_pendidikan, 'KD_JENJANG', 'JENJANG_PENDIDIKAN', 'Pilih Jenjang');
        fillDropdown('add-jenis-pendidikan', master.jenis_pendidikan, 'KD_JENIS_PENDIDIKAN', 'JENIS_PENDIDIKAN', 'Pilih Jenis Pendidikan');
        fillDropdown('add-status-lulus', master.status_lulus, 'KD_STATUS_LULUS', 'STATUS_LULUS', 'Pilih Status Lulus');

        // Pengalaman
        fillDropdown('add-pengalaman-provinsi', master.provinsi, 'KD_PROVINSI', 'PROVINSI', 'Pilih Provinsi Perusahaan');
        fillDropdown('add-pengalaman-jabatan', master.jabatan, 'KD_JABATAN', 'JABATAN', 'Pilih Jabatan');
        fillDropdown('add-pengalaman-jenis', master.jenis_pengalaman, 'KD_JENIS_PENGALAMAN', 'JENIS_PENGALAMAN', 'Pilih Jenis Pengalaman');

        // Keahlian
        fillDropdown('add-keahlian-status', master.status_keahlian, 'KD_STATUS_KEAHLIAN', 'STATUS_KEAHLIAN', 'Pilih Status Keahlian');

        // Keluarga
        fillDropdown('add-keluarga-hubungan', master.hubungan, 'KD_HUBUNGAN', 'HUBUNGAN', 'Pilih Hubungan');
        fillDropdown('add-keluarga-pekerjaan', master.pekerjaan, 'KD_PEKERJAAN', 'PEKERJAAN', 'Pilih Pekerjaan');
        fillDropdown('add-keluarga-pendidikan', master.jenjang_pendidikan, 'KD_JENJANG', 'JENJANG_PENDIDIKAN', 'Pilih Pendidikan');
        fillDropdown('add-keluarga-goldar', master.golda, 'KD_GOLDA', 'GOLONGAN_DARAH', 'Pilih Golongan Darah');
        fillDropdown('add-keluarga-status-asuransi', master.status_asuransi, 'KD_STATUS_ASURANSI', 'STATUS_ASURANSI', 'Pilih Status Asuransi');
        fillDropdown('add-keluarga-nama-asuransi', master.nama_asuransi, 'KD_ASURANSI', 'NAMA_ASURANSI', 'Pilih Asuransi');
      }

      // Load Jurusan
      const resJurusan = await httpGet(`${apiUrl}/cPegawai/get_jurusan`);
      if (resJurusan && (resJurusan.code === 200 || Array.isArray(resJurusan.data))) {
        const jurusanList = Array.isArray(resJurusan.data) ? resJurusan.data : (resJurusan.data?.data || []);
        fillDropdown('add-jurusan', jurusanList, 'KD_JURUSAN', 'JURUSAN', 'Pilih Jurusan');
      }
    } catch (err) {
      console.error('Error in initMasterData:', err);
    }
  }

  function fillDropdown(elementId, items, valKey, textKey, defaultText = 'Pilih...') {
    const el = document.getElementById(elementId);
    if (!el || !items || !Array.isArray(items)) return;

    el.innerHTML = `<option value="">${defaultText}</option>`;
    items.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item[valKey] || '';
      opt.textContent = item[textKey] || item['NAMA_' + valKey] || item[valKey];
      el.appendChild(opt);
    });
  }

  function bindWilayahEvents() {
    // Domisili Wilayah
    const provEl = document.getElementById('add-provinsi');
    const kabEl = document.getElementById('add-kabupaten');
    const kecEl = document.getElementById('add-kecamatan');
    const kelEl = document.getElementById('add-kelurahan');

    provEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (kabEl) kabEl.innerHTML = '<option value="">Pilih Kabupaten</option>';
        if (kecEl) kecEl.innerHTML = '<option value="">Pilih Kecamatan</option>';
        if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kabupaten?kd_provinsi=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-kabupaten', list, 'KD_KABUPATEN', 'KABUPATEN', 'Pilih Kabupaten');
      } catch (err) {
        console.error('Error loading kabupaten:', err);
      }
    });

    kabEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (kecEl) kecEl.innerHTML = '<option value="">Pilih Kecamatan</option>';
        if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kecamatan?kd_kabupaten=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-kecamatan', list, 'KD_KECAMATAN', 'KECAMATAN', 'Pilih Kecamatan');
      } catch (err) {
        console.error('Error loading kecamatan:', err);
      }
    });

    kecEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (kelEl) kelEl.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kelurahan?kd_kecamatan=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-kelurahan', list, 'KD_KELURAHAN', 'KELURAHAN', 'Pilih Kelurahan');
      } catch (err) {
        console.error('Error loading kelurahan:', err);
      }
    });

    // Bagian & Sub Bagian
    const bagianEl = document.getElementById('add-bagian');
    const subBagianEl = document.getElementById('add-sub-bagian');
    bagianEl?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (subBagianEl) subBagianEl.innerHTML = '<option value="">Pilih Sub Bagian</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_sub_bagian?kd_bagian=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-sub-bagian', list, 'KD_SUB_BAGIAN', 'SUB_BAGIAN', 'Pilih Sub Bagian');
      } catch (err) {
        console.error('Error loading sub bagian:', err);
      }
    });

    // Pengalaman Wilayah
    const pengProv = document.getElementById('add-pengalaman-provinsi');
    const pengKab = document.getElementById('add-pengalaman-kabupaten');
    const pengKec = document.getElementById('add-pengalaman-kecamatan');
    const pengKel = document.getElementById('add-pengalaman-kelurahan');

    pengProv?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (pengKab) pengKab.innerHTML = '<option value="">Pilih Kabupaten</option>';
        if (pengKec) pengKec.innerHTML = '<option value="">Pilih Kecamatan</option>';
        if (pengKel) pengKel.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kabupaten?kd_provinsi=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-pengalaman-kabupaten', list, 'KD_KABUPATEN', 'KABUPATEN', 'Pilih Kabupaten');
      } catch (err) {
        console.error('Error loading pengalaman kabupaten:', err);
      }
    });

    pengKab?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (pengKec) pengKec.innerHTML = '<option value="">Pilih Kecamatan</option>';
        if (pengKel) pengKel.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kecamatan?kd_kabupaten=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-pengalaman-kecamatan', list, 'KD_KECAMATAN', 'KECAMATAN', 'Pilih Kecamatan');
      } catch (err) {
        console.error('Error loading pengalaman kecamatan:', err);
      }
    });

    pengKec?.addEventListener('change', async (e) => {
      const kd = e.target.value;
      if (!kd) {
        if (pengKel) pengKel.innerHTML = '<option value="">Pilih Kelurahan</option>';
        return;
      }
      try {
        const res = await httpGet(`${apiUrl}/cPegawai/get_kelurahan?kd_kecamatan=${encodeURIComponent(kd)}`);
        const list = Array.isArray(res?.data) ? res.data : [];
        fillDropdown('add-pengalaman-kelurahan', list, 'KD_KELURAHAN', 'KELURAHAN', 'Pilih Kelurahan');
      } catch (err) {
        console.error('Error loading pengalaman kelurahan:', err);
      }
    });
  }

  function bindFotoPreview() {
    const box = document.getElementById('box-foto-profil');
    const input = document.getElementById('input-file-foto');
    const preview = document.getElementById('img-preview-foto');
    const placeholder = document.getElementById('placeholder-icon-foto');

    box?.addEventListener('click', () => {
      input?.click();
    });

    input?.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) {
        selectedFotoFile = file;
        const reader = new FileReader();
        reader.onload = (re) => {
          if (preview) {
            preview.src = re.target.result;
            preview.classList.remove('d-none');
          }
          if (placeholder) {
            placeholder.classList.add('d-none');
          }
        };
        reader.readAsDataURL(file);
      }
    });
  }

  async function submitFormPegawai(e) {
    if (e) e.preventDefault();

    const nip = document.getElementById('add-nip')?.value.trim();
    const nama = document.getElementById('add-nama')?.value.trim();

    if (!nip || !nama) {
      if (typeof Swal !== 'undefined') {
        Swal.fire('Validasi Gagal', 'NIP dan Nama Lengkap Pegawai wajib diisi!', 'warning');
      } else {
        alert('NIP dan Nama Lengkap Pegawai wajib diisi!');
      }
      return;
    }

    const btnSimpan = document.getElementById('btn-simpan-add-pegawai');
    const oldBtnText = btnSimpan ? btnSimpan.innerHTML : '';
    if (btnSimpan) {
      btnSimpan.disabled = true;
      btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Menyimpan...';
    }

    const formData = new FormData();

    // 1. Foto Profil
    if (selectedFotoFile) {
      formData.append('foto', selectedFotoFile);
    } else {
      const fotoInput = document.getElementById('input-file-foto');
      if (fotoInput && fotoInput.files && fotoInput.files[0]) {
        formData.append('foto', fotoInput.files[0]);
      }
    }

    // 2. Data Pribadi
    formData.append('nip', nip);
    formData.append('nama', nama);
    formData.append('gelar_depan', document.getElementById('add-gelar-depan')?.value.trim() || '');
    formData.append('gelar_belakang', document.getElementById('add-gelar-belakang')?.value.trim() || '');
    formData.append('no_identitas', document.getElementById('add-nik')?.value.trim() || '');
    formData.append('kd_identitas', document.getElementById('add-identitas')?.value || '1');
    formData.append('no_kk', document.getElementById('add-kk')?.value.trim() || '');
    formData.append('jenis_kelamin', document.getElementById('add-jk')?.value || '1');
    formData.append('tempat_lahir', document.getElementById('add-tempat-lahir')?.value.trim() || '');
    formData.append('tgl_lahir', document.getElementById('add-tgl-lahir')?.value || '');
    formData.append('kd_agama', document.getElementById('add-agama')?.value || '1');
    formData.append('kd_golda', document.getElementById('add-goldar')?.value || '1');
    formData.append('rhesus', document.getElementById('add-rhesus')?.value || '+');
    formData.append('kd_status_perkawinan', document.getElementById('add-status-nikah')?.value || '1');

    // 3. Kontak & Domisili
    formData.append('handphone', document.getElementById('add-hp')?.value.trim() || '');
    formData.append('email', document.getElementById('add-email')?.value.trim() || '');
    formData.append('alamat', document.getElementById('add-alamat')?.value.trim() || '');
    formData.append('kd_provinsi', document.getElementById('add-provinsi')?.value || '');
    formData.append('kd_kabupaten', document.getElementById('add-kabupaten')?.value || '');
    formData.append('kd_kecamatan', document.getElementById('add-kecamatan')?.value || '');
    formData.append('kd_kelurahan', document.getElementById('add-kelurahan')?.value || '');
    formData.append('kodepos', document.getElementById('add-kodepos')?.value.trim() || '');
    formData.append('npwp', document.getElementById('add-npwp')?.value.trim() || '');
    formData.append('bpjs_kes', document.getElementById('add-bpjs-kes')?.value.trim() || '');
    formData.append('bpjs_tk', document.getElementById('add-bpjs-tk')?.value.trim() || '');

    // 4. Penempatan
    formData.append('kd_bagian', document.getElementById('add-bagian')?.value || '');
    formData.append('kd_subbagian', document.getElementById('add-sub-bagian')?.value || '');
    formData.append('kd_jabatan', document.getElementById('add-jabatan')?.value || '');
    formData.append('kd_pangkat', document.getElementById('add-pangkat')?.value || '');
    formData.append('kd_golongan', document.getElementById('add-golongan')?.value || '');
    formData.append('kd_eselon', document.getElementById('add-eselon')?.value || '');
    formData.append('kd_status_pegawai', document.getElementById('add-status-pegawai')?.value || '');
    formData.append('kd_jenis_pegawai', document.getElementById('add-jenis-pegawai')?.value || '');
    formData.append('kd_lokasi', document.getElementById('add-lokasi')?.value || '');
    formData.append('jenis_penempatan', document.getElementById('add-jenis-penempatan')?.value || 'Tetap');
    formData.append('tgl_masuk', document.getElementById('add-tgl-masuk')?.value || '');
    const fileSk = document.getElementById('add-file-sk')?.files?.[0];
    if (fileSk) formData.append('file_penempatan', fileSk);

    // 5. Pendidikan
    formData.append('nama_lembaga', document.getElementById('add-pendidikan')?.value.trim() || '');
    formData.append('kd_jenjang', document.getElementById('add-jenjang-pendidikan')?.value || '');
    formData.append('kd_jenis_pendidikan', document.getElementById('add-jenis-pendidikan')?.value || '');
    formData.append('kd_status_lulus', document.getElementById('add-status-lulus')?.value || '');
    formData.append('kd_jurusan', document.getElementById('add-jurusan')?.value || '');
    formData.append('ipk', document.getElementById('add-ipk')?.value.trim() || '');
    formData.append('periode_mulai', document.getElementById('add-pendidikan-mulai')?.value || '');
    formData.append('periode_sampai', document.getElementById('add-pendidikan-sampai')?.value || '');
    formData.append('alamat_lembaga', document.getElementById('add-alamat-lembaga')?.value.trim() || '');
    formData.append('nama_pejabat', document.getElementById('add-nama-pejabat')?.value.trim() || '');
    formData.append('no_ijazah', document.getElementById('add-no-ijazah')?.value.trim() || '');
    const filePdk = document.getElementById('add-pendidikan-upload')?.files?.[0];
    if (filePdk) formData.append('file_pendidikan', filePdk);

    // 6. Pengalaman Kerja
    formData.append('nama_perusahaan', document.getElementById('add-nama-perusahaan')?.value.trim() || '');
    formData.append('pengalaman_alamat', document.getElementById('add-pengalaman-alamat')?.value.trim() || '');
    formData.append('pengalaman_provinsi', document.getElementById('add-pengalaman-provinsi')?.value || '');
    formData.append('pengalaman_kabupaten', document.getElementById('add-pengalaman-kabupaten')?.value || '');
    formData.append('pengalaman_kecamatan', document.getElementById('add-pengalaman-kecamatan')?.value || '');
    formData.append('pengalaman_kelurahan', document.getElementById('add-pengalaman-kelurahan')?.value || '');
    formData.append('pengalaman_periode_mulai', document.getElementById('add-pengalaman-mulai')?.value || '');
    formData.append('pengalaman_periode_selesai', document.getElementById('add-pengalaman-selesai')?.value || '');
    formData.append('pengalaman_jabatan', document.getElementById('add-pengalaman-jabatan')?.value || '');
    formData.append('pengalaman_jenis', document.getElementById('add-pengalaman-jenis')?.value || '');
    const filePeng = document.getElementById('add-pengalaman-upload')?.files?.[0];
    if (filePeng) formData.append('file_pengalaman', filePeng);

    // 7. Keahlian
    formData.append('nama_keahlian', document.getElementById('add-keahlian-nama')?.value.trim() || '');
    formData.append('keahlian_status', document.getElementById('add-keahlian-status')?.value || '1');
    formData.append('keahlian_keterangan', document.getElementById('add-keahlian-keterangan')?.value.trim() || '');
    const fileKhl = document.getElementById('add-keahlian-upload')?.files?.[0];
    if (fileKhl) formData.append('file_keahlian', fileKhl);

    // 8. Keluarga
    formData.append('nama_keluarga', document.getElementById('add-keluarga-nama')?.value.trim() || '');
    formData.append('keluarga_hubungan', document.getElementById('add-keluarga-hubungan')?.value || '1');
    formData.append('keluarga_tempat_lahir', document.getElementById('add-keluarga-tempat-lahir')?.value.trim() || '');
    formData.append('keluarga_tgl_lahir', document.getElementById('add-keluarga-tgl-lahir')?.value || '');
    formData.append('keluarga_jk', document.getElementById('add-keluarga-jk')?.value || '1');
    formData.append('keluarga_pekerjaan', document.getElementById('add-keluarga-pekerjaan')?.value || '1');
    formData.append('keluarga_pendidikan', document.getElementById('add-keluarga-pendidikan')?.value || '1');
    formData.append('keluarga_goldar', document.getElementById('add-keluarga-goldar')?.value || '1');
    formData.append('keluarga_status_asuransi', document.getElementById('add-keluarga-status-asuransi')?.value || '1');
    formData.append('keluarga_nama_asuransi', document.getElementById('add-keluarga-nama-asuransi')?.value || '1');
    const fileKel = document.getElementById('add-keluarga-upload')?.files?.[0];
    if (fileKel) formData.append('file_keluarga', fileKel);

    // 9. Akun Sistem
    const buatUser = document.getElementById('add-buat-user')?.checked ? '1' : '0';
    formData.append('buat_user', buatUser);
    formData.append('username', document.getElementById('add-username')?.value.trim() || nip);
    formData.append('password', document.getElementById('add-password')?.value || '');

    try {
      const response = await fetch(`${apiUrl}/cPegawai/save_data`, {
        method: 'POST',
        headers: (typeof config !== 'undefined' && config.auth_key) ? { 'Authorization-Key': config.auth_key } : {},
        body: formData
      });
      const res = await response.json();

      if (btnSimpan) {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = oldBtnText;
      }

      if (res && (res.code === 200 || res.status === 200 || res.status === 'OK' || res.status === 'ok')) {
        if (typeof Swal !== 'undefined') {
          await Swal.fire({
            icon: 'success',
            title: 'Berhasil Terdaftar',
            text: res.message || 'Data pegawai baru berhasil disimpan ke sistem.',
            timer: 1600,
            showConfirmButton: false
          });
        } else {
          alert(res.message || 'Data pegawai baru berhasil disimpan ke sistem.');
        }

        // Tutup form / popup
        handleTutupForm();

        // Refresh tabel pegawai
        if (window.vpegawai && typeof window.vpegawai.loadData === 'function') {
          window.vpegawai.loadData();
        } else if (typeof memuatUlangDataPegawai === 'function') {
          memuatUlangDataPegawai();
        }
      } else {
        const errMsg = res?.data?.message || res?.message || res?.status || 'Gagal menyimpan data pegawai.';
        if (typeof Swal !== 'undefined') {
          Swal.fire('Gagal Simpan', String(errMsg), 'error');
        } else {
          alert('Gagal Simpan: ' + String(errMsg));
        }
      }
    } catch (err) {
      console.error('Error saat simpan pegawai:', err);
      if (btnSimpan) {

    if (window.popupTambahPegawai && typeof window.popupTambahPegawai.close === 'function') {
      window.popupTambahPegawai.close();
      return;
    }
    if (window.popupTambah && typeof window.popupTambah.close === 'function') {
      window.popupTambah.close();
      return;
    }
    const activeModal = document.querySelector('#modalTambahPegawai, .modal.show');
    if (activeModal && typeof bootstrap !== 'undefined') {
      const bsModal = bootstrap.Modal.getInstance(activeModal);
      if (bsModal) {
