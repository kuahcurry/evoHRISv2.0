    max-width: 680px;
    margin: 1.5rem auto;
  }
  #modal-form-pegawai .modal-content {
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 12px;
    box-shadow: 0 20px 35px -8px rgba(15, 23, 42, 0.18);
    overflow: hidden;
    background: #ffffff;

  #modal-form-pegawai .modal-body {
    max-height: calc(88vh - 120px);
    overflow-y: auto;
    padding: 1.15rem 1.25rem;

  #modal-form-pegawai .modal-body::-webkit-scrollbar {

  }
  #modal-form-pegawai .modal-body::-webkit-scrollbar-track {

  #modal-form-pegawai .modal-body::-webkit-scrollbar-thumb {

  #modal-form-pegawai .modal-body::-webkit-scrollbar-thumb:hover {

  }
  #modal-form-pegawai .modal-footer {
    border-top: 1px solid #edf2f7;

  #modal-form-pegawai .form-section-card {
    background: #f8fafc;

  #modal-form-pegawai .form-label {

  #modal-form-pegawai .form-control,
  #modal-form-pegawai .form-select {

  #modal-form-pegawai .form-control:focus,
  #modal-form-pegawai .form-select:focus {

  #modal-form-pegawai .form-control.is-invalid,
  #modal-form-pegawai .form-select.is-invalid {

  #modal-form-pegawai .form-control::placeholder {

  #modal-form-pegawai .section-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding-bottom: 0.35rem;
    margin-bottom: 0.65rem;
    border-bottom: 1px solid #e2e8f0;
  }
  #modal-form-pegawai .section-badge {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    background: rgba(44, 123, 229, 0.12);
    font-size: 11px;
    font-weight: 700;
    color: #2c7be5;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #modal-form-pegawai .section-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: #334155;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .table-pegawai-wrapper th {
    font-weight: 600;
    letter-spacing: 0.02em;
    background-color: #f8fafc !important;
  }
</style>

<script type="module" defer>
  import { httpPost, httpGet } from './assets/js/core/http.js';
  import { getFormEntries } from './assets/js/core/helpers.js';

  let allPegawai = [];
  let currentPage = 1;
  const pageSize = 25;

  const genderMap = { '1': 'Laki-laki', '2': 'Perempuan' };
  const formatTanpaData = (val) => (!val || val === '-' || val === '0000-00-00') ? '<span class="text-muted">-</span>' : val;

  // --- CLIENT-SIDE LOCATION CACHE ---
  const locationCache = { kabupaten: {}, kecamatan: {}, kelurahan: {} };

  const getCachedKabupaten = async (kdProv) => {
    if (!kdProv) return [];
    if (!locationCache.kabupaten[kdProv]) {
      const rs = await httpGet(`${config.api_url}/pegawai/kabupaten?kd_provinsi=${kdProv}`);
      locationCache.kabupaten[kdProv] = (rs && rs.code === 200 && Array.isArray(rs.data)) ? rs.data : [];
    }
    return locationCache.kabupaten[kdProv];
  };

  const getCachedKecamatan = async (kdKab) => {
    if (!kdKab) return [];
    if (!locationCache.kecamatan[kdKab]) {
      const rs = await httpGet(`${config.api_url}/pegawai/kecamatan?kd_kabupaten=${kdKab}`);
      locationCache.kecamatan[kdKab] = (rs && rs.code === 200 && Array.isArray(rs.data)) ? rs.data : [];
    }
    return locationCache.kecamatan[kdKab];
  };

  const getCachedKelurahan = async (kdKec) => {
    if (!kdKec) return [];
    if (!locationCache.kelurahan[kdKec]) {
      const rs = await httpGet(`${config.api_url}/pegawai/kelurahan?kd_kecamatan=${kdKec}`);
      locationCache.kelurahan[kdKec] = (rs && rs.code === 200 && Array.isArray(rs.data)) ? rs.data : [];
    }
    return locationCache.kelurahan[kdKec];
  };

  // --- MODAL HELPER (Bootstrap 5) ---
  const getModal = () => {
    const el = document.getElementById('modal-form-pegawai');
    return bootstrap.Modal.getOrCreateInstance(el);
  };

  // --- 1. LOAD LIST (BACK-END SEARCH via ?keyword=) ---
  const getKeyword = () => document.getElementById('input-search-pegawai')?.value.trim() || '';

  const loadData = async (keyword = getKeyword()) => {
    const tbody = document.getElementById('table-pegawai');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2 text-primary"></span>Memuat data pegawai...</td></tr>';
    }

    const url = keyword
      ? `${config.api_url}/pegawai/list?keyword=${encodeURIComponent(keyword)}`
      : `${config.api_url}/pegawai/list`;
    const rs = await httpGet(url);

    if (rs && (rs.code === 200 || rs.code === '200') && Array.isArray(rs.data)) {
      allPegawai = rs.data;
    } else {
      allPegawai = [];
    }
    renderTablePage(1);
  };

  // Helper format tanggal dari YYYY-MM-DD ke DD-MM-YYYY untuk antarmuka
  const formatTglIndo = (tgl) => {
    if (!tgl || tgl === '0000-00-00' || tgl === '-' || tgl === 'null') return '-';
    const parts = String(tgl).trim().split('-');
    if (parts.length === 3 && parts[0].length === 4) {
      return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    return tgl;
  };

  // --- 2. RENDER TABLE ---
  const renderTablePage = (page) => {
    currentPage = page;
    const tbody = document.getElementById('table-pegawai');
    if (!tbody) return;

    const total = allPegawai.length;
    const totalBadge = document.getElementById('total-badge');
    if (totalBadge) totalBadge.innerText = `${total} pegawai aktif`;

    if (total === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4"><span class="fas fa-info-circle me-1 text-secondary"></span>Data pegawai tidak ditemukan.</td></tr>';
      const nav = document.getElementById('pagination-nav');
      if (nav) nav.innerHTML = '';
      return;
    }

    const start = (page - 1) * pageSize;
    const pageItems = allPegawai.slice(start, start + pageSize);

    let rowsHtml = '';
    pageItems.forEach((p, index) => {
      const itemNo = start + index + 1;
      const cleanNama = (p.NAMA || '').replace(/"/g, '&quot;');
      const hpText = p.HANDPHONE ? `<div><span class="fas fa-phone-alt text-primary me-1" style="font-size:0.7rem;"></span><span class="fw-medium">${p.HANDPHONE}</span></div>` : '<div class="text-muted fs--2">No. HP: -</div>';
      const emailText = p.EMAIL ? `<div><span class="fas fa-envelope text-info me-1" style="font-size:0.7rem;"></span><span class="text-muted" style="font-size:0.78rem;">${p.EMAIL}</span></div>` : '<div class="text-muted fs--2">Email: -</div>';
      const nikBadge = p.NO_IDENTITAS ? `<span class="badge badge-subtle-success ms-1" style="font-size:0.7rem;">NIK: ${p.NO_IDENTITAS}</span>` : '';

      rowsHtml += `
        <tr>
          <td class="text-center text-muted fs--1">${itemNo}</td>
          <td>
            <div class="fw-semibold text-dark">${p.NAMA}</div>
            <div class="text-muted fs--1 mt-1 d-flex align-items-center flex-wrap gap-1">
              <span>NIP: ${p.NIP || '-'}</span>
              ${nikBadge}
            </div>
          </td>
          <td>${genderMap[p.JENIS_KELAMIN] || '-'}</td>
          <td>
            <div class="fw-medium">${p.TEMPAT_LAHIR || '-'}</div>
            <div class="text-muted fs--1">${formatTglIndo(p.TANGGAL_LAHIR)}</div>
          </td>
          <td><small class="text-dark d-inline-block text-truncate" style="max-width: 220px;" title="${p.ALAMAT || ''}">${p.ALAMAT || '-'}</small></td>
          <td>
            ${hpText}
            ${emailText}
          </td>
          <td class="text-center text-nowrap">
            <button type="button" class="btn btn-sm btn-falcon-warning px-2 py-1 me-1" title="Ubah Data Pegawai (Edit)" onclick="editPegawai('${p.ID_PEGAWAI}')">
              <span class="fas fa-edit"></span>
            </button>
            <button type="button" class="btn btn-sm btn-falcon-danger px-2 py-1" title="Hapus / Nonaktifkan Data Pegawai (Soft Delete)" onclick="hapusPegawai('${p.ID_PEGAWAI}', '${cleanNama}')">
              <span class="fas fa-trash"></span>
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = rowsHtml;
    renderPaginationNav();
  };

  const renderPaginationNav = () => {
    const nav = document.getElementById('pagination-nav');
    if (!nav) return;
    const totalPages = Math.ceil(allPegawai.length / pageSize);
    if (totalPages <= 1) { nav.innerHTML = ''; return; }

    let html = `<ul class="pagination pagination-sm mb-0">`;
    html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><button class="page-link" onclick="goToPage(${currentPage - 1})">&laquo;</button></li>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
        html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><button class="page-link" onclick="goToPage(${i})">${i}</button></li>`;
      } else if (i === currentPage - 3 || i === currentPage + 3) {
        html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
      }
    }
    html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><button class="page-link" onclick="goToPage(${currentPage + 1})">&raquo;</button></li></ul>`;
    nav.innerHTML = html;
  };

  window.goToPage = (page) => renderTablePage(page);

  // --- SEARCH (debounce 350ms) ---
  let searchTimer = null;
  window.onSearchInput = () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadData(getKeyword()), 350);
  };
  window.handleSearch = () => {
    clearTimeout(searchTimer);
    loadData(getKeyword());
  };

  // --- 3. MASTER DROPDOWNS ---
  const loadMasterDropdowns = async () => {
    try {
      const resAgama = await httpGet(`${config.api_url}/pegawai/agama`);
      if (resAgama && resAgama.code === 200 && Array.isArray(resAgama.data)) {
        const el = document.getElementById('select-agama');
        if (el) {
          el.innerHTML = '<option value="">Pilih agama</option>' +
            resAgama.data.map(a => `<option value="${a.KD_AGAMA}">${a.AGAMA}</option>`).join('');
        }
      }
      const resProv = await httpGet(`${config.api_url}/pegawai/provinsi`);
      if (resProv && resProv.code === 200 && Array.isArray(resProv.data)) {
        const el = document.getElementById('select-provinsi');
        if (el) {
          el.innerHTML = '<option value="">Pilih provinsi</option>' +
            resProv.data.map(p => `<option value="${p.KD_PROVINSI}">${p.PROVINSI}</option>`).join('');
        }
      }
    } catch (e) {
      console.error('Error loading master dropdowns:', e);
    }
  };

  const fillSelect = (id, list, kdKey, namaKey, placeholder) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = `<option value="">${placeholder}</option>` +
      list.map(x => `<option value="${x[kdKey]}">${x[namaKey]}</option>`).join('');
  };

  window.onProvinsiChange = async (kdProvinsi) => {
    fillSelect('select-kecamatan', [], '', '', 'Pilih kabupaten dahulu');
    fillSelect('select-kelurahan', [], '', '', 'Pilih kecamatan dahulu');
    if (!kdProvinsi) {
      fillSelect('select-kabupaten', [], '', '', 'Pilih provinsi dahulu');
      return;
    }
    fillSelect('select-kabupaten', [], '', '', 'Memuat kabupaten...');
    const listKab = await getCachedKabupaten(kdProvinsi);
    fillSelect('select-kabupaten', listKab, 'KD_KABUPATEN', 'KABUPATEN', 'Pilih kabupaten / kota');
  };

  window.onKabupatenChange = async (kdKabupaten) => {
    fillSelect('select-kelurahan', [], '', '', 'Pilih kecamatan dahulu');
    if (!kdKabupaten) {
      fillSelect('select-kecamatan', [], '', '', 'Pilih kabupaten dahulu');
      return;
    }
    fillSelect('select-kecamatan', [], '', '', 'Memuat kecamatan...');
    const listKec = await getCachedKecamatan(kdKabupaten);
    fillSelect('select-kecamatan', listKec, 'KD_KECAMATAN', 'KECAMATAN', 'Pilih kecamatan');
  };

  window.onKecamatanChange = async (kdKecamatan) => {
    if (!kdKecamatan) {
      fillSelect('select-kelurahan', [], '', '', 'Pilih kecamatan dahulu');
      return;
    }
    fillSelect('select-kelurahan', [], '', '', 'Memuat kelurahan...');
    const listKel = await getCachedKelurahan(kdKecamatan);
    fillSelect('select-kelurahan', listKel, 'KD_KELURAHAN', 'KELURAHAN', 'Pilih kelurahan / desa');
  };

  // --- 4. MODAL: TAMBAH & UBAH ---
  window.showModalTambah = () => {
    const formEl = document.getElementById('form-pegawai');
    if (formEl) {
      formEl.reset();
      formEl.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
    }
    document.getElementById('input-id-pegawai').value = '';
    document.getElementById('modal-title').innerText = 'Tambah Data Pegawai';
    document.getElementById('modal-subtitle').innerText = 'Lengkapi formulir di bawah ini untuk mendaftarkan pegawai baru ke sistem RS.';
    document.getElementById('btn-simpan-pegawai').innerHTML = '<span class="fas fa-save me-1"></span> Simpan Data';
    
    const inputTgl = document.getElementById('input-tanggal-lahir');
    if (inputTgl) inputTgl.value = '';
    const hiddenDate = document.getElementById('native-date-picker-hidden');
    if (hiddenDate) hiddenDate.value = '';
    if (typeof setupTanggalLahirInput === 'function') setupTanggalLahirInput();

    fillSelect('select-kabupaten', [], '', '', 'Pilih provinsi dahulu');
    fillSelect('select-kecamatan', [], '', '', 'Pilih kabupaten dahulu');
    fillSelect('select-kelurahan', [], '', '', 'Pilih kecamatan dahulu');
    getModal().show();
  };

  window.closeModalForm = () => getModal().hide();

  window.editPegawai = async (id) => {
    const p = allPegawai.find(item => String(item.ID_PEGAWAI) === String(id));
    if (!p) {
      alert('Data pegawai tidak ditemukan.');
      return;
    }

    const formEl = document.getElementById('form-pegawai');
    if (formEl) {
      formEl.reset();
      formEl.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
    }

    document.getElementById('modal-title').innerText = 'Ubah Data Pegawai';
    document.getElementById('modal-subtitle').innerText = `Perbarui rincian informasi untuk: ${p.NAMA || ''} (ID: ${p.ID_PEGAWAI})`;
    document.getElementById('btn-simpan-pegawai').innerHTML = '<span class="fas fa-check me-1"></span> Perbarui Data';

    const setVal = (field, val) => {
      const el = document.querySelector(`[data-field="${field}"]`);
      if (el) el.value = val ?? '';
    };

    document.getElementById('input-id-pegawai').value = p.ID_PEGAWAI;
    setVal('NAMA', p.NAMA);
    setVal('NO_IDENTITAS', p.NO_IDENTITAS);
    setVal('NIP', p.NIP);
    setVal('JENIS_KELAMIN', p.JENIS_KELAMIN);
    setVal('TEMPAT_LAHIR', p.TEMPAT_LAHIR);

    const tglDisplay = (p.TANGGAL_LAHIR && p.TANGGAL_LAHIR !== '0000-00-00') ? formatTglIndo(p.TANGGAL_LAHIR) : '';
    setVal('TANGGAL_LAHIR', tglDisplay);
    const hiddenDate = document.getElementById('native-date-picker-hidden');
    if (hiddenDate) {
      hiddenDate.value = (p.TANGGAL_LAHIR && p.TANGGAL_LAHIR !== '0000-00-00') ? p.TANGGAL_LAHIR : '';
    }
    if (typeof setupTanggalLahirInput === 'function') setupTanggalLahirInput();

    setVal('KD_AGAMA', p.KD_AGAMA);
    setVal('HANDPHONE', p.HANDPHONE);
    setVal('EMAIL', p.EMAIL);
    setVal('ALAMAT', p.ALAMAT);

    getModal().show();

    // Cascading lokasi dari data pegawai
    const selProv = document.getElementById('select-provinsi');
    if (selProv) selProv.value = p.KD_PROVINSI || '';

    if (p.KD_PROVINSI) {
      const listKab = await getCachedKabupaten(p.KD_PROVINSI);
      fillSelect('select-kabupaten', listKab, 'KD_KABUPATEN', 'KABUPATEN', 'Pilih kabupaten / kota');
      const selKab = document.getElementById('select-kabupaten');
      if (selKab) selKab.value = p.KD_KABUPATEN || '';
    } else {
      fillSelect('select-kabupaten', [], '', '', 'Pilih provinsi dahulu');
    }

    if (p.KD_KABUPATEN) {
      const listKec = await getCachedKecamatan(p.KD_KABUPATEN);
      fillSelect('select-kecamatan', listKec, 'KD_KECAMATAN', 'KECAMATAN', 'Pilih kecamatan');
      const selKec = document.getElementById('select-kecamatan');
      if (selKec) selKec.value = p.KD_KECAMATAN || '';
    } else {
      fillSelect('select-kecamatan', [], '', '', 'Pilih kabupaten dahulu');
    }

    if (p.KD_KECAMATAN) {
      const listKel = await getCachedKelurahan(p.KD_KECAMATAN);
      fillSelect('select-kelurahan', listKel, 'KD_KELURAHAN', 'KELURAHAN', 'Pilih kelurahan / desa');
      const selKel = document.getElementById('select-kelurahan');
      if (selKel) selKel.value = p.KD_KELURAHAN || '';
    } else {
      fillSelect('select-kelurahan', [], '', '', 'Pilih kecamatan dahulu');
    }
  };

  // --- 5. SIMPAN (INSERT / UPDATE) DENGAN VALIDASI LENGKAP & PARAMETER JELAS ---
  window.simpanPegawai = async () => {
    const formEl = document.getElementById('form-pegawai');
    const data = getFormEntries(formEl);

    const idPegawai = document.getElementById('input-id-pegawai').value.trim();
    const isEdit = idPegawai !== '';
    if (isEdit) data.ID_PEGAWAI = idPegawai;

    // Pastikan nilai spesifik diambil langsung dari DOM untuk menjaga konsistensi data
    const inputNama = formEl.querySelector('[data-field="NAMA"]');
    const inputNik = formEl.querySelector('[data-field="NO_IDENTITAS"]');
    const inputNip = formEl.querySelector('[data-field="NIP"]');
    const inputHp = formEl.querySelector('[data-field="HANDPHONE"]');
    const inputEmail = formEl.querySelector('[data-field="EMAIL"]');

    const nama = inputNama?.value.trim() || '';
    const nik = inputNik?.value.trim().replace(/[^0-9]/g, '') || '';
    const nip = inputNip?.value.trim() || '';
    const hp = inputHp?.value.trim() || '';
    const email = inputEmail?.value.trim() || '';

    data.NAMA = nama;
    data.NO_IDENTITAS = nik;
    data.NIP = nip;
    data.HANDPHONE = hp;
    data.EMAIL = email;

    // Reset visual error state
    formEl.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));

    // Parameter Validasi 1: Nama Lengkap minimal 3 karakter
    if (!nama || nama.length < 3) {
      if (inputNama) inputNama.classList.add('is-invalid');
      alert('Parameter Validasi:\nNama lengkap pegawai wajib diisi minimal 3 karakter!');
      inputNama?.focus();
      return;
    }

    // Parameter Validasi 2: Minimal dan panjang NIK (16 digit angka) jika diisi
    if (nik && nik.length !== 16) {
      if (inputNik) inputNik.classList.add('is-invalid');
      alert('Parameter Validasi:\nNIK / No. KTP harus berupa 16 digit angka sesuai standar kependudukan (Panjang saat ini: ' + nik.length + ' digit)!');
      inputNik?.focus();
      return;
    }

    // Parameter Validasi 3: Format email valid jika diisi
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      if (inputEmail) inputEmail.classList.add('is-invalid');
      alert('Parameter Validasi:\nFormat alamat email tidak valid (Contoh: nama@rumahsakit.com)!');
      inputEmail?.focus();
      return;
    }

    // Parameter Validasi 4: Nomor telepon/kontak minimal 9 digit jika diisi
    if (hp && hp.length < 9) {
      if (inputHp) inputHp.classList.add('is-invalid');
      alert('Parameter Validasi:\nNomor kontak handphone minimal 9 digit angka (Contoh: 081234567890)!');
      inputHp?.focus();
      return;
    }

    // Parameter Validasi 5: Format Tanggal Lahir (DD-MM-YYYY) jika diisi
    const inputTglLahir = document.getElementById('input-tanggal-lahir');
    const rawTgl = inputTglLahir?.value.trim() || '';
    let normalizedTgl = null;

    if (rawTgl) {
      const mDmy = rawTgl.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
      const mYmd = rawTgl.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
      if (mDmy) {
        const d = parseInt(mDmy[1], 10);
        const m = parseInt(mDmy[2], 10);
        const y = parseInt(mDmy[3], 10);
        if (d < 1 || d > 31 || m < 1 || m > 12 || y < 1900 || y > 2100) {
          if (inputTglLahir) inputTglLahir.classList.add('is-invalid');
          alert('Parameter Validasi:\nTanggal lahir tidak valid! Pastikan hari (01-31), bulan (01-12), dan tahun (4 digit) sesuai urutan DD-MM-YYYY (contoh: 17-08-1995).');
          inputTglLahir?.focus();
          return;
        }
        const sD = String(d).padStart(2, '0');
        const sM = String(m).padStart(2, '0');
        normalizedTgl = `${y}-${sM}-${sD}`;
      } else if (mYmd) {
        const y = parseInt(mYmd[1], 10);
        const m = parseInt(mYmd[2], 10);
        const d = parseInt(mYmd[3], 10);
        if (d < 1 || d > 31 || m < 1 || m > 12 || y < 1900 || y > 2100) {
          if (inputTglLahir) inputTglLahir.classList.add('is-invalid');
          alert('Parameter Validasi:\nTanggal lahir tidak valid!');
          inputTglLahir?.focus();
          return;
        }
        const sD = String(d).padStart(2, '0');
        const sM = String(m).padStart(2, '0');
        normalizedTgl = `${y}-${sM}-${sD}`;
      } else {
        if (inputTglLahir) inputTglLahir.classList.add('is-invalid');
        alert('Parameter Validasi:\nFormat tanggal lahir harus dimulai dengan urutan Hari-Bulan-Tahun (DD-MM-YYYY).\nContoh: 17-08-1995');
        inputTglLahir?.focus();
        return;
      }
    }

    data.TANGGAL_LAHIR = normalizedTgl;

    const endpoint = isEdit ? `${config.api_url}/pegawai/update` : `${config.api_url}/pegawai/save`;
    const btn = document.getElementById('btn-simpan-pegawai');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Menyimpan...';

    try {
      const rs = await httpPost(endpoint, data);
      btn.disabled = false;
      btn.innerHTML = isEdit ? '<span class="fas fa-check me-1"></span> Perbarui Data' : '<span class="fas fa-save me-1"></span> Simpan Data';

      if (rs && (rs.code === 200 || rs.code === '200')) {
        alert(isEdit ? 'Data pegawai berhasil diperbarui!' : 'Data pegawai berhasil disimpan!');
        window.closeModalForm();
        await loadData();
      } else {
        const errMsg = rs?.message || (rs?.data && rs.data.message) || rs?.status || 'Terjadi kesalahan sistem saat menyimpan data.';
        alert('Gagal Menyimpan Data Pegawai:\n' + errMsg);
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = isEdit ? '<span class="fas fa-check me-1"></span> Perbarui Data' : '<span class="fas fa-save me-1"></span> Simpan Data';
      alert('Terjadi kesalahan jaringan/sistem:\n' + (err.message || err));
    }
  };

  // --- 6. SOFT DELETE (NONAKTIFKAN PEGAWAI) ---
  window.hapusPegawai = async (id, nama) => {
    if (!confirm(`Apakah Anda yakin ingin menonaktifkan data pegawai:\n\nNama : ${nama}\nID   : ${id}?\n\nCatatan: Pegawai akan dinonaktifkan dari daftar aktif (soft delete) tanpa menghapus rekaman riwayat.`)) {
      return;
    }

    try {
      const rs = await httpPost(`${config.api_url}/pegawai/delete`, { ID_PEGAWAI: id });
      if (rs && (rs.code === 200 || rs.code === '200')) {
        alert(`Data pegawai "${nama}" berhasil dinonaktifkan.`);
        await loadData();
      } else {
        const errMsg = rs?.message || (rs?.data && rs.data.message) || rs?.status || 'Terjadi kesalahan saat menonaktifkan pegawai.';
        alert('Gagal Menonaktifkan Data Pegawai:\n' + errMsg);
      }
    } catch (err) {
      alert('Terjadi kesalahan saat menghapus pegawai:\n' + (err.message || err));
    }
  };

  // --- 5. INITIALIZER INPUT TANGGAL LAHIR (DD-MM-YYYY) ---
  const setupTanggalLahirInput = () => {
    const inputTgl = document.getElementById('input-tanggal-lahir');
    const btnPick = document.getElementById('btn-pick-tanggal-lahir');
    const hiddenDate = document.getElementById('native-date-picker-hidden');

    if (!inputTgl) return;
    if (inputTgl._hasDateListener) return;
    inputTgl._hasDateListener = true;

    // Masker otomatis untuk format DD-MM-YYYY saat pengguna mengetik angka
    inputTgl.addEventListener('input', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '');
      if (val.length > 8) val = val.substring(0, 8);
      let formatted = '';
      if (val.length > 4) {
        formatted = `${val.substring(0, 2)}-${val.substring(2, 4)}-${val.substring(4)}`;
      } else if (val.length > 2) {
        formatted = `${val.substring(0, 2)}-${val.substring(2)}`;
      } else {
        formatted = val;
      }
      e.target.value = formatted;

      // Sinkronkan ke date picker tersembunyi jika format sudah lengkap 8 digit
      if (val.length === 8 && hiddenDate) {
        const d = val.substring(0, 2);
        const m = val.substring(2, 4);
        const y = val.substring(4, 8);
        hiddenDate.value = `${y}-${m}-${d}`;
      }
    });

    if (btnPick && hiddenDate) {
      btnPick.addEventListener('click', () => {
        const cur = inputTgl.value.trim();
        const mDmy = cur.match(/^(\d{2})-(\d{2})-(\d{4})$/);
        if (mDmy) {
          hiddenDate.value = `${mDmy[3]}-${mDmy[2]}-${mDmy[1]}`;
        }
        if (typeof hiddenDate.showPicker === 'function') {
          hiddenDate.showPicker();
        } else {
          hiddenDate.focus();
        }
      });

      hiddenDate.addEventListener('change', () => {
        if (hiddenDate.value) {
          const parts = hiddenDate.value.split('-');
          if (parts.length === 3) {
            // YYYY-MM-DD -> DD-MM-YYYY
            inputTgl.value = `${parts[2]}-${parts[1]}-${parts[0]}`;
            inputTgl.classList.remove('is-invalid');
          }
        }
      });
    }
  };

  loadMasterDropdowns();
  loadData();
  setupTanggalLahirInput();

  document.pegawai = { loadData };
  document.pegawai_direktori = { loadData };
  window.pegawai_direktori = { loadData };
  document.perawat = document.pegawai; // kompatibilitas ke belakang
</script>
