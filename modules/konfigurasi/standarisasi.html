<template id="template-konfig-standarisasi">
    <div class="container-fluid py-4 px-3 px-md-4 bg-light">

        <!-- HEADER -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h3 class="fw-bold text-dark mb-1">Standarisasi Jam & Jadwal Kerja</h3>
                <p class="text-secondary mb-0">Konfigurasi standar operasional jadwal shift pelayanan medis dan jam kerja kantor/administrasi RS.</p>
            </div>
            <div>
                <button class="btn btn-white border border-secondary-subtle shadow-sm rounded-pill px-3 py-2 text-dark fw-semibold" id="btn-refresh-standar">
                    <i class="fas fa-sync-alt text-primary me-2"></i>Refresh Data
                </button>
            </div>
        </div>

        <!-- TABS NAVIGATION -->
        <div class="bg-white rounded-5 shadow-sm border p-1 d-inline-flex gap-1 mb-4">
            <ul class="nav nav-pills border-0" id="standarTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-semibold rounded-5 px-4 py-2" id="tab-pelayanan-link" data-bs-toggle="tab" data-bs-target="#tab-pelayanan" type="button" role="tab">
                        <i class="fas fa-clock me-2"></i>Shift Pelayanan 
                        <span id="badge-total-pelayanan" class="badge bg-secondary ms-2 rounded-pill">0</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-semibold rounded-5 px-4 py-2" id="tab-administrasi-link" data-bs-toggle="tab" data-bs-target="#tab-administrasi" type="button" role="tab">
                        <i class="fas fa-calendar-day me-2"></i>Jam Administrasi
                        <span id="badge-total-admin" class="badge bg-secondary ms-2 rounded-pill">0</span>
                    </button>
                </li>
            </ul>
        </div>

        <div class="tab-content" id="standarTabsContent">
            
            <!-- ========================================== -->
            <!-- TAB 1: SHIFT PELAYANAN                     -->
            <!-- ========================================== -->
            <div class="tab-pane fade show active" id="tab-pelayanan" role="tabpanel">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-white pt-4 px-4 pb-3 border-bottom-0">
                        <div class="row g-3 align-items-center justify-content-between">
                            <div class="col-md-4">
                                <div class="input-group shadow-sm rounded-3">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-search"></i></span>
                                    <input type="text" class="form-control bg-light border-start-0" id="search-shift" placeholder="Cari nama shift pelayanan...">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select bg-light border-secondary-subtle shadow-sm rounded-3" id="filter-shift-kelompok">
                                    <option value="">-- Semua Kelompok Unit --</option>
                                </select>
                            </div>
                            <div class="col-md-3 text-md-end">
                                <button class="btn btn-primary rounded-pill px-3 py-2 fw-semibold shadow-sm d-flex align-items-center gap-2 ms-auto" id="btn-add-shift">
                                    <i class="fas fa-plus"></i> Tambah Shift
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-borderless align-middle mb-0">
                                <thead class="bg-light text-secondary">
                                    <tr>
                                        <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 60px;">#</th>
                                        <th class="py-3 text-uppercase small fw-bold">Unit / Kelompok Kerja</th>
                                        <th class="py-3 text-uppercase small fw-bold">Nama Shift</th>
                                        <th class="py-3 text-uppercase small fw-bold text-center">Jam Mulai</th>
                                        <th class="py-3 text-uppercase small fw-bold text-center">Jam Selesai</th>
                                        <th class="py-3 text-uppercase small fw-bold text-center">Durasi</th>
                                        <th class="py-3 text-uppercase small fw-bold text-center">Status</th>
                                        <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 100px;">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="shift-table-body">
                                    <tr>
                                        <td colspan="8" class="text-center py-5 text-muted">
                                            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Memuat standar shift...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div class="card-footer bg-white py-3 px-4 border-top border-secondary-subtle">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="small text-secondary fw-semibold" id="shift-page-info">Menampilkan 0 data</div>
                            <nav><ul class="pagination pagination-sm mb-0 shadow-sm" id="shift-pagination"></ul></nav>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- TAB 2: JADWAL ADMINISTRASI                 -->
            <!-- ========================================== -->
            <div class="tab-pane fade" id="tab-administrasi" role="tabpanel">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-white pt-4 px-4 pb-3 border-bottom-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                            <i class="fas fa-calendar-alt text-primary"></i> Jam Kerja Administrasi
                        </h5>
                        <button class="btn btn-primary rounded-pill px-3 py-2 fw-semibold shadow-sm d-flex align-items-center gap-2" id="btn-add-admin-schedule">
                            <i class="fas fa-plus"></i> Tambah Jadwal
                        </button>
                    </div>
                    
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-borderless align-middle mb-0">
                                <thead class="bg-light text-secondary">
                                    <tr>
                                        <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 60px;">#</th>
                                        <th class="py-3 text-uppercase small fw-bold">Hari Kerja</th>
                                        <th class="py-3 text-uppercase small fw-bold text-center">Jam Masuk</th>
                                        <th class="py-3 text-uppercase small fw-bold text-center">Jam Pulang</th>
                                        <th class="py-3 text-uppercase small fw-bold text-center">Toleransi</th>
                                        <th class="py-3 text-uppercase small fw-bold">Keterangan</th>
                                        <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 100px;">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-table-body">
                                    <tr>
                                        <td colspan="7" class="text-center py-5 text-muted">
                                            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Memuat jadwal administrasi...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL: SHIFT PELAYANAN                     -->
    <!-- ========================================== -->
    <div class="modal fade" id="modal-shift-form" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="form-shift">
                    
                    <div class="modal-header bg-white border-bottom-0 px-4 pt-4 pb-0">
                        <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2" id="modal-shift-title">
                            <i class="fas fa-clock text-primary"></i> Tambah Shift Pelayanan
                        </h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    
                    <div class="modal-body p-4">
                        <input type="hidden" id="form-shift-id" name="id">
                        
                        <div class="bg-light p-3 rounded-3 mb-3">
                            <label class="form-label fw-semibold text-secondary small mb-1">Kelompok Kerja / Unit <span class="text-danger">*</span></label>
                            <select class="form-select bg-white border-secondary-subtle shadow-sm rounded-2" id="form-shift-kelompok" name="kd_kelompok" required>
                                <option value="">-- Pilih Kelompok Unit --</option>
                            </select>
                        </div>
                        
                        <div class="bg-light p-3 rounded-3 mb-3">
                            <label class="form-label fw-semibold text-secondary small mb-1">Nama Shift Pelayanan <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-shift-nama" name="nama_standarisasi" required placeholder="Contoh: Shift Pagi, Shift Siang">
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Jam Mulai <span class="text-danger">*</span></label>
                                    <input type="time" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-shift-mulai" name="jam_mulai" required value="07:00">
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Jam Selesai <span class="text-danger">*</span></label>
                                    <input type="time" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-shift-selesai" name="jam_selesai" required value="14:00">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row g-3 mb-0">
                            <div class="col-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Durasi Efektif</label>
                                    <div class="input-group">
                                        <input type="number" step="0.5" class="form-control bg-white border-secondary-subtle shadow-sm rounded-start-2" id="form-shift-durasi" name="durasi_jam" value="7.0">
                                        <span class="input-group-text bg-white border-secondary-subtle text-muted rounded-end-2">Jam</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Status</label>
                                    <select class="form-select bg-white border-secondary-subtle shadow-sm rounded-2" id="form-shift-status" name="is_active">
                                        <option value="1">Aktif</option>
                                        <option value="0">Non-Aktif</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-footer bg-light border-top-0 px-4 py-3">
                        <button type="button" class="btn btn-white border border-secondary-subtle text-dark fw-semibold shadow-sm rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary fw-semibold shadow-sm rounded-pill px-4 d-flex align-items-center gap-2" id="btn-save-shift">
                            <i class="fas fa-save"></i> Simpan Shift
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL: ADMINISTRASI                        -->
    <!-- ========================================== -->
    <div class="modal fade" id="modal-admin-form" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="form-admin">
                    
                    <div class="modal-header bg-white border-bottom-0 px-4 pt-4 pb-0">
                        <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2" id="modal-admin-title">
                            <i class="fas fa-calendar-day text-primary"></i> Tambah Jadwal Kantor
                        </h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    
                    <div class="modal-body p-4">
                        <input type="hidden" id="form-admin-id" name="id">
                        
                        <div class="bg-light p-3 rounded-3 mb-3">
                            <label class="form-label fw-semibold text-secondary small mb-1">Hari Kerja <span class="text-danger">*</span></label>
                            <select class="form-select bg-white border-secondary-subtle shadow-sm rounded-2" id="form-admin-hari" name="hari" required>
                                <option value="Senin">Senin</option>
                                <option value="Selasa">Selasa</option>
                                <option value="Rabu">Rabu</option>
                                <option value="Kamis">Kamis</option>
                                <option value="Jumat">Jumat</option>
                                <option value="Sabtu">Sabtu</option>
                                <option value="Minggu">Minggu</option>
                            </select>
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Jam Masuk <span class="text-danger">*</span></label>
                                    <input type="time" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-admin-masuk" name="jam_masuk" required value="07:30">
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Jam Pulang <span class="text-danger">*</span></label>
                                    <input type="time" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-admin-pulang" name="jam_pulang" required value="16:00">
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-light p-3 rounded-3 mb-3">
                            <label class="form-label fw-semibold text-secondary small mb-1">Toleransi Terlambat</label>
                            <div class="input-group">
                                <input type="number" class="form-control bg-white border-secondary-subtle shadow-sm rounded-start-2" id="form-admin-toleransi" name="toleransi_menit" value="15" min="0">
                                <span class="input-group-text bg-white border-secondary-subtle text-muted rounded-end-2">Menit</span>
                            </div>
                            <div class="form-text small text-muted mt-1">Batas toleransi sebelum dikenakan potongan disiplin.</div>
                        </div>
                        
                        <div class="bg-light p-3 rounded-3 mb-0">
                            <label class="form-label fw-semibold text-secondary small mb-1">Keterangan Aturan</label>
                            <input type="text" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-admin-keterangan" name="keterangan" placeholder="Contoh: Jam kerja reguler staf manajemen">
                        </div>
                    </div>
                    
                    <div class="modal-footer bg-light border-top-0 px-4 py-3">
                        <button type="button" class="btn btn-white border border-secondary-subtle text-dark fw-semibold shadow-sm rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary fw-semibold shadow-sm rounded-pill px-4 d-flex align-items-center gap-2" id="btn-save-admin">
                            <i class="fas fa-save"></i> Simpan Jadwal
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</template>

<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';

  let kelompokList = [];
  let shiftState = {
    data: [],
    search: '',
    kdKelompok: '',
    page: 1,
    perPage: 10,
    total: 0
  };
  let adminData = [];

  const loadKelompok = async () => {
    try {
      const resp = await httpGet(`${config.api_url}/konfigurasi/kelompok/list`);
      if (resp && resp.data) {
        kelompokList = resp.data || [];
        
        const filterEl = document.getElementById('filter-shift-kelompok');
        const formEl = document.getElementById('form-shift-kelompok');

        const opts = kelompokList.map(k => `<option value="${k.KD_KELOMPOK}">${k.KELOMPOK}</option>`).join('');

        if (filterEl) {
          filterEl.innerHTML = '<option value="">-- Semua Kelompok Unit --</option>' + opts;
        }
        if (formEl) {
          formEl.innerHTML = '<option value="">-- Pilih Kelompok Unit --</option>' + opts;
        }
      }
    } catch (err) {
      console.error('Error loading kelompok for standarisasi:', err);
    }
  };

  const loadShifts = async () => {
    const tbody = document.getElementById('shift-table-body');
    if (!tbody) return;

    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="text-center py-4 text-muted">
          <div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat standar shift...
        </td>
      </tr>
    `;

    try {
      const params = new URLSearchParams({
        search: shiftState.search,
        kd_kelompok: shiftState.kdKelompok,
        page: shiftState.page,
        per_page: shiftState.perPage
      });

      const resp = await httpGet(`${config.api_url}/konfigurasi/standarisasi/list?${params.toString()}`);
      if (resp && resp.data) {
        shiftState.data = resp.data || [];
        shiftState.total = resp.rows || 0;

        const badgeEl = document.getElementById('badge-total-pelayanan');
        if (badgeEl) badgeEl.textContent = shiftState.total;

        renderShifts();
        renderShiftPagination();
      }
    } catch (err) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center py-4 text-danger">
            <i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat shift: ${err.message}
          </td>
        </tr>
      `;
    }
  };

  const renderShifts = () => {
    const tbody = document.getElementById('shift-table-body');
    if (!tbody) return;

    if (shiftState.data.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center py-4 text-muted">
            <i class="fas fa-info-circle me-2"></i>Tidak ada data shift pelayanan yang sesuai filter.
          </td>
        </tr>
      `;
      return;
    }

    const startIdx = (shiftState.page - 1) * shiftState.perPage;
    let html = '';

    shiftState.data.forEach((s, idx) => {
      const isActive = parseInt(s.is_active) === 1;
      const statusBadge = isActive 
        ? `<span class="badge bg-success-subtle text-success border border-success"><i class="fas fa-check-circle me-1"></i>Aktif</span>`
        : `<span class="badge bg-secondary-subtle text-secondary border"><i class="fas fa-times-circle me-1"></i>Non-Aktif</span>`;

      html += `
        <tr>
          <td class="text-center align-middle">${startIdx + idx + 1}</td>
          <td class="align-middle fw-bold text-dark">${s.nama_kelompok || 'Semua Unit'}</td>
          <td class="align-middle">
            <i class="fas fa-clock text-primary me-2"></i>${s.nama_standarisasi}
          </td>
          <td class="text-center align-middle font-monospace">${s.jam_mulai || '-'}</td>
          <td class="text-center align-middle font-monospace">${s.jam_selesai || '-'}</td>
          <td class="text-center align-middle fw-bold text-primary">${s.durasi_jam || '-'} Jam</td>
          <td class="text-center align-middle">${statusBadge}</td>
          <td class="text-end align-middle pe-3">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-falcon-default btn-edit-shift" data-idx="${idx}" title="Edit Shift">
                <i class="fas fa-edit text-primary"></i>
              </button>
              <button class="btn btn-falcon-default btn-delete-shift" data-id="${s.id_standarisasi}" data-name="${s.nama_standarisasi}" title="Hapus Shift">
                <i class="fas fa-trash-alt text-danger"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    bindShiftActions();
  };

  const renderShiftPagination = () => {
    const pageInfo = document.getElementById('shift-page-info');
    const pagination = document.getElementById('shift-pagination');
    if (!pagination) return;

    const totalPages = Math.ceil(shiftState.total / shiftState.perPage) || 1;
    const from = shiftState.total === 0 ? 0 : (shiftState.page - 1) * shiftState.perPage + 1;
    const to = Math.min(shiftState.page * shiftState.perPage, shiftState.total);

    if (pageInfo) {
      pageInfo.textContent = `Menampilkan ${from} - ${to} dari ${shiftState.total} shift`;
    }

    let html = '';
    html += `
      <li class="page-item ${shiftState.page <= 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" data-page="${shiftState.page - 1}"><i class="fas fa-chevron-left"></i></a>
      </li>
    `;

    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || (p >= shiftState.page - 2 && p <= shiftState.page + 2)) {
        html += `
          <li class="page-item ${p === shiftState.page ? 'active' : ''}">
            <a class="page-link" href="#" data-page="${p}">${p}</a>
          </li>
        `;
      } else if (p === shiftState.page - 3 || p === shiftState.page + 3) {
        html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
      }
    }

    html += `
      <li class="page-item ${shiftState.page >= totalPages ? 'disabled' : ''}">
        <a class="page-link" href="#" data-page="${shiftState.page + 1}"><i class="fas fa-chevron-right"></i></a>
      </li>
    `;

    pagination.innerHTML = html;
    pagination.querySelectorAll('.page-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const p = parseInt(link.getAttribute('data-page'));
        if (p && p >= 1 && p <= totalPages && p !== shiftState.page) {
          shiftState.page = p;
          loadShifts();
        }
      });
    });
  };

  const bindShiftActions = () => {
    document.querySelectorAll('.btn-edit-shift').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = btn.getAttribute('data-idx');
        const s = shiftState.data[idx];
        if (!s) return;

        document.getElementById('modal-shift-title').innerHTML = '<i class="fas fa-edit me-2 text-primary"></i>Edit Shift Pelayanan';
        document.getElementById('form-shift-id').value = s.id_standarisasi;
        document.getElementById('form-shift-kelompok').value = s.kd_kelompok || '';
        document.getElementById('form-shift-nama').value = s.nama_standarisasi;
        document.getElementById('form-shift-mulai').value = s.jam_mulai || '07:00';
        document.getElementById('form-shift-selesai').value = s.jam_selesai || '14:00';
        document.getElementById('form-shift-durasi').value = s.durasi_jam || 7.0;
        document.getElementById('form-shift-status').value = s.is_active || '1';

        const modalEl = document.getElementById('modal-shift-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    });

    document.querySelectorAll('.btn-delete-shift').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');
        if (confirm(`Apakah Anda yakin ingin menghapus shift "${name}"?`)) {
          try {
            const response = await httpPost(`${config.api_url}/konfigurasi/standarisasi/delete/${id}`, { id });
            if (!response || Number(response.code) !== 200) {
              throw new Error(response?.message || response?.status || 'Respons server tidak valid');
            }
            loadShifts();
          } catch (err) {
            alert('Gagal menghapus shift: ' + err.message);
          }
        }
      });
    });
  };

  const loadAdmin = async () => {
    const tbody = document.getElementById('admin-table-body');
    if (!tbody) return;

    try {
      const resp = await httpGet(`${config.api_url}/konfigurasi/administrasi/list`);
      if (resp && resp.data) {
        adminData = resp.data || [];
        const badgeEl = document.getElementById('badge-total-admin');
        if (badgeEl) badgeEl.textContent = adminData.length;

        renderAdmin();
      }
    } catch (err) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-4 text-danger">
            <i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat jadwal administrasi: ${err.message}
          </td>
        </tr>
      `;
    }
  };

  const renderAdmin = () => {
    const tbody = document.getElementById('admin-table-body');
    if (!tbody) return;

    if (adminData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-4 text-muted">Belum ada jadwal kantor administrasi terdaftar.</td>
        </tr>
      `;
      return;
    }

    let html = '';
    adminData.forEach((a, idx) => {
      html += `
        <tr>
          <td class="text-center align-middle">${idx + 1}</td>
          <td class="align-middle fw-bold text-primary">
            <i class="fas fa-calendar-day me-2 text-secondary"></i>${a.hari}
          </td>
          <td class="text-center align-middle font-monospace text-success fw-bold">${a.jam_masuk || '-'}</td>
          <td class="text-center align-middle font-monospace text-danger fw-bold">${a.jam_pulang || '-'}</td>
          <td class="text-center align-middle">
            <span class="badge bg-100 text-dark border">${a.toleransi_menit || 0} Menit</span>
          </td>
          <td class="align-middle text-muted small">${a.keterangan || '-'}</td>
          <td class="text-end align-middle pe-3">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-falcon-default btn-edit-admin" data-idx="${idx}" title="Edit Jadwal">
                <i class="fas fa-edit text-primary"></i>
              </button>
              <button class="btn btn-falcon-default btn-delete-admin" data-id="${a.id}" data-hari="${a.hari}" title="Hapus Jadwal">
                <i class="fas fa-trash-alt text-danger"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    bindAdminActions();
  };

  const bindAdminActions = () => {
    document.querySelectorAll('.btn-edit-admin').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = btn.getAttribute('data-idx');
        const a = adminData[idx];
        if (!a) return;

        document.getElementById('modal-admin-title').innerHTML = '<i class="fas fa-edit me-2 text-primary"></i>Edit Jadwal Kantor';
        document.getElementById('form-admin-id').value = a.id;
        document.getElementById('form-admin-hari').value = a.hari;
        document.getElementById('form-admin-masuk').value = a.jam_masuk || '07:30';
        document.getElementById('form-admin-pulang').value = a.jam_pulang || '16:00';
        document.getElementById('form-admin-toleransi').value = a.toleransi_menit || 15;
        document.getElementById('form-admin-keterangan').value = a.keterangan || '';

        const modalEl = document.getElementById('modal-admin-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    });

    document.querySelectorAll('.btn-delete-admin').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const hari = btn.getAttribute('data-hari');
        if (confirm(`Apakah Anda yakin ingin menghapus jadwal untuk hari "${hari}"?`)) {
          try {
            await httpPost(`${config.api_url}/konfigurasi/administrasi/delete/${id}`, {});
            loadAdmin();
          } catch (err) {
            alert('Gagal menghapus jadwal: ' + err.message);
          }
        }
      });
    });
  };

  const bindEvents = () => {
    // Search shift
    let searchTimer = null;
    const searchShiftInput = document.getElementById('search-shift');
    if (searchShiftInput) {
      searchShiftInput.addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          shiftState.search = e.target.value.trim();
          shiftState.page = 1;
          loadShifts();
        }, 300);
      });
    }

    // Filter shift kelompok
    const filterKelompok = document.getElementById('filter-shift-kelompok');
    if (filterKelompok) {
      filterKelompok.addEventListener('change', (e) => {
        shiftState.kdKelompok = e.target.value;
        shiftState.page = 1;
        loadShifts();
      });
    }

    // Refresh
    const refreshBtn = document.getElementById('btn-refresh-standar');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        loadShifts();
        loadAdmin();
      });
    }

    // Add shift modal
    const addShiftBtn = document.getElementById('btn-add-shift');
    if (addShiftBtn) {
      addShiftBtn.addEventListener('click', () => {
        document.getElementById('modal-shift-title').innerHTML = '<i class="fas fa-plus me-2 text-primary"></i>Tambah Shift Pelayanan';
        document.getElementById('form-shift-id').value = '';
        document.getElementById('form-shift-kelompok').value = '';
        document.getElementById('form-shift-nama').value = '';
        document.getElementById('form-shift-mulai').value = '07:00';
        document.getElementById('form-shift-selesai').value = '14:00';
        document.getElementById('form-shift-durasi').value = '7.0';
        document.getElementById('form-shift-status').value = '1';

        const modalEl = document.getElementById('modal-shift-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    }

    // Submit shift
    const formShift = document.getElementById('form-shift');
    if (formShift) {
      formShift.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('form-shift-id').value;
        const kd_kelompok = document.getElementById('form-shift-kelompok').value;
        const nama_standarisasi = document.getElementById('form-shift-nama').value;
        const jam_mulai = document.getElementById('form-shift-mulai').value;
        const jam_selesai = document.getElementById('form-shift-selesai').value;
        const durasi_jam = document.getElementById('form-shift-durasi').value;
        const is_active = document.getElementById('form-shift-status').value;

        try {
          const response = await httpPost(`${config.api_url}/konfigurasi/standarisasi/save`, {
            id, kd_kelompok, nama_standarisasi, jam_mulai, jam_selesai, durasi_jam, is_active
          });
          if (!response || Number(response.code) !== 200) {
            throw new Error(response?.message || response?.status || 'Respons server tidak valid');
          }

          const modalEl = document.getElementById('modal-shift-form');
          if (modalEl && window.bootstrap) {
            bootstrap.Modal.getInstance(modalEl).hide();
          }
          loadShifts();
        } catch (err) {
          alert('Gagal menyimpan shift: ' + err.message);
        }
      });
    }

    // Add admin modal
    const addAdminBtn = document.getElementById('btn-add-admin-schedule');
    if (addAdminBtn) {
      addAdminBtn.addEventListener('click', () => {
        document.getElementById('modal-admin-title').innerHTML = '<i class="fas fa-plus me-2 text-primary"></i>Tambah Jadwal Kantor';
        document.getElementById('form-admin-id').value = '';
        document.getElementById('form-admin-hari').value = 'Senin';
        document.getElementById('form-admin-masuk').value = '07:30';
        document.getElementById('form-admin-pulang').value = '16:00';
        document.getElementById('form-admin-toleransi').value = '15';
        document.getElementById('form-admin-keterangan').value = '';

        const modalEl = document.getElementById('modal-admin-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    }

    // Submit admin
    const formAdmin = document.getElementById('form-admin');
    if (formAdmin) {
      formAdmin.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('form-admin-id').value;
        const hari = document.getElementById('form-admin-hari').value;
        const jam_masuk = document.getElementById('form-admin-masuk').value;
        const jam_pulang = document.getElementById('form-admin-pulang').value;
        const toleransi_menit = document.getElementById('form-admin-toleransi').value;
        const keterangan = document.getElementById('form-admin-keterangan').value;

        try {
          await httpPost(`${config.api_url}/konfigurasi/administrasi/save`, {
            id, hari, jam_masuk, jam_pulang, toleransi_menit, keterangan
          });
          const modalEl = document.getElementById('modal-admin-form');
          if (modalEl && window.bootstrap) {
            bootstrap.Modal.getInstance(modalEl).hide();
          }
          loadAdmin();
        } catch (err) {
          alert('Gagal menyimpan jadwal kantor: ' + err.message);
        }
      });
    }
  };

  const initModule = async () => {
    bindEvents();
    await loadKelompok();
    loadShifts();
    loadAdmin();
  };

  initModule();
</script>
