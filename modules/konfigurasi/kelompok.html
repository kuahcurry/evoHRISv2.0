<template id="template-konfig-kelompok">
    <div class="container-fluid py-4 px-3 px-md-4">

        <!-- HEADER -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h3 class="fw-bold text-dark mb-1">Level & Kelompok Pengguna</h3>
                <p class="text-secondary mb-0">Konfigurasi struktur hierarki peran akses (Role Level) dan kelompok kerja unit fungsional RS.</p>
            </div>
            <div>
                <button class="btn btn-white border border-secondary-subtle shadow-sm rounded-pill px-3 py-2 text-dark fw-semibold" id="btn-refresh-all">
                    <i class="fas fa-sync-alt text-primary me-2"></i>Refresh Data
                </button>
            </div>
        </div>

        <!-- TABS NAVIGATION -->
        <div class="bg-white rounded-5 shadow-sm border p-1 d-inline-flex gap-1 mb-4">
            <ul class="nav nav-pills border-0" id="kelompokTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-semibold rounded-5 px-4 py-2" id="tab-roles-link" data-bs-toggle="tab" data-bs-target="#tab-roles" type="button" role="tab">
                        <i class="fas fa-user-tag me-2"></i>Peran & Level 
                        <span id="badge-total-roles" class="badge bg-secondary ms-2 rounded-pill">0</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-semibold rounded-5 px-4 py-2" id="tab-kelompok-link" data-bs-toggle="tab" data-bs-target="#tab-kelompok" type="button" role="tab">
                        <i class="fas fa-layer-group me-2"></i>Kelompok Kerja
                        <span id="badge-total-kelompok" class="badge bg-secondary ms-2 rounded-pill">0</span>
                    </button>
                </li>
            </ul>
        </div>

        <!-- TAB CONTENT -->
        <div class="tab-content" id="kelompokTabsContent">
            
            <!-- ========================================== -->
            <!-- TAB 1: PERAN & LEVEL                       -->
            <!-- ========================================== -->
            <div class="tab-pane fade show active" id="tab-roles" role="tabpanel">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-white pt-4 px-4 pb-3 border-bottom-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                            <i class="fas fa-list text-primary"></i> Daftar Peran & Level Sistem
                        </h5>
                        <button class="btn btn-primary rounded-pill px-3 py-2 fw-semibold shadow-sm d-flex align-items-center gap-2" id="btn-add-role">
                            <i class="fas fa-plus"></i> Tambah Level
                        </button>
                    </div>
                    
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-borderless align-middle mb-0">
                                <thead class="bg-light text-secondary">
                                    <tr>
                                        <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 60px;">#</th>
                                        <th class="py-3 text-uppercase small fw-bold" style="width: 120px;">Kode Level</th>
                                        <th class="py-3 text-uppercase small fw-bold">Nama Peran / Level</th>
                                        <th class="py-3 text-uppercase small fw-bold">Bagian / Unit</th>
                                        <th class="py-3 text-uppercase small fw-bold">Sub Bagian</th>
                                        <th class="py-3 text-uppercase small fw-bold text-center">Jumlah Akun</th>
                                        <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 100px;">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="roles-table-body">
                                    <tr>
                                        <td colspan="7" class="text-center py-5 text-muted">
                                            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Memuat peran pengguna...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- TAB 2: KELOMPOK KERJA                      -->
            <!-- ========================================== -->
            <div class="tab-pane fade" id="tab-kelompok" role="tabpanel">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-white pt-4 px-4 pb-3 border-bottom-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                            <i class="fas fa-layer-group text-primary"></i> Daftar Kelompok Kerja
                        </h5>
                        <button class="btn btn-primary rounded-pill px-3 py-2 fw-semibold shadow-sm d-flex align-items-center gap-2" id="btn-add-kelompok">
                            <i class="fas fa-plus"></i> Tambah Kelompok
                        </button>
                    </div>
                    
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-borderless align-middle mb-0">
                                <thead class="bg-light text-secondary">
                                    <tr>
                                        <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 60px;">#</th>
                                        <th class="py-3 text-uppercase small fw-bold" style="width: 150px;">Kode Kelompok</th>
                                        <th class="py-3 text-uppercase small fw-bold">Nama Kelompok Kerja</th>
                                        <th class="py-3 text-uppercase small fw-bold text-center">Jadwal Shift Aktif</th>
                                        <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 100px;">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="kelompok-table-body">
                                    <tr>
                                        <td colspan="5" class="text-center py-5 text-muted">
                                            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Memuat kelompok kerja...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL: ROLE FORM                           -->
    <!-- ========================================== -->
    <div class="modal fade" id="modal-role-form" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="form-role">
                    
                    <div class="modal-header bg-white border-bottom-0 px-4 pt-4 pb-0">
                        <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2" id="modal-role-title">
                            <i class="fas fa-user-tag text-primary"></i> Tambah Peran Akses
                        </h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body p-4">
                        <input type="hidden" id="form-role-id" name="ID">
                        
                        <div class="bg-light p-3 rounded-3 mb-3">
                            <label class="form-label fw-semibold text-secondary small mb-1">Kode Level <span class="text-danger">*</span></label>
                            <input type="number" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-role-kd" name="KD_LEVEL" required min="1" placeholder="Contoh: 1, 2, 3">
                            <div class="form-text small text-muted mt-1">Angka urutan tingkatan level otoritas di sistem.</div>
                        </div>

                        <div class="bg-light p-3 rounded-3 mb-3">
                            <label class="form-label fw-semibold text-secondary small mb-1">Nama Level / Peran <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-role-name" name="LEVEL" required placeholder="Contoh: Administrator, Ka. Ruangan">
                        </div>

                        <div class="row g-3 mb-0">
                            <div class="col-md-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Bagian / Bidang</label>
                                    <input type="text" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-role-bagian" name="BAGIAN" placeholder="Opsional">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Sub Bagian</label>
                                    <input type="text" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-role-subbagian" name="SUB_BAGIAN" placeholder="Opsional">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer bg-light border-top-0 px-4 py-3">
                        <button type="button" class="btn btn-white border border-secondary-subtle text-dark fw-semibold shadow-sm rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary fw-semibold shadow-sm rounded-pill px-4 d-flex align-items-center gap-2" id="btn-save-role">
                            <i class="fas fa-save"></i> Simpan Peran
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL: KELOMPOK FORM                       -->
    <!-- ========================================== -->
    <div class="modal fade" id="modal-kelompok-form" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="form-kelompok">
                    
                    <div class="modal-header bg-white border-bottom-0 px-4 pt-4 pb-0">
                        <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2" id="modal-kelompok-title">
                            <i class="fas fa-layer-group text-primary"></i> Tambah Kelompok Kerja
                        </h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body p-4">
                        <input type="hidden" id="form-kelompok-id" name="KD_KELOMPOK">
                        
                        <div class="bg-light p-3 rounded-3 mb-0">
                            <label class="form-label fw-semibold text-secondary small mb-1">Nama Kelompok Kerja <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-kelompok-name" name="KELOMPOK" required placeholder="Contoh: Rawat Inap, ICU, Farmasi">
                            <div class="form-text small text-muted mt-1">Unit atau kelompok penugasan untuk rotasi shift & jadwal absensi.</div>
                        </div>
                    </div>

                    <div class="modal-footer bg-light border-top-0 px-4 py-3">
                        <button type="button" class="btn btn-white border border-secondary-subtle text-dark fw-semibold shadow-sm rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary fw-semibold shadow-sm rounded-pill px-4 d-flex align-items-center gap-2" id="btn-save-kelompok">
                            <i class="fas fa-save"></i> Simpan Kelompok
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</template>

<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';

  let rolesData = [];
  let kelompokData = [];

  const loadRoles = async () => {
    const tbody = document.getElementById('roles-table-body');
    if (!tbody) return;

    try {
      const resp = await httpGet(`${config.api_url}/konfigurasi/roles/list`);
      if (resp && resp.data) {
        rolesData = resp.data || [];
        const badgeEl = document.getElementById('badge-total-roles');
        if (badgeEl) badgeEl.textContent = rolesData.length;

        renderRoles();
      }
    } catch (err) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-4 text-danger">
            <i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat peran: ${err.message}
          </td>
        </tr>
      `;
    }
  };

  const renderRoles = () => {
    const tbody = document.getElementById('roles-table-body');
    if (!tbody) return;

    if (rolesData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-4 text-muted">Belum ada peran / level pengguna terdaftar.</td>
        </tr>
      `;
      return;
    }

    let html = '';
    rolesData.forEach((r, idx) => {
      const userCount = parseInt(r.user_count) || 0;
      html += `
        <tr>
          <td class="text-center align-middle">${idx + 1}</td>
          <td class="align-middle"><code>${r.KD_LEVEL}</code></td>
          <td class="align-middle fw-bold text-dark">
            ${r.LEVEL}
            ${r.ID == 13 ? '<span class="badge bg-primary ms-2">Administrator</span>' : ''}
          </td>
          <td class="align-middle">${r.BAGIAN || '-'}</td>
          <td class="align-middle">${r.SUB_BAGIAN || '-'}</td>
          <td class="text-center align-middle">
            <span class="badge bg-100 text-dark border">${userCount} Akun</span>
          </td>
          <td class="text-end align-middle pe-3">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-falcon-default btn-edit-role" data-idx="${idx}" title="Edit Role">
                <i class="fas fa-edit text-primary"></i>
              </button>
              <button class="btn btn-falcon-default btn-delete-role" data-id="${r.ID}" data-name="${r.LEVEL}" ${userCount > 0 ? 'disabled title="Masih memiliki user aktif"' : 'title="Hapus Role"'}>
                <i class="fas fa-trash-alt text-danger"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    bindRolesEvents();
  };

  const bindRolesEvents = () => {
    document.querySelectorAll('.btn-edit-role').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = btn.getAttribute('data-idx');
        const r = rolesData[idx];
        if (!r) return;

        document.getElementById('modal-role-title').innerHTML = '<i class="fas fa-edit me-2 text-primary"></i>Edit Peran Akses';
        document.getElementById('form-role-id').value = r.ID;
        document.getElementById('form-role-kd').value = r.KD_LEVEL;
        document.getElementById('form-role-name').value = r.LEVEL;
        document.getElementById('form-role-bagian').value = r.BAGIAN || '';
        document.getElementById('form-role-subbagian').value = r.SUB_BAGIAN || '';

        const modalEl = document.getElementById('modal-role-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    });

    document.querySelectorAll('.btn-delete-role').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');
        if (confirm(`Apakah Anda yakin ingin menghapus peran "${name}"?`)) {
          try {
            const response = await httpPost(`${config.api_url}/konfigurasi/roles/delete/${id}`, { id });
            if (!response || Number(response.code) !== 200) {
              throw new Error(response?.message || response?.status || 'Respons server tidak valid');
            }
            loadRoles();
          } catch (err) {
            alert('Gagal menghapus peran: ' + err.message);
          }
        }
      });
    });
  };

  const loadKelompok = async () => {
    const tbody = document.getElementById('kelompok-table-body');
    if (!tbody) return;

    try {
      const resp = await httpGet(`${config.api_url}/konfigurasi/kelompok/list`);
      if (resp && resp.data) {
        kelompokData = resp.data || [];
        const badgeEl = document.getElementById('badge-total-kelompok');
        if (badgeEl) badgeEl.textContent = kelompokData.length;

        renderKelompok();
      }
    } catch (err) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="text-center py-4 text-danger">
            <i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat kelompok: ${err.message}
          </td>
        </tr>
      `;
    }
  };

  const renderKelompok = () => {
    const tbody = document.getElementById('kelompok-table-body');
    if (!tbody) return;

    if (kelompokData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="text-center py-4 text-muted">Belum ada kelompok kerja terdaftar.</td>
        </tr>
      `;
      return;
    }

    let html = '';
    kelompokData.forEach((k, idx) => {
      const shiftCount = parseInt(k.shift_count) || 0;
      html += `
        <tr>
          <td class="text-center align-middle">${idx + 1}</td>
          <td class="align-middle"><code>${k.KD_KELOMPOK}</code></td>
          <td class="align-middle fw-bold text-dark">${k.KELOMPOK}</td>
          <td class="text-center align-middle">
            <span class="badge bg-100 text-info border">${shiftCount} Shift Terdaftar</span>
          </td>
          <td class="text-end align-middle pe-3">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-falcon-default btn-edit-kelompok" data-idx="${idx}" title="Edit Kelompok">
                <i class="fas fa-edit text-primary"></i>
              </button>
              <button class="btn btn-falcon-default btn-delete-kelompok" data-id="${k.KD_KELOMPOK}" data-name="${k.KELOMPOK}" title="Hapus Kelompok">
                <i class="fas fa-trash-alt text-danger"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    bindKelompokEvents();
  };

  const bindKelompokEvents = () => {
    document.querySelectorAll('.btn-edit-kelompok').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = btn.getAttribute('data-idx');
        const k = kelompokData[idx];
        if (!k) return;

        document.getElementById('modal-kelompok-title').innerHTML = '<i class="fas fa-edit me-2 text-primary"></i>Edit Kelompok Kerja';
        document.getElementById('form-kelompok-id').value = k.KD_KELOMPOK;
        document.getElementById('form-kelompok-name').value = k.KELOMPOK;

        const modalEl = document.getElementById('modal-kelompok-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    });

    document.querySelectorAll('.btn-delete-kelompok').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');
        if (confirm(`Apakah Anda yakin ingin menghapus kelompok "${name}"?`)) {
          try {
            const response = await httpPost(`${config.api_url}/konfigurasi/kelompok/delete/${id}`, { id });
            if (!response || Number(response.code) !== 200) {
              throw new Error(response?.message || response?.status || 'Respons server tidak valid');
            }
            loadKelompok();
          } catch (err) {
            alert('Gagal menghapus kelompok: ' + err.message);
          }
        }
      });
    });
  };

  const bindGlobalEvents = () => {
    // Refresh all
    const refreshBtn = document.getElementById('btn-refresh-all');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        loadRoles();
        loadKelompok();
      });
    }

    // Add role
    const addRoleBtn = document.getElementById('btn-add-role');
    if (addRoleBtn) {
      addRoleBtn.addEventListener('click', () => {
        document.getElementById('modal-role-title').innerHTML = '<i class="fas fa-plus me-2 text-primary"></i>Tambah Peran Akses';
        document.getElementById('form-role-id').value = '';
        document.getElementById('form-role-kd').value = (rolesData.length + 1);
        document.getElementById('form-role-name').value = '';
        document.getElementById('form-role-bagian').value = '';
        document.getElementById('form-role-subbagian').value = '';

        const modalEl = document.getElementById('modal-role-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    }

    // Submit role form
    const formRole = document.getElementById('form-role');
    if (formRole) {
      formRole.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ID = document.getElementById('form-role-id').value;
        const KD_LEVEL = document.getElementById('form-role-kd').value;
        const LEVEL = document.getElementById('form-role-name').value;
        const BAGIAN = document.getElementById('form-role-bagian').value;
        const SUB_BAGIAN = document.getElementById('form-role-subbagian').value;

        try {
          await httpPost(`${config.api_url}/konfigurasi/roles/save`, { ID, KD_LEVEL, LEVEL, BAGIAN, SUB_BAGIAN });
          const modalEl = document.getElementById('modal-role-form');
          if (modalEl && window.bootstrap) {
            bootstrap.Modal.getInstance(modalEl).hide();
          }
          loadRoles();
        } catch (err) {
          alert('Gagal menyimpan peran: ' + err.message);
        }
      });
    }

    // Add kelompok
    const addKelompokBtn = document.getElementById('btn-add-kelompok');
    if (addKelompokBtn) {
      addKelompokBtn.addEventListener('click', () => {
        document.getElementById('modal-kelompok-title').innerHTML = '<i class="fas fa-plus me-2 text-primary"></i>Tambah Kelompok Kerja';
        document.getElementById('form-kelompok-id').value = '';
        document.getElementById('form-kelompok-name').value = '';

        const modalEl = document.getElementById('modal-kelompok-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    }

    // Submit kelompok form
    const formKelompok = document.getElementById('form-kelompok');
    if (formKelompok) {
      formKelompok.addEventListener('submit', async (e) => {
        e.preventDefault();
        const KD_KELOMPOK = document.getElementById('form-kelompok-id').value;
        const KELOMPOK = document.getElementById('form-kelompok-name').value;

        try {
          await httpPost(`${config.api_url}/konfigurasi/kelompok/save`, { KD_KELOMPOK, KELOMPOK });
          const modalEl = document.getElementById('modal-kelompok-form');
          if (modalEl && window.bootstrap) {
            bootstrap.Modal.getInstance(modalEl).hide();
          }
          loadKelompok();
        } catch (err) {
          alert('Gagal menyimpan kelompok: ' + err.message);
        }
      });
    }
  };

  const initModule = () => {
    bindGlobalEvents();
    loadRoles();
    loadKelompok();
  };

  initModule();
</script>
