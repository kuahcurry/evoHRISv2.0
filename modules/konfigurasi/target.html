<template id="template-konfig-target">
    <div class="container-fluid py-4 px-3 px-md-4 bg-light rounded-2 ">

        <!-- HEADER -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h3 class="fw-bold text-dark mb-1">Konfigurasi Target SKP</h3>
                <p class="text-secondary mb-0">Pengaturan kuota target jam kerja efektif bulanan per jenjang eselon dan jabatan fungsional RS.</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-white border border-secondary-subtle shadow-sm rounded-pill px-3 py-2 text-dark fw-semibold" id="btn-refresh-target">
                    <i class="fas fa-sync-alt text-primary me-2"></i>Refresh
                </button>
                <button class="btn btn-primary rounded-pill px-3 py-2 fw-semibold shadow-sm d-flex align-items-center gap-2" id="btn-add-target">
                    <i class="fas fa-plus"></i> Tambah Target
                </button>
            </div>
        </div>

        <!-- STAT CARDS -->
        <div class="row g-4 mb-4">
            
            <!-- Card 1 -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 d-flex align-items-center gap-3">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 56px; height: 56px;">
                            <i class="fas fa-sitemap fs-5"></i>
                        </div>
                        <div>
                            <div class="text-secondary fw-semibold text-uppercase small mb-1" style="letter-spacing: 0.5px;">Total Jenjang</div>
                            <h3 class="mb-0 fw-bold text-dark" id="stat-total-target">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 d-flex align-items-center gap-3">
                        <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 56px; height: 56px;">
                            <i class="fas fa-hourglass-half fs-5"></i>
                        </div>
                        <div>
                            <div class="text-secondary fw-semibold text-uppercase small mb-1" style="letter-spacing: 0.5px;">Target Maksimal</div>
                            <h3 class="mb-0 fw-bold text-dark" id="stat-max-target">0 <span class="fs-5 fw-normal text-muted">Jam</span></h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 d-flex align-items-center gap-3">
                        <div class="bg-info bg-opacity-10 text-info rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 56px; height: 56px;">
                            <i class="fas fa-calculator fs-5"></i>
                        </div>
                        <div>
                            <div class="text-secondary fw-semibold text-uppercase small mb-1" style="letter-spacing: 0.5px;">Rata-Rata Target</div>
                            <h3 class="mb-0 fw-bold text-dark" id="stat-avg-target">0 <span class="fs-5 fw-normal text-muted">Jam</span></h3>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- MAIN TABLE -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-header bg-white pt-4 px-4 pb-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                    <i class="fas fa-table text-primary"></i> Ketentuan Beban Kerja
                </h5>
            </div>
            
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-borderless align-middle mb-0">
                        <thead class="bg-light text-secondary">
                            <tr>
                                <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 60px;">#</th>
                                <th class="py-3 text-uppercase small fw-bold" style="width: 25%;">Jenjang Eselon / Jabatan</th>
                                <th class="py-3 text-uppercase small fw-bold text-center" style="width: 18%;">Target Jam</th>
                                <th class="py-3 text-uppercase small fw-bold text-center" style="width: 18%;">Target Menit</th>
                                <th class="py-3 text-uppercase small fw-bold">Keterangan</th>
                                <th class="py-3 px-4 text-uppercase small fw-bold text-center" style="width: 100px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="target-table-body">
                            <tr>
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Memuat data target SKP...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- MODAL: ADD/EDIT TARGET                     -->
    <!-- ========================================== -->
    <div class="modal fade" id="modal-target-form" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="form-target">
                    
                    <div class="modal-header bg-white border-bottom-0 px-4 pt-4 pb-0">
                        <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2" id="modal-target-title">
                            <i class="fas fa-bullseye text-primary"></i> Tambah Target Eselon
                        </h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    
                    <div class="modal-body p-4">
                        <input type="hidden" id="form-target-id" name="id_target">
                        
                        <div class="bg-light p-3 rounded-3 mb-3">
                            <label class="form-label fw-semibold text-secondary small mb-1">Jenjang Eselon / Jabatan <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-target-eselon" name="eselon" required placeholder="Contoh: Eselon II, Dokter, Perawat...">
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Target Jam <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="number" step="1" class="form-control bg-white border-secondary-subtle shadow-sm rounded-start-2" id="form-target-jam" name="target_jam" required min="1" value="100">
                                        <span class="input-group-text bg-white border-secondary-subtle text-muted rounded-end-2">Jam</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="bg-light p-3 rounded-3 h-100">
                                    <label class="form-label fw-semibold text-secondary small mb-1">Target Menit <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="number" step="1" class="form-control bg-white border-secondary-subtle shadow-sm rounded-start-2" id="form-target-menit" name="target_menit" required min="60" value="6000">
                                        <span class="input-group-text bg-white border-secondary-subtle text-muted rounded-end-2">Mnt</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-light p-3 rounded-3 mb-0">
                            <label class="form-label fw-semibold text-secondary small mb-1">Keterangan / Regulasi Acuan</label>
                            <textarea class="form-control bg-white border-secondary-subtle shadow-sm rounded-2" id="form-target-keterangan" name="keterangan" rows="2" placeholder="Dasar peraturan / standar MenPAN-RB..."></textarea>
                        </div>
                    </div>
                    
                    <div class="modal-footer bg-light border-top-0 px-4 py-3">
                        <button type="button" class="btn btn-white border border-secondary-subtle text-dark fw-semibold shadow-sm rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary fw-semibold shadow-sm rounded-pill px-4 d-flex align-items-center gap-2" id="btn-save-target">
                            <i class="fas fa-save"></i> Simpan Target
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</template>

<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';

  let targetsData = [];

  const loadTargets = async () => {
    const tbody = document.getElementById('target-table-body');
    if (!tbody) return;

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="text-center py-4 text-muted">
          <div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data target SKP...
        </td>
      </tr>
    `;

    try {
      const resp = await httpGet(`${config.api_url}/konfigurasi/target/list`);
      if (resp && resp.data) {
        targetsData = resp.data || [];
        renderStats();
        renderTable();
      }
    } catch (err) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="text-center py-4 text-danger">
            <i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat target: ${err.message}
          </td>
        </tr>
      `;
    }
  };

  const renderStats = () => {
    const totalEl = document.getElementById('stat-total-target');
    const maxEl = document.getElementById('stat-max-target');
    const avgEl = document.getElementById('stat-avg-target');

    if (totalEl) totalEl.textContent = targetsData.length;

    if (targetsData.length > 0) {
      let maxJam = 0;
      let sumJam = 0;
      targetsData.forEach(t => {
        const j = parseFloat(t.target_jam) || (parseFloat(t.target_menit) / 60) || 0;
        if (j > maxJam) maxJam = j;
        sumJam += j;
      });

      const avg = (sumJam / targetsData.length).toFixed(1);
      if (maxEl) maxEl.textContent = `${maxJam} Jam`;
      if (avgEl) avgEl.textContent = `${avg} Jam`;
    }
  };

  const renderTable = () => {
    const tbody = document.getElementById('target-table-body');
    if (!tbody) return;

    if (targetsData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="text-center py-4 text-muted">Belum ada target SKP eselon terdaftar.</td>
        </tr>
      `;
      return;
    }

    let html = '';
    targetsData.forEach((t, idx) => {
      const jam = t.target_jam ? t.target_jam : (t.target_menit ? Math.round(t.target_menit / 60) : '-');
      const menit = t.target_menit ? Number(t.target_menit).toLocaleString('id-ID') : '-';

      html += `
        <tr>
          <td class="text-center align-middle">${idx + 1}</td>
          <td class="align-middle fw-bold text-dark">
            <span class="badge bg-100 text-primary border border-200 me-2"><i class="fas fa-award"></i></span>
            ${t.eselon}
          </td>
          <td class="text-center align-middle">
            <span class="badge bg-primary fs-0 px-3 py-1">${jam} Jam</span>
          </td>
          <td class="text-center align-middle font-monospace text-secondary">${menit} Menit</td>
          <td class="align-middle text-muted small">${t.keterangan || '-'}</td>
          <td class="text-end align-middle pe-3">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-falcon-default btn-edit-target" data-idx="${idx}" title="Edit Target">
                <i class="fas fa-edit text-primary"></i>
              </button>
              <button class="btn btn-falcon-default btn-delete-target" data-id="${t.id_target}" data-eselon="${t.eselon}" title="Hapus Target">
                <i class="fas fa-trash-alt text-danger"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    bindTableEvents();
  };

  const bindTableEvents = () => {
    document.querySelectorAll('.btn-edit-target').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = btn.getAttribute('data-idx');
        const t = targetsData[idx];
        if (!t) return;

        document.getElementById('modal-target-title').innerHTML = '<i class="fas fa-edit me-2 text-primary"></i>Edit Target Eselon';
        document.getElementById('form-target-id').value = t.id_target;
        document.getElementById('form-target-eselon').value = t.eselon;
        document.getElementById('form-target-jam').value = t.target_jam || Math.round((t.target_menit || 0) / 60);
        document.getElementById('form-target-menit').value = t.target_menit || ((t.target_jam || 0) * 60);
        document.getElementById('form-target-keterangan').value = t.keterangan || '';

        const modalEl = document.getElementById('modal-target-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    });

    document.querySelectorAll('.btn-delete-target').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const eselon = btn.getAttribute('data-eselon');
        if (confirm(`Apakah Anda yakin ingin menghapus konfigurasi target untuk "${eselon}"?`)) {
          try {
            await httpPost(`${config.api_url}/konfigurasi/target/delete/${id}`, {});
            loadTargets();
          } catch (err) {
            alert('Gagal menghapus target: ' + err.message);
          }
        }
      });
    });
  };

  const bindGlobalEvents = () => {
    // Refresh
    const refreshBtn = document.getElementById('btn-refresh-target');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        loadTargets();
      });
    }

    // Add target button
    const addBtn = document.getElementById('btn-add-target');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        document.getElementById('modal-target-title').innerHTML = '<i class="fas fa-plus me-2 text-primary"></i>Tambah Target Eselon';
        document.getElementById('form-target-id').value = '';
        document.getElementById('form-target-eselon').value = '';
        document.getElementById('form-target-jam').value = '100';
        document.getElementById('form-target-menit').value = '6000';
        document.getElementById('form-target-keterangan').value = '';

        const modalEl = document.getElementById('modal-target-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      });
    }

    // Auto calculate hours to minutes
    const jamInput = document.getElementById('form-target-jam');
    const menitInput = document.getElementById('form-target-menit');
    if (jamInput && menitInput) {
      jamInput.addEventListener('input', () => {
        const j = parseFloat(jamInput.value) || 0;
        menitInput.value = Math.round(j * 60);
      });
      menitInput.addEventListener('input', () => {
        const m = parseFloat(menitInput.value) || 0;
        jamInput.value = (m / 60).toFixed(1);
      });
    }

    // Submit form
    const formTarget = document.getElementById('form-target');
    if (formTarget) {
      formTarget.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id_target = document.getElementById('form-target-id').value;
        const eselon = document.getElementById('form-target-eselon').value;
        const target_jam = document.getElementById('form-target-jam').value;
        const target_menit = document.getElementById('form-target-menit').value;
        const keterangan = document.getElementById('form-target-keterangan').value;

        try {
          await httpPost(`${config.api_url}/konfigurasi/target/save`, {
            id_target, eselon, target_jam, target_menit, keterangan
          });
          const modalEl = document.getElementById('modal-target-form');
          if (modalEl && window.bootstrap) {
            bootstrap.Modal.getInstance(modalEl).hide();
          }
          loadTargets();
        } catch (err) {
          alert('Gagal menyimpan target: ' + err.message);
        }
      });
    }
  };

  const initModule = () => {
    bindGlobalEvents();
    loadTargets();
  };

  initModule();
</script>
