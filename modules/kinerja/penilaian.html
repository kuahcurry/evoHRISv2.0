<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';

  let rawPenilaianData = [];
  let filteredPenilaianData = [];
  let masterPerilaku = [];
  let masterPegawai = [];
  let currentPage = 1;
  const pageSize = 15;

  const tag = 'kinerja_penilaian';

  const initModule = () => {
    bindEvents();
    loadData();
    loadMaster();
  };

  const loadMaster = async () => {
    try {
      const res = await httpGet(`${config.api_url}/kinerja/master`);
      if (res && res.code === 200 && res.data) {
        masterPerilaku = res.data.master_perilaku || [];
      }

      const resPeg = await httpGet(`${config.api_url}/pegawai/list?limit=500`);
      if (resPeg && resPeg.code === 200 && resPeg.data) {
        masterPegawai = Array.isArray(resPeg.data) ? resPeg.data : (resPeg.data.data || []);
        populatePegawaiSelect();
      }
    } catch (e) {
      console.warn('Master load error:', e);
    }
  };

  const populatePegawaiSelect = () => {
    const sel = document.getElementById('modal-eval-pegawai');
    if (!sel) return;
    let html = '<option value="">-- Pilih Pegawai --</option>';
    masterPegawai.forEach(p => {
      const nipStr = p.NIP ? ` (${p.NIP})` : '';
      html += `<option value="${p.ID_PEGAWAI || p.NIP}">${p.NAMA || p.nama}${nipStr}</option>`;
    });
    sel.innerHTML = html;
  };

  const loadData = async () => {
    const tbody = document.getElementById('tbody-penilaian');
    const spinner = document.getElementById('loading-penilaian');

    if (spinner) spinner.classList.remove('d-none');
    if (tbody) tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data Penilaian Kinerja & Evaluasi Perilaku...</td></tr>';

    try {
      const periode = document.getElementById('filter-periode-penilaian')?.value || '';
      const search = document.getElementById('search-penilaian')?.value || '';

      let url = `${config.api_url}/kinerja/penilaian?limit=500`;
      if (periode) url += `&periode=${encodeURIComponent(periode)}`;
      if (search) url += `&search=${encodeURIComponent(search)}`;

      const res = await httpGet(url);
      if (res && res.code === 200) {
        const dataObj = res.data;
        rawPenilaianData = Array.isArray(dataObj) ? dataObj : (dataObj.data || []);
        filteredPenilaianData = [...rawPenilaianData];

        updateSummaryCards(dataObj.total || rawPenilaianData.length);
        currentPage = 1;
        renderTable();
      } else {
        if (tbody) tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Gagal memuat rekapitulasi penilaian</td></tr>';
      }
    } catch (err) {
      console.error('Error load penilaian:', err);
      if (tbody) tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">Terjadi kesalahan: ${err.message}</td></tr>`;
    } finally {
      if (spinner) spinner.classList.add('d-none');
    }
  };

  const updateSummaryCards = (totalCount) => {
    const elTotal = document.getElementById('card-stat-pen-total-eval');
    const elAvg = document.getElementById('card-stat-pen-avg-score');
    const elSangatBaik = document.getElementById('card-stat-pen-sangat-baik');
    const elBaik = document.getElementById('card-stat-pen-baik');

    const total = totalCount || rawPenilaianData.length;
    let sumScore = 0;
    let countValid = 0;
    let sangatBaik = 0;
    let baik = 0;

    rawPenilaianData.forEach(r => {
      const val = parseFloat(r.rata_nilai || 0);
      if (val > 0) {
        sumScore += val;
        countValid++;
      }
      if (r.predikat === 'Sangat Baik') sangatBaik++;
      else if (r.predikat === 'Baik') baik++;
    });

    const avg = countValid > 0 ? (sumScore / countValid).toFixed(2) : '0.00';

    if (elTotal) elTotal.textContent = total.toLocaleString();
    if (elAvg) elAvg.textContent = avg;
    if (elSangatBaik) elSangatBaik.textContent = sangatBaik.toLocaleString();
    if (elBaik) elBaik.textContent = baik.toLocaleString();

    const badge = document.getElementById('badge-total-penilaian');
    if (badge) badge.textContent = `${total} Evaluasi Kinerja`;
  };

  const renderTable = () => {
    const tbody = document.getElementById('tbody-penilaian');
    if (!tbody) return;

    if (filteredPenilaianData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted"><i class="fas fa-star-half me-2"></i>Tidak ada data evaluasi kinerja yang ditemukan</td></tr>';
      renderPagination(0);
      return;
    }

    const start = (currentPage - 1) * pageSize;
    const end = start + pageSize;
    const pageRows = filteredPenilaianData.slice(start, end);

    let html = '';
    pageRows.forEach((row, idx) => {
      const num = start + idx + 1;
      const namaPegawai = row.nama_pegawai || (row.id_pegawai ? `Pegawai #${row.id_pegawai}` : 'Pegawai Rumah Sakit');
      const nip = row.NIP || '-';
      const bagian = row.nama_bagian || '-';
      const periode = row.periode || '-';
      const rataNilai = parseFloat(row.rata_nilai || 0).toFixed(2);
      const jmlKriteria = row.jml_kriteria || '1';
      const predikat = row.predikat || 'Baik';
      const predikatClass = row.predikat_class || 'bg-soft-success text-success';

      html += `
        <tr>
          <td class="text-center text-muted fw-bold">${num}</td>
          <td>
            <div class="fw-bold text-dark">${namaPegawai}</div>
            <div class="text-muted small">NIP: ${nip}</div>
          </td>
          <td>
            <span class="badge bg-light text-primary border">${bagian}</span>
          </td>
          <td class="text-center fw-semibold text-dark">${periode}</td>
          <td class="text-center">
            <span class="badge bg-soft-info text-info fs-6 px-2 py-1">${rataNilai}</span>
          </td>
          <td class="text-center small text-muted">${jmlKriteria} Aspek</td>
          <td class="text-center">
            <span class="badge ${predikatClass} px-3 py-1 fs-7">${predikat}</span>
          </td>
          <td class="text-center">
            <button class="btn btn-outline-primary btn-sm btn-detail-penilaian" data-idx="${start + idx}" title="Raport Prestasi Kinerja">
              <i class="fas fa-file-invoice me-1"></i>Raport
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    renderPagination(filteredPenilaianData.length);

    tbody.querySelectorAll('.btn-detail-penilaian').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.getAttribute('data-idx'));
        const item = filteredPenilaianData[idx];
        if (item) showRaportModal(item);
      });
    });
  };

  const renderPagination = (totalRows) => {
    const el = document.getElementById('pagination-penilaian');
    const info = document.getElementById('pagination-info-penilaian');
    if (!el) return;

    const totalPages = Math.ceil(totalRows / pageSize) || 1;
    const start = totalRows === 0 ? 0 : (currentPage - 1) * pageSize + 1;
    const end = Math.min(currentPage * pageSize, totalRows);

    if (info) info.textContent = `Menampilkan ${start} - ${end} dari ${totalRows} data`;

    let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage - 1}">«</a></li>`;
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || (p >= currentPage - 2 && p <= currentPage + 2)) {
        html += `<li class="page-item ${p === currentPage ? 'active' : ''}"><a class="page-link" href="#" data-page="${p}">${p}</a></li>`;
      } else if (p === currentPage - 3 || p === currentPage + 3) {
        html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
      }
    }
    html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage + 1}">»</a></li>`;
    el.innerHTML = html;

    el.querySelectorAll('.page-link').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const p = parseInt(btn.getAttribute('data-page'));
        if (p && p !== currentPage && p >= 1 && p <= totalPages) {
          currentPage = p;
          renderTable();
        }
      });
    });
  };

  const showRaportModal = (item) => {
    const modalEl = document.getElementById('modal-raport-penilaian');
    if (!modalEl || !window.bootstrap) return;

    document.getElementById('raport-nama').textContent = item.nama_pegawai || (item.id_pegawai ? `Pegawai #${item.id_pegawai}` : 'Pegawai Rumah Sakit');
    document.getElementById('raport-nip').textContent = item.NIP || '-';
    document.getElementById('raport-bagian').textContent = item.nama_bagian || '-';
    document.getElementById('raport-periode').textContent = item.periode || '-';
    document.getElementById('raport-nilai-akhir').textContent = parseFloat(item.rata_nilai || 0).toFixed(2);
    document.getElementById('raport-predikat').textContent = item.predikat || 'Baik';
    document.getElementById('raport-predikat').className = `badge ${item.predikat_class || 'bg-success'} fs-6 px-3 py-2`;

    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    modal.show();
  };

  const showModalForm = () => {
    const modalEl = document.getElementById('modal-evaluasi-form');
    if (!modalEl || !window.bootstrap) return;

    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    modal.show();
  };

  const saveEvaluasiPerilaku = async () => {
    const peg = document.getElementById('modal-eval-pegawai')?.value;
    const periode = document.getElementById('modal-eval-periode')?.value;

    if (!peg) {
      alert('Pilih Pegawai terlebih dahulu.');
      return;
    }
    if (!periode) {
      alert('Tentukan Periode Penilaian.');
      return;
    }

    const payload = {
      id_pegawai: peg,
      periode: periode,
      nilai_orientasi: document.getElementById('score-orientasi')?.value || 85,
      nilai_integritas: document.getElementById('score-integritas')?.value || 85,
      nilai_komitmen: document.getElementById('score-komitmen')?.value || 85,
      nilai_disiplin: document.getElementById('score-disiplin')?.value || 85,
      nilai_kerjasama: document.getElementById('score-kerjasama')?.value || 85,
      nilai_kepemimpinan: document.getElementById('score-kepemimpinan')?.value || 85
    };

    const btn = document.getElementById('btn-save-evaluasi');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...';
    }

    try {
      const res = await httpPost(`${config.api_url}/kinerja/perilaku/save`, payload);
      if (res && res.code === 200) {
        const modalEl = document.getElementById('modal-evaluasi-form');
        if (modalEl && window.bootstrap) {
          bootstrap.Modal.getInstance(modalEl)?.hide();
        }
        await loadData();
      } else {
        alert(res?.message || 'Gagal menyimpan evaluasi perilaku.');
      }
    } catch (e) {
      alert('Terjadi kesalahan: ' + e.message);
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save me-1"></i>Simpan Evaluasi Perilaku';
      }
    }
  };

  const bindEvents = () => {
    document.getElementById('btn-filter-penilaian')?.addEventListener('click', () => loadData());
    document.getElementById('btn-refresh-penilaian')?.addEventListener('click', () => loadData());
    document.getElementById('btn-tambah-evaluasi')?.addEventListener('click', () => showModalForm());
    document.getElementById('btn-save-evaluasi')?.addEventListener('click', () => saveEvaluasiPerilaku());

    document.getElementById('search-penilaian')?.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        filteredPenilaianData = [...rawPenilaianData];
      } else {
        filteredPenilaianData = rawPenilaianData.filter(r => 
          (r.nama_pegawai && r.nama_pegawai.toLowerCase().includes(q)) ||
          (r.NIP && r.NIP.toLowerCase().includes(q)) ||
          (r.nama_bagian && r.nama_bagian.toLowerCase().includes(q)) ||
          (r.periode && r.periode.toLowerCase().includes(q)) ||
          (r.predikat && r.predikat.toLowerCase().includes(q))
        );
      }
      currentPage = 1;
      renderTable();
    });
  };

  window.kinerja_penilaian = { loadData, showRaportModal, showModalForm };
  document.kinerja_penilaian = { loadData };

  initModule();
</script>
