<script type="module" defer>
    import { httpPost, httpGet } from './assets/js/core/http.js';
    import { getCurrentUser, getSelectedPasien, getFormEntries, setFormEntries } from './assets/js/core/helpers.js';
    import EvoSelector from './components/EvoSelector.js';
    import EvoDrawing from './components/EvoDrawbing.js';

    const id = 'laporan_operasi';
    const listpasien = document.getElementById('daftarpasien-title');
    const currentuser = getCurrentUser('kd_user');
    const selectedpasien = getSelectedPasien(`pasien-${listpasien.dataset.tagger}`);
    const frm_entries = getThisForm(id).entries;
    const frm_actions = document.getElementById(`${id}-actions`);

    // let gambar = new EvoDrawing('gambar', {width:'400px'});

    let dpjpObgyn_operasi = new EvoSelector('sel_dpjp_obgyn_operasi');
    dpjpObgyn_operasi.on('typed', async (e) => {
        let keyword = e.detail.value;
        await operasi.getDokter(keyword, dpjpObgyn_operasi)
    })
    let dokterOperator_operasi = new EvoSelector('sel_dokter_operator_operasi');
    dokterOperator_operasi.on('typed', async (e) => {x
        let keyword = e.detail.value;
        await operasi.getDokter(keyword, dokterOperator_operasi)
    })
    let asistenOperator_operasi = new EvoSelector('sel_asisten_operator_operasi');
    asistenOperator_operasi.on('typed', async (e) => {
        let keyword = e.detail.value;
        await perawat.getPerawat(keyword, asistenOperator_operasi)
    })
    let dokterAnestesi_operasi = new EvoSelector('sel_dokter_anestesi_operasi');
    dokterAnestesi_operasi.on('typed', async (e) => {
        let keyword = e.detail.value;
        await anestesi.getDokter(keyword, dokterAnestesi_operasi)
    })
    let asistenAnestesi_operasi = new EvoSelector('sel_asisten_anestesi_operasi');
    asistenAnestesi_operasi.on('typed', async (e) => {
        let keyword = e.detail.value;
        await perawat.getPerawat(keyword, asistenAnestesi_operasi)
    })
    let dokterOperator_operasi_2 = new EvoSelector('sel_dokter_operator_operasi_2');
    dokterOperator_operasi_2.on('typed', async (e) => {
        let keyword = e.detail.value;
        await operasi.getDokter(keyword, dokterOperator_operasi_2)
    })
    let asistenOperator_operasi_2 = new EvoSelector('sel_asisten_operator_operasi_2');
    asistenOperator_operasi_2.on('typed', async (e) => {
        let keyword = e.detail.value;
        await perawat.getPerawat(keyword, asistenOperator_operasi_2)
    })
    let dokterOperator_operasi_3 = new EvoSelector('sel_dokter_operator_operasi_3');
    dokterOperator_operasi_3.on('typed', async (e) => {
        let keyword = e.detail.value;
        await operasi.getDokter(keyword, dokterOperator_operasi_3)
    })
    let asistenOperator_operasi_3 = new EvoSelector('sel_asisten_operator_operasi_3');
    asistenOperator_operasi_3.on('typed', async (e) => {
        let keyword = e.detail.value;
        await perawat.getPerawat(keyword, asistenOperator_operasi_3)
    })
    let operasi = {
        counter: '',
        reset: (async () => {
            await setFormEntries(frm_entries, []);
            operasi.counter = '';
            dpjpObgyn_operasi.addOptions(operasi.dataDokterTemp);
            dokterOperator_operasi.addOptions(operasi.dataDokterTemp);
            asistenOperator_operasi.addOptions(perawat.dataPerawatTemp);
            dokterAnestesi_operasi.addOptions(anestesi.dataDokterTemp);
            asistenAnestesi_operasi.addOptions(perawat.dataPerawatTemp);
            dokterOperator_operasi_2.addOptions(operasi.dataDokterTemp);
            asistenOperator_operasi_2.addOptions(perawat.dataPerawatTemp);
            dokterOperator_operasi_3.addOptions(operasi.dataDokterTemp);
            asistenOperator_operasi_3.addOptions(perawat.dataPerawatTemp);
        }),
        dataDokter: [],
        dataDokterTemp: [],
        getDokter: (async (keyword = '', dataSel = {}) => {
            if (keyword == '') {
                let rs = await httpGet(`${config.api_url}/paramedis/load`, {});
                if (rs.code == 200) {
                    const options = rs.data.map(v => {
                        return { text: v.nama_paramedis, value: v.kd_paramedis };
                    });
                    operasi.dataDokter = options;
                    operasi.dataDokterTemp = options;
                }
            } else {
                let found = operasi.dataDokter.filter(v => v.text.toLowerCase().includes(keyword.toLowerCase()));
                if (found.length > 0) {
                    let data = found.map(v => {
                        return { text: v.text, value: v.value };
                    })
                    dataSel.addOptions(data);
                }
            }
        }),

        template: {
            dataset: [],
            id: '',
            save: (async () => {
                const txtNamaTemplate = document.getElementById('txt_nama_template').value;
                const data_post = document.getElementById(operasi.template.id).value;
                const kd_unit = getCurrentUser('kd_unit');
                const data_operasi = getFormEntries(frm_entries);
                if (data_post == '') {
                    showDialog({ ui: 'interactive', type: 'warning', label: `<span class="text-danger">Laporan operasi belum diisi !!!</span>` });
                    return false;
                };
                if (txtNamaTemplate == '') {
                    showDialog({ ui: 'interactive', type: 'warning', label: `<span class="text-danger">Nama template belum diisi!!!</span>` });
                    return false;
                };
                const frm_data = { kd_unit: kd_unit, kd_user: currentuser, nama: txtNamaTemplate, data_post: data_post };
                let rs = await httpPost(`${config.api_url}/laporan_operasi/template_save`, frm_data);
                if (rs.code == 200) {
                    await operasi.template.loadData();
                    showDialog({ type: 'info', label: '<span class="text-black">Simpan template sukses</span>' });
                } else {
                    let status = rs.code > 200 && rs.code == 304 ? 'Simpan template gagal!!!' : rs.status;
                    showDialog({ ui: 'interactive', type: 'warning', label: `<span class="text-danger">${status}</span>` });
                }
            }),
            delete: (async (id) => {
                const frm_data = { kd_user: currentuser, id: id };
                let rs = await httpPost(`${config.api_url}/laporan_operasi/template_delete`, frm_data);
                if (rs.code == 200) {
                    let rowIndex = operasi.template.dataset.findIndex(v => v.id == id);
                    if (rowIndex > -1) {
                        const elements = document.getElementsByClassName(`#!tr_template`);
                        elements[rowIndex].remove();
                        operasi.template.dataset.splice(rowIndex, 1);
                        showDialog({ type: 'info', label: '<span class="text-black">Delete template sukses</span>' });
                    }
                } else {
                    showDialog({ ui: 'interactive', type: 'warning', label: '<span class="text-danger">Delete template gagal</span>' });
                }
            }),
            loadData: (async () => {
                const listpasien = document.getElementById('daftarpasien-title');
                const currentuser = getCurrentUser('kd_user');
                const selectedpasien = getSelectedPasien(`pasien-${listpasien.dataset.tagger}`);
                let rs = await httpGet(`${config.api_url}/laporan_operasi/template_load`, { kd_user: currentuser, kd_unit: selectedpasien.kd_unit });
                let tbody = document.getElementById('tbodyTemplate');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="text-start">
                        <label for="" class="form-label fs-0 fw-bold text-dark text-capitalize">belum ada data</label>
                        </td>
                    </tr>
                `;
                if (rs.code == 200) {
                    tbody.innerHTML = '';
                    for await (let v of rs.data) {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                        <td class="text-center"><a href="#!btn-pilih-item-template_${v.id}" class="btn btn-sm btn-light pt-2" role="button" title="pilih" data-row='${JSON.stringify(v)}'><span class="fas fa-plus"></span></a></td>
                        <td class="py-2 text-start">${v.nama}</td>
                        <td class="text-center"><a href="#!btn-hapus-item-template_${v.id}" class="btn btn-sm btn-light pt-2" role="button" title="hapus" data-row='${JSON.stringify(v)}'><span class="fas fa-trash"></span></td>
                    `;
                        tbody.appendChild(tr).className = `#!tr_template py-2`;
                        operasi.template.dataset = [...operasi.template.dataset, v];

                        //pilih template
                        const pilih_item = document.querySelectorAll(`a[href="#!btn-pilih-item-template_${v.id}"]`);
                        pilih_item.forEach(v => {
                            v.addEventListener('click', async (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                let item = JSON.parse(e.target.dataset.row);
                                let rowIndex = operasi.template.dataset.findIndex(v => v.id == item.id);
                                if (rowIndex > -1) {
                                    let data = operasi.template.dataset[rowIndex];
                                    if(operasi.template.id != ''){
                                        document.getElementById(operasi.template.id).value = data.data_post;
                                    }
                                    modalTemplate.hide();
                                }
                            })
                        })

                        //hapus
                        const hapus_item = document.querySelectorAll(`a[href="#!btn-hapus-item-template_${v.id}"]`);
                        hapus_item.forEach(v => {
                            v.addEventListener('click', async (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                let item = JSON.parse(e.target.dataset.row);
                                await operasi.template.delete(item.id);
                            })
                        })
                    }
                }
            })
        }
    }
    let anestesi = {
        dataDokter: [],
        dataDokterTemp: [],
        getDokter: (async (keyword = '', dataSel = {}) => {
            if (keyword == '') {
                let rs = await httpGet(`${config.api_url}/laporan_operasi/anestesi`, {});
                if (rs.code == 200) {
                    const options = rs.data.map(v => {
                        return { text: v.nama_paramedis, value: v.kd_paramedis };
                    });
                    anestesi.dataDokter = options;
                    anestesi.dataDokterTemp = options;
                }
            } else {
                let found = anestesi.dataDokter.filter(v => v.text.toLowerCase().includes(keyword.toLowerCase()));
                if (found.length > 0) {
                    let data = found.map(v => {
                        return { text: v.text, value: v.value };
                    })
                    dataSel.addOptions(data);
                }
            }
        }),
    }
    let perawat = {
        dataPerawat: [],
        dataPerawatTemp: [],
        getPerawat: (async (keyword = '', dataSel = {}) => {
            if (keyword == '') {
                let rs = await httpGet(`${config.api_url}/paramedis/load_perawat`, {bidan: true});
                if (rs.code == 200) {
                    const options = rs.data.map(v => {
                        return { text: v.nama_paramedis, value: v.kd_paramedis };
                    });
                    perawat.dataPerawat = options;
                    perawat.dataPerawatTemp = options;
                }
            } else {
                let found = perawat.dataPerawat.filter(v => v.text.toLowerCase().includes(keyword.toLowerCase()));
                if (found.length > 0) {
                    let data = found.map(v => {
                        return { text: v.text, value: v.value };
                    })
                    dataSel.addOptions(data);
                }
            }
        }),
    }

    //btn-history
    const modalHistory = new bootstrap.Modal(document.getElementById('history-modal'));
    let btn_history = frm_actions.querySelector('a[href="#!btn-history"]');
    btn_history.addEventListener('click', async (e) => {
        const listpasien = document.getElementById('daftarpasien-title'); 
        const selectedpasien = getSelectedPasien(`pasien-${listpasien.dataset.tagger}`);
        loadHistory(selectedpasien.single_id,selectedpasien.no_registrasikunjungan);
        modalHistory.show();
    });

    //history
    const loadHistory = async () => {
        const frm_data = { single_id: selectedpasien.single_id, no_kunjungan: selectedpasien.no_kunjungan };
        let rs = await httpGet(`${config.api_url}/laporan_operasi/load_history`, frm_data);
        console.log(rs);
        const table_history = document.getElementById('tbl_history').getElementsByTagName('tbody')[0];
        let dataset = [];
        let no = 1;
        table_history.innerHTML = '<td class="unit"></td><td class="dokter"></td><td class="status"></td><td class="pertanyaan"></td><td class="jawaban"></td>';
        if (rs.code == 200) dataset = rs.data;
        dataset.forEach(item => {
            let dataPost = JSON.parse(item.data_post);
            let edit = `<a href="#!btn-edit" id="btn_edit" class="btn btn-sm btn-light pt-2" role="button" title="Edit" data-row='${JSON.stringify(item)}'><span class="fas fa-edit"></span></a>`;
            let hapus = `<a href="#!btn-hapus" id="btn_hapus" class="btn btn-sm btn-light pt-2" role="button" title="Hapus" data-row='${JSON.stringify(item)}'><span class="fas fa-trash-alt"></span></a>`;
            let cetak = `<a href="#!btn-cetak" id="btn_cetak" class="btn btn-sm btn-light pt-2" role="button" title="Cetak" data-row='${JSON.stringify(item)}'><span class="fas fa-print"></span></a>`;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="align-middle py-2">${no++}</td>
                <td class="align-middle py-2">${dataPost.tgl_ops}</td>
                <td class="align-middle py-2">${dataPost.jam_ops}</td>
                <td class="align-middle py-2">${item.nm_dpjp_obgyn}</td>
                <td class="align-middle py-2">${dataPost.diagnosis_pra_ops}</td>
                <td>${edit}</td>
                <td>${hapus}</td>
                <td>${cetak}</td>`
            ;
            table_history.appendChild(row);
        });

        const alledit = document.querySelectorAll('a[href="#!btn-edit"]');
        alledit.forEach(btn=>{
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                await operasi.reset();
                let table_history = JSON.parse(e.target.dataset.row);
                let data = JSON.parse(table_history.data_post);
                operasi.counter = table_history.counter;
                data['dokter_operator_2'] = data.dokter_operator_2 != undefined ? data.dokter_operator_2 : '';
                data['asisten_operator_2'] = data.asisten_operator_2 != undefined ? data.asisten_operator_2 : '';
                data['dokter_operator_3'] = data.dokter_operator_3 != undefined ? data.dokter_operator_3 : '';
                data['asisten_operator_3'] = data.asisten_operator_3 != undefined ? data.asisten_operator_3 : '';
                setFormEntries(frm_entries, data);
                dpjpObgyn_operasi.value = data.dpjp_obgyn;
                dokterOperator_operasi.value = data.dokter_operator;
                asistenOperator_operasi.value = data.asisten_operator;
                dokterAnestesi_operasi.value = data.dokter_anestesi;
                asistenAnestesi_operasi.value = data.asisten_anestesi;
                dokterOperator_operasi_2.value = data.dokter_operator_2;
                asistenOperator_operasi_2.value = data.asisten_operator_2;
                dokterOperator_operasi_3.value = data.dokter_operator_3;
                asistenOperator_operasi_3.value = data.asisten_operator_3;
                modalHistory.hide();
            })
        });

        const allhapus = document.querySelectorAll('a[href="#!btn-hapus"]');
        allhapus.forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.preventDefault();   
            let table_history = JSON.parse(e.target.dataset.row);
            let data_post = JSON.parse(table_history.data_post);
            const dialog = await showDialog({
                ui: 'interactive',
                type: 'question',
                label: `<span class="text-black">Apakah yakin akan menghapus laporan operasi dokter <b>${table_history.nm_dokter_operator}</b> dengan diagnosis pra ops <b>${data_post.diagnosis_pra_ops}</b> ?</span>`,
                buttons: [
                    { label: 'Ya', class: 'btn-primary', onClick: async() => { dialog.close(); await deleteData(table_history); } },
                    { label: 'Tidak', class: 'btn-secondary', onClick: () => dialog.close() }
                ]
            }, () => {}, 'dialog_delete_operator');
            return true;
        })
        });

        const btn_cetak = document.querySelectorAll('a[href="#!btn-cetak"]');
        btn_cetak.forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.preventDefault();   
            let table_history = JSON.parse(e.target.dataset.row);
            await cetakData(table_history);
            return true;
        })
        });
        await listInit();
    }

    const btn_cetak = frm_actions.querySelector('a[href="#!btn-cetak"]');
    btn_cetak.addEventListener('click', async (e) => {
        const listpasien = document.getElementById('daftarpasien-title');
        const selectedpasien = getSelectedPasien(`pasien-${listpasien.dataset.tagger}`);
        operasi.no_kunjungan = selectedpasien.no_kunjungan;
        await cetakData(operasi);
    })

    const cetakData = async (tbl_history) => {
        const listpasien = document.getElementById('daftarpasien-title');
        const currentuser = getCurrentUser('kd_user');
        const selectedpasien = getSelectedPasien(`pasien-${listpasien.dataset.tagger}`);
        const frm_data = {
            single_id: selectedpasien.single_id,
            no_kunjungan: tbl_history.no_registrasikunjungan,
            no_transaksi: selectedpasien.no_transaksi,
            no_medicalrecord: selectedpasien.no_medicalrecord,
            nama_pasien: selectedpasien.nama,
            tgl_lahir: selectedpasien.tgl_lahir,
            umur: selectedpasien.usia,
            jenis_kelamin: selectedpasien.gender,
            tgl_jam: selectedpasien.tgl_pendaftaran,
            alamat: selectedpasien.alamat,
            nik: selectedpasien.nik,
            nama_paramedis: selectedpasien.nama_paramedis,
            kd_unit: selectedpasien.kd_unit,
            counter: tbl_history.counter,
            tag: id,
            table: 'rawat_inap.ri_laporan_operasi'
        };
        let rs = await httpPost(`${config.api_url}/laporan_operasi/print`, frm_data);
        if (rs.code == 200) window.open(rs.data[0].file);
        if (rs.code != 200) showDialog({ ui: 'interactive', size: 'large', type: 'warning', label: '<span class="text-danger">Cetakan poli belum termapping. Mohon hubungi administrator</span>' });
    }

    const deleteData = async (tbl_history) => {
        const listpasien = document.getElementById('daftarpasien-title');
        const currentuser = getCurrentUser('kd_user');
        const selectedpasien = getSelectedPasien(`pasien-${listpasien.dataset.tagger}`);
        const frm_data = {
            single_id: tbl_history.single_id,
            no_kunjungan: tbl_history.no_registrasikunjungan,
            no_transaksi: selectedpasien.no_transaksi,
            no_medicalrecord: selectedpasien.no_medicalrecord,
            nama_pasien: selectedpasien.nama,
            tgl_lahir: selectedpasien.tgl_lahir,
            umur: selectedpasien.usia,
            jenis_kelamin: selectedpasien.gender,
            tgl_jam: selectedpasien.tgl_pendaftaran,
            alamat: selectedpasien.alamat,
            nik: selectedpasien.nik,
            nama_paramedis: selectedpasien.nama_paramedis,
            kd_unit: selectedpasien.kd_unit,
            counter: tbl_history.counter,
            kd_user: currentuser,
            tag: id,
            table: 'rawat_inap.ri_laporan_operasi'
        };
        let rs = await httpPost(`${config.api_url}/laporan_operasi/delete`, frm_data);
        if (rs.code == 200) {
            showDialog({ ui: 'interactive', size: 'medium', type: 'success', label: '<span class="text-dark">Sukses Hapus Data</span>' });
            await loadHistory();
        } else {
            showDialog({ ui: 'interactive', size: 'medium', type: 'warning', label: '<span class="text-danger">Gagal Hapus Data</span>' });
        }
    }

    const loadData = async () => {
        await operasi.getDokter();
        await anestesi.getDokter();
        await perawat.getPerawat();
        //selector
        dpjpObgyn_operasi.addOptions(operasi.dataDokter);
        dokterOperator_operasi.addOptions(operasi.dataDokter);
        asistenOperator_operasi.addOptions(perawat.dataPerawat);
        dokterAnestesi_operasi.addOptions(anestesi.dataDokter);
        asistenAnestesi_operasi.addOptions(perawat.dataPerawat);
        dokterOperator_operasi_2.addOptions(operasi.dataDokter);
        asistenOperator_operasi_2.addOptions(perawat.dataPerawat);
        dokterOperator_operasi_3.addOptions(operasi.dataDokter);
        asistenOperator_operasi_3.addOptions(perawat.dataPerawat);
        dpjpObgyn_operasi.value = '-';
        dokterOperator_operasi.value = '-';
        asistenOperator_operasi.value = '-';
        dokterAnestesi_operasi.value = '-';
        asistenAnestesi_operasi.value = '-';
        dokterOperator_operasi_2.value = '-';
        asistenOperator_operasi_2.value = '-';
        dokterOperator_operasi_3.value = '-';
        asistenOperator_operasi_3.value = '-';
        //load
        const frm_data = { single_id: selectedpasien.single_id, no_kunjungan: selectedpasien.no_kunjungan };
        let rs = await httpGet(`${config.api_url}/laporan_operasi/load`, frm_data);
        if (rs.code == 200) {
            operasi.counter = rs.data[0].counter;
            let data = JSON.parse(rs.data[0].data_post);
            data['dokter_operator_2'] = data.dokter_operator_2 != undefined ? data.dokter_operator_2 : '';
            data['asisten_operator_2'] = data.asisten_operator_2 != undefined ? data.asisten_operator_2 : '';
            data['dokter_operator_3'] = data.dokter_operator_3 != undefined ? data.dokter_operator_3 : '';
            data['asisten_operator_3'] = data.asisten_operator_3 != undefined ? data.asisten_operator_3 : '';
            setFormEntries(frm_entries, data);
            dpjpObgyn_operasi.value = data.dpjp_obgyn;
            dokterOperator_operasi.value = data.dokter_operator;
            asistenOperator_operasi.value = data.asisten_operator;
            dokterAnestesi_operasi.value = data.dokter_anestesi;
            asistenAnestesi_operasi.value = data.asisten_anestesi;
            dokterOperator_operasi_2.value = data.dokter_operator_2;
            asistenOperator_operasi_2.value = data.asisten_operator_2;
            dokterOperator_operasi_3.value = data.dokter_operator_3;
            asistenOperator_operasi_3.value = data.asisten_operator_3;
        }
    }
    const saveData = async () => {
        const data_operasi = getFormEntries(frm_entries);
        const frm_data = {
            single_id: selectedpasien.single_id,
            no_kunjungan: selectedpasien.no_kunjungan,
            no_medrec: selectedpasien.no_medicalrecord,
            data_post: JSON.stringify(data_operasi),
            kd_user: currentuser,
            counter: operasi.counter,
            // gambar: btoa(gambar.drawing),
        };
        console.log(frm_data); //return true;
        let rs = await httpPost(`${config.api_url}/laporan_operasi/save`, frm_data);
        return rs;
    }

    //btn_simpan
    const btn_simpan = frm_actions.querySelector('a[href="#!btn-simpan"]');
    btn_simpan.addEventListener('click', async (e) => {
        e.preventDefault();
        let isi_laporan = frm_entries.querySelector('textarea[data-field="laporan_ops"]');
        if (dpjpObgyn_operasi.value == '' || dpjpObgyn_operasi.value == '-') {
            let params = { ui: 'interactive', type: 'warning', label: '<span class="text-danger fs-1">Maaf DPJP harus dipilih, Mohon Lengkapi!!!</span>' };
            showDialog(params);
            return false;
        }
        if (dokterOperator_operasi.value == '' || dokterOperator_operasi.value == '-') {
            let params = { ui: 'interactive', type: 'warning', label: '<span class="text-danger fs-1">Maaf Dokter Operator harus dipilih, Mohon Lengkapi!!!</span>' };
            showDialog(params);
            return false;
        }
        if (asistenOperator_operasi.value == '' || asistenOperator_operasi.value == '-') {
