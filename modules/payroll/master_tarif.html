<script type="module" defer>
  import { httpGet } from './assets/js/core/http.js';

  let masterList = [];

  const formatRupiah = (val) => {
    const num = parseFloat(val) || 0;
    return 'Rp ' + num.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  };

  const initModule = () => {
    bindEvents();
    loadTarifData();
  };

  const loadTarifData = async () => {
    try {
      const res = await httpGet(`${config.api_url}/payroll/master-tarif`);
      if (res && res.code === 200 && res.data) {
        masterList = res.data.jabatan || [];
        renderJabatanTable(masterList);
      }
    } catch (e) {
      console.error('Error fetching master tarif:', e);
    }
  };

  const renderJabatanTable = (list) => {
    const tbody = document.getElementById('tbody-master-jabatan');
    if (!tbody) return;

    if (!list || list.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="text-center py-4 text-muted">Tidak ada data jabatan.</td>
        </tr>`;
      return;
    }

    let html = '';
    list.forEach((j, idx) => {
      html += `
        <tr>
          <td class="text-center font-monospace">${idx + 1}</td>
          <td><span class="badge bg-light text-dark font-monospace border">${j.KD_JABATAN || '-'}</span></td>
          <td class="fw-bold text-dark">${j.JABATAN || '-'}</td>
          <td class="text-end font-monospace">Rp 3.500.000</td>
          <td class="text-end font-monospace text-primary">Rp 500.000</td>
          <td class="text-center"><span class="badge bg-success">Aktif</span></td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  };

  const runSimulation = () => {
    const gapok = parseFloat(document.getElementById('sim-gapok')?.value) || 0;
    const lembur = parseFloat(document.getElementById('sim-lembur')?.value) || 0;
    const honor = parseFloat(document.getElementById('sim-honor')?.value) || 0;
    const menit = parseInt(document.getElementById('sim-menit')?.value) || 0;
    const alpa = parseInt(document.getElementById('sim-alpa')?.value) || 0;

    const tunjKes = gapok * 0.03;
    const tunjTk = gapok * (0.037 + 0.0024 + 0.0030);

    const potKes = gapok * 0.02;
    const potTk = gapok * 0.02;
    const dendaTerlambat = menit * 1000;
    const dendaAlpa = alpa * (gapok / 22);
    const totDenda = dendaTerlambat + dendaAlpa;

    const thp = (gapok + lembur + honor) - (potKes + potTk + totDenda);

    document.getElementById('sim-res-tunj-kes').textContent = formatRupiah(tunjKes);
    document.getElementById('sim-res-tunj-tk').textContent = formatRupiah(tunjTk);
    document.getElementById('sim-res-pot-kes').textContent = formatRupiah(potKes);
    document.getElementById('sim-res-pot-tk').textContent = formatRupiah(potTk);
    document.getElementById('sim-res-denda').textContent = formatRupiah(totDenda);
    document.getElementById('sim-res-thp').textContent = formatRupiah(thp);
  };

  const bindEvents = () => {
    document.getElementById('btn-open-simulasi')?.addEventListener('click', () => {
      runSimulation();
      const modal = new bootstrap.Modal(document.getElementById('modal-simulasi-gaji'));
      modal.show();
    });

    document.querySelectorAll('.sim-input').forEach(inp => {
      inp.addEventListener('input', runSimulation);
    });

    document.getElementById('search-jabatan')?.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = masterList.filter(j =>
        (j.JABATAN || '').toLowerCase().includes(q) ||
        (j.KD_JABATAN || '').toLowerCase().includes(q)
      );
      renderJabatanTable(filtered);
    });
  };

  initModule();
</script>
