<script type="module" defer>
  import { httpGet } from './assets/js/core/http.js';

  const formatRupiah = (val) => {
    const num = parseFloat(val) || 0;
    return 'Rp ' + num.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  };

  const initModule = () => {
    const defaultPeriode = '2024-09';
    const filterEl = document.getElementById('rekap-filter-periode');
    if (filterEl) filterEl.value = defaultPeriode;

    bindEvents();
    loadRekapData();
  };

  const loadRekapData = async () => {
    const periode = document.getElementById('rekap-filter-periode')?.value || '2024-09';
    const tbody = document.getElementById('tbody-rekap-bagian');
    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center py-4 text-muted">
            <i class="fas fa-spinner fa-spin fa-2x mb-2 d-block text-primary"></i>Memuat rekapitulasi penggajian...
          </td>
        </tr>`;
    }

    // Set printable labels
    document.querySelectorAll('.print-periode-label').forEach(el => el.textContent = periode);
    document.querySelectorAll('.print-tgl-sekarang').forEach(el => el.textContent = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }));
    const badge = document.getElementById('badge-periode');
    if (badge) badge.textContent = `Periode: ${periode}`;

    try {
      const res = await httpGet(`${config.api_url}/payroll/rekap?periode=${periode}`);
      if (res && res.code === 200 && res.data) {
        renderRekapTable(res.data.rekap_bagian || []);
        renderTotals(res.data.summary || {});
      } else {
        renderRekapTable([]);
      }
    } catch (e) {
      console.error('Error fetching payroll recap:', e);
      if (tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-4 text-danger">
              <i class="fas fa-exclamation-triangle fa-2x mb-2 d-block"></i>Gagal memuat data rekap.
            </td>
          </tr>`;
      }
    }
  };

  const renderRekapTable = (list) => {
    const tbody = document.getElementById('tbody-rekap-bagian');
    if (!tbody) return;

    if (!list || list.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center py-4 text-muted">
            Tidak ada data penggajian untuk periode yang dipilih.
          </td>
        </tr>`;
      return;
    }

    let html = '';
    list.forEach((item, idx) => {
      const gapok = parseFloat(item.total_gapok) || 0;
      const bruto = parseFloat(item.total_bruto) || 0;
      const tunjangan = bruto - gapok;
      const potongan = parseFloat(item.total_potongan) || 0;
      const thp = parseFloat(item.total_thp) || 0;

      html += `
        <tr>
          <td class="text-center font-monospace">${idx + 1}</td>
          <td>
            <div class="fw-bold text-dark">${item.BAGIAN || 'Umum'}</div>
            <div class="small text-muted font-monospace">KD: ${item.KD_BAGIAN || '-'}</div>
          </td>
          <td class="text-center"><span class="badge bg-secondary">${item.jumlah_pegawai} Orang</span></td>
          <td class="text-end font-monospace">${formatRupiah(gapok)}</td>
          <td class="text-end font-monospace text-primary">${formatRupiah(tunjangan)}</td>
          <td class="text-end font-monospace text-primary fw-semibold">${formatRupiah(bruto)}</td>
          <td class="text-end font-monospace text-danger">${formatRupiah(potongan)}</td>
          <td class="text-end font-monospace text-success fw-bold">${formatRupiah(thp)}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  };

  const renderTotals = (summary) => {
    document.getElementById('rekap-total-pegawai').textContent = (summary.total_pegawai || 0).toLocaleString('id-ID');
    document.getElementById('rekap-total-bagian').textContent = `${summary.total_bagian || 0} Unit / Bagian`;
    document.getElementById('rekap-total-gapok').textContent = formatRupiah(summary.sum_gapok);
    document.getElementById('rekap-total-potongan').textContent = formatRupiah(summary.sum_potongan);
    document.getElementById('rekap-total-thp').textContent = formatRupiah(summary.sum_gaji_bersih);

    document.getElementById('foot-total-pegawai').textContent = `${summary.total_pegawai || 0} Orang`;
    document.getElementById('foot-total-gapok').textContent = formatRupiah(summary.sum_gapok);
    const sumBruto = parseFloat(summary.sum_bruto) || 0;
    const sumGapok = parseFloat(summary.sum_gapok) || 0;
    document.getElementById('foot-total-tunj').textContent = formatRupiah(sumBruto - sumGapok);
    document.getElementById('foot-total-bruto').textContent = formatRupiah(sumBruto);
    document.getElementById('foot-total-potongan').textContent = formatRupiah(summary.sum_potongan);
    document.getElementById('foot-total-thp').textContent = formatRupiah(summary.sum_gaji_bersih);
  };

  const bindEvents = () => {
    document.getElementById('btn-apply-filter')?.addEventListener('click', loadRekapData);
    document.getElementById('rekap-filter-periode')?.addEventListener('change', loadRekapData);
    document.getElementById('btn-print-rekap')?.addEventListener('click', () => window.print());
    document.getElementById('btn-goto-gaji')?.addEventListener('click', () => {
      if (window.loadModule) {
        window.loadModule('modules/payroll/gaji.html');
      }
    });
  };

  initModule();
</script>
