<script type="module" defer>
  import { httpGet } from './assets/js/core/http.js';

  let rekapData = [];
  let currentPage = 1;
  let rowsPerPage = 5;
  let isPrinting = false;

  const formatRupiah = (val) => {
    const num = parseFloat(val) || 0;
    return 'Rp ' + num.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  };

  const initModule = () => {
    const defaultPeriode = '2024-09';
    const filterEl = document.getElementById('rekap-filter-periode');
    if (filterEl) filterEl.value = defaultPeriode;

    bindEvents();
    loadRekapData();
  };

  const loadRekapData = async () => {
    const periode = document.getElementById('rekap-filter-periode')?.value || '2024-09';
    const tbody = document.getElementById('tbody-rekap-bagian');
    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center py-4 text-muted">
            <i class="fas fa-spinner fa-spin fa-2x mb-2 d-block text-primary"></i>Memuat rekapitulasi penggajian...
          </td>
        </tr>`;
    }

    // Set printable labels
    document.querySelectorAll('.print-periode-label').forEach(el => el.textContent = periode);
    document.querySelectorAll('.print-tgl-sekarang').forEach(el => el.textContent = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }));
    const badge = document.getElementById('badge-periode');

    if (badge) badge.textContent = `Periode: ${periode}`;

    try {
      const res = await httpGet(`${config.api_url}/payroll/rekap?periode=${periode}`);
      if (res && res.code === 200 && res.data) {
        rekapData = res.data.rekap || [];
        currentPage = 1;
        renderRekapTable();
        renderTotals(res.data.grand_total || {}, rekapData.length);
      } else {
        rekapData = [];
        currentPage = 1;
        renderRekapTable();
        renderTotals({}, 0);
      }
    } catch (e) {
      console.error('Error fetching payroll recap:', e);
      rekapData = [];
      currentPage = 1;
      renderPagination(0);
      renderTotals({}, 0);
      if (tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-4 text-danger">
              <i class="fas fa-exclamation-triangle fa-2x mb-2 d-block"></i>Gagal memuat data rekap.
            </td>
          </tr>`;
      }
    }
  };

  const renderRekapTable = () => {
    const tbody = document.getElementById('tbody-rekap-bagian');
    if (!tbody) return;

    if (rekapData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center py-4 text-muted">
            Tidak ada data penggajian untuk periode yang dipilih.
          </td>
        </tr>`;
      renderPagination(0);
      return;
    }

    const startIndex = isPrinting ? 0 : (currentPage - 1) * rowsPerPage;
    const pageRows = isPrinting ? rekapData : rekapData.slice(startIndex, startIndex + rowsPerPage);
    let html = '';
    pageRows.forEach((item, idx) => {
      const gapok = parseFloat(item.total_gapok) || 0;
      const tunjangan = (parseFloat(item.total_tunj_bpjs) || 0)
        + (parseFloat(item.total_tunj_jht) || 0)
        + (parseFloat(item.total_tunj_jkk) || 0)
        + (parseFloat(item.total_tunj_jkm) || 0);
      const bruto = gapok + tunjangan
        + (parseFloat(item.total_lembur) || 0)
        + (parseFloat(item.total_honor) || 0);
      const potongan = (parseFloat(item.total_pot_bpjs) || 0)
        + (parseFloat(item.total_pot_jht) || 0);
      const thp = parseFloat(item.total_thp) || 0;

      html += `
        <tr>
          <td class="text-center font-monospace">${startIndex + idx + 1}</td>
          <td>
            <div class="fw-bold text-dark">${item.nama_bagian || item.BAGIAN || 'Belum ditentukan'}</div>
            <div class="small text-muted font-monospace">KD: ${item.kd_bagian || item.KD_BAGIAN || '-'}</div>
          </td>
          <td class="text-center"><span class="badge bg-secondary">${item.jml_pegawai || 0} Orang</span></td>
          <td class="text-end font-monospace">${formatRupiah(gapok)}</td>
          <td class="text-end font-monospace text-primary">${formatRupiah(tunjangan)}</td>
          <td class="text-end font-monospace text-primary fw-semibold">${formatRupiah(bruto)}</td>
          <td class="text-end font-monospace text-danger">${formatRupiah(potongan)}</td>
          <td class="text-end font-monospace text-success fw-bold">${formatRupiah(thp)}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
    if (!isPrinting) renderPagination(rekapData.length);
  };

  const renderPagination = (totalRows) => {
    const info = document.getElementById('rekap-total-info');
    const container = document.getElementById('rekap-pagination');
    if (!info || !container) return;

    const totalPages = Math.ceil(totalRows / rowsPerPage) || 1;
    currentPage = Math.min(currentPage, totalPages);
    const start = totalRows === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
    const end = Math.min(currentPage * rowsPerPage, totalRows);
    info.textContent = `Menampilkan ${totalRows === 0 ? 0 : end - start + 1} dari total ${totalRows} unit / bagian`;

    if (totalPages <= 1) {
      container.innerHTML = '';
      return;
    }

    let html = '<ul class="pagination pagination-sm mb-0">';
    html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage - 1}">&laquo;</a></li>`;

    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

    if (startPage > 1) {
      html += '<li class="page-item"><a class="page-link" href="#" data-page="1">1</a></li>';
      if (startPage > 2) html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
    }

    for (let page = startPage; page <= endPage; page++) {
      html += `<li class="page-item ${page === currentPage ? 'active' : ''}"><a class="page-link" href="#" data-page="${page}">${page}</a></li>`;
    }

    if (endPage < totalPages) {
      if (endPage < totalPages - 1) html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
      html += `<li class="page-item"><a class="page-link" href="#" data-page="${totalPages}">${totalPages}</a></li>`;
    }

    html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage + 1}">&raquo;</a></li>`;
    html += '</ul>';
    container.innerHTML = html;

    container.querySelectorAll('.page-link[data-page]').forEach(link => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        const page = parseInt(link.getAttribute('data-page'), 10);
        if (page >= 1 && page <= totalPages && page !== currentPage) {
          currentPage = page;
          renderRekapTable();
        }
      });
    });
  };

  const renderTotals = (totals, totalBagian) => {
    const totalPegawai = parseFloat(totals.total_pegawai) || 0;
    const totalGapok = parseFloat(totals.total_gapok) || 0;
    const totalTunjangan = (parseFloat(totals.total_tunj_bpjs) || 0)
      + (parseFloat(totals.total_tunj_jht) || 0)
      + (parseFloat(totals.total_tunj_jkk) || 0)
      + (parseFloat(totals.total_tunj_jkm) || 0);
    const totalLembur = parseFloat(totals.total_lembur) || 0;
    const totalHonor = parseFloat(totals.total_honor) || 0;
    const totalBruto = totalGapok + totalTunjangan + totalLembur + totalHonor;
    const totalPotongan = (parseFloat(totals.total_pot_bpjs) || 0)
      + (parseFloat(totals.total_pot_jht) || 0);
    const totalThp = parseFloat(totals.total_thp) || 0;

    document.getElementById('rekap-total-pegawai').textContent = totalPegawai.toLocaleString('id-ID');
    document.getElementById('rekap-total-bagian').textContent = `${totalBagian} Unit / Bagian`;
    document.getElementById('rekap-total-gapok').textContent = formatRupiah(totalGapok);
    document.getElementById('rekap-total-potongan').textContent = formatRupiah(totalPotongan);
    document.getElementById('rekap-total-thp').textContent = formatRupiah(totalThp);

    document.getElementById('foot-total-pegawai').textContent = `${totalPegawai} Orang`;
    document.getElementById('foot-total-gapok').textContent = formatRupiah(totalGapok);
    document.getElementById('foot-total-tunj').textContent = formatRupiah(totalTunjangan);
    document.getElementById('foot-total-bruto').textContent = formatRupiah(totalBruto);
    document.getElementById('foot-total-potongan').textContent = formatRupiah(totalPotongan);
    document.getElementById('foot-total-thp').textContent = formatRupiah(totalThp);
  };

  const bindEvents = () => {
    document.getElementById('btn-apply-filter')?.addEventListener('click', loadRekapData);
    document.getElementById('rekap-filter-periode')?.addEventListener('change', loadRekapData);
    document.getElementById('filter-limit-rekap')?.addEventListener('change', (event) => {
      rowsPerPage = parseInt(event.target.value, 10) || 5;
      currentPage = 1;
      renderRekapTable();
    });
    document.getElementById('btn-print-rekap')?.addEventListener('click', () => {
      const pageBeforePrint = currentPage;
      isPrinting = true;
      renderRekapTable();
      const printTable = document.getElementById('table-rekap-bagian').cloneNode(true);
      printTable.id = 'rekap-print-table';
      const printRoot = document.createElement('div');
      printRoot.id = 'rekap-print-only';
      printRoot.appendChild(printTable);
      document.body.appendChild(printRoot);

      const cleanupPrint = () => {
        printRoot.remove();
        window.removeEventListener('afterprint', cleanupPrint);
      };
      window.addEventListener('afterprint', cleanupPrint);

      try {
        window.print();
      } catch (error) {
        console.error('Error printing payroll recap:', error);
        cleanupPrint();
      } finally {
        isPrinting = false;
        currentPage = pageBeforePrint;
        renderRekapTable();
      }
    });
    document.getElementById('btn-goto-gaji')?.addEventListener('click', async () => {
      await loadModule('modules/payroll/gaji', '#container-isi');
    });
  };

  initModule();
</script>
