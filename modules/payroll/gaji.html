          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module" defer>
  import { httpGet, httpPost } from './assets/js/core/http.js';

  let payrollData = [];
  let masterBagian = [];
  let masterJabatan = [];
  let masterPegawai = [];
  let currentPage = 1;
  const pageSize = 20;

  // Indonesian Currency Formatter
  const formatRupiah = (val) => {
    const num = parseFloat(val) || 0;
    return 'Rp ' + num.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  };

  // Convert number to Indonesian Words (Terbilang)
  const terbilang = (angka) => {
    const bilangan = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
    angka = Math.floor(Math.abs(Number(angka)));
    if (angka < 12) return bilangan[angka];
    if (angka < 20) return terbilang(angka - 10) + ' Belas';
    if (angka < 100) return terbilang(Math.floor(angka / 10)) + ' Puluh ' + terbilang(angka % 10);
    if (angka < 200) return 'Seratus ' + terbilang(angka - 100);
    if (angka < 1000) return terbilang(Math.floor(angka / 100)) + ' Ratus ' + terbilang(angka % 100);
    if (angka < 2000) return 'Seribu ' + terbilang(angka - 1000);
    if (angka < 1000000) return terbilang(Math.floor(angka / 1000)) + ' Ribu ' + terbilang(angka % 1000);
    if (angka < 1000000000) return terbilang(Math.floor(angka / 1000000)) + ' Juta ' + terbilang(angka % 1000000);
    if (angka < 1000000000000) return terbilang(Math.floor(angka / 1000000000)) + ' Milyar ' + terbilang(angka % 1000000000);
    return '';
  };

  const initModule = () => {
    // Set default month to current or recent month
    const now = new Date();
    const curMonth = '2024-09'; // default to generated active period
    const filterPeriode = document.getElementById('filter-periode');
    if (filterPeriode) filterPeriode.value = curMonth;

    const genPeriode = document.getElementById('gen-periode');
    if (genPeriode) genPeriode.value = curMonth;

    bindEvents();
    loadMaster();
    loadData();
  };

  const loadMaster = async () => {
    try {
      const res = await httpGet(`${config.api_url}/payroll/master`);
      if (res && res.code === 200 && res.data) {
        masterBagian = res.data.bagian || [];
        masterJabatan = res.data.jabatan || [];
        masterPegawai = res.data.pegawai || [];

        // Populate Bagian filters
        const selBagian = document.getElementById('filter-bagian');
        const genBagian = document.getElementById('gen-bagian');
        if (selBagian) {
          selBagian.innerHTML = '<option value="">-- Semua Unit / Bagian --</option>';
          masterBagian.forEach(b => {
            selBagian.innerHTML += `<option value="${b.KD_BAGIAN}">${b.BAGIAN}</option>`;
          });
        }
        if (genBagian) {
          genBagian.innerHTML = '<option value="">-- Seluruh Bagian / Unit Kerja --</option>';
          masterBagian.forEach(b => {
            genBagian.innerHTML += `<option value="${b.KD_BAGIAN}">${b.BAGIAN}</option>`;
          });
        }

        // Populate Pegawai Select in Modal Form
        const selPegawai = document.getElementById('form-pegawai');
        if (selPegawai) {
          selPegawai.innerHTML = '<option value="">-- Pilih Pegawai --</option>';
          masterPegawai.forEach(p => {
            selPegawai.innerHTML += `<option value="${p.ID_PEGAWAI}" data-bagian="${p.KD_BAGIAN || ''}" data-jabatan="${p.KD_JABATAN || ''}">${p.NIP} - ${p.NAMA} (${p.BAGIAN || 'Umum'})</option>`;
          });
        }
      }
    } catch (e) {
      console.error('Error loading payroll master:', e);
    }
  };

  const loadData = async (page = 1) => {
    currentPage = page;
    const tbody = document.getElementById('tbody-payroll');
    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="10" class="text-center py-4 text-muted">
            <i class="fas fa-spinner fa-spin fa-2x mb-2 d-block text-primary"></i>Memuat data penggajian...
          </td>
        </tr>`;
    }

    const periode = document.getElementById('filter-periode')?.value || '';
    const kdBagian = document.getElementById('filter-bagian')?.value || '';
    const statusApprove = document.getElementById('filter-status')?.value || '';
    const search = document.getElementById('filter-search')?.value || '';

    const offset = (page - 1) * pageSize;
    let url = `${config.api_url}/payroll/list?limit=${pageSize}&offset=${offset}`;
    if (periode) url += `&periode=${periode}`;
    if (kdBagian) url += `&kd_bagian=${kdBagian}`;
    if (statusApprove !== '') url += `&status_approve=${statusApprove}`;
    if (search) url += `&search=${encodeURIComponent(search)}`;

    try {
      const res = await httpGet(url);
      if (res && res.code === 200 && res.data) {
        payrollData = res.data.rows || [];
        updateSummaryKPI(res.data.summary);
        renderTable(payrollData);
        renderPagination(res.data.total || 0, page);
      } else {
        renderTable([]);
        renderPagination(0, 1);
      }
    } catch (e) {
      console.error('Error fetching payroll list:', e);
      if (tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="10" class="text-center py-4 text-danger">
              <i class="fas fa-exclamation-triangle fa-2x mb-2 d-block"></i>Gagal memuat data penggajian. Silakan periksa koneksi atau coba lagi.
            </td>
          </tr>`;
      }
    }
  };

  const updateSummaryKPI = (summary) => {
    if (!summary) return;
    document.getElementById('stat-total-pegawai').textContent = (summary.total_pegawai || 0).toLocaleString('id-ID');
    document.getElementById('stat-approved').textContent = (summary.total_approved || 0).toLocaleString('id-ID');
    document.getElementById('stat-total-gapok').textContent = formatRupiah(summary.sum_gapok);
    document.getElementById('stat-total-tunj').textContent = formatRupiah(summary.sum_tunjangan);
    document.getElementById('stat-total-potongan').textContent = formatRupiah(summary.sum_potongan);
    document.getElementById('stat-total-bersih').textContent = formatRupiah(summary.sum_gaji_bersih);
  };

  const renderTable = (rows) => {
    const tbody = document.getElementById('tbody-payroll');
    if (!tbody) return;

    if (!rows || rows.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="10" class="text-center py-5 text-muted">
            <i class="fas fa-file-invoice fa-3x mb-3 text-secondary d-block"></i>
            Tidak ada data penggajian pada filter ini.<br>
            Klik tombol <strong>Generate Gaji Periode</strong> di atas untuk memproses gaji otomatis.
          </td>
        </tr>`;
      return;
    }

    let html = '';
    rows.forEach(r => {
      const isApproved = parseInt(r.status_approve) === 1;
      const statusBadge = isApproved
        ? '<span class="badge bg-success"><i class="fas fa-check me-1"></i>Approved</span>'
        : '<span class="badge bg-warning text-dark"><i class="fas fa-clock me-1"></i>Draft</span>';

      html += `
        <tr>
          <td class="text-center">
            <input type="checkbox" class="form-check-input check-item" value="${r.id_gaji}" data-approved="${r.status_approve}">
          </td>
          <td>
            <div class="fw-bold text-dark">${r.nama_pegawai || '-'}</div>
            <div class="small text-muted font-monospace">${r.NIP || '-'}</div>
          </td>
          <td><span class="badge bg-light text-dark border">${r.nama_bagian || 'Semua Unit'}</span></td>
          <td><small class="text-muted">${r.nama_jabatan || '-'}</small></td>
          <td class="text-end font-monospace">${formatRupiah(r.gaji_pokok)}</td>
          <td class="text-end font-monospace text-primary">${formatRupiah(parseFloat(r.total_bruto) - parseFloat(r.gaji_pokok))}</td>
          <td class="text-end font-monospace text-danger">${formatRupiah(r.total_potongan)}</td>
          <td class="text-end font-monospace text-success fw-bold">${formatRupiah(r.gaji_bersih)}</td>
          <td class="text-center">${statusBadge}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-info p-1 px-2 btn-view-slip" data-id="${r.id_gaji}" title="Lihat Slip Gaji">
              <i class="fas fa-file-invoice-dollar"></i>
            </button>
            <button class="btn btn-sm btn-outline-primary p-1 px-2 btn-edit-gaji" data-id="${r.id_gaji}" title="Edit Gaji">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger p-1 px-2 btn-delete-gaji" data-id="${r.id_gaji}" title="Hapus Data">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;

    // Attach click events on action buttons
    tbody.querySelectorAll('.btn-view-slip').forEach(btn => {
      btn.addEventListener('click', () => showSlipGaji(btn.getAttribute('data-id')));
    });
    tbody.querySelectorAll('.btn-edit-gaji').forEach(btn => {
      btn.addEventListener('click', () => openEditModal(btn.getAttribute('data-id')));
    });
    tbody.querySelectorAll('.btn-delete-gaji').forEach(btn => {
      btn.addEventListener('click', () => confirmDelete(btn.getAttribute('data-id')));
    });
  };

  const renderPagination = (total, page) => {
    const info = document.getElementById('pagination-info');
    const links = document.getElementById('pagination-links');
    if (!info || !links) return;

    const totalPages = Math.ceil(total / pageSize) || 1;
    const start = total === 0 ? 0 : (page - 1) * pageSize + 1;
    const end = Math.min(page * pageSize, total);

    info.textContent = `Menampilkan ${start} - ${end} dari total ${total} data`;

    let html = '';
    html += `<li class="page-item ${page <= 1 ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${page - 1}">Prev</a></li>`;

    let startPage = Math.max(1, page - 2);
    let endPage = Math.min(totalPages, page + 2);

    for (let i = startPage; i <= endPage; i++) {
      html += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
    }

    html += `<li class="page-item ${page >= totalPages ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${page + 1}">Next</a></li>`;
    links.innerHTML = html;

    links.querySelectorAll('a.page-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const p = parseInt(a.getAttribute('data-page'));
        if (p >= 1 && p <= totalPages && p !== page) {
          loadData(p);
        }
      });
    });
  };

  // Show Interactive Slip Gaji Modal
  const showSlipGaji = async (idGaji) => {
    try {
      const res = await httpGet(`${config.api_url}/payroll/detail/${idGaji}`);
      if (res && res.code === 200 && res.data) {
        const d = res.data;
        document.getElementById('slip-nip').textContent = d.NIP || '-';
        document.getElementById('slip-nama').textContent = d.nama_pegawai || '-';
        document.getElementById('slip-jabatan').textContent = d.nama_jabatan || '-';
        document.getElementById('slip-bagian').textContent = d.nama_bagian || '-';

        const tglMulai = d.tgl_gaji_mulai ? d.tgl_gaji_mulai.substring(0, 7) : '-';
        document.getElementById('slip-periode').textContent = tglMulai;
        document.getElementById('slip-tgl-cetak').textContent = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

        document.getElementById('slip-gapok').textContent = formatRupiah(d.gaji_pokok);
        document.getElementById('slip-tunj-bpjs').textContent = formatRupiah(d.tunjangan_bpjs);
        document.getElementById('slip-tunj-jht').textContent = formatRupiah(d.tunjangan_jht);
        document.getElementById('slip-tunj-jkk').textContent = formatRupiah(d.tunjangan_jkk);
        document.getElementById('slip-tunj-jkm').textContent = formatRupiah(d.tunjangan_jkm);
        document.getElementById('slip-lembur').textContent = formatRupiah(d.lembur);
        document.getElementById('slip-honor').textContent = formatRupiah(d.honor);
        document.getElementById('slip-total-bruto').textContent = formatRupiah(d.total_bruto);

        document.getElementById('slip-pot-bpjs').textContent = formatRupiah(d.potongan_bpjs);
        document.getElementById('slip-pot-jht').textContent = formatRupiah(d.potongan_jht);
        document.getElementById('slip-pot-lain').textContent = formatRupiah(d.potongan_lainnya || 0);
        document.getElementById('slip-total-potongan').textContent = formatRupiah(d.total_potongan);

        const thp = d.gaji_bersih || 0;
        document.getElementById('slip-thp').textContent = formatRupiah(thp);
        document.getElementById('slip-terbilang').textContent = `"${terbilang(thp)} Rupiah"`;

        document.getElementById('slip-ttd-nama').textContent = `( ${d.nama_pegawai || 'Karyawan'} )`;
        document.getElementById('slip-ttd-nip').textContent = `NIP. ${d.NIP || '-'}`;

        const modalEl = document.getElementById('modal-slip-gaji');
        const modal = new bootstrap.Modal(modalEl);
        modal.show();
      }
    } catch (e) {
      console.error('Error viewing slip gaji:', e);
      alert('Gagal memuat slip gaji');
    }
  };

  // Open Edit / Add Manual Modal
  const openEditModal = async (idGaji = null) => {
    const modalEl = document.getElementById('modal-form-gaji');
    const modalTitle = document.getElementById('modal-form-gaji-title');
    const form = document.getElementById('form-payroll');
    form.reset();
    document.getElementById('form-id-gaji').value = '';

    if (idGaji) {
      modalTitle.textContent = 'Edit Data Penggajian';
      try {
        const res = await httpGet(`${config.api_url}/payroll/detail/${idGaji}`);
        if (res && res.code === 200 && res.data) {
          const d = res.data;
          document.getElementById('form-id-gaji').value = d.id_gaji;
          document.getElementById('form-pegawai').value = d.id_pegawai;
          document.getElementById('form-tgl-mulai').value = d.tgl_gaji_mulai ? d.tgl_gaji_mulai.substring(0, 10) : '';
          document.getElementById('form-tgl-sampai').value = d.tgl_gaji_sampai ? d.tgl_gaji_sampai.substring(0, 10) : '';
          document.getElementById('form-gapok').value = d.gaji_pokok;
          document.getElementById('form-tunj-bpjs').value = d.tunjangan_bpjs;
          document.getElementById('form-tunj-jht').value = d.tunjangan_jht;
          document.getElementById('form-tunj-jkk').value = d.tunjangan_jkk;
          document.getElementById('form-tunj-jkm').value = d.tunjangan_jkm;
          document.getElementById('form-lembur').value = d.lembur;
          document.getElementById('form-honor').value = d.honor;
          document.getElementById('form-pot-bpjs').value = d.potongan_bpjs;
          document.getElementById('form-pot-jht').value = d.potongan_jht;
          calculateFormTHP();
        }
      } catch (e) {
        console.error('Error fetching detail for edit:', e);
      }
    } else {
      modalTitle.textContent = 'Tambah Data Penggajian Manual';
      const curPeriode = document.getElementById('filter-periode')?.value || '2024-09';
      document.getElementById('form-tgl-mulai').value = `${curPeriode}-01`;
      document.getElementById('form-tgl-sampai').value = `${curPeriode}-30`;
      document.getElementById('form-gapok').value = 3500000;
      calculateFormTHP();
    }

    const modal = new bootstrap.Modal(modalEl);
    modal.show();
  };

  const calculateFormTHP = () => {
    const gapok = parseFloat(document.getElementById('form-gapok')?.value) || 0;
    const lembur = parseFloat(document.getElementById('form-lembur')?.value) || 0;
    const honor = parseFloat(document.getElementById('form-honor')?.value) || 0;
    const potBpjs = parseFloat(document.getElementById('form-pot-bpjs')?.value) || 0;
    const potJht = parseFloat(document.getElementById('form-pot-jht')?.value) || 0;

    const thp = (gapok + lembur + honor) - (potBpjs + potJht);
    document.getElementById('calc-preview-thp').textContent = formatRupiah(thp);
  };

  const confirmDelete = async (idGaji) => {
    if (!confirm('Apakah Anda yakin ingin menghapus data penggajian ini?')) return;
    try {
      const res = await httpPost(`${config.api_url}/payroll/delete/${idGaji}`, {});
      if (res && res.code === 200) {
        loadData(currentPage);
      } else {
        alert(res?.data?.message || 'Gagal menghapus data');
      }
    } catch (e) {
      console.error('Error deleting payroll item:', e);
    }
  };

  const bindEvents = () => {
    // Filter triggers
    document.getElementById('filter-periode')?.addEventListener('change', () => loadData(1));
    document.getElementById('filter-bagian')?.addEventListener('change', () => loadData(1));
    document.getElementById('filter-status')?.addEventListener('change', () => loadData(1));
    document.getElementById('btn-search')?.addEventListener('click', () => loadData(1));
    document.getElementById('filter-search')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadData(1);
    });

    document.getElementById('btn-refresh')?.addEventListener('click', () => {
      document.getElementById('filter-bagian').value = '';
      document.getElementById('filter-status').value = '';
      document.getElementById('filter-search').value = '';
      loadData(1);
    });

    // Check All Checkboxes
    document.getElementById('check-all')?.addEventListener('change', (e) => {
      const checked = e.target.checked;
      document.querySelectorAll('.check-item').forEach(c => c.checked = checked);
    });

    // Batch Approve
    document.getElementById('btn-approve-selected')?.addEventListener('click', async () => {
      const selected = Array.from(document.querySelectorAll('.check-item:checked')).map(c => parseInt(c.value));
      if (selected.length === 0) {
        alert('Silakan centang data gaji yang ingin diapprove');
        return;
      }
      if (!confirm(`Approve ${selected.length} data gaji terpilih?`)) return;

      try {
        const res = await httpPost(`${config.api_url}/payroll/approve`, { ids: selected, status: 1 });
        if (res && res.code === 200) {
          loadData(currentPage);
        } else {
          const errorMessage = res?.message || (res?.status instanceof Error ? res.status.message : res?.status);
          alert(errorMessage || 'Gagal mengapprove data');
        }
      } catch (e) {
        console.error('Error approving batch:', e);
        alert(e.message || 'Gagal mengapprove data');
      }
    });

    // Modal Batch Generate Open
    document.getElementById('btn-modal-generate')?.addEventListener('click', () => {
      const modal = new bootstrap.Modal(document.getElementById('modal-generate-gaji'));
      modal.show();
    });

    // Batch Generate Submit
    document.getElementById('btn-submit-generate')?.addEventListener('click', async () => {
      const periode = document.getElementById('gen-periode')?.value;
      if (!periode) {
        alert('Pilih periode bulan!');
        return;
      }

      const payload = {
        periode: periode,
        kd_bagian: document.getElementById('gen-bagian')?.value || null,
        nip_filter: document.getElementById('gen-nip-filter')?.value || 'all',
        default_gapok: parseFloat(document.getElementById('gen-gapok')?.value) || 3500000,
        default_umk: parseFloat(document.getElementById('gen-umk')?.value) || 3000000
      };

      const btn = document.getElementById('btn-submit-generate');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Memproses...';

      try {
        const res = await httpPost(`${config.api_url}/payroll/generate`, payload);
        bootstrap.Modal.getInstance(document.getElementById('modal-generate-gaji'))?.hide();
        if (res && res.code === 200) {
          alert(`Sukses: ${res.data?.message || 'Penggajian berhasil diproses'}`);
          document.getElementById('filter-periode').value = periode;
          loadData(1);
        } else {
          alert('Gagal memproses penggajian');
        }
      } catch (e) {
        console.error('Error generating payroll:', e);
        alert('Terjadi kesalahan saat memproses penggajian');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-play me-1"></i>Mulai Proses Penggajian';
      }
    });

    // Form Manual Add
    document.getElementById('btn-add-manual')?.addEventListener('click', () => openEditModal(null));

    // Dynamic calc in form modal
    document.querySelectorAll('.comp-calc').forEach(inp => {
      inp.addEventListener('input', calculateFormTHP);
    });

    // Save Form Payroll
    document.getElementById('btn-save-payroll')?.addEventListener('click', async () => {
      const selPeg = document.getElementById('form-pegawai');
      const opt = selPeg.options[selPeg.selectedIndex];

      const payload = {
        id_gaji: document.getElementById('form-id-gaji')?.value || null,
        id_pegawai: selPeg.value,
        kd_bagian: opt?.getAttribute('data-bagian') || null,
        kd_jabatan: opt?.getAttribute('data-jabatan') || null,
        tgl_gaji_mulai: document.getElementById('form-tgl-mulai')?.value + ' 00:00:00',
        tgl_gaji_sampai: document.getElementById('form-tgl-sampai')?.value + ' 23:59:59',
        gaji_pokok: parseFloat(document.getElementById('form-gapok')?.value) || 0,
        tunjangan_bpjs: parseFloat(document.getElementById('form-tunj-bpjs')?.value) || 0,
        tunjangan_jht: parseFloat(document.getElementById('form-tunj-jht')?.value) || 0,
        tunjangan_jkk: parseFloat(document.getElementById('form-tunj-jkk')?.value) || 0,
        tunjangan_jkm: parseFloat(document.getElementById('form-tunj-jkm')?.value) || 0,
        lembur: parseFloat(document.getElementById('form-lembur')?.value) || 0,
        honor: parseFloat(document.getElementById('form-honor')?.value) || 0,
        potongan_bpjs: parseFloat(document.getElementById('form-pot-bpjs')?.value) || 0,
        potongan_jht: parseFloat(document.getElementById('form-pot-jht')?.value) || 0,
      };

      if (!payload.id_pegawai) {
        alert('Pilih pegawai!');
        return;
      }

      try {
        const res = await httpPost(`${config.api_url}/payroll/save`, payload);
        bootstrap.Modal.getInstance(document.getElementById('modal-form-gaji'))?.hide();
        if (res && res.code === 200) {
          loadData(currentPage);
        } else {
          alert('Gagal menyimpan data');
        }
      } catch (e) {
        console.error('Error saving payroll:', e);
      }
    });

    // Print Slip Button
    document.getElementById('btn-print-slip')?.addEventListener('click', () => {
      window.print();
    });
  };

  initModule();
</script>
