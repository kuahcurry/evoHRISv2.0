<script type="module" defer>
 import { httpGet, httpPost } from './assets/js/core/http.js';
 import { getCurrentUser } from './assets/js/core/helpers.js';   
 import EvoDrawing from './components/EvoDrawing.js';

 const id = 'tanda_tangan';
 const signaturePad = new EvoDrawing('signaturePad');
 const doLoad = async () => {
  let user = getCurrentUser();
  const frmdata = {kd_user: user.kd_user};
  let rs = await httpGet(`${config.api_url}/tandatangan`, frmdata);
  if (rs.code == 200) signaturePad.drawing = rs.data[0].signature;
 }
 const doDelete = async () => {
  let user = getCurrentUser();
  const frmdata = {kd_user: user.kd_user};
  let rs = await httpPost(`${config.api_url}/tandatangan/delete`, frmdata);
  const contents = {type: 'info', label: '<span class="text-success">Hapus tanda tangan sukses</span>'};
  if (rs.code > 200) contents = {ui: 'interactive', type: 'warning', label: '<span class="text-danger">Hapus tanda tangan gagal!!</span>'};
  showDialog(contents, e => {
   if (rs.code == 200) signaturePad.drawing = '';
  });

 }
 const doSave = async () => {
  let user = getCurrentUser();
  const pin = document.getElementById('txt_pin_baru').value;
  if(pin.length > 0 && pin.length < 6){
    showDialog({ui: 'interactive', type: 'warning', label: '<span class="text-danger">PIN Harus terdiri dari 6 angka</span>'});
    return
  }
  const frmdata = {kd_paramedis: user.kd_paramedis, tanda_tangan: signaturePad.drawing, pin: pin, kd_user: user.kd_user};
  let rs = await httpPost(`${config.api_url}/tandatangan/save`, frmdata);
  const contents = {type: 'success', label: '<span class="text-success">Simpan tanda tangan sukses</span>'};
  if (rs.code > 200) contents = {ui: 'interactive', type: 'warning', label: '<span class="text-danger">Simpan tanda tangan gagal!!</span>'};
  showDialog(contents);
 }
 const toolbar = async (action) => {
  let user = getCurrentUser();
  if (action == 'load') {
   doLoad();
  }else if (action == 'reset') { 
   const dialog = showDialog({
    ui: 'interactive',
    contents: {
     type: 'question',
     title: '<span class="text-black">Konfirmasi</span>',
     label: '<span class="text-black">Yakin akan hapus tanda tangan?</span>',
     buttons: [
      {label: 'Ya', class: 'btn-primary', onClick: async() => doDelete()},
      {label: 'Tidak', class: 'btn-secondary', onClick: () => dialog.close()}
     ]
    }
   }) 
  }else if (action == 'simpan') {
   doSave();
  }
 }
    document.getElementById('txt_pin_baru').addEventListener('input', function (e) {
        this.value = this.value.replace(/[^0-9]/g, '');
        if (this.value.length > 6) {
            this.value = this.value.slice(0, 6);
            this.classList.remove('is-invalid');
        }else if (this.value.length < 6 && this.value.length > 0 ){
            this.classList.add('is-invalid');
        }else{
            this.classList.remove('is-invalid');
        }
    });
    document.getElementById('togglePIN').addEventListener('click', function () {
        const input = document.getElementById('txt_pin_baru');
        const icon = document.getElementById('toggleIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.textContent = 'Show';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye')
        }
    });

 document.tanda_tangan = { id, toolbar };
</script>

<template>
    <div class="row mb-2">
        <div class="row-md-1">
            <signaturePad></signaturePad>
        </div>
    </div>
    <div class="row mb-2">
        <div class="row-md-1">
            <label for="" class="fw-bold">PIN</label>
            <div class="form-group">
                <div class="input-group">
                    <input type="password" id="txt_pin_baru" class="form-control form-control-sm" data-type="txt" data-field="pin_baru" maxlength="6" placeholder="Masukkan PIN Baru">
                    <div class="input-group-append">
                        <button class="btn btn-sm btn-outline-secondary" type="button" id="togglePIN">
                            <span class="fas fa-eye" id="toggleIcon"></span>
                        </button>
                    </div>
                </div>
                <span class="fw-bold" style="color:crimson">
                    * masukkan 6 digit PIN<br>
                    * Kosongi jika tidak ingin merubah PIN
                </span>
            </div>
        </div>
    </div>
</template>
