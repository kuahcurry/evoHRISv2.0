<script type="module" defer>
  import { loadSession, saveSession, clearSession, getCurrentUser } from './assets/js/core/helpers.js';
  import EvoPopup from './components/EvoPopup.js';
  import EvoDialog from './components/EvoDialog.js';
  
  const mainPopup = new EvoPopup('popupNavbar');
  mainPopup.on('onOpened', async (e) => {
    if (e.detail.children.id == 'tanda_tangan') {
      document.tanda_tangan.toolbar('load');
    } else if (e.detail.children.id == 'setting') {
      document.setting.loadData();
    }
  });

  const onProgress = async () => {
    showDialog({
      ui: 'non-interactive',
      contents: {
        type: 'info',
        title: '<span class="text-black">Informasi</span>',
        label: '<span class="text-info">Fitur dalam proses pembuatan</span>'
      }
    });
  }

  const showStatus = () => {
    onProgress();
  }

  const showProfile = () => {
    onProgress();
  }

  const showDashboard = async () => {
    // document.sidebar.toggleListPasien(false);
    await loadModule('modules/dashboard', '#container-isi');
    let html = document.querySelector('html').classList;
    if (!html.value.includes('navbar-vertical-collapsed')) {
      const event = new Event('click');
      navbarVerticalToggle.dispatchEvent(event);
    }
    // let infopasien = document.getElementById('infopasien-container');
    // infopasien.classList.add('d-none');
    let contenttitle = document.getElementById('content-title');
    if (contenttitle) contenttitle.innerHTML = '';
  }

  const savePassword = async() => {
    let rs = await document.ganti_password.saveData();
    if(rs.code == 200) {
      document.main.sendHome();
    }
  }

  const showGantiPassword = () => {
    let options = {
      size: 'medium'
    }
    let params = {
      title: '<span class="text-black">Ganti Password</span>',
      content: {
        type: 'module',
        name: 'features/ganti_password'
      },
      buttons: [
        {label: 'Simpan', class: 'btn-primary', onClick: () => {
          const dialog = showDialog({
            ui: 'interactive',
            contents: {
              type: 'question',
              title: '<span class="text-black">Konfirmasi</span>',
              label: '<span class="text-black">Yakin akan ganti password ?</span>',
              buttons: [
                { label: 'Ya', class: 'btn-primary', onClick: async() => await savePassword() },
                { label: 'Tidak', class: 'btn-secondary', onClick: () => dialog.close() }
              ]
            }
          });
        }}
      ]
    };
    mainPopup.open(options, params);
  }

  const saveSetting = async (mode = '') => {
    document.setting.saveData(mode);
  }

  const showSetting = () => {
    let options = {
      size: 'small'
    }
    let params = {
      title: '<span class="text-black">Setting</span>',
      content: {
        type: 'module',
        name: 'features/setting'
      },
      buttons: [
        {label: 'Simpan', class: 'btn-primary', onClick: () => saveSetting()},
        // {label: 'Simpan & Aktifkan', class: 'btn-primary', onClick: () => saveSetting('aktifkan')},
      ]
    };
    mainPopup.open(options, params);
  }

  const btn_users = document.querySelectorAll('a[href="#!btn_users"]');
  btn_users.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      let target = e.target.dataset.target;
      
      if (target == 'setting') showSetting();
      if (target == 'ganti_password') showGantiPassword();
      if (target == 'setting_role') document.main.showRoleSetting();
    });
  })

  const btn_logout = document.querySelector('a[href="#!btn_logout"]');
  btn_logout.addEventListener('click', () => doLogout());
  const doLogout = async () => {
    const dialog = showDialog({
      ui: 'interactive',
      type: 'question',
      label: '<span class="text-black">Yakin akan logout, sekarang?</span>',
      buttons: [
        { label: 'Ya', class: 'btn-primary', onClick: () => document.main.sendHome() },
        { label: 'Tidak', class: 'btn-secondary', onClick: () => dialog.close() }
      ]
    });
  }

  document.navbar = { showDashboard, onProgress };
</script>
<template>
  <li class="nav-item" data-alias="link-user"><span class="ms-3" id="current-user">User</span><br><small class="ms-3" id="current-jabatan">Jabatan</small></li>
  <li class="nav-item dropdown" data-alias="link-usermenu">
    <a class="nav-link pe-0 ps-2" id="navbarDropdownUser" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
      <div class="avatar avatar-xl">
        <img class="rounded-circle" src="assets/img/4-thumb.png" alt="" />
      </div>
    </a>
    <div class="dropdown-menu dropdown-caret dropdown-caret dropdown-menu-end py-0" aria-labelledby="navbarDropdownUser">
      <div class="bg-white dark__bg-1000 rounded-2 py-2">
        <a class="dropdown-item" href="#!btn_users" data-target="ganti_password">Ganti Password</a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" href="#!btn_users" data-target="setting">Setting Unit</a>
        <a class="dropdown-item" href="#!btn_users" data-target="setting_role">Setting Role</a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" href="#!btn_logout">Logout</a>
      </div>
    </div>
  </li>
</template>
