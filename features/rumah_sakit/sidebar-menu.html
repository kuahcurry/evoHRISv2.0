<script type="module" defer>
  import { httpGet } from "./assets/js/core/http.js";
  import { loadSession, saveSession, getCurrentUser, subscribe } from "./assets/js/core/helpers.js";

  const loadAvailableModules = async (kd_instalasi, kd_unit, kd_jabatan, kd_user, token) => {
    let frm_data = { kd_instalasi, kd_unit, kd_jabatan, kd_user, token };
    let rs = await httpGet(`${config.api_url}/login/privileges`, frm_data);
    return rs.code == 200 ? rs.data : [];
  }

  const showOnProgress = async (submenuItem) => {
    const title = submenuItem.getAttribute('data-title') + ' ' || '';
    const dialog = await showDialog({
      type: 'info',
      label: `<span class="text-black">Fitur ${title}dalam pengembangan</span>`,
      buttons: [
        {
          label: 'Ok',
          class: 'btn-primary',
          onClick: () => dialog.close()
        }
      ]
    });
    return dialog;
  }

  const updateActiveState = (clickedElement) => {
    const allLinks = document.querySelectorAll('#sidebar-menu .nav-link');
    allLinks.forEach(link => link.classList.remove('active'));
    clickedElement.classList.add('active');
  };

  const doMenuItems = async (e, item) => {
    e.preventDefault();
    if (typeof window.checkLogin === 'function') await window.checkLogin();

    if (item.classList.contains('dropdown-indicator')) {
      return true;
    }

    updateActiveState(item);

    const targetModule = item.getAttribute('data-target');
    const title = item.getAttribute('data-title') || '';

    if (targetModule) {
      document.getElementById('container-isi').style.cssText = 'overflow-y: scroll; overflow-x: hidden; min-height: 100%; max-height: 87vh;';
      const rs = await loadModule(`modules${targetModule}`, "#container-isi");
      saveSession({ id: 'page', data: { name: targetModule, path: `modules${targetModule}`, title: title } });
      if (!rs) {
        showOnProgress(item);
        return false;
      }
    } else {
      showOnProgress(item);
    }
    return true;
  };

  const doSubmenuItems = async (e, item) => {
    e.preventDefault();
    // if (typeof checkLogin === 'function') await checkLogin();

    updateActiveState(item);

    const targetModule = item.getAttribute('data-target');
    const title = item.getAttribute('data-title') || '';
    const subtitle = item.getAttribute('data-subtitle') || '';
    const tag = item.getAttribute('data-tag') || '';

    if (targetModule) {
      document.getElementById('container-isi').style.cssText = 'overflow-y: scroll; overflow-x: hidden; min-height: 100%; max-height: 87vh;';
      const rs = await loadModule(`modules${targetModule}`, "#container-isi");
      saveSession({ id: 'page', data: { name: targetModule, path: `modules${targetModule}`, title: title, subtitle: subtitle, tag: tag } });
      if (!rs) {
        showOnProgress(item);
        return false;
      }
      if (document[tag] && typeof document[tag].loadData === 'function') {
        await document[tag].loadData();
      } else if (window[tag] && typeof window[tag].loadData === 'function') {
        await window[tag].loadData();
      }
    } else {
      showOnProgress(item);
    }
    return true;
  };

  const renderMenu = async (reload = '') => {
    const sb = document.querySelector('.search-box');
    if (sb) sb.classList.add('d-none');
    let app = loadSession({ id: "app" });
    if (reload) {
      let newHakAkses = await loadAvailableModules(app.kd_instalasi, app.kd_unit, app.kd_jabatan, app.kd_user, app.token);
      app.hak_akses = newHakAkses;
    }
    saveSession({ id: "app", data: app });

    const allmenus = app.hak_akses;
    if (allmenus == undefined || allmenus.length === 0) return false;

    let html = `<ul class="navbar-nav flex-column mb-3" id="navbarVerticalNav">`;

    let evoMedis = allmenus.filter(v => parseInt(v.evo) == 1);
    evoMedis.forEach((group, index) => {
      const collapseId = `collapse_group_${index}`;
      const hasModules = group.modules && group.modules.length > 0;

      if (hasModules) {
        html += `
          <li class="nav-item">
            <a class="nav-link dropdown-indicator" href="#${collapseId}" role="button" data-bs-toggle="collapse" aria-expanded="false" aria-controls="${collapseId}">
              <div class="d-flex align-items-center">
                <span class="nav-link-icon"><span class="${group.icon || 'fas fa-building'}"></span></span>
                <span class="nav-link-text ps-1">${group.title}</span>
              </div>
            </a>
            <div class="parent-wrapper label-1">
              <ul class="nav collapse parent" id="${collapseId}" data-bs-parent="#navbarVerticalNav">
                ${group.modules.map(m => `
                  <li class="nav-item">
                    <a class="nav-link submenu-item" href="#menu" data-tag="${m.tag || ''}" data-target="${m.filename}" data-title="${m.title}" data-icon="${m.icon || ''}" data-group="${group.title}">
                      <div class="d-flex align-items-center">
                        <span class="nav-link-icon"><span class="${m.icon || 'fas fa-file-alt'}"></span></span>
                        <span class="nav-link-text ps-1">${m.title}</span>
                      </div>
                    </a>
                  </li>
                `).join('')}
              </ul>
            </div>
          </li>
        `;
      }
    });

    html += `</ul>`;

    const sidebarEl = document.getElementById('sidebar-menu');
    if (sidebarEl) {
      sidebarEl.innerHTML = html;

      sidebarEl.querySelectorAll('.menu-item').forEach((item) => {
        item.addEventListener('click', (e) => doMenuItems(e, item));
      });

      sidebarEl.querySelectorAll('.submenu-item').forEach((item) => {
        item.addEventListener('click', (e) => doSubmenuItems(e, item));
      });
    }
  };

  const sidebarEl = document.getElementById('sidebar-menu');
  if (sidebarEl) {
    // sidebarEl.innerHTML = html;

    sidebarEl.querySelectorAll('.menu-item').forEach((item) => {
      item.addEventListener('click', (e) => doMenuItems(e, item));
    });

    sidebarEl.querySelectorAll('.submenu-item').forEach((item) => {
      item.addEventListener('click', (e) => doSubmenuItems(e, item));
    });

    sidebarEl.querySelectorAll('.dropdown-indicator').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const targetId = btn.getAttribute('href') || btn.getAttribute('data-bs-target');
        if (targetId && targetId.startsWith('#')) {
          const targetEl = document.querySelector(targetId);
          if (targetEl && window.bootstrap) {
            const collapseInstance = bootstrap.Collapse.getOrCreateInstance(targetEl);
            collapseInstance.toggle();
          }
        }
      });
    });
  }

  // await renderMenu(true);

  document.sidebar = { renderMenu };
</script>
